[[feature]]
id = "platform.slack-bot-events"
title = "Slack bot event intake"
flow = "slack-bot"
what = "Slack posts events to /slack/events on the API, which proxies them to the Slack bot process. The bot verifies each delivery against the saved bots, answers each event once, and rate limits bad traffic."
code = [
  "backend/nodejs/apps/src/integrations/slack-bot/src/receiver.ts",
  "backend/nodejs/apps/src/integrations/slack-bot/src/botRegistry.ts",
  "backend/nodejs/apps/src/integrations/slack-bot/src/authorizeFn.ts",
  "backend/nodejs/apps/src/integrations/slack-bot/src/slackApp.ts",
  "backend/nodejs/apps/src/app.ts",
  "backend/nodejs/apps/src/libs/middlewares/rate-limit.middleware.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.slack-bot-events.signature"
  says = "A delivery without Slack signature headers, with a non-numeric timestamp or one more than five minutes from now (past or future), or whose signature matches no saved bot is refused with 401 and is not processed."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/integrations/slack-bot/slackEventsGuard.test.ts"]

  [[feature.behavior]]
  id = "platform.slack-bot-events.registry"
  says = "The bot checks a signature against its cached registry, force-refreshes once when nothing matches (at most every 30 seconds, so forged signatures cannot flood the API) and then stops."
  priority = "P1"
  tests = ["node:tests/integrations/slack-bot/slackEventsGuard.test.ts"]

  [[feature.behavior]]
  id = "platform.slack-bot-events.dedupe"
  says = "A repeated event_id is acknowledged without being handled again, while the retry of a delivery that failed is handled."
  priority = "P0"
  tests = ["node:tests/integrations/slack-bot/slackEventsGuard.test.ts"]

  [[feature.behavior]]
  id = "platform.slack-bot-events.rate-limit"
  says = "The gateway counts only failed deliveries (400 and above) per client address, never throttles accepted ones, and answers 429 once failures pass the per-minute limit."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/libs/middlewares/rate-limit.middleware.test.ts"]

  [[feature.behavior]]
  id = "platform.slack-bot-events.proxy"
  says = "The gateway proxies /slack/events to the bot, passes a complete answer through, answers 502 when the bot is down, and cuts the client response when the bot's answer is cut midway."
  priority = "P1"
  tests = ["node:tests/app.slack-proxy-cut.test.ts"]

  [[feature.behavior]]
  id = "platform.slack-bot-events.token"
  says = "The bot resolves its Slack token from the bot that matched the request, then from the registry by team or bot id, then from BOT_TOKEN, and fails when none exists."
  priority = "P1"
  tests = ["node:tests/integrations/slack-bot/authorizeFn.test.ts"]

  [[feature.behavior]]
  id = "platform.slack-bot-events.health"
  says = "The Slack bot process exposes a health route."
  priority = "P2"
  tests = ["node:tests/integrations/slack-bot/healthRoute.test.ts"]

