  id = "platform.desktop-signin.deep-link"
  says = "The app completes a callback only from a deep link that matches its own state and family, ignores links for another state, surfaces a provider error without completing, and treats cancel as silent."
  priority = "P0"
  kind = "security"
  tests = ["fe:lib/electron/__tests__/desktop-oauth-return.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-signin.state-marker"
  says = "An OAuth state started from the desktop app carries the phd. marker so the callback page hands the code to the app, and a state without it completes in the browser."
  priority = "P1"
  tests = [
    "py:tests/unit/utils/test_desktop_state.py",
    "fe:lib/electron/__tests__/desktop-oauth-return.test.ts",
  ]

  [[feature.behavior]]
  id = "platform.desktop-signin.streaming"
  says = "The desktop app streams chat answers through its own fetch because the app origin cannot use the browser's streaming path."
  priority = "P2"
  tests = ["fe:lib/electron/__tests__/streaming-fetch.test.ts"]

# ---------------------------------------------------------------------------
# Edition seams
# ---------------------------------------------------------------------------

[[feature]]
id = "platform.edition-python"
title = "Python extension points and their defaults"
flow = "edition-seams"
what = "The Python services reach every replaceable behavior through edition modules. Each has a default that works on its own: one connector worker, no model decorators, lane assignment by hash, a web access gate that refuses internal addresses by their spelling."
code = [
  "backend/python/app/edition.py",
  "backend/python/app/edition_config.py",
  "backend/python/app/edition_services.py",
  "backend/python/app/edition_containers.py",
  "backend/python/app/services/messaging/lanes/assignment_policy.py",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.edition-python.defaults"
  says = "The default hooks change nothing: model and embedding decorators return their input, configure_app and extra toolsets do nothing, and a registered error classifier is asked first and skipped if it fails."
  priority = "P0"
  tests = ["py:tests/unit/test_edition_hook_defaults.py"]

  [[feature.behavior]]
  id = "platform.edition-python.single-process"
  says = "Connector sync runs in one process: one worker, no leased bootstrap ids kept after a restart, no sync reaper and no external executor."
  priority = "P1"
  tests = ["py:tests/unit/test_edition_hook_defaults.py"]

  [[feature.behavior]]
  id = "platform.edition-python.web-gate"
  says = "The default web access gate allows any search and any http or https URL whose host is not internal by its spelling (localhost, link-local, private or metadata literal addresses, non-http schemes, no host). A hostname is checked again after DNS resolution when it is fetched."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/test_edition_hook_defaults.py"]

  [[feature.behavior]]
  id = "platform.edition-python.lanes"
  says = "Lane assignment follows the default rule, and an administrator is never allowed to move a connector to another lane."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_lane_assignment_policy.py",
    "py:tests/unit/services/messaging/test_lane_assignment.py",
  ]

  [[feature.behavior]]
  id = "platform.edition-python.lazy-routers"
  says = "Importing the edition config does not load the chat, agent or entity routers, they load on first attribute access, and an unknown attribute still raises."
  priority = "P1"
  tests = [
    "py:tests/unit/test_edition_config_lazy_routers.py",
    "py:tests/unit/test_import_boundaries.py",
  ]

  [[feature.behavior]]
  id = "platform.edition-python.service-exports"
  says = "The edition services module exports the token refresh services, and resolves the event service, entity event service and record event handler on demand. An unknown name raises AttributeError."
  priority = "P1"
  tests = ["py:tests/unit/test_edition_services.py"]

[[feature]]
id = "platform.edition-node"
title = "Node extension points and their defaults"
flow = "edition-seams"
what = "The Node API wires routers, boot hooks and policy constants through config.ts, edition.ts and the edition boot object. The defaults mount nothing extra, add no broker topics or CSP sources, and leave telemetry on."
code = [
  "backend/nodejs/apps/src/config.ts",
  "backend/nodejs/apps/src/edition.ts",
  "backend/nodejs/apps/src/libs/edition/edition-boot.ts",
  "frontend/config-pages.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.edition-node.boot"
  says = "The default boot object adds no broker topics and no CSP sources, mounts no routes, starts no workers and does nothing on initialize, listen, stop or dispose."
  priority = "P0"
  tests = ["node:tests/libs/edition/edition-boot.test.ts"]

  [[feature.behavior]]
  id = "platform.edition-node.sign-in-methods"
  says = "A saved sign-in policy that names a method this build does not offer is rewritten at startup, and a failure to rewrite one policy does not stop the others or mark the migration done."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/migrations/sign_in_methods_removal.migration.test.ts"]

  [[feature.behavior]]
  id = "platform.edition-node.pages"
  says = "A frontend page this build does not implement answers 404, and the pages it implements are exported from config-pages.ts."
  priority = "P1"
  tests = []

  [[feature.behavior]]
  id = "platform.edition-node.vector-rebuild"
  says = "The routes that drop and rebuild the records vector collection are offered by default."
  priority = "P2"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.test.ts"]

# ---------------------------------------------------------------------------
# Startup
# ---------------------------------------------------------------------------

[[feature]]
id = "platform.startup-migrations"
title = "Startup data migrations"
flow = "sync-indexing"
what = "The Node API runs one-time data migrations at startup, each guarded by a done flag so it runs once, and moves the key-value store from etcd to Redis when needed. The connector service runs its graph migrations at startup."
code = [
  "backend/nodejs/apps/src/modules/configuration_manager/services/migration.service.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/services/migrations/**",
  "backend/nodejs/apps/src/libs/keyValueStore/migration/**",
  "backend/python/app/migrations/**",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.startup-migrations.order"
  says = "The service account staging runs first, then the sign-in methods migration, then the others, and an unexpected failure in one is logged and swallowed so the API still starts."
  priority = "P0"
  tests = ["node:tests/modules/configuration_manager/services/migration.service.test.ts"]

  [[feature.behavior]]
  id = "platform.startup-migrations.idempotent"
  says = "A migration whose done flag is set is skipped, and one that finished with errors leaves its flag unset so the next boot retries."
  priority = "P0"
  tests = [
    "node:tests/modules/configuration_manager/services/migrations/admin_role.migration.test.ts",
    "node:tests/modules/configuration_manager/services/migrations/chat_sessions.migration.test.ts",
    "node:tests/modules/configuration_manager/services/migrations/document_orgid_backfill.migration.test.ts",
    "node:tests/modules/configuration_manager/services/migrations/scheduled_jobs_backfill.migration.test.ts",
    "node:tests/modules/configuration_manager/services/migrations/chat_kb_filters.migration.test.ts",
    "node:tests/modules/configuration_manager/services/migrations/sign_in_methods_removal.migration.test.ts",
  ]

  [[feature.behavior]]
  id = "platform.startup-migrations.kv-store"
  says = "The key-value store migration copies etcd data to Redis only when the store is Redis, ETCD_URL is set, etcd is reachable and the migration has not completed, and a failed migration stops startup."
  priority = "P1"
  tests = ["node:tests/libs/keyValueStore/migration/kvStoreMigration.service.test.ts"]

  [[feature.behavior]]
  id = "platform.startup-migrations.graph"
  says = "Each graph migration sets a done flag after success, does not run again once done, and is retried on the next start after a failure."
  priority = "P1"
  tests = [
    "py:tests/unit/migrations/test_all_team_migration.py",
    "py:tests/unit/migrations/test_app_org_id_migration.py",
    "py:tests/unit/migrations/test_hierarchy_backfill_migration.py",
    "py:tests/unit/migrations/test_redundant_group_edges_migration.py",
    "py:tests/unit/migrations/test_service_account_kind_migration.py",
  ]

[ignore]
pages = ["frontend/app/(main)/@sidebar/workspace/bots/page.tsx"]

[[feature]]
id = "platform.classify-on-first-use"
title = "Classify on first use"
flow = "sync-indexing"
what = "With the Labs setting on, indexing makes a record searchable and leaves classification (summary, categories, topics) for later. The first search that returns the record asks for its classification in the background."
code = ["backend/python/app/modules/pipeline/first_use.py", "backend/python/app/services/featureflag/platform_settings.py"]
status = "draft"

  [[feature.behavior]]
  id = "platform.classify-on-first-use.off"
  says = "With the setting off, a search asks for no classification."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/modules/pipeline/test_first_use.py"]

  [[feature.behavior]]
  id = "platform.classify-on-first-use.once"
  says = "Only indexed records waiting for classification are picked, each record and revision is asked for once even when two searches run at the same time, and at most 50 are asked per search after dropping those already asked for."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/modules/pipeline/test_first_use.py"]

  [[feature.behavior]]
  id = "platform.classify-on-first-use.never-blocks-search"
  says = "A broken or refusing message broker never fails the search; the records it could not ask for are asked again by the next search."
  priority = "P0"
  kind = "function"
  tests = ["py:tests/unit/modules/pipeline/test_first_use.py"]
