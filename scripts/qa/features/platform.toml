# Platform: the indexing pipeline (flow sync-indexing), the Slack bot (slack-bot), the desktop app (desktop)
# and the edition seams (edition-seams). Most of it has no route in the API spec.

# ---------------------------------------------------------------------------
# Indexing pipeline
# ---------------------------------------------------------------------------

[[feature]]
id = "platform.index-record-flow"
title = "A record becomes searchable"
flow = "sync-indexing"
what = "A new or changed record from a connector or an upload is read from the broker, fetched from the connectors service, parsed into blocks, embedded and written to the vector store and blob storage. Its indexing status moves NOT_STARTED, QUEUED, IN_PROGRESS and then COMPLETED, EMPTY, FILE_TYPE_NOT_SUPPORTED, PASSWORD_PROTECTED or FAILED."
code = [
  "backend/python/app/indexing_main.py",
  "backend/python/app/events/**",
  "backend/python/app/services/messaging/kafka/handlers/record.py",
  "backend/python/app/modules/transformers/sink_orchestrator.py",
  "backend/python/app/modules/indexing/run.py",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-record-flow.completed"
  says = "A record whose vectors were written ends COMPLETED with its blocks stored, and is marked as having an indexed copy so search can find it. In the same write, extraction status is set to QUEUED for the classify stage, or to NOT_STARTED when classification is left for the record's first use."
  priority = "P0"
  tests = [
    "py:tests/unit/modules/transformers/test_sink_orchestrator.py",
    "py:tests/unit/events/test_orchestrator_flow.py",
    "it:messaging/test_e2e_record_pipeline.py",
  ]

  [[feature.behavior]]
  id = "platform.index-record-flow.in-progress-markers"
  says = "While a record is processed its statuses track the parse and index phases, and its content revision is written with IN_PROGRESS so later stage writes apply only to that revision."
  priority = "P1"
  tests = ["py:tests/unit/events/test_orchestrator_flow.py"]

  [[feature.behavior]]
  id = "platform.index-record-flow.empty"
  says = "A file that parses to no blocks ends EMPTY, and an update to empty content drops the old vectors and the indexed copy unless another record still holds them."
  priority = "P1"
  tests = [
    "py:tests/unit/events/test_empty_update_drops_indexed_copy.py",
    "py:tests/unit/events/test_service_parse_empty_update.py",
  ]

  [[feature.behavior]]
  id = "platform.index-record-flow.unsupported"
  says = "A file type the gate rejects ends FILE_TYPE_NOT_SUPPORTED with a reason. A type the gate accepts but no parser can route is failed on its first attempt with a reason and is not retried."
  priority = "P1"
  tests = ["py:tests/unit/services/messaging/test_record_handler_unsupported.py"]

  [[feature.behavior]]
  id = "platform.index-record-flow.password"
  says = "A file that needs a password to open ends PASSWORD_PROTECTED, not FAILED. It is never retried, text that merely mentions a password does not count, and its queued duplicates get the same status. An owner-password-only PDF is indexed normally."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_record_handler_password.py",
    "py:tests/unit/events/test_events_password.py",
    "py:tests/unit/modules/parsers/test_encryption.py",
  ]

  [[feature.behavior]]
  id = "platform.index-record-flow.duplicates"
  says = "Records with the same content hash in one collection are indexed once. A finished twin is reused, a twin in progress makes the duplicate wait, and a failed or deleted twin lets the duplicate index itself."
  priority = "P1"
  tests = [
    "py:tests/unit/events/test_dedup_selection.py",
    "py:tests/unit/events/test_duplicate_enrichment_handoff.py",
    "py:tests/unit/events/test_events.py",
  ]

  [[feature.behavior]]
  id = "platform.index-record-flow.reindex"
  says = "A reindex or new-record event on a record that is already COMPLETED does not index it again unless the event is a forced reindex. An update or reindex event deletes the old embeddings before the new ones are written, except for file types that are reconciled block by block."
  priority = "P1"
  tests = ["py:tests/unit/services/messaging/test_record_handler.py"]

  [[feature.behavior]]
  id = "platform.index-record-flow.no-llm"
  says = "With no AI model configured, a record that needs one (images, spreadsheets) fails with the message that no model is set up, and a text record still completes because classification only skips."
  priority = "P1"
  tests = [
    "py:tests/unit/utils/test_user_errors.py",
    "py:tests/unit/modules/transformers/test_document_extraction_outcomes.py",
  ]

[[feature]]
id = "platform.index-resync-status"
title = "Record status after a connector re-sync"
flow = "sync-indexing"
what = "A sync saves every record it lists. A record with unchanged content keeps its outcome (COMPLETED, EMPTY, FILE_TYPE_NOT_SUPPORTED, PASSWORD_PROTECTED, FAILED) or its pending work. A content change, a restore from the trash or a new record is indexed again."
code = [
  "backend/python/app/connectors/core/base/data_processor/data_source_entities_processor.py",
  "backend/python/app/services/graph_db/common/record_visibility.py",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-resync-status.unchanged"
  says = "A re-sync of an unchanged record keeps its indexing status, reason and queue time, so a sync is not a retry and queued records are not published twice."
  priority = "P0"
  tests = [
    "py:tests/unit/connectors/core/test_unchanged_record_keeps_indexing_fields.py",
    "py:tests/unit/connectors/core/test_data_source_entities_processor.py",
  ]

  [[feature.behavior]]
  id = "platform.index-resync-status.changed"
  says = "A record with a new revision, or the same revision read as another file type, is indexed again whatever status it held, including PASSWORD_PROTECTED."
  priority = "P0"
  tests = ["py:tests/unit/connectors/core/test_unchanged_record_keeps_indexing_fields.py"]

  [[feature.behavior]]
  id = "platform.index-resync-status.auto-index-off"
  says = "Turning automatic indexing off stops an unchanged record that has not started, but never takes back what indexing already reached."
  priority = "P1"
  tests = ["py:tests/unit/connectors/core/test_unchanged_record_keeps_indexing_fields.py"]

  [[feature.behavior]]
  id = "platform.index-resync-status.searchable-while-requeued"
  says = "A record that was indexed stays searchable from its previous copy while an edited version is queued or re-indexed, and is hidden when it is in the trash."
  priority = "P0"
  tests = [
    "py:tests/unit/modules/transformers/test_sink_orchestrator.py",
    "py:tests/integration/graph_db/test_search_keeps_indexed_copy_real_backends.py",
    "py:tests/integration/test_search_keeps_indexed_copy_e2e.py",
  ]

[[feature]]
id = "platform.index-retry"
title = "Indexing retries and failure outcomes"
flow = "sync-indexing"
what = "A transient failure puts the record back to QUEUED and re-publishes it with a growing delay. A terminal failure, or exhausted attempts, ends it FAILED with a reason and releases its queued duplicates. A record that crashes the process is not run again after two unfinished attempts."
code = [
  "backend/python/app/services/messaging/error_classifier.py",
  "backend/python/app/services/messaging/retry_manager.py",
  "backend/python/app/services/messaging/fail_safe_retry_tracker.py",
  "backend/python/app/services/messaging/disposition.py",
  "backend/python/app/services/messaging/redis_streams/indexing_consumer.py",
  "backend/python/app/services/messaging/kafka/consumer/**",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-retry.classify"
  says = "Errors are classified: 400, 401, 403, 404, 413, 422 and other 4xx answers are terminal, while 408, 409, 429 and 5xx answers are transient. Content and parsing failures are terminal and network failures are transient."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_error_classifier.py",
    "py:tests/unit/services/messaging/test_error_classifier_poison.py",
    "py:tests/unit/services/messaging/test_handler_failures_reach_classifier.py",
  ]

  [[feature.behavior]]
  id = "platform.index-retry.dead-letter"
  says = "A record that keeps failing is dead-lettered after the attempt limit instead of being run again: its message is acknowledged and the record ends FAILED with a reason."
  priority = "P0"
  tests = [
    "py:tests/unit/services/messaging/test_fail_safe_retry_tracker.py",
    "py:tests/unit/services/messaging/test_redis_streams_indexing_consumer.py",
    "py:tests/unit/services/messaging/test_retry_manager.py",
  ]

  [[feature.behavior]]
  id = "platform.index-retry.progress-requeue"
  says = "An embedding run that finished at least one batch before it was cut is re-queued without counting an attempt, and resumes from the stored points. A cut with no new batch, a shutdown or a lost lease is counted or left for redelivery."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_progress_requeue.py",
    "py:tests/unit/modules/indexing/test_embed_resume.py",
    "py:tests/unit/events/test_events_resume.py",
  ]

  [[feature.behavior]]
  id = "platform.index-retry.crash-suspects"
  says = "A record whose attempts never finished twice, because the process died, is failed without running again. A record with one unfinished attempt runs one at a time, apart from other records."
  priority = "P1"
  tests = ["py:tests/unit/services/messaging/test_unfinished_attempts.py"]

  [[feature.behavior]]
  id = "platform.index-retry.deleted-record"
  says = "A record deleted or trashed while it is indexed is not a failure: its message is acknowledged and no status is written."
  priority = "P1"
  tests = ["py:tests/unit/services/messaging/test_record_deleted.py"]

  [[feature.behavior]]
  id = "platform.index-retry.record-lease"
  says = "Only one worker indexes a record at a time. A record whose lease is not free is handed back without counting an attempt, and a lost lease cancels the handler and leaves the message for redelivery."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_lease_renewer.py",
    "py:tests/unit/services/messaging/test_lease_resilience.py",
    "py:tests/unit/services/messaging/test_unfinished_attempts.py",
  ]

  [[feature.behavior]]
  id = "platform.index-retry.worker-loop-failure"
  says = "If the worker event loop exits without a stop request, the consumers stop reading and the indexing health check answers 503."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_worker_loop.py",
    "py:tests/unit/test_indexing_main.py",
  ]

[[feature]]
id = "platform.index-admission"
title = "Indexing admission, fairness and backpressure"
flow = "sync-indexing"
what = "The indexing service admits records through heavy and light permits sized to the machine, shares the permits fairly between connectors, and pauses reading when a downstream service asks it to slow down."
code = [
  "backend/python/app/services/resource_governor/**",
  "backend/python/app/services/messaging/backpressure.py",
  "backend/python/app/services/messaging/consumer_concurrency.py",
  "backend/python/app/services/messaging/distributed_concurrency.py",
  "backend/python/app/services/messaging/scheduling/**",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-admission.tiers"
  says = "A file is classed heavy or light from its extension, or from its MIME type when the extension is unknown. Text-like types are light and unproven types stay heavy."
  priority = "P1"
  tests = ["py:tests/unit/services/resource_governor/test_tiers.py"]

  [[feature.behavior]]
  id = "platform.index-admission.permits"
  says = "A request that waits too long for a permit gives up without leaking one, and a cancelled waiter does not leak one either."
  priority = "P1"
  tests = [
    "py:tests/unit/services/resource_governor/test_admission.py",
    "py:tests/unit/services/resource_governor/test_gate.py",
  ]

  [[feature.behavior]]
  id = "platform.index-admission.fair-share"
  says = "A busy connector or workspace cannot starve a quiet one: dispatch interleaves by deficit round robin, and the parsing service holds a workspace to its share of a pool while another one is waiting or running."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_drr_scheduler.py",
    "py:tests/unit/services/resource_governor/test_org_share.py",
    "py:tests/unit/services/messaging/test_fair_scheduling_redis.py",
    "py:tests/unit/services/messaging/test_fair_scheduling_kafka.py",
  ]

  [[feature.behavior]]
  id = "platform.index-admission.backpressure"
  says = "Reading stops at the pending task ceiling and while a downstream service signals 429 with a Retry-After, and resumes when the pause ends. A longer signal extends an active pause and a shorter one does not shorten it."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_backpressure.py",
    "py:tests/unit/services/messaging/test_fair_scheduling_limits.py",
  ]

  [[feature.behavior]]
  id = "platform.index-admission.parse-now"
  says = "A record opened before it is indexed can be parsed ahead of the queue on a priority lane with its own permits, and its outcome is written to a parse marker without changing the record's own statuses when automatic indexing is off."
  priority = "P2"
  tests = [
    "py:tests/unit/services/messaging/test_record_handler_parse_now.py",
    "py:tests/unit/modules/pipeline/test_parse_now.py",
    "py:tests/unit/modules/indexing/test_parse_now_marker.py",
    "py:tests/unit/services/messaging/test_parse_now_priority_redis.py",
  ]

[[feature]]
id = "platform.index-recovery"
title = "Indexing recovery sweeps"
flow = "sync-indexing"
what = "Background loops in the indexing process find records whose events were lost or whose worker died, and send them again. A source that answers 429 defers a record instead of failing it."
code = [
  "backend/python/app/indexing_main.py",
  "backend/python/app/modules/indexing/record_republish.py",
  "backend/python/app/modules/indexing/rate_limit_deferral.py",
  "backend/python/app/modules/indexing/recovery_budget.py",
  "backend/python/app/modules/indexing/connector_sweep.py",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-recovery.stale-in-progress"
  says = "A record left IN_PROGRESS past its lease is put back in line and republished, and it stays searchable from its previous indexed copy. A record whose lease is still held, or that finished mid-scan, is left alone. A record that keeps failing or being cut off after recovery is ended instead of re-queued for ever."
  priority = "P0"
  tests = [
    "py:tests/unit/test_indexing_main.py",
    "py:tests/unit/modules/indexing/test_recovery_budget.py",
  ]

  [[feature.behavior]]
  id = "platform.index-recovery.stranded"
  says = "A record whose queue event was lost is sent again once it has waited past the threshold and the queue has passed it. The sweep never sends filtered or trashed records or records of a connector that is off or being deleted, and the wait before the next resend doubles each time."
  priority = "P0"
  tests = [
    "py:tests/unit/test_stranded_sweep_parked_while_off.py",
    "py:tests/unit/test_stranded_sweep_simulated_day.py",
    "py:tests/unit/modules/indexing/test_record_republish.py",
  ]

  [[feature.behavior]]
  id = "platform.index-recovery.rate-limited"
  says = "A content fetch answered 429 with Retry-After leaves the record QUEUED with a retry time and a reason, counts no attempt, and is sent again after that time. A record still refused after a day ends FAILED with the reason."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_rate_limited_records.py",
    "py:tests/unit/modules/indexing/test_rate_limit_deferral.py",
  ]

  [[feature.behavior]]
  id = "platform.index-recovery.startup-order"
  says = "The indexing service ensures the graph schema before any consumer starts, retries until the schema is in place, and a failed startup stops the consumers it already started."
  priority = "P1"
  tests = ["py:tests/unit/test_indexing_main.py"]

[[feature]]
id = "platform.index-maintenance"
title = "Indexing maintenance jobs"
flow = "sync-indexing"
what = "The indexing service runs background jobs that bring existing data up to date: stamping connector and group ids onto vector points, adding class units for code records, rebuilding the entity index from the graph, and sweeping orphaned entities and scope data. Each job runs on one replica at a time and resumes after a restart."
code = [
  "backend/python/app/modules/indexing/vector_membership_backfill.py",
  "backend/python/app/modules/indexing/class_units_backfill.py",
  "backend/python/app/modules/indexing/entity_index_rebuild.py",
  "backend/python/app/modules/indexing/named_entity_sweep.py",
  "backend/python/app/modules/indexing/scope_sweep_loop.py",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-maintenance.leader-lease"
  says = "Only the replica that holds the lease runs a job. A replica that does not hold it cannot renew or take it, a lease that expired and moved to another replica is not taken back, and a released lease goes to the next replica."
  priority = "P0"
  tests = ["py:tests/unit/modules/indexing/test_leader_lease.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.membership-backfill"
  says = "The membership backfill takes one connector and one page of records per tick, stamps the connector and record group ids onto each record's vector points, saves a cursor after every full page, and marks the connector done after the last page. A pass that lost the lease stops without saving progress."
  priority = "P1"
  tests = ["py:tests/unit/modules/indexing/test_vector_membership_backfill_scanner.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.backfill-retry"
  says = "A record that keeps failing does not block the backfill: after three passes with failures the connector is marked done, and each failed tick doubles the wait before the next one."
  priority = "P1"
  tests = ["py:tests/unit/modules/indexing/test_vector_membership_backfill_scanner.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.class-units"
  says = "Class units are added to code records indexed before they existed only when CODE_GRAPH_BACKFILL is true. Only completed code records with no residue unit are embedded, from the stored blob without fetching the source, a missing blob is counted as failed and skipped, and a second run does nothing."
  priority = "P1"
  tests = ["py:tests/unit/modules/indexing/test_class_units_backfill.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.entity-index"
  says = "The entity index is rebuilt from the graph, connectors before organizations, without extraction or an LLM call. Records of every status get a point, points of trashed records are removed, and a change of embedding model or a collection that was dropped runs the passes again."
  priority = "P1"
  tests = ["py:tests/unit/modules/indexing/test_entity_index_rebuild.py", "py:tests/unit/modules/indexing/test_entity_index_outlives_records_rebuild.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.entity-sweep"
  says = "Once a day per organization the rebuild deletes entity points whose node is gone or belongs to another organization, and never touches record points. A failed lookup deletes nothing."
  priority = "P1"
  tests = ["py:tests/unit/modules/indexing/test_entity_index_rebuild.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.deleted-connector-entities"
  says = "Entity points left by a deleted connector are removed by the rebuild once the cleanup request is older than 15 minutes. A connector that still exists, or whose lookup fails, is never cleaned."
  priority = "P1"
  tests = ["py:tests/unit/modules/indexing/test_entity_cleanup_reconcile.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.named-entity-sweep"
  says = "Orphaned named entities are swept every six hours by one replica, whether or not the Labs flag is on. A grace period below one hour is raised to one hour."
  priority = "P2"
  tests = ["py:tests/unit/modules/indexing/test_named_entity_sweep_loop.py"]

  [[feature.behavior]]
  id = "platform.index-maintenance.scope-sweep"
  says = "The scope sweep runs only when the scope fields are on. It sweeps every organization each round, every 300 seconds unless the setting is a number of 30 or more, with a random wait added so replicas do not sweep together."
  priority = "P2"
  tests = ["py:tests/unit/modules/indexing/test_scope_sweep_loop.py"]

[[feature]]
id = "platform.index-delete"
title = "Removing records from the index"
flow = "sync-indexing"
what = "Deleting a record, a connector or a collection removes the matching vectors, stored blocks and entity points. Deleted and trashed records disappear from search and from the record API."
code = [
  "backend/python/app/services/messaging/kafka/handlers/record.py",
  "backend/python/app/modules/indexing/connector_off_events.py",
  "backend/python/app/modules/indexing/stored_content_cleanup.py",
  "backend/python/app/services/graph_db/**/delete*.py",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-delete.record"
  says = "A deleteRecord event removes the record's embeddings and its entity points, hands a shared copy over to the next holder, and retries the delete when the hand-over fails."
  priority = "P0"
  tests = ["py:tests/unit/services/messaging/test_record_handler.py"]

  [[feature.behavior]]
  id = "platform.index-delete.visible"
  says = "A deleted record is gone from the graph and the record API."
  priority = "P0"
  tests = [
    "it:messaging/test_e2e_record_pipeline.py::TestRecordCleanupStage::test_deleted_record_not_in_api",
    "it:messaging/test_e2e_record_pipeline.py::TestRecordCleanupStage::test_deleted_record_removed_from_graph",
    "py:tests/unit/services/graph_db/test_delete_record_through_providers.py",
  ]

  [[feature.behavior]]
  id = "platform.index-delete.bulk"
  says = "A bulk delete of an empty list removes nothing and still completes, and a bulk delete that names a connector goes through the virtual-record purge instead of the plain delete."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_record_handler.py",
    "py:tests/unit/modules/indexing/test_indexing_run.py",
  ]

  [[feature.behavior]]
  id = "platform.index-delete.connector-off"
  says = "The backlog of a turned-off connector drains at read speed without being dispatched, and the events of a removed connector are acknowledged without writing a status. An unreadable connector state drops nothing."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_connector_off_at_read.py",
    "py:tests/unit/modules/indexing/test_connector_off_events.py",
  ]

  [[feature.behavior]]
  id = "platform.index-delete.stored-documents"
  says = "Stored documents of deleted records are purged. A file the graph still lists is rescheduled with a growing delay and not purged, until a day has passed, after which it is kept."
  priority = "P1"
  tests = [
    "py:tests/unit/services/messaging/test_record_handler_stored_content.py",
    "py:tests/unit/modules/indexing/test_stored_content_cleanup.py",
  ]

[[feature]]
id = "platform.index-stages"
title = "Classification and entity extraction stages"
flow = "sync-indexing"
what = "After a record is searchable, pipeline stages run on their own topics with their own permits and retries: classify writes the summary, categories, topics and departments, and entities extracts named entities. They never block search."
code = [
  "backend/python/app/modules/pipeline/**",
  "backend/python/app/modules/transformers/document_extraction.py",
  "backend/python/app/modules/named_entities/**",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.index-stages.ordering"
  says = "A stage runs once after its last prerequisite finishes, even when prerequisites finish at the same time, and an inapplicable stage is skipped while its successors still run."
  priority = "P1"
  tests = ["py:tests/unit/modules/pipeline/test_coordinator.py"]

  [[feature.behavior]]
  id = "platform.index-stages.revision"
  says = "A stage result for a superseded content revision is stale and saves nothing. A record that was deleted or trashed before its stages are handed off raises the deleted-record outcome."
  priority = "P0"
  tests = [
    "py:tests/unit/modules/pipeline/test_classify_stage.py",
    "py:tests/unit/modules/pipeline/test_ingress.py",
  ]

  [[feature.behavior]]
  id = "platform.index-stages.classify"
  says = "Classification applies to text and images when it is on, and saves the summary and taxonomy only for records still on the revision it read. With no AI model configured it ends SKIPPED with a reason and the record stays searchable."
  priority = "P1"
  tests = [
    "py:tests/unit/modules/pipeline/test_classify_stage.py",
    "py:tests/unit/modules/transformers/test_document_extraction_outcomes.py",
  ]

  [[feature.behavior]]
  id = "platform.index-stages.entities"
  says = "Entity extraction needs only the indexed text, saves each entity with the blocks it came from, and a failed extraction is retried and writes nothing."
  priority = "P1"
  tests = ["py:tests/unit/modules/pipeline/test_entities_stage.py"]

[[feature]]
id = "platform.index-brokers"
title = "Message brokers and lanes for indexing"
flow = "sync-indexing"
what = "Record events travel over Kafka, Redis Streams or a PostgreSQL queue, chosen by MESSAGE_BROKER. On Redis Streams a connector is assigned one of eight lanes so one connector cannot hold up the rest."
code = [
  "backend/python/app/services/messaging/messaging_factory.py",
