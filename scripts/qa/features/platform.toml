[[feature]]
id = "platform.desktop-relay"
title = "Desktop relay for local folders"
flow = "desktop"
what = "The desktop app connects over Socket.IO and registers a device. The connectors service then asks that device, through service-only routes, for file events and file content of the user's local folders."
code = [
  "backend/nodejs/apps/src/modules/desktop_proxy/**",
  "backend/nodejs/apps/src/libs/services/desktop-presence.provider.ts",
  "backend/nodejs/apps/src/utils/local-fs-utils.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "platform.desktop-relay.handshake"
  says = "A socket handshake without a token, with an expired token, or with a token that has no user or organisation is refused. A revoked session is refused with an authentication message, and a failing session check is refused with a retryable message."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/desktop_proxy/socket/desktop-proxy.gateway.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-relay.revocation"
  says = "A device whose token was revoked is disconnected at the next 30-second check."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/desktop_proxy/socket/desktop-proxy.gateway.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-relay.routes"
  says = "POST /api/v1/desktop/internal/local-fs/file-events/pull and /content need a service token with the desktop:command scope and a valid body, and they address only the user in the token, never a user named in the body."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/desktop_proxy/controllers/desktop-proxy.controller.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-relay.errors"
  says = "The relay answers 409 when the desktop is offline, 504 when it does not answer in time, 502 when it reports a failure, and 503 before the socket namespace is attached."
  priority = "P1"
  tests = ["node:tests/modules/desktop_proxy/controllers/desktop-proxy.controller.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-relay.device-routing"
  says = "A request goes only to the device that owns the connector, never to another device of the same user or to another user. A reconnecting device is routed to its newest socket, and a page answered by another device is refused."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/desktop_proxy/socket/local-fs-relay.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-relay.content"
  says = "File content is reassembled byte for byte from chunks, a short or aborted transfer is rejected, a file over 100 MB is refused up front, and at most three transfers run per device."
  priority = "P1"
  tests = ["node:tests/modules/desktop_proxy/socket/local-fs-relay.test.ts"]

  [[feature.behavior]]
  id = "platform.desktop-relay.presence"
  says = "The connector service can ask whether a user's desktop or device is online, and gets no answer, not offline, before the namespace is attached."
  priority = "P2"
  tests = [
    "node:tests/libs/services/desktop-presence.provider.test.ts",
    "node:tests/modules/desktop_proxy/socket/local-fs-relay.test.ts",
  ]

