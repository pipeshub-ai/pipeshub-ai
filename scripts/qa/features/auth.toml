  says = "A reset link used once is refused the second time, and of two simultaneous uses only one succeeds."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestForgotPasswordLink::test_the_same_link_is_refused_the_second_time",
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestResetLinkUsedTwiceAtOnce::test_only_one_of_two_simultaneous_uses_succeeds",
  ]

  [[feature.behavior]]
  id = "auth.password-reset.expired"
  says = "An expired reset link is refused."
  priority = "P0"
  kind = "security"
  tests = ["it:response-validation/auth/integration_test_emailed_sign_in.py::TestExpiredResetLink::test_an_expired_link_is_refused"]

  [[feature.behavior]]
  id = "auth.password-reset.no-enumeration"
  says = "POST /api/v1/userAccount/password/forgot answers 200 with the same text whether or not the address has an account, and the mail is sent after the reply."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/auth/controller/userAccount.controller.test.ts", "node:tests/modules/auth/routes/userAccount.address-limit.http.test.ts"]

  [[feature.behavior]]
  id = "auth.password-reset.captcha"
  says = "When a Turnstile secret is configured, a reset-link request without a valid challenge is refused."
  priority = "P2"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "auth.password-reset.strength"
  says = "A new password needs at least eight characters with an uppercase letter, a lowercase letter, a digit and a special character, and at most 72 bytes."
  priority = "P1"
  tests = ["node:tests/modules/auth/utils/passwordValidator.test.ts"]

  [[feature.behavior]]
  id = "auth.password-reset.end-sessions"
  says = "Resetting a password ends every session that was open before it."
  priority = "P0"
  kind = "security"
  tests = ["it:security/test_credential_change_invalidation.py::TestPasswordChange::test_a_token_issued_before_the_change_is_rejected"]

