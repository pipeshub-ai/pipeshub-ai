# Feature map: sign-in, SSO and OpenID, password reset, sign-up and onboarding,
# org auth settings, user account and profile.

[[feature]]
id = "auth.sign-in"
title = "Sign in with password or email code"
flow = "login"
what = "A person starts a sign-in session, then proves who they are with a password or an emailed code, one step per the org policy. The last step returns an access token and a refresh token."
routes = ["POST /api/v1/userAccount/initAuth", "POST /api/v1/userAccount/authenticate"]
pages = ["frontend/app/(public)/login/**"]
code = [
  "backend/nodejs/apps/src/modules/auth/controller/userAccount.controller.ts",
  "backend/nodejs/apps/src/modules/auth/routes/userAccount.routes.ts",
  "backend/nodejs/apps/src/modules/auth/middlewares/userAuthentication.middleware.ts",
  "backend/nodejs/apps/src/modules/auth/utils/authMethodGuard.ts",
  "backend/nodejs/apps/src/modules/auth/services/session.service.ts",
  "frontend/app/(public)/login/**",
  "frontend/app/(public)/forms/**",
]
status = "draft"

  [[feature.behavior]]
  id = "auth.sign-in.password"
  says = "POST /api/v1/userAccount/initAuth returns an x-session-token and the methods the first step allows; POST /api/v1/userAccount/authenticate with method password and the right password returns accessToken and refreshToken."
  priority = "P0"
  tests = [
    "it:response-validation/auth/integration_test_userAccount.py::TestInitAuth::test_init_auth_response_schema",
    "it:response-validation/auth/integration_test_userAccount.py::TestAuthenticate::test_authenticate_response_schema",
    "e2e:tests/e2e/auth/login.spec.ts",
  ]

  [[feature.behavior]]
  id = "auth.sign-in.wrong-credentials"
  says = "A wrong password, an unknown email and an account with no password all get the same refusal, so the answer does not show whether an account exists."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/auth/controller/userAccount.signInFlow.test.ts",
    "node:tests/modules/auth/controller/userAccount.controller.test.ts",
    "it:response-validation/auth/integration_test_userAccount.py::TestAuthenticate::test_authenticate_negative_tests",
  ]

  [[feature.behavior]]
  id = "auth.sign-in.lockout"
  says = "The tenth wrong password or sign-in code locks the account (the ninth does not); wrong codes and wrong passwords count together, and a locked account refuses even the right password until the lock ends or an admin unblocks it."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestLockoutThreshold::test_the_tenth_wrong_password_locks_and_the_ninth_does_not",
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestLockoutCountersShared::test_wrong_codes_and_wrong_passwords_count_together",
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestLockoutBySignInCodesAlone::test_ten_wrong_codes_lock_the_account_until_an_admin_unblocks_it",
    "node:tests/modules/auth/controller/userAccount.signInFlow.test.ts",
  ]

  [[feature.behavior]]
  id = "auth.sign-in.policy-step"
  says = "A method the org policy does not list for the current step is refused, and in a multi-step policy every step must prove the same account."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/auth/controller/userAccount.signInFlow.test.ts",
    "node:tests/modules/auth/utils/authMethodGuard.test.ts",
  ]

  [[feature.behavior]]
  id = "auth.sign-in.rate-limit"
  says = "More than ten sign-in attempts in a minute are refused, while loading the sign-in page does not spend attempts."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/auth/routes/userAccount.authenticate.http.test.ts"]

  [[feature.behavior]]
  id = "auth.sign-in.captcha"
  says = "When a Turnstile secret is configured, a password sign-in without a valid challenge is refused before the password is checked."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/auth/controller/userAccount.signInFlow.test.ts"]

  [[feature.behavior]]
  id = "auth.sign-in.lock-expiry"
  says = "A locked account is unlocked automatically after 24 hours and can sign in again."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/auth/sign-in-audit.http.test.ts"]

  [[feature.behavior]]
  id = "auth.sign-in.audit"
  says = "Each sign-in outcome (success, refusal with a reason, lock, partial multi-step) is recorded once as an audit line that names the account and method and never holds the password, code or email as the method."
  priority = "P1"
  kind = "security"
  tests = [
    "node:tests/modules/auth/sign-in-audit.http.test.ts",
    "node:tests/modules/auth/utils/sign-in-audit.test.ts",
  ]

  [[feature.behavior]]
  id = "auth.sign-in.login-page"
  says = "The login page shows the email and password fields, validates the email, shows an error for a wrong password, and sends a successful sign-in to /chat; if the server is unreachable it shows a retry, not a password form."
  priority = "P1"
  tests = [
    "e2e:tests/e2e/auth/login.spec.ts",
    "fe:app/(public)/login/__tests__/login-page.test.tsx",
  ]

[[feature]]
id = "auth.sign-in-code"
title = "Sign-in code by email"
flow = "login"
what = "A person asks for a one-time code by email and signs in with it. The code works once and for ten minutes."
routes = ["POST /api/v1/userAccount/login/otp/generate"]
code = [
  "backend/nodejs/apps/src/modules/auth/controller/userAccount.controller.ts",
  "backend/nodejs/apps/src/modules/auth/utils/generateOtp.ts",
  "backend/nodejs/apps/src/libs/middlewares/email-rate-limit.middleware.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "auth.sign-in-code.sign-in"
  says = "The right code signs in and a wrong code is refused."
  priority = "P0"
  tests = [
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestSignInCode::test_the_right_code_signs_in",
    "it:response-validation/auth/integration_test_emailed_sign_in.py::TestSignInCode::test_a_wrong_code_is_refused",
  ]

  [[feature.behavior]]
  id = "auth.sign-in-code.single-use"
  says = "A code that already signed someone in is refused the second time, and an expired code is refused."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/auth/controller/userAccount.signInFlow.test.ts"]

  [[feature.behavior]]
  id = "auth.sign-in-code.no-enumeration"
  says = "A request for a code answers 200 with the same text for an unknown email, a locked account and a real account, and sends no code for the first two."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/auth/controller/userAccount.controller.test.ts"]

  [[feature.behavior]]
  id = "auth.sign-in-code.address-limit"
  says = "Repeated code requests for one address are answered like accepted ones but send nothing, and each address and each route is counted on its own."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/auth/routes/userAccount.address-limit.http.test.ts"]

[[feature]]
id = "auth.session"
title = "Session refresh and sign-out"
flow = "login"
what = "A refresh token returns a new access token. Signing out records the sign-out, and tokens issued before a sign-out, password change, lock or account deletion stop working."
routes = ["POST /api/v1/userAccount/refresh/token", "POST /api/v1/userAccount/logout/manual"]
pages = []
code = [
  "backend/nodejs/apps/src/modules/auth/controller/userAccount.controller.ts",
  "backend/nodejs/apps/src/libs/middlewares/auth.middleware.ts",
  "backend/nodejs/apps/src/libs/middlewares/require-session-auth.middleware.ts",
  "frontend/lib/api/**",
]
status = "draft"

  [[feature.behavior]]
  id = "auth.session.refresh"
  says = "POST /api/v1/userAccount/refresh/token with a valid refresh token as Bearer returns a new accessToken; no token or a bad token gets an error."
  priority = "P0"
  tests = [
    "it:response-validation/auth/integration_test_userAccount.py::TestRefreshToken::test_refresh_token_response_schema",
    "it:response-validation/auth/integration_test_userAccount.py::TestRefreshToken::test_refresh_token_negative_tests",
  ]

  [[feature.behavior]]
  id = "auth.session.logout"
  says = "POST /api/v1/userAccount/logout/manual returns 200 with an empty body, needs an interactive session, and the person can sign in again afterwards."
  priority = "P1"
  tests = [
    "it:response-validation/auth/integration_test_userAccount.py::TestLogoutManual::test_logout_returns_200_empty_body",
    "it:response-validation/auth/integration_test_userAccount.py::TestLogoutManual::test_logout_negative_tests",
    "e2e:tests/e2e/auth/logout.spec.ts",
  ]

  [[feature.behavior]]
  id = "auth.session.revoked-after-credential-change"
  says = "After a password change, a lock, an admin block or an account deletion, access tokens and refresh tokens issued before it are refused by the Node API and the Python services."
  priority = "P0"
  kind = "security"
  tests = [
    "it:security/test_session_revocation.py::TestPasswordChangeEndsEverySession::test_access_tokens_from_before_the_change_are_refused",
    "it:security/test_session_revocation.py::TestPasswordChangeEndsEverySession::test_refresh_tokens_from_before_the_change_are_refused",
    "it:security/test_session_revocation.py::TestLockedAccountEndsEverySession::test_access_tokens_from_before_the_lock_are_refused",
    "it:security/test_session_revocation.py::TestDeletedUserEndsEverySession::test_refresh_tokens_from_before_the_deletion_are_refused",
    "it:security/test_credential_change_invalidation.py::TestBlockingAnAccount::test_a_token_issued_before_the_block_is_rejected",
  ]

  [[feature.behavior]]
  id = "auth.session.expired"
  says = "An expired access token or refresh token is refused by the public API and by the Python services."
  priority = "P0"
  kind = "security"
  tests = [
    "it:security/test_session_revocation.py::TestExpiredAccessToken::test_an_expired_access_token_is_refused_by_the_public_api",
    "it:security/test_session_revocation.py::TestExpiredRefreshToken::test_an_expired_refresh_token_is_refused",
  ]

  [[feature.behavior]]
  id = "auth.session.logout-ui"
  says = "Signing out in the app clears the local session and returns to the login page."
  priority = "P1"
  tests = ["e2e:tests/e2e/auth/logout.spec.ts", "fe:lib/api/__tests__/session-store-resets.test.ts"]

[[feature]]
id = "auth.provider-sign-in"
title = "Sign in with Google or Microsoft"
flow = "login"
what = "When the org policy lists Google or Microsoft, a person signs in with a provider token that the server verifies against the admin's client settings. An unknown person gets an account only when the admin turned just-in-time provisioning on."
pages = ["frontend/app/(public)/auth/google/**", "frontend/app/(public)/auth/microsoft/**"]
code = [
  "backend/nodejs/apps/src/modules/auth/controller/userAccount.controller.ts",
  "backend/nodejs/apps/src/modules/auth/services/jit-provisioning.service.ts",
  "backend/nodejs/apps/src/modules/auth/utils/googleIdTokenValidation.ts",
  "backend/nodejs/apps/src/modules/auth/utils/azureAdTokenValidation.ts",
  "frontend/app/(public)/auth/google/**",
  "frontend/app/(public)/auth/microsoft/**",
  "frontend/lib/auth/desktop-oauth.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "auth.provider-sign-in.verified-identity"
  says = "A Google token with no email, or a Microsoft token with no usable identity, is refused, and only the verified identity of an existing account signs in."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/auth/controller/userAccount.signInFlow.test.ts"]

  [[feature.behavior]]
  id = "auth.provider-sign-in.jit"
  says = "An unknown Google or Microsoft identity is refused when just-in-time provisioning is off for that provider, and gets a new account on first sign-in when it is on."
  priority = "P0"
  tests = [
    "node:tests/modules/auth/controller/userAccount.signInFlow.test.ts",
    "node:tests/modules/auth/services/jit-provisioning.service.test.ts",
  ]

  [[feature.behavior]]
  id = "auth.provider-sign-in.token-validation"
  says = "A Google ID token is checked against the configured client id, and a Microsoft token against the configured client and tenant."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/auth/utils/googleIdTokenValidation.test.ts",
    "node:tests/modules/auth/utils/azureAdTokenValidation.test.ts",
  ]

  [[feature.behavior]]
  id = "auth.provider-sign-in.callback-state"
  says = "The Google and Microsoft callback pages check the state value stored by the sign-in button before they pass the token to the opener, and hand the result to the desktop app only for a desktop state."
  priority = "P1"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "auth.provider-sign-in.live"
  says = "A real Google or Microsoft sign-in works end to end in the browser."
  priority = "P1"
  tests = []
  manual = "Needs a real Google or Microsoft account and registered client; the repo has no simulator for either provider."

[[feature]]
id = "auth.provider-config"
title = "Google and Microsoft sign-in settings"
flow = "login"
what = "An admin saves the Google or Microsoft client settings used for sign-in. Secrets are stored encrypted and masked when read back."
routes = [
  "* /api/v1/configurationManager/authConfig/google",
  "* /api/v1/configurationManager/authConfig/microsoft",
  "POST /api/v1/userAccount/updateAppConfig",
]
code = [
  "backend/nodejs/apps/src/modules/configuration_manager/routes/cm_routes.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/controller/cm_controller.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/utils/maskConfigSecrets.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "auth.provider-config.admin-only"
  says = "Reading or saving the Google or Microsoft settings needs an admin and the config scope; a member gets 403."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/routes/cm_routes.guards.test.ts"]

  [[feature.behavior]]
  id = "auth.provider-config.masked"
  says = "The admin routes return masked settings while masking is on, a reveal asked with an OAuth-app token is ignored, and saving the masked form back keeps the stored secret."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.authSecrets.test.ts"]

  [[feature.behavior]]
  id = "auth.provider-config.sign-in-reads-real-values"
  says = "The internal route the sign-in service uses returns the stored values even while the admin routes mask them."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.authSecrets.test.ts"]

  [[feature.behavior]]
  id = "auth.provider-config.validation"
  says = "A save with a missing or invalid client id, or a masked placeholder with nothing stored to restore, is refused."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.authSecrets.test.ts"]

  [[feature.behavior]]
  id = "auth.provider-config.reload"
  says = "POST /api/v1/userAccount/updateAppConfig needs a service token with the fetch-config scope and reloads the auth service's settings."
  priority = "P1"
  kind = "security"
  tests = []

[[feature]]
