# Connectors: the platform (flow connector-setup) and one feature per connector (flow sync-indexing).

[[feature]]
id = "connectors.registry"
title = "Connector registry and connection check"
flow = "connector-setup"
what = "A caller lists the connector types and reads the form schema of one, and checks credentials before saving. A failed check is a normal answer with a message, not an error."
routes = [
  "GET /api/v1/connectors/registry",
  "GET /api/v1/connectors/registry/{connectorType}/schema",
  "POST /api/v1/connectors/registry/{connectorType}/test-connection",
  "GET /api/v1/connectors/network/egress-ips",
]
code = [
  "backend/python/app/connectors/core/registry/**",
  "backend/nodejs/apps/src/modules/tokens_manager/routes/connectors.routes.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.registry.list"
  says = "GET /api/v1/connectors/registry lists the registered connector types with their scopes and auth types, and needs the connector:read scope."
  priority = "P1"
  tests = ["py:tests/unit/connectors/core/test_connector_registry.py", "py:tests/unit/connectors/core/registry/test_connector_definitions.py", "py:tests/unit/connectors/test_connector_contract.py"]

  [[feature.behavior]]
  id = "connectors.registry.schema"
  says = "GET /api/v1/connectors/registry/{type}/schema returns the form schema of one type and says whether the type has a connection check."
  priority = "P1"
  tests = ["py:tests/unit/connectors/api/test_router_test_connection.py"]

  [[feature.behavior]]
  id = "connectors.registry.test-connection"
  says = "POST .../test-connection answers 200 with the failure message when the check fails, reports a crashing check as a failure, answers 404 for an unknown type and refuses a type that has no check."
  priority = "P0"
  tests = ["py:tests/unit/connectors/api/test_router_test_connection.py"]

  [[feature.behavior]]
  id = "connectors.registry.test-connection-secret"
  says = "Checking an existing instance keeps a saved secret that the form sends back as the mask, uses a new secret when one is typed, and refuses an instance of another type."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/api/test_router_test_connection.py"]

  [[feature.behavior]]
  id = "connectors.registry.egress-ips"
  says = "GET /api/v1/connectors/network/egress-ips returns the addresses connectors connect from, so an admin can allow-list them at the source."
  priority = "P2"
  tests = ["py:tests/unit/connectors/api/test_router_test_connection.py"]

[[feature]]
id = "connectors.network-policy"
title = "Address policy for personal connectors"
flow = "connector-setup"
what = "A personal connector reaches public addresses only. A team connector follows the deployment setting PIPESHUB_BLOCK_PRIVATE_ADDRESSES."
code = ["backend/python/app/connectors/core/address_policy.py"]
status = "draft"

  [[feature.behavior]]
  id = "connectors.network-policy.member-check"
  says = "A member's connection check on a private, loopback, link-local or metadata address is refused before anything is dialled, while an admin's check follows the deployment setting."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/test_personal_connector_address_policy.py"]

  [[feature.behavior]]
  id = "connectors.network-policy.saved-instance"
  says = "A saved personal connector that points at an inward address fails at init and at sync, while a team connector to a private host connects."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/test_personal_connector_address_policy.py"]

[[feature]]
id = "connectors.instances"
title = "Connector instances"
flow = "connector-setup"
what = "A user creates a personal connector instance, an admin creates team ones, and each caller lists, reads, renames and deletes the instances they may reach."
routes = [
  "GET /api/v1/connectors",
  "POST /api/v1/connectors",
  "GET /api/v1/connectors/active",
  "GET /api/v1/connectors/inactive",
  "GET /api/v1/connectors/configured",
  "GET /api/v1/connectors/agents/active",
  "GET /api/v1/connectors/{connectorId}",
  "DELETE /api/v1/connectors/{connectorId}",
  "GET /api/v1/connectors/{connectorId}/stats",
  "PUT /api/v1/connectors/{connectorId}/name",
]
code = [
  "backend/python/app/connectors/api/router.py",
  "backend/python/app/connectors/core/registry/connector_registry.py",
  "backend/nodejs/apps/src/modules/tokens_manager/controllers/connector.controllers.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.instances.create"
  says = "POST /api/v1/connectors needs a type and a name, answers 404 for a type that is not registered and 400 for a scope or auth type the connector does not support."
  priority = "P0"
  tests = ["py:tests/unit/connectors/api/test_router_create_instance.py"]

  [[feature.behavior]]
  id = "connectors.instances.create-team-admin"
  says = "Only an administrator can create a team connector; any user can create a personal one, and personal is the default scope."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/api/test_router_create_instance.py"]

  [[feature.behavior]]
  id = "connectors.instances.access-scoping"
  says = "A personal instance is reachable by its creator only (not by an admin), a team instance by an admin or its creator, and an instance of another organization by nobody."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/core/registry/test_connector_access_scoping.py"]

  [[feature.behavior]]
  id = "connectors.instances.list-scope"
  says = "The instance lists are scoped to the caller's organization, and each user lists only their own personal connectors."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/services/graph_db/test_connector_listing_org_scope.py", "py:tests/integration/graph_db/test_connector_list_personal_visibility_real_backends.py", "py:tests/integration/graph_permissions/test_connector_instances.py"]

  [[feature.behavior]]
  id = "connectors.instances.list-filters"
  says = "The list filters reject a scope other than team or personal, an isActive value that is not true or false, a page below 1 and a limit above 200."
  priority = "P2"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.test.ts", "node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.instances.delete"
  says = "Only the creator or an administrator can delete an instance. A delete answers 202 and runs in the background, answers 409 while one is already running or while an agent uses the connector, and removes the sync schedule."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/core/registry/test_connector_access_scoping.py", "node:tests/modules/crawling_manager/routes/cm_connector_delete.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.instances.delete-shared-content"
  says = "Deleting a connector hands its copies of shared content over to a surviving connector before its storage is removed, and publishes the vector cleanup for the records it removes."
  priority = "P1"
  tests = ["py:tests/unit/connectors/core/test_shared_content_handover.py", "py:tests/unit/connectors/core/test_connector_delete_vector_cleanup.py", "py:tests/integration/test_connector_delete_vector_cleanup_e2e.py"]

  [[feature.behavior]]
  id = "connectors.instances.path-ids"
  says = "A connector id that is not a plain key, such as a path that climbs out of its URL segment, is refused with 400 before any connector service call."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.path-params.test.ts"]

  [[feature.behavior]]
  id = "connectors.instances.stats"
  says = "GET /api/v1/connectors/{id}/stats asks the connector service for that connector only and passes on its own 404 wording."
  priority = "P2"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.instances.rename"
  says = "PUT /api/v1/connectors/{id}/name renames an instance for the users who may change it."
  priority = "P2"
  tests = []

  [[feature.behavior]]
  id = "connectors.instances.beta-gate"
  says = "While beta connectors are switched off in platform settings, a beta connector type is refused with 403 on create, delete and the other instance routes."
  priority = "P1"
  tests = []

[[feature]]
id = "connectors.config"
title = "Connector configuration and credentials"
flow = "connector-setup"
what = "An admin or creator reads and saves a connector's auth, filters and sync settings. Stored secrets and OAuth tokens never leave the server in clear."
routes = [
  "GET /api/v1/connectors/{connectorId}/config",
  "PUT /api/v1/connectors/{connectorId}/config",
  "PUT /api/v1/connectors/{connectorId}/config/auth",
  "PUT /api/v1/connectors/{connectorId}/config/filters-sync",
]
pages = ["frontend/app/(main)/workspace/connectors/**"]
code = [
  "backend/python/app/connectors/api/router.py",
  "backend/python/app/connectors/core/registry/auth_utils.py",
  "frontend/app/(main)/workspace/connectors/components/**",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.config.mask-secrets"
  says = "The config routes answer with stored secrets masked, and a save that sends the mask back keeps the stored secret while a save with a new secret replaces it."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/api/test_router_config_response_masks_secrets.py"]

  [[feature.behavior]]
  id = "connectors.config.hide-tokens"
  says = "No config route returns the owner's stored OAuth access and refresh tokens or flow state, and a save keeps them stored."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/api/test_router_config_response_hides_tokens.py"]

  [[feature.behavior]]
  id = "connectors.config.auth-rules"
  says = "A connector can set its own auth rules (OneDrive needs a client certificate for a new instance); a refused save is a 400 with the reason, and the admin's action items are stored and cleared."
  priority = "P1"
  tests = ["py:tests/unit/connectors/api/test_router_auth_save_rules.py", "py:tests/unit/connectors/api/test_router_update_auth.py"]

  [[feature.behavior]]
  id = "connectors.config.update"
  says = "PUT config and config/filters-sync save the settings, and sync custom fields outside the connector's schema are refused."
  priority = "P1"
  tests = ["py:tests/unit/connectors/api/test_router_update_config.py", "py:tests/unit/connectors/core/registry/test_sync_field_validation.py"]

  [[feature.behavior]]
  id = "connectors.config.oauth-app-link"
  says = "A full-config save that names an OAuth app links it to the instance, and the OAuth app's source fields are the only ones a save may store."
  priority = "P1"
  tests = ["py:tests/unit/connectors/api/test_router_full_config_save_links_oauth_app.py", "py:tests/unit/connectors/api/test_router_oauth_source_fields.py"]

  [[feature.behavior]]
  id = "connectors.config.secret-field-ui"
  says = "The setup form masks a password field, never prints the secret as page text or to the console, and reveals it only on request."
  priority = "P1"
  kind = "security"
  tests = ["fe:app/(main)/workspace/connectors/components/__tests__/schema-form-field.test.tsx", "fe:app/(main)/workspace/connectors/components/authenticate-tab/__tests__/authenticate-tab.test.tsx"]

  [[feature.behavior]]
  id = "connectors.config.locked"
  says = "Changing the settings of a connector that is syncing, queued for a sync or being deleted gets 409 with a message that names what is running."
  priority = "P1"
  tests = []

[[feature]]
id = "connectors.oauth-signin"
title = "Connector OAuth sign-in and token refresh"
flow = "connector-setup"
what = "An admin or creator signs a connector in with OAuth: the server builds the authorization URL, handles the callback and keeps the tokens fresh in the background."
routes = [
  "GET /api/v1/connectors/{connectorId}/oauth/authorize",
  "GET /api/v1/connectors/oauth/callback",
  "POST /api/v1/connectors/getTokenFromCode",
]
pages = ["frontend/app/(public)/connectors/oauth/callback/page.tsx", "frontend/app/(main)/connectors/page.tsx"]
code = [
  "backend/python/app/connectors/core/base/token_service/**",
  "backend/nodejs/apps/src/modules/tokens_manager/controllers/connector.controllers.ts",
  "frontend/app/(main)/connectors/oauth/**",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.oauth-signin.callback"
  says = "GET /api/v1/connectors/oauth/callback needs both code and state, marks a successful sign-in, and passes a failed sign-in's details back for the page to show."
  priority = "P0"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts", "fe:app/(main)/connectors/oauth/__tests__/connector-oauth-window-messages.test.ts"]

  [[feature.behavior]]
  id = "connectors.oauth-signin.authorize"
  says = "GET .../oauth/authorize returns the provider's authorization URL for the instance, and the Authorize tab starts the flow from it."
  priority = "P0"
  tests = ["fe:app/(main)/workspace/connectors/components/__tests__/authorize-tab-oauth.test.tsx", "py:tests/unit/connectors/api/test_router_part2.py"]

  [[feature.behavior]]
  id = "connectors.oauth-signin.token-code-admin"
  says = "POST /api/v1/connectors/getTokenFromCode (Google Workspace) needs an administrator and the connector:write scope."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.legacy-google.test.ts", "node:tests/modules/tokens_manager/routes/connectors.routes.test.ts"]

  [[feature.behavior]]
  id = "connectors.oauth-signin.token-refresh"
  says = "The background refresh renews expiring connector tokens org by org, logs one line per refresh without secrets, and one failing connector does not stop the others."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/connectors/core/test_token_refresh_org_scan.py", "py:tests/unit/connectors/core/test_token_refresh_logging.py", "py:tests/unit/connectors/test_token_refresh_service.py"]

[[feature]]
id = "connectors.oauth-apps"
title = "Shared OAuth apps for connectors and toolsets"
flow = "connector-setup"
what = "An admin saves the OAuth app (client id and secret) once for a connector or toolset type, and instances link to it. Members see only basic details."
routes = [
  "GET /api/v1/oauth/registry",
  "GET /api/v1/oauth/registry/{connectorType}",
  "GET /api/v1/oauth",
  "GET /api/v1/oauth/{connectorType}",
  "POST /api/v1/oauth/{connectorType}",
  "GET /api/v1/oauth/{connectorType}/{configId}",
  "PUT /api/v1/oauth/{connectorType}/{configId}",
  "DELETE /api/v1/oauth/{connectorType}/{configId}",
  "GET /api/v1/toolsets/oauth-configs/{toolsetType}",
  "PUT /api/v1/toolsets/oauth-configs/{toolsetType}/{oauthConfigId}",
  "DELETE /api/v1/toolsets/oauth-configs/{toolsetType}/{oauthConfigId}",
]
code = [
  "backend/nodejs/apps/src/modules/tokens_manager/routes/oauth.routes.ts",
  "backend/python/app/connectors/core/registry/oauth_config_registry.py",
  "backend/python/app/api/routes/toolsets.py",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.oauth-apps.admin-write"
  says = "Only an administrator can create, update or delete an OAuth app; a non-admin gets 403, a duplicate name 409, and a missing name 400."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/api/test_router_part2.py", "node:tests/modules/tokens_manager/controllers/oauth.controllers.test.ts", "node:tests/modules/tokens_manager/routes/oauth.routes.test.ts"]

  [[feature.behavior]]
  id = "connectors.oauth-apps.secrets"
  says = "An OAuth app's client secret is masked in every read unless the caller is an admin who asks to reveal it, and it is never written to the logs."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/test_oauth_config_log_hygiene.py", "fe:app/(main)/workspace/connectors/components/authenticate-tab/__tests__/oauth-app-selector-reveal.test.tsx"]

  [[feature.behavior]]
  id = "connectors.oauth-apps.connector-vs-toolset"
  says = "A connector and a toolset can register an OAuth app under the same name and each keeps its own callback URL and scopes."
  priority = "P1"
  tests = ["py:tests/unit/connectors/core/test_oauth_registry_connector_vs_toolset.py", "py:tests/unit/connectors/core/test_oauth_config_registry.py"]

  [[feature.behavior]]
  id = "connectors.oauth-apps.toolset-scopes"
  says = "The toolset OAuth config routes need the toolset:read, toolset:write and toolset:delete scopes for list, update and delete, and delete is refused with 409 while a toolset instance uses the app."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/toolsets/routes/toolsets_routes.scopes.test.ts"]

  [[feature.behavior]]
  id = "connectors.oauth-apps.basic-auth"
  says = "Providers that take OAuth client credentials in a Basic auth header (Airtable and Zoom) get them there."
  priority = "P2"
  tests = ["py:tests/unit/connectors/test_oauth_basic_auth_providers.py"]

[[feature]]
id = "connectors.filters"
title = "Connector filters"
flow = "connector-setup"
what = "A connector exposes sync and indexing filters. The caller reads their options, including pages of dynamic options, and saves selections."
routes = [
  "GET /api/v1/connectors/{connectorId}/filters",
  "POST /api/v1/connectors/{connectorId}/filters",
  "GET /api/v1/connectors/{connectorId}/filters/{filterKey}/options",
]
code = [
  "backend/python/app/connectors/core/registry/filters.py",
  "backend/python/app/connectors/core/registry/folder_scope.py",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.filters.options-paging"
  says = "The dynamic options route forwards the context path as one repeated parameter, refuses a page size outside 1 to 100 with the message Limit must be between 1 and 100, before the connector service is called."
  priority = "P1"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.filters.key-path"
  says = "A filter key that would climb out of the options path is rejected."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.path-params.test.ts"]

  [[feature.behavior]]
  id = "connectors.filters.validation"
  says = "A filter value is checked against its type and operator, and folder filter values are checked wherever sync filters are validated."
  priority = "P1"
  tests = ["py:tests/unit/connectors/core/test_filters.py", "py:tests/unit/connectors/api/test_router_folder_paths.py"]

[[feature]]
id = "connectors.sync-control"
title = "Turn sync on or off, resync, reindex and stop"
flow = "connector-setup"
what = "A user turns a connector's sync or agent on or off, starts a resync or reindex, and stops a running sync. A busy connector refuses a second request."
routes = [
  "POST /api/v1/connectors/{connectorId}/toggle",
  "POST /api/v1/connectors/{connectorId}/resync",
  "POST /api/v1/connectors/{connectorId}/reindex",
  "POST /api/v1/connectors/{connectorId}/sync/stop",
]
code = [
  "backend/python/app/connectors/api/router.py",
  "backend/nodejs/apps/src/modules/tokens_manager/controllers/connector.controllers.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "connectors.sync-control.toggle-access"
  says = "Only an administrator can toggle a team connector, and only the creator can toggle a personal one."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/api/test_router_part2.py"]

  [[feature.behavior]]
  id = "connectors.sync-control.toggle-ready"
  says = "A connector cannot be turned on before it is configured or, for OAuth, before sign-in completes, and one with required sync filters (for example exactly one repository) cannot be enabled without them."
  priority = "P0"
  tests = ["py:tests/unit/connectors/api/test_router_sync_filter_guard.py", "py:tests/unit/connectors/api/test_router_init_oauth_app_missing.py"]

  [[feature.behavior]]
  id = "connectors.sync-control.toggle-order"
  says = "Each sync toggle numbers itself and sends the number with its event, so an off handled after a later on cannot turn the connector off again."
  priority = "P1"
  tests = ["py:tests/unit/connectors/api/test_router_toggle_sequence.py"]

  [[feature.behavior]]
  id = "connectors.sync-control.resync-busy"
  says = "A resync is refused while a sync is running, a full sync is running, one is queued, the connector is being deleted or locked, and someone else's personal connector is refused."
  priority = "P0"
  tests = ["node:tests/modules/tokens_manager/controllers/connector.controllers.stop.test.ts", "node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.sync-control.resync-queue"
  says = "POST .../resync publishes the event for the caller (ignoring any org or user in the body), answers 503 when it cannot be queued, and needs the connector name."
  priority = "P1"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.sync-control.stop"
  says = "POST .../sync/stop stops a local or remote running sync, returns a queued connector to idle, keeps a full sync owed by a filter change, and never claims IDLE when the repair did not land."
  priority = "P1"
  tests = ["py:tests/unit/connectors/api/test_stop_endpoint.py", "node:tests/modules/tokens_manager/controllers/connector.controllers.stop.test.ts"]

  [[feature.behavior]]
  id = "connectors.sync-control.reindex"
  says = "POST .../reindex forwards status filters when given, sends an empty body for everything, and rejects filters that are not a list of strings."
  priority = "P1"
  tests = ["node:tests/modules/tokens_manager/routes/connectors.routes.http.test.ts", "node:tests/modules/tokens_manager/routes/connectors.routes.test.ts"]

[[feature]]
id = "connectors.crawling"
title = "Sync schedules (crawling manager)"
flow = "connector-setup"
what = "A user schedules a connector's recurring sync (interval, cron or one time), then pauses, resumes, changes or removes it. Admins list and clear every schedule of the org."
routes = ["* /api/v1/crawlingManager/**"]
code = ["backend/nodejs/apps/src/modules/crawling_manager/**"]
status = "draft"

  [[feature.behavior]]
  id = "connectors.crawling.access"
  says = "Creating, pausing or resuming a schedule needs a sign-in and the crawl:write scope (crawl:read to read, crawl:delete to remove); a member cannot schedule a team connector or touch another member's personal one, and another org's admin cannot reach it by id."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/crawling_manager/routes/cm_routes.http.test.ts", "node:tests/modules/crawling_manager/routes/cm_routes.test.ts"]

  [[feature.behavior]]
  id = "connectors.crawling.org-scope"
  says = "The org and user come from the sign-in, not the body; list, remove-all and stats cover the caller's own org only, and remove-all and list-all need an administrator."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/crawling_manager/routes/cm_routes.http.test.ts"]

  [[feature.behavior]]
  id = "connectors.crawling.lifecycle"
  says = "Creating a schedule queues one repeating job, changing it replaces the old one, pause leaves nothing to fire, resume restores the same schedule, and remove leaves nothing queued."
  priority = "P0"
  tests = ["node:tests/modules/crawling_manager/routes/cm_routes.http.test.ts", "node:tests/modules/crawling_manager/services/crawling_service.test.ts"]

  [[feature.behavior]]
  id = "connectors.crawling.validation"
  says = "A schedule is refused, keeping the old one, for a cron expression without five fields, an hour of 24, an interval outside 1 minute to one year, a one-time run in the past, or a path id that is not a plain segment."
  priority = "P1"
  tests = ["node:tests/modules/crawling_manager/routes/cm_routes.http.test.ts", "node:tests/modules/crawling_manager/validator/validator.test.ts"]

  [[feature.behavior]]
  id = "connectors.crawling.repair"
  says = "A sweep recreates a missing schedule for an active scheduled connector, replaces one whose interval changed, removes orphans, and changes nothing when the connector list cannot be fetched."
  priority = "P1"
  tests = ["node:tests/modules/crawling_manager/services/connector_schedule_sweep.test.ts", "node:tests/modules/crawling_manager/services/connector_schedule_orchestrator.test.ts"]

  [[feature.behavior]]
  id = "connectors.crawling.failures"
  says = "A removal or pause that could not reach the queue is reported, not claimed as done, and what the connector service said when it failed is not shown to the caller."
