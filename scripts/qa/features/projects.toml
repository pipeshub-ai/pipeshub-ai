    "fe:app/(main)/notifications/__tests__/panel-mobile.test.tsx",
    "fe:app/(main)/notifications/__tests__/store.test.ts",
  ]

[[feature]]
id = "projects.notification-delivery"
title = "Notification delivery"
flow = "notifications-mail"
what = "Services publish notification events to a queue; a consumer resolves the recipients (users or roles), stores the notification and pushes it live to the user's open sessions over a socket."
code = [
  "backend/nodejs/apps/src/modules/notification/service/**",
  "backend/nodejs/apps/src/modules/notification/utils/**",
  "backend/nodejs/apps/src/modules/notification/container/**",
  "frontend/lib/socket/notification-socket.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.notification-delivery.consume"
  says = "The consumer stores a notification for each resolved recipient in the event's org, and skips an event with an invalid org id or type."
  priority = "P1"
  tests = [
    "node:tests/modules/notification/service/notification.consumer.test.ts",
    "node:tests/modules/notification/notification-recipient.resolver.test.ts",
    "node:tests/modules/notification/notification-payload.resolver.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.notification-delivery.socket-auth"
  says = "The notification socket accepts a connection only with a valid token, puts the user in their own room, and tells a user without a role or an ended session to sign out."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/notification/service/notification.service.socket.test.ts",
    "node:tests/modules/notification/service/notification.service.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.notification-delivery.recipients"
  says = "A notification for a role reaches only the users of that role (admin, or a group type) in the same org."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/notification/notification-recipient.resolver.test.ts"]

  [[feature.behavior]]
  id = "projects.notification-delivery.client"
  says = "The browser socket connects with the session token, reconnects, and adds each pushed notification to the panel once."
  priority = "P2"
  tests = [
    "fe:lib/socket/__tests__/notification-socket.test.ts",
    "fe:app/(main)/notifications/__tests__/useNotificationSocket.test.tsx",
  ]

  [[feature.behavior]]
  id = "projects.notification-delivery.producer"
  says = "Notification events (for example upload status) are published to the notification topic with the org, recipients and payload."
  priority = "P2"
  tests = ["node:tests/modules/notification/service/notification.producer.test.ts"]

