# Feature map: projects (flows `projects-artifacts`, `notifications-mail`, `chat-citations`). Projects, artifacts, notifications and the home and sidebar pages.

[[feature]]
id = "projects.crud"
title = "Projects"
flow = "projects-artifacts"
what = "A user creates a project with a name, description, icon and color, lists, opens, renames and deletes it, and pins it to their own list. The Projects switch under Workspace > Labs must be on, and an OAuth token needs project:read, project:write or project:delete."
routes = [
  "POST /api/v1/projects",
  "GET /api/v1/projects",
  "GET /api/v1/projects/{projectId}",
  "PATCH /api/v1/projects/{projectId}",
  "DELETE /api/v1/projects/{projectId}",
  "POST /api/v1/projects/{projectId}/pin",
  "POST /api/v1/projects/{projectId}/unpin",
]
pages = ["frontend/app/(main)/projects/page.tsx", "frontend/app/(main)/@sidebar/projects/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/projects/routes/**",
  "backend/nodejs/apps/src/modules/projects/controller/**",
  "backend/nodejs/apps/src/modules/projects/services/project.service.ts",
  "backend/nodejs/apps/src/modules/projects/validators/**",
  "backend/nodejs/apps/src/modules/projects/schema/**",
  "frontend/app/(main)/projects/**",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.crud.lifecycle"
  says = "A project can be created, listed with the caller's role and conversation count, read by id, updated, pinned, unpinned and deleted; the create and read responses match the spec."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectCrudLifecycle::test_create_get_update_archive_pin_delete",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectResponseOpenApiContract::test_create_project_response",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectResponseOpenApiContract::test_list_projects_response",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectResponseOpenApiContract::test_get_project_by_id_response_includes_role",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectCrudLifecycle::test_list_projects_includes_created_project_with_role_and_conversation_count",
  ]

  [[feature.behavior]]
  id = "projects.crud.validation"
  says = "Create rejects a missing name and an unknown field with 400; a malformed project id gets 400 and an unknown one 404; an empty name on update is refused with 400."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_create_project_rejects_missing_name",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_create_project_rejects_unknown_field",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectCrudLifecycle::test_get_nonexistent_project_returns_404",
    "node:tests/modules/projects/validators/project.validators.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.crud.non-member-404"
  says = "A user who is not a member gets 404, not 403, for a project, so its existence is not revealed; a member with too low a role gets 403."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectAccessMatrix::test_non_member_gets_404_not_403",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectAccessMatrix::test_viewer_member_can_read_but_not_update",
    "node:tests/modules/projects/services/project.service.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.crud.sharing-settings-owner-only"
  says = "An editor can change the name, description, icon and color, but only the owner can change visibility or chat sharing; those fields from an editor get 403."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectAccessMatrix::test_editor_member_cannot_manage_members_or_change_visibility",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_update_project_accepts_owner_only_fields_alongside_others",
  ]

  [[feature.behavior]]
  id = "projects.crud.delete-owner-only"
  says = "Only the owner can delete a project; the delete unlinks its chats first and repeating the delete by the owner succeeds; another user cannot see a deleted project."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/projects/controller/project.controller.test.ts",
    "node:tests/modules/projects/services/project.service.transactions.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.crud.labs-switch"
  says = "While the Projects switch in Workspace > Labs is off, every project route is refused with a message that says an admin can turn Projects on; turning it on applies within seconds."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectsLabsSwitch::test_projects_are_refused_while_the_labs_switch_is_off",
    "node:tests/modules/projects/utils/projects-feature.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.crud.scopes"
  says = "An OAuth token or PAT without project:read gets 403 from GET /api/v1/projects, without project:write from POST and PATCH, and without project:delete from DELETE."
  priority = "P0"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "projects.crud.ui"
  says = "The projects page lists the user's projects as cards with pin, archive and delete actions that depend on the user's role, and a user opens a project to see its workspace."
  priority = "P1"
  tests = [
    "e2e:tests/e2e/chat/chat-projects.spec.ts",
    "fe:app/(main)/projects/components/__tests__/project-list.test.tsx",
    "fe:app/(main)/projects/components/__tests__/project-helpers.test.ts",
    "fe:app/(main)/chat/sidebar/dialogs/__tests__/create-project-dialog.test.tsx",
  ]

[[feature]]
id = "projects.archive"
title = "Archive a project"
flow = "projects-artifacts"
what = "The owner archives a project to make it read-only, and restores it later. While a project is archived, edits and new chats in it are refused."
routes = [
  "POST /api/v1/projects/{projectId}/archive",
  "POST /api/v1/projects/{projectId}/unarchive",
]
code = [
  "backend/nodejs/apps/src/modules/projects/services/project.service.ts",
  "backend/nodejs/apps/src/modules/projects/controller/project.controller.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.archive.owner-only"
  says = "Only the owner can archive or unarchive a project; an editor or viewer gets 403."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/projects/services/project.service.test.ts"]

  [[feature.behavior]]
  id = "projects.archive.read-only"
  says = "An archived project refuses updates and member changes with a message that tells the user to unarchive it, and new chats cannot start in it."
  priority = "P1"
  tests = ["node:tests/modules/projects/services/project.service.test.ts"]

  [[feature.behavior]]
  id = "projects.archive.restore"
  says = "Archiving then unarchiving returns the project to its earlier state, and the archive sets archivedBy to the owner."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectCrudLifecycle::test_create_get_update_archive_pin_delete",
    "node:tests/modules/projects/services/project.service.test.ts",
  ]

[[feature]]
id = "projects.members"
title = "Project members"
flow = "projects-artifacts"
what = "The owner adds users or teams to a project as viewer or editor, changes their role and removes them. A member can leave on their own."
routes = [
  "GET /api/v1/projects/{projectId}/members",
  "PUT /api/v1/projects/{projectId}/members",
  "DELETE /api/v1/projects/{projectId}/members/{memberUserId}",
]
code = [
  "backend/nodejs/apps/src/modules/projects/services/project.service.ts",
  "backend/nodejs/apps/src/modules/projects/utils/team-membership.ts",
  "backend/nodejs/apps/src/modules/projects/controller/project.controller.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.members.upsert"
  says = "PUT members adds or updates members with a viewer or editor role, rejects any other role with 400, and rejects a user that does not exist."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_upsert_project_members",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_upsert_project_members_rejects_bad_role",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectAccessMatrix::test_upsert_members_rejects_unknown_iam_user",
  ]

  [[feature.behavior]]
  id = "projects.members.owner-only"
  says = "Only the owner can add, change or remove other members; an editor gets 403."
  priority = "P0"
  kind = "security"
  tests = ["it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectAccessMatrix::test_editor_member_cannot_manage_members_or_change_visibility"]

  [[feature.behavior]]
  id = "projects.members.remove-revokes"
  says = "After a member is removed, the project returns 404 for them, and their access to the project's files collection is revoked before the removal is stored."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectAccessMatrix::test_remove_member_revokes_access",
    "node:tests/modules/projects/services/project-kb.service.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.members.leave"
  says = "A member who is not the owner can remove only their own user row, which is how they leave; removing someone else gets 403, and a removal that matches no row reports that nothing was removed."
  priority = "P1"
  tests = ["node:tests/modules/projects/services/project.service.test.ts"]

  [[feature.behavior]]
  id = "projects.members.team-access"
  says = "A user in a team that is a project member gets that team's role, resolved from the graph, and does not get it after leaving the team."
  priority = "P1"
  tests = ["node:tests/modules/projects/utils/team-membership.test.ts"]

[[feature]]
id = "projects.chats"
title = "Chats in a project"
flow = "projects-artifacts"
what = "A user lists the conversations of a project, links a chat to a project or unlinks it, and starts a chat in a project. A project's instructions and its files and sources narrow what the chat uses."
