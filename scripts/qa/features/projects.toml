  "GET /api/v1/artifacts",
  "GET /api/v1/artifacts/{artifactId}",
  "GET /api/v1/artifacts/{artifactId}/versions",
  "GET /api/v1/artifacts/{artifactId}/permissions",
]
pages = ["frontend/app/(main)/artifacts/page.tsx", "frontend/app/(main)/@sidebar/artifacts/page.tsx"]
