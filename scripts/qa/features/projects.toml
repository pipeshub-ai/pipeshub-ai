  "backend/python/app/connectors/api/artifacts_router.py",
  "backend/python/app/services/artifact_registry/**",
  "frontend/app/(main)/artifacts/**",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.artifacts.routes"
  says = "The artifact routes match the OpenAPI spec, and the controller forwards the caller's identity to the connectors service and passes its errors through."
