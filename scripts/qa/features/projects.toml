code = [
  "backend/nodejs/apps/src/modules/enterprise_search/utils/project-context.ts",
  "backend/nodejs/apps/src/modules/projects/controller/project.controller.ts",
  "backend/python/app/agents/agent_loop/**",
  "frontend/app/(main)/chat/project-api.ts",
  "frontend/app/(main)/chat/sidebar/project-conversations-sidebar.tsx",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.chats.list"
  says = "GET project conversations lists the chats linked to a project for a member, and answers 404 for a project the caller cannot see."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectConversationLinking::test_link_and_list_conversation_in_project",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectConversationLinking::test_link_to_project_caller_cannot_see_returns_404",
  ]

  [[feature.behavior]]
  id = "projects.chats.link"
  says = "A chat's project can be set and cleared with null, the field is required, and a bad visibility value gets 400; a chat started with a project id is linked on creation."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_set_conversation_project_link",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_set_conversation_project_unlink_with_null",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_set_conversation_project_requires_the_field",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectRequestOpenApiContract::test_set_conversation_project_visibility_rejects_bad_enum",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectScopedStream::test_new_conversation_with_project_id_is_linked_on_creation",
    "node:tests/modules/enterprise_search/controller/set-conversation-project.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.chats.scope"
  says = "A chat in a project gets the project's instructions, and its source filters default to the project's scope and the hidden files collection; a request can narrow the scope but never widen it."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/enterprise_search/utils/project-context.test.ts",
    "py:tests/unit/agents/adapter/test_agent_context_project_instructions.py",
  ]

  [[feature.behavior]]
  id = "projects.chats.token-scope"
  says = "An OAuth token needs project:read to start a chat in a project, and a caller who cannot see the project gets 404 before anything reaches the AI service."
  priority = "P0"
  kind = "security"
  tests = []

[[feature]]
id = "projects.files"
