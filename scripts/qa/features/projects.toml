  tests = [
    "py:tests/unit/services/artifact_registry/test_versioning.py",
    "py:tests/unit/services/artifact_registry/test_artifact_edited_from_a_fork.py",
    "fe:app/(main)/chat/utils/__tests__/artifact-version-after-fork.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.artifacts.ui"
  says = "The gallery shows artifacts in a grid or list with thumbnails and type labels, shows loading, empty and error states, and opens an artifact's chat from a row."
  priority = "P1"
  tests = [
    "e2e:tests/e2e/artifacts/artifacts-gallery.spec.ts",
    "fe:app/(main)/artifacts/components/__tests__/data-table-states.test.tsx",
    "fe:app/(main)/artifacts/__tests__/open-in-chat.test.tsx",
    "fe:app/(main)/artifacts/__tests__/deep-link.test.tsx",
  ]

[[feature]]
id = "projects.artifacts-share"
title = "Share and delete an artifact"
flow = "projects-artifacts"
what = "The owner of an artifact shares it with users in the same org, takes the share back, or deletes it. Nobody else can share or delete it."
routes = [
  "POST /api/v1/artifacts/{artifactId}/share",
  "POST /api/v1/artifacts/{artifactId}/unshare",
  "DELETE /api/v1/artifacts/{artifactId}",
]
code = [
  "backend/python/app/services/artifact_registry/sharing.py",
  "backend/python/app/services/artifact_registry/registry.py",
  "backend/nodejs/apps/src/modules/artifacts/services/conversation-artifacts.service.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.artifacts-share.owner-only"
  says = "Only the owner can share or unshare an artifact, only with users of the same org and at most 100 per request; others get 404 or 403 and a bad target gets 400."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/connectors/api/test_artifacts_router_sharing.py",
    "py:tests/unit/services/artifact_registry/test_sharing_service.py",
  ]

  [[feature.behavior]]
  id = "projects.artifacts-share.unshare"
  says = "Unshare removes only direct shares; the owner's access stays, and access that came from a shared chat stays."
  priority = "P1"
  tests = ["py:tests/unit/services/artifact_registry/test_sharing_service.py"]

  [[feature.behavior]]
  id = "projects.artifacts-share.delete"
  says = "DELETE returns 204 for the owner and removes the artifact from the gallery and storage; a non-owner gets 403 and an unknown id 404; a storage outage returns 503."
  priority = "P0"
  tests = [
    "py:tests/unit/connectors/api/test_artifacts_router_delete.py",
    "py:tests/unit/services/artifact_registry/test_registry_delete.py",
    "e2e:tests/e2e/artifacts/artifacts-delete.spec.ts",
  ]

  [[feature.behavior]]
  id = "projects.artifacts-share.delete-scope"
  says = "DELETE needs the conversation:write scope; a token with only kb:write gets 403."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/artifacts/artifacts-match-the-spec.test.ts"]

  [[feature.behavior]]
  id = "projects.artifacts-share.notify"
  says = "Sharing an artifact sends the recipient an in-app notification."
  priority = "P2"
  tests = ["py:tests/unit/connectors/api/test_artifacts_router_sharing.py"]

[[feature]]
id = "projects.artifact-store"
title = "Artifact creation, storage and retention"
flow = "projects-artifacts"
what = "Files the AI writes in a chat or through the sandbox are stored as artifacts with metadata, versions and signed download links, shown in the chat's artifact panel, and removed on schedule or with their chat."
code = [
  "backend/python/app/modules/artifacts/**",
  "backend/python/app/sandbox/artifact_upload.py",
  "backend/python/app/sandbox/artifact_cleanup.py",
  "backend/python/app/agents/actions/artifacts/**",
  "backend/nodejs/apps/src/modules/artifacts/services/**",
  "backend/nodejs/apps/src/modules/storage/**",
  "frontend/app/(main)/chat/components/message-area/artifacts-panel.tsx",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.artifact-store.write-read"
  says = "A record's parsed content is stored as one artifact set per revision and read back with the same content; a pointer to a missing, tampered or different revision is not served, and the read falls back instead of failing."
  priority = "P0"
  tests = [
    "py:tests/unit/modules/artifacts/test_writer.py",
    "py:tests/unit/modules/artifacts/test_artifact_reader.py",
    "py:tests/integration/test_artifact_stale_pointer_e2e.py",
    "py:tests/integration/test_artifact_stored_write_e2e.py",
  ]

  [[feature.behavior]]
  id = "projects.artifact-store.signed-urls"
  says = "Storage signs the URLs for artifact files and gives none when it cannot sign; an upload grant is single-use, tied to the actor, size-capped and expires, and the storage route does not serve another organisation's files or paths outside the mount."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/services/artifact_registry/test_signed_urls.py",
    "node:tests/modules/storage/providers/artifact-object-urls.provider.test.ts",
    "node:tests/modules/storage/routes/storage.artifacts.http.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.artifact-store.path-safety"
  says = "An artifact's properties path cannot escape its own directory."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/storage/validators/artifact-properties-path.test.ts"]

  [[feature.behavior]]
  id = "projects.artifact-store.retention"
  says = "The cleanup job removes artifact-set revisions that are neither the current nor the previous one nor held by a record, after a grace period, and keeps every revision while a holder is in the trash."
  priority = "P1"
  tests = [
    "py:tests/unit/modules/artifacts/test_retention.py",
    "py:tests/unit/modules/artifacts/test_stored_retention.py",
  ]

  [[feature.behavior]]
  id = "projects.artifact-store.conversation-delete"
  says = "Deleting a conversation deletes its artifacts with it, leaving no edges behind and never touching a neighbouring artifact; if the artifacts cannot be deleted the chat is not deleted."
  priority = "P1"
  tests = [
    "node:tests/modules/artifacts/services/conversation-artifacts.service.test.ts",
    "py:tests/integration/graph_db/test_artifact_delete_real_backends.py",
  ]

  [[feature.behavior]]
  id = "projects.artifact-store.sandbox-upload"
  says = "A file the coding sandbox writes becomes an artifact of the conversation, uploaded in the background; a file over 25 MB, an unreadable one, or one whose upload fails is skipped and the others still upload."
  priority = "P1"
  tests = ["py:tests/unit/sandbox/test_artifact_upload.py"]

  [[feature.behavior]]
  id = "projects.artifact-store.sandbox-read-safety"
  says = "Only regular files inside the sandbox directories are read as artifacts: a path outside them and a symlink, even one inside, are refused, so a script cannot publish a host file; a file that grows past the size cap while being read is dropped."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/sandbox/test_artifact_upload.py"]

  [[feature.behavior]]
  id = "projects.artifact-store.sandbox-cleanup"
  says = "A background job removes sandbox working directories older than ARTIFACT_TEMP_TTL_HOURS (default 1 hour) every ARTIFACT_CLEANUP_INTERVAL_MINUTES (default 30); an invalid value falls back to the default, recent directories and stray files are kept."
  priority = "P2"
  tests = ["py:tests/unit/sandbox/test_artifact_cleanup.py"]

  [[feature.behavior]]
  id = "projects.artifact-store.reconcile"
  says = "An artifact whose new version reached storage but not the database is repaired by the same job: it re-reads the stored bytes, records the new version, size and hash, and clears the marker only after both writes succeed, so a failure is retried next sweep."
  priority = "P1"
  tests = ["py:tests/unit/sandbox/test_artifact_cleanup.py"]

  [[feature.behavior]]
  id = "projects.artifact-store.agent-tools"
  says = "The agent saves, updates, lists, reads and links artifacts of its chat: a new save returns an id, unchanged content is reported as a duplicate, an update on a stale expected version is refused rather than overwritten, a missing or forbidden artifact gives a clear error, and a file named .docx or .pdf must be a real document. What the agent makes belongs to the person chatting."
  priority = "P1"
  tests = [
    "py:tests/unit/agents/actions/artifacts/test_artifacts.py",
    "py:tests/unit/agents/actions/artifacts/test_service_account_artifact_owner.py",
  ]

  [[feature.behavior]]
  id = "projects.artifact-store.fork"
  says = "Forking a chat copies its artifacts to the new chat, so deleting one chat does not delete the other's files."
  priority = "P1"
  tests = [
    "node:tests/modules/enterprise_search/controller/fork-artifact-copier.test.ts",
    "node:tests/modules/enterprise_search/controller/fork-artifact-flow.test.ts",
    "py:tests/unit/services/artifact_registry/test_copy_to_conversation.py",
  ]

  [[feature.behavior]]
  id = "projects.artifact-store.panel"
  says = "A chat's artifact panel shows the files of the answer with thumbnails and previews, and marks an artifact that was deleted."
  priority = "P2"
  tests = [
    "fe:app/(main)/chat/components/message-area/__tests__/artifacts-panel.test.tsx",
    "fe:app/(main)/chat/components/message-area/__tests__/chat-response-artifact-preview.test.tsx",
  ]

[[feature]]
id = "projects.notifications"
title = "In-app notifications"
flow = "notifications-mail"
what = "A user sees their own notifications, filters them by read, unread or archived, marks them read or unread, archives, restores and dismisses them. Notifications are kept for 30 days."
routes = [
  "GET /api/v1/notifications",
  "GET /api/v1/notifications/stats",
  "PATCH /api/v1/notifications/read-all",
  "PATCH /api/v1/notifications/{id}/read",
  "PATCH /api/v1/notifications/{id}/unread",
  "PATCH /api/v1/notifications/{id}/archive",
  "PATCH /api/v1/notifications/{id}/unarchive",
  "DELETE /api/v1/notifications/{id}",
]
code = [
  "backend/nodejs/apps/src/modules/notification/controllers/**",
  "backend/nodejs/apps/src/modules/notification/routes/**",
  "backend/nodejs/apps/src/modules/notification/validators/**",
  "backend/nodejs/apps/src/modules/notification/schema/**",
  "frontend/app/(main)/notifications/**",
]
status = "draft"

  [[feature.behavior]]
  id = "projects.notifications.own-only"
  says = "A user lists, counts and changes only their own notifications; another user's notification id answers 404."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/notification/controllers/notification.controller.test.ts"]

  [[feature.behavior]]
  id = "projects.notifications.auth"
  says = "Every notification route needs a valid token and answers 401 without one."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/notification/routes/notification.routes.test.ts"]

  [[feature.behavior]]
  id = "projects.notifications.list"
  says = "GET notifications pages with a cursor and a limit of 1 to 100 (default 20), filters by status read, unread or archived, and rejects any other status with 400; stats returns the notification counts."
  priority = "P1"
  tests = [
    "node:tests/modules/notification/controllers/notification.controller.test.ts",
    "node:tests/modules/notification/notification-api.utils.test.ts",
  ]

  [[feature.behavior]]
  id = "projects.notifications.state"
  says = "Read, unread, archive, unarchive and read-all change the state they name, a malformed id gets 400 and an unknown id 404, and dismiss soft-deletes it so it no longer lists."
  priority = "P1"
  tests = ["node:tests/modules/notification/controllers/notification.controller.test.ts"]

  [[feature.behavior]]
  id = "projects.notifications.retention"
  says = "Notifications expire 30 days after they were created."
  priority = "P2"
  tests = ["node:tests/modules/notification/notification-api.utils.test.ts"]

  [[feature.behavior]]
  id = "projects.notifications.panel"
  says = "The notification panel lists notifications with a link to the item, filters, and a mobile layout; chat-shared notifications read correctly in every language."
