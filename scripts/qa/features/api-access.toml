  "backend/nodejs/apps/src/modules/oauth_provider/routes/agent-registration.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/controller/agent-registration.controller.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/agent-registration.service.ts",
  "frontend/app/(public)/agent/claim/**",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.agent-registration.hashed"
  says = "Registering stores only hashes and answers alike for any address, never looking users up."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/agent-registration.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.agent-registration.claim-session"
  says = "Verify, complete, list and revoke need a signed-in session; a token or service account is refused. The registration binds to the session user and org, not to the request."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/agent-registration.service.test.ts", "node:tests/modules/oauth_provider/controller/agent-registration.controller.test.ts"]

  [[feature.behavior]]
  id = "api-access.agent-registration.code-attempts"
  says = "After 5 wrong claim codes the attempt expires, even for the right code."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/agent-registration.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.agent-registration.token"
  says = "After approval the agent gets one access token with no refresh token, limited to what the person approved. A denied or revoked registration gets no token."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/agent-registration.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.agent-registration.revoke"
  says = "Revoking a registration revokes the tokens issued under it, and a user revokes only their own registrations."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/agent-registration.service.test.ts"]

# Service accounts and service tokens

[[feature]]
id = "api-access.service-accounts"
title = "Service accounts"
flow = "api-access"
what = "An admin creates non-human accounts for unattended access, renames, describes, disables and deletes them. A service account cannot create credentials itself."
routes = [
  "GET /api/v1/service-accounts",
  "POST /api/v1/service-accounts",
  "GET /api/v1/service-accounts/{id}",
  "PATCH /api/v1/service-accounts/{id}",
  "DELETE /api/v1/service-accounts/{id}",
]
pages = ["frontend/app/(main)/workspace/service-accounts/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/user_management/routes/service-accounts.routes.ts",
  "backend/nodejs/apps/src/modules/user_management/controller/service-accounts.controller.ts",
  "backend/nodejs/apps/src/modules/user_management/services/service-accounts.service.ts",
  "frontend/app/(main)/workspace/service-accounts/**",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.service-accounts.admin-and-scope"
  says = "Only organization admins use these routes, and an OAuth token or PAT also needs the matching user scope (user:read, user:invite, user:write, user:delete)."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/user_management/routes/service-accounts.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-accounts.name"
  says = "A name must be 3 or more lowercase letters, digits and single hyphens (not at the ends) and unique in the organization; a taken name answers 409."
  priority = "P1"
  tests = ["node:tests/modules/user_management/services/service-accounts.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-accounts.delete"
  says = "Deleting an account revokes every token it holds. A deleted name can be reused, and the new account does not inherit the old tokens."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/user_management/services/service-accounts.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-accounts.disable"
  says = "A disabled account keeps its record but cannot get new tokens; enabling it again works."
  priority = "P1"
  tests = ["node:tests/modules/user_management/services/service-accounts.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-accounts.not-users"
  says = "A service account route never returns a human user, and service accounts are hidden from user and team member lists."
  priority = "P1"
  tests = [
    "node:tests/modules/user_management/services/service-accounts.service.test.ts",
    "py:tests/unit/services/graph_db/test_organization_users_hide_service_accounts.py",
    "py:tests/unit/services/graph_db/test_team_members_hide_service_accounts.py",
  ]

  [[feature.behavior]]
  id = "api-access.service-accounts.page"
  says = "The service accounts page lets an admin create, disable and delete accounts, with a confirmation before destructive actions."
  priority = "P1"
  tests = ["fe:app/(main)/workspace/service-accounts/__tests__/destructive-actions-confirm.test.tsx"]

[[feature]]
id = "api-access.service-tokens"
title = "Service tokens"
flow = "api-access"
what = "An admin mints read-only tokens for a service account, lists them and revokes them. Tokens carry the prefix phsvc_ and always expire."
routes = [
  "GET /api/v1/service-tokens",
  "POST /api/v1/service-tokens",
  "GET /api/v1/service-tokens/scopes",
  "DELETE /api/v1/service-tokens/{tokenId}",
]
code = [
  "backend/nodejs/apps/src/modules/oauth_provider/routes/service-token.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/controller/service-token.controller.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/service-token.service.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/validators/service-token.validators.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.service-tokens.scopes"
  says = "A token needs at least one scope; agent:execute and scopes the instance does not allow are refused."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/service-token.service.test.ts", "node:tests/modules/oauth_provider/controller/service-token.controller.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-tokens.identity"
  says = "The token authenticates as the service account, not as the admin who minted it."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/service-token.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-tokens.expiry-cap"
  says = "Expiry defaults to 90 days and may not exceed 365 days; there is no never-expires option. An account may hold at most 50 active tokens."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/services/service-token.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-tokens.admin-and-scope"
  says = "Only admins use the routes, and a token caller also needs the matching user scope."
  priority = "P0"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "api-access.service-tokens.disabled-account"
  says = "Minting for a disabled account is refused; listing and revoking its tokens still work."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/services/service-token.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.service-tokens.revoke"
  says = "Revoking a token stops it working, and a token id that belongs to a different service account answers 404."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/service-token.service.test.ts"]

[[feature]]
id = "api-access.delegation"
title = "Service account delegation"
flow = "api-access"
what = "Acting as a named person through a service account is not available in this build. The capability probe says so, and the other routes answer 501."
routes = [
  "GET /api/v1/service-account-delegations/capability",
  "GET /api/v1/service-account-delegations",
  "POST /api/v1/service-account-delegations",
  "GET /api/v1/service-account-delegations/events",
  "DELETE /api/v1/service-account-delegations/{subjectUserId}",
]
code = ["backend/nodejs/apps/src/modules/oauth_provider/routes/delegation.routes.ts"]
status = "draft"

  [[feature.behavior]]
  id = "api-access.delegation.capability"
  says = "GET /api/v1/service-account-delegations/capability answers 200 with available false."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/routes/delegation.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.delegation.not-built"
  says = "The list, create, events and delete routes answer 501, so no delegation entry can exist."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/routes/delegation.routes.test.ts"]

# MCP endpoint

[[feature]]
id = "api-access.mcp-endpoint"
title = "MCP endpoint"
flow = "api-access"
what = "An MCP client calls the server's tools over streamable HTTP at /mcp with an OAuth access token or a PAT. The tools it sees depend on the token's scopes."
routes = [
  "POST /api/v1/mcp",
  "GET /api/v1/mcp",
]
code = [
  "backend/nodejs/apps/src/modules/mcp/**",
  "backend/nodejs/apps/src/modules/oauth_provider/routes/oid.provider.routes.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.auth"
  says = "A request with no token or a bad token gets 401 with a WWW-Authenticate header naming the protected-resource metadata."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpAuth::test_no_token_is_401",
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpAuth::test_bad_token_is_401",
    "node:tests/modules/mcp/routes/mcp.routes.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.token-kinds"
  says = "An authorization-code token, a client_credentials token and a PAT are accepted. A web session token is refused with 401."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpAuth::test_authorization_code_token_is_accepted",
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpAuth::test_client_credentials_token_sees_the_same_tools",
    "it:ai_agents/integration_test_pipeshub_mcp_live.py::TestPipesHubMcpWithAPat::test_the_tool_list_has_search",
    "node:tests/modules/mcp/routes/mcp.routes.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.audience"
  says = "A token issued for another resource is refused at /mcp, and an MCP token is refused by the REST API and the connector service."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/mcp/integration_test_mcp_audience.py::test_the_token_names_mcp_as_its_audience",
    "it:response-validation/mcp/integration_test_mcp_audience.py::test_the_rest_api_refuses_it",
    "it:response-validation/mcp/integration_test_mcp_audience.py::test_the_connector_service_refuses_it",
  ]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.origin"
  says = "A browser request with an Origin not in the allowed list gets 403 before authentication; clients that send no Origin pass."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/mcp/routes/mcp.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.tools"
  says = "The tool list is the curated set with descriptions, schemas and annotations; a call to a tool the token lacks scopes for answers 403 insufficient_scope."
  priority = "P0"
  tests = [
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpSurfaceInvariants::test_exactly_the_curated_tools",
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpSurfaceMatchesGolden::test_tool_names",
    "node:tests/modules/mcp/controller/mcp.controller.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.get-405"
  says = "GET /mcp answers 405 with Allow: POST."
  priority = "P2"
  tests = ["node:tests/modules/mcp/routes/mcp.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.rate-limit"
  says = "Each account has its own request budget, and an address is counted only for rejected tokens. Over the limit answers 429 as a JSON-RPC error."
  priority = "P1"
  tests = ["node:tests/modules/mcp/routes/mcp.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.mcp-endpoint.tool-results"
  says = "Tools return real data for the caller: search finds an indexed document, a record can be read back, and every hit can be opened."
  priority = "P1"
  tests = [
    "it:response-validation/mcp/integration_test_mcp_tools.py::TestSearch::test_finds_the_seeded_document_in_its_collection",
    "it:response-validation/mcp/integration_test_mcp_tools.py::TestGetRecordContent::test_content_reads_the_document",
  ]

# API documentation

[[feature]]
id = "api-access.api-docs"
title = "API documentation"
flow = "api-access"
what = "The server serves its API documentation as a page at /api/v1/docs, the OpenAPI document as JSON, and a health check."
routes = [
  "GET /api/v1/docs",
  "GET /api/v1/docs/{subPath}",
  "GET /api/v1/docs/health",
  "GET /api/v1/docs/json",
]
code = ["backend/nodejs/apps/src/modules/api-docs/**"]
status = "draft"

  [[feature.behavior]]
  id = "api-access.api-docs.json"
  says = "GET /api/v1/docs/json returns the unified API document with an OAuth2 requirement on each operation at most once."
  priority = "P1"
  tests = ["node:tests/modules/api-docs/docs.oauth-security.test.ts", "node:tests/modules/api-docs/docs.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.api-docs.page"
  says = "The docs page renders descriptions as escaped text: markup in a description is not executed and only http(s), relative and fragment links are linked."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/api-docs/docs.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.api-docs.health"
  says = "GET /api/v1/docs/health answers status ok."
  priority = "P2"
  tests = []

  [[feature.behavior]]
  id = "api-access.api-docs.any-path"
  says = "Any other path under /api/v1/docs serves the same page, so deep links work."
  priority = "P2"
  tests = []

[ignore]
pages = [
  "frontend/app/(main)/@sidebar/workspace/oauth-apps/page.tsx",
  "frontend/app/(main)/workspace/oauth-apps/page.tsx",
]
