# Feature map: API access (tokens, OAuth, service accounts, MCP endpoint, API docs).

# Personal access tokens

[[feature]]
id = "api-access.pat"
title = "Personal access tokens"
flow = "api-access"
what = "A signed-in user creates, lists and revokes their own scoped tokens for programmatic access. The raw token is shown once; only a hash is stored."
routes = [
  "GET /api/v1/personal-access-tokens",
  "POST /api/v1/personal-access-tokens",
  "GET /api/v1/personal-access-tokens/scopes",
  "DELETE /api/v1/personal-access-tokens/{tokenId}",
]
pages = [
  "frontend/app/(main)/@sidebar/workspace/developer-settings/personal-access-tokens/page.tsx",
  "frontend/app/(main)/workspace/developer-settings/personal-access-tokens/page.tsx",
]
code = [
  "backend/nodejs/apps/src/modules/oauth_provider/routes/pat.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/controller/pat.controller.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/pat.service.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/validators/pat.validators.ts",
  "frontend/app/(main)/workspace/developer-settings/personal-access-tokens/**",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.pat.create-once"
  says = "POST /api/v1/personal-access-tokens answers 201 with the raw token (prefix phpat_) once and no refresh token. Listing never returns it."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts", "e2e:tests/e2e/workspace/personal-access-tokens.spec.ts"]

  [[feature.behavior]]
  id = "api-access.pat.scopes"
  says = "A scope outside the allowed set is refused, and a token created without scopes gets the default set. GET /api/v1/personal-access-tokens/scopes lists what may be chosen."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts", "node:tests/modules/oauth_provider/controller/pat.controller.test.ts"]

  [[feature.behavior]]
  id = "api-access.pat.expiry"
  says = "expiryDays accepts only 30, 90, 365 or never (default 30; never means 100 years). A name is required (1 to 100 characters)."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts", "e2e:tests/e2e/workspace/personal-access-tokens.spec.ts"]

  [[feature.behavior]]
  id = "api-access.pat.session-only"
  says = "Every personal access token route needs a signed-in session. A PAT or an OAuth access token gets 403, and a service account caller is refused."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/routes/pat.routes.test.ts",
    "node:tests/libs/middlewares/require-session-auth.middleware.test.ts",
    "node:tests/modules/user_management/middlewares/refuseServiceAccountCaller.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.pat.revoke-own"
  says = "DELETE /api/v1/personal-access-tokens/{tokenId} revokes only the caller's own token; another user's token id, or a malformed id, is refused (404 or 400). A revoked token stops working at once."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts", "e2e:tests/e2e/workspace/personal-access-tokens.spec.ts"]

  [[feature.behavior]]
  id = "api-access.pat.knowledge-limit"
  says = "A token created with a knowledge limit can reach only the sources in that limit: search, record reads, downloads and browsing outside it are refused or empty."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/services/pat.service.test.ts",
    "it:security/test_connection_limits.py::TestCreatingALimit::test_the_limit_is_signed_into_the_token_and_listed",
    "it:security/test_connection_limits.py::TestSearch::test_a_collection_limit_hides_the_other_collection",
    "it:security/test_connection_limits.py::TestSearch::test_a_folder_limit_hides_the_rest_of_its_collection",
    "it:security/test_connection_limits.py::TestMcp::test_reading_a_record_outside_the_limit_is_refused_with_a_reason",
  ]

  [[feature.behavior]]
  id = "api-access.pat.knowledge-limit-shape"
  says = "A knowledge limit must name at least one source, at most 50 ids in all, and only the keys apps, recordGroups and records with UUID values; anything else answers 400."
  priority = "P1"
  kind = "security"
  tests = [
    "it:security/test_connection_limits.py::TestCreatingALimit::test_a_limit_must_name_something",
    "it:security/test_connection_limits.py::TestCreatingALimit::test_a_limit_holds_at_most_fifty_ids",
    "it:security/test_connection_limits.py::TestCreatingALimit::test_a_limit_takes_only_known_keys_and_uuids",
  ]

  [[feature.behavior]]
  id = "api-access.pat.rate-limit"
  says = "Token routes share a per-user per-minute budget with OAuth app management; over it answers 429."
  priority = "P2"
  tests = []

  [[feature.behavior]]
  id = "api-access.pat.list"
  says = "GET /api/v1/personal-access-tokens lists only the caller's own live tokens with name, scopes, expiry and last-used time; revoked and expired tokens are not listed."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts", "e2e:tests/e2e/workspace/personal-access-tokens.spec.ts"]

  [[feature.behavior]]
  id = "api-access.pat.page"
  says = "The personal access tokens page creates a token (name, scopes, expiry), shows it once, lists the user's tokens and revokes one. Agent sign-ins the user approved are listed there and can be revoked."
  priority = "P1"
  tests = [
    "e2e:tests/e2e/workspace/personal-access-tokens.spec.ts",
    "fe:app/(main)/workspace/developer-settings/personal-access-tokens/__tests__/agent-sign-ins.test.tsx",
  ]

[[feature]]
id = "api-access.pat-admin"
title = "Admin view of personal access tokens"
flow = "api-access"
what = "An organization admin lists every active personal access token (paged, with owner) and revokes any of them."
routes = [
  "GET /api/v1/personal-access-tokens/admin",
  "DELETE /api/v1/personal-access-tokens/admin/{tokenId}",
]
code = [
  "backend/nodejs/apps/src/modules/oauth_provider/routes/pat.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/pat.service.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.pat-admin.admin-only"
  says = "A non-admin gets 403 from both admin routes, and an admin using a token instead of a signed-in session gets 403 too."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/routes/pat.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.pat-admin.list"
  says = "The admin list pages at most 100 live tokens per request (newest first) with the owner's name and email, and a token whose owner was deleted is still listed and marked ownerDeleted."
  priority = "P1"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.pat-admin.revoke"
  says = "An admin revokes any user's token by id in the organization; an unknown id answers 404."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/pat.service.test.ts"]

# OAuth apps (management)

[[feature]]
id = "api-access.oauth-apps"
title = "OAuth apps"
flow = "api-access"
what = "A user registers OAuth apps with redirect URIs, grant types and scopes, then edits, suspends, reactivates, deletes them, rotates the secret and revokes their tokens."
routes = [
  "GET /api/v1/oauth-clients",
  "POST /api/v1/oauth-clients",
  "GET /api/v1/oauth-clients/scopes",
  "GET /api/v1/oauth-clients/{appId}",
  "PUT /api/v1/oauth-clients/{appId}",
  "DELETE /api/v1/oauth-clients/{appId}",
  "POST /api/v1/oauth-clients/{appId}/regenerate-secret",
  "POST /api/v1/oauth-clients/{appId}/suspend",
  "POST /api/v1/oauth-clients/{appId}/activate",
  "GET /api/v1/oauth-clients/{appId}/tokens",
  "POST /api/v1/oauth-clients/{appId}/revoke-all-tokens",
]
pages = [
  "frontend/app/(main)/@sidebar/workspace/developer-settings/oauth2/page.tsx",
  "frontend/app/(main)/workspace/developer-settings/oauth2/page.tsx",
]
code = [
  "backend/nodejs/apps/src/modules/oauth_provider/routes/oauth.clients.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/controller/oauth.app.controller.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/oauth.app.service.ts",
  "frontend/app/(main)/workspace/developer-settings/oauth2/**",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.oauth-apps.create"
  says = "POST /api/v1/oauth-clients answers 201 with the client id and the client secret once. Later reads never return the secret."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestCreateOAuthApp::test_response_schema",
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestGetOAuthApp::test_response_schema",
    "e2e:tests/e2e/workspace/oauth-apps.spec.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.session-only"
  says = "Every OAuth app route needs a signed-in session. A PAT or an OAuth access token gets 403, and a service account is refused."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestOAuthAppsRequireSession::test_oauth_access_token_is_refused",
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestOAuthAppsRequireSession::test_personal_access_token_is_refused",
    "node:tests/modules/oauth_provider/routes/oauth.clients.routes.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.redirect-uris"
  says = "Redirect URIs must be https, or http on localhost or 127.0.0.1, with no fragment; at most 10; an authorization_code app needs at least one."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/services/oauth.app.service.test.ts",
    "e2e:tests/e2e/workspace/oauth-apps.spec.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.own-apps"
  says = "A user sees and changes only the apps they created, and another user's app id answers 404."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/services/oauth.app.service.test.ts",
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestSuspendActivateOAuthApp::test_cross_user_errors",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.regenerate-secret"
  says = "POST /api/v1/oauth-clients/{appId}/regenerate-secret returns a new secret once, and the old secret stops working at the token endpoint (401 invalid_client)."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestRegenerateOAuthAppSecret::test_response_schema",
    "e2e:tests/e2e/workspace/oauth-apps.spec.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.suspend-revoke"
  says = "Suspending or deleting an app revokes the tokens it issued; an app that is not active gets invalid_client at the token endpoint, and a deleted app can no longer be read or listed."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/services/oauth.app.service.test.ts",
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestDeleteOAuthApp::test_deleted_app_not_gettable_or_searchable",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.status-rules"
  says = "Suspending a suspended app, activating an active app, and activating a revoked app each answer 400."
  priority = "P1"
  tests = [
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestSuspendActivateOAuthApp::test_suspend_flow",
    "node:tests/modules/oauth_provider/services/oauth.app.service.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.revoke-all"
  says = "POST /api/v1/oauth-clients/{appId}/revoke-all-tokens revokes every token the app issued, and GET /api/v1/oauth-clients/{appId}/tokens lists the live ones."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestRevokeAllOAuthAppTokens::test_response_schema",
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestListOAuthAppTokens::test_response_schema",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.list"
  says = "GET /api/v1/oauth-clients lists the caller's own apps, 20 per page by default and at most 100, and filters by status and name."
  priority = "P1"
  tests = [
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestListOAuthApps::test_pagination",
    "it:response-validation/oauth_app/integration_test_oauthApps.py::TestListOAuthApps::test_filters",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.token-lifetimes"
  says = "An app's access token lifetime must be 300 to 86400 seconds (default 3600) and its refresh token lifetime 3600 to 31536000 seconds (default 30 days); other values answer 400."
  priority = "P2"
  tests = []

  [[feature.behavior]]
  id = "api-access.oauth-apps.rate-limit"
  says = "App management shares a per-user per-minute budget with the token routes; over it answers 429 in the documented error shape."
  priority = "P2"
  tests = ["it:response-validation/oauth_app/integration_test_oauthApps.py::TestOAuthAppRateLimiting::test_rate_limit_error_schema"]

  [[feature.behavior]]
  id = "api-access.oauth-apps.scope-narrowing"
  says = "Removing a scope or narrowing the knowledge limit of an app revokes its existing tokens; adding scopes does not, and a widened limit does not widen tokens already issued."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/services/oauth-app-scope-reduction.test.ts",
    "node:tests/modules/oauth_provider/schema/knowledge_limit.schema.test.ts",
    "it:security/test_connection_limits.py::TestOAuthApps::test_a_new_limit_revokes_the_apps_tokens_and_a_lifted_one_keeps_them_at_their_limit",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-apps.admin-scopes"
  says = "Any member may create an authorization_code app; the scopes on offer (GET /api/v1/oauth-clients/scopes) and accepted on create and update depend on the caller's role, and an admin-only scope from a member is refused."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/services/oauth.app.service.test.ts",
    "node:tests/modules/oauth_provider/config/scopes.config.test.ts",
  ]

[[feature]]
id = "api-access.oauth-app-identity"
title = "OAuth app token identity"
flow = "api-access"
what = "An admin chooses which service account an app's client_credentials tokens act as. An app using client_credentials must name one."
routes = ["PUT /api/v1/oauth-clients/{appId}/token-identity"]
code = [
  "backend/nodejs/apps/src/modules/oauth_provider/routes/oauth.clients.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/oauth.app.service.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.oauth-app-identity.admin-only"
  says = "A non-admin gets 403 from PUT /api/v1/oauth-clients/{appId}/token-identity, and a member who creates an app with the client_credentials grant, or edits an app to gain it, gets 403."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/oauth.app.service.test.ts", "node:tests/modules/oauth_provider/services/oauth-app-token-identity.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-app-identity.account-rules"
  says = "The named account must be an enabled service account of the same organization: a colleague, a deleted or unknown id answers 404 and a disabled account answers 400."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/oauth-app-token-identity.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-app-identity.keep-binding"
  says = "Clearing the identity (serviceAccountId null) is refused with 400 while the app allows client_credentials; switching to another service account is allowed."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/oauth-app-token-identity.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-app-identity.revokes"
  says = "Changing the identity revokes the app's existing tokens, and the old identity is restored if the revocation fails."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/oauth-app-token-identity.test.ts"]

# OAuth provider

[[feature]]
id = "api-access.oauth-authorize"
title = "OAuth authorization code flow"
flow = "api-access"
what = "A third-party app sends a user to authorize, the user consents on the consent page, and the app exchanges the code at the token endpoint. Tokens can be refreshed, revoked and introspected."
routes = [
  "GET /api/v1/oauth2/authorize",
  "POST /api/v1/oauth2/authorize",
  "POST /api/v1/oauth2/token",
  "POST /api/v1/oauth2/revoke",
  "POST /api/v1/oauth2/introspect",
]
pages = ["frontend/app/(public)/oauth/authorize/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/oauth_provider/routes/oauth.provider.routes.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/controller/oauth.provider.controller.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/authorization_code.service.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/services/oauth_token.service.ts",
  "backend/nodejs/apps/src/modules/oauth_provider/middlewares/oauth.redirect.middleware.ts",
  "frontend/app/(public)/oauth/authorize/**",
]
status = "draft"

  [[feature.behavior]]
  id = "api-access.oauth-authorize.code-flow"
  says = "POST /api/v1/oauth2/authorize from a signed-in user who approves answers with a redirectUrl to the registered redirect_uri carrying a code and the state; the token endpoint exchanges the code for an access token (and a refresh token when allowed). A user who denies gets an access_denied redirectUrl and no code. GET /api/v1/oauth2/authorize with no signed-in session redirects to the sign-in page and keeps the query."
  priority = "P0"
  tests = [
    "node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts",
    "node:tests/modules/oauth_provider/middlewares/oauth.redirect.middleware.test.ts",
    "e2e:tests/e2e/workspace/oauth-apps.spec.ts",
    "it:response-validation/mcp/integration_test_mcp_server.py::TestMcpAuth::test_authorization_code_token_is_accepted",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.redirect-uri"
  says = "A redirect_uri that does not exactly match a registered one (loopback may differ in port) is refused with a 400 error page and never redirected to, and no code is issued. The token endpoint also refuses a redirect_uri that differs from the one the code was issued for."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts",
    "node:tests/modules/oauth_provider/services/oauth.app.service.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.pkce"
  says = "A public client must send a code_challenge, and only the S256 method is accepted; the verifier must match it or the exchange fails with invalid_grant."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/authorization_code.service.test.ts", "node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.code-single-use"
  says = "An authorization code works once and lives 10 minutes. Presenting a used code again fails with invalid_grant and revokes the tokens that app holds for that user. An expired code is refused."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/services/authorization_code.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.consent-session-only"
  says = "POST /api/v1/oauth2/authorize needs a signed-in session. A token (PAT or OAuth) gets 403, and a service account is refused."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/routes/oauth.provider.routes.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.scopes"
  says = "Consent covers only scopes the app is registered for; scopes outside the registration are dropped from the code, and when none remain GET /api/v1/oauth2/authorize redirects with invalid_scope and POST issues no code. Tokens carry the scopes on the code, not a wider scope sent to the token endpoint."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts", "node:tests/modules/oauth_provider/services/scope.validator.service.test.ts"]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.client-auth"
  says = "The token endpoint answers 401 invalid_client for an unknown client and for a wrong or missing secret on a confidential client, and 400 unsupported_grant_type for a grant the app does not allow. Responses carry Cache-Control no-store."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/oauth_provider/integration_test_oauthProvider.py::TestOAuthToken::test_error_responses",
    "node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.rate-limit"
  says = "The token, revoke, introspect and register endpoints share a per-address per-minute limit; over it answers 429."
  priority = "P1"
  tests = ["it:response-validation/oauth_provider/integration_test_oauthProvider.py::TestOAuthProviderRateLimiting::test_token_rate_limit"]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.client-credentials"
  says = "A client_credentials token has no refresh token and acts as the service account bound to the app (or, for an older app with none, its creator); it is refused when that identity is disabled, deleted or being restored. Scopes that only mean something for a person (openid, profile, email, offline_access) are dropped."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts",
    "it:response-validation/oauth_provider/integration_test_oauthProvider.py::TestOAuthToken::test_response_schema",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.knowledge-limit"
  says = "An app with a knowledge limit puts it on the code and on every token; the token endpoint refuses a code issued under a limit the app has since narrowed, and a refresh keeps the limit the user agreed to."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts",
    "it:security/test_connection_limits.py::TestOAuthApps::test_the_limit_picked_on_the_app_holds_for_every_token_and_after_a_refresh",
  ]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.app-organization"
  says = "An app that belongs to another organization than the signed-in user's is refused with 403 access_denied on both the consent page lookup and the consent step, and no code is issued."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/oauth_provider/controller/oauth.provider.controller.test.ts", "fe:app/(public)/oauth/authorize/__tests__/oauth-authorize-view.workspace.test.tsx"]

  [[feature.behavior]]
  id = "api-access.oauth-authorize.refresh-rotation"
  says = "A refresh token works once and is replaced. Presenting a used refresh token again revokes the grant."
  priority = "P0"
