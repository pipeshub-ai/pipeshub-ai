    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_unarchive_conversation_not_archived_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_archive_conversation_nonexistent_returns_404",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_archive_conversation_invalid_conversation_id_returns_400",
