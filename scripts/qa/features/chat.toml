  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_search_finds_after_create_and_archive",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_search_active_not_in_results",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_search_with_limit_caps_rows",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_search_empty_search_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_search_missing_search_returns_400",
  ]

  [[feature.behavior]]
  id = "chat.archive.auth"
  says = "The archived list and archived search answer 401 or 403 without a token, and an invalid start date is 400."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_missing_auth_returns_401_or_403",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_search_missing_auth_returns_401_or_403",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_invalid_start_date_returns_400",
  ]

  [[feature.behavior]]
  id = "chat.archive.page"
  says = "The archived chats page lists archived conversations, works on a phone and on touch."
  priority = "P2"
  tests = [
    "fe:app/(main)/workspace/archived-chats/__tests__/archived-chat-view.test.ts",
    "fe:app/(main)/workspace/archived-chats/__tests__/archived-chats-mobile.test.tsx",
  ]

[[feature]]
id = "chat.fork"
title = "Fork a conversation"
flow = "chat-citations"
what = "A user copies a conversation up to a chosen message into a new conversation they own, including its artifacts, and continues from there."
routes = ["POST /api/v1/conversations/{conversationId}/message/{messageId}/fork"]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/utils/fork-conversation.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/fork-artifacts.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.fork.copy"
  says = "The owner gets their own copy and the original is untouched; the copy keeps the history up to the chosen message."
  priority = "P1"
  tests = ["node:tests/modules/enterprise_search/utils/fork-conversation.test.ts", "node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts"]

  [[feature.behavior]]
  id = "chat.fork.access"
  says = "A project member cannot fork a chat the owner made visible to the project, and another user gets 404."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts"]

  [[feature.behavior]]
  id = "chat.fork.artifacts"
  says = "Artifacts are copied under the new chat's id and the original keeps its own; when the fork fails, the copies already made are removed."
  priority = "P1"
  tests = ["node:tests/modules/enterprise_search/controller/fork-artifact-flow.test.ts", "node:tests/modules/enterprise_search/controller/fork-artifact-copier.test.ts", "node:tests/modules/enterprise_search/utils/fork-artifacts.test.ts"]

[[feature]]
id = "chat.compare"
title = "Compare models"
flow = "chat-citations"
what = "When an admin turns on Compare models in Labs, a user re-asks a saved question with a second model in a hidden branch, sees both answers, and keeps one."
routes = [
  "POST /api/v1/conversations/{conversationId}/compare/branch",
  "GET /api/v1/conversations/{conversationId}/compare",
  "POST /api/v1/conversations/{conversationId}/compare/choose",
]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/compare.controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/chat-compare-feature.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/compare-turn.ts",
  "frontend/app/(main)/chat/compare/**",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.compare.flag"
