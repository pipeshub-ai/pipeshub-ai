# Feature map: chat (flow `chat-citations`). Conversations, streaming answers, citations, archive, speech.

[[feature]]
id = "chat.conversations"
title = "Conversations"
flow = "chat-citations"
what = "A user starts a conversation, lists them, opens one, renames it, pins it and deletes it. Only the owner reads and changes a conversation, unless it was shared."
routes = [
  "GET /api/v1/conversations",
  "* /api/v1/conversations/{conversationId}",
  "PATCH /api/v1/conversations/{conversationId}/title",
  "PATCH /api/v1/conversations/{conversationId}/pin",
  "PATCH /api/v1/conversations/{conversationId}/unpin",
]
pages = ["frontend/app/(main)/chat/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/routes/es.routes.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/schema/conversation.schema.ts",
  "frontend/app/(main)/chat/**",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.conversations.ownership"
  says = "Another user in the same org gets 404 on every conversation route (read, add message, rename, archive, pin, share, delete, fork, cancel, regenerate), a read-only recipient gets 404 on every route that changes or extends it, and a user from another org gets 404 on read; nothing is written or sent to the AI service."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts"]

  [[feature.behavior]]
  id = "chat.conversations.auth"
  says = "Conversation routes answer 401 or 403 without a valid token; an OAuth token needs conversation:read to read, conversation:write to change and conversation:chat to ask."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_archived_conversations_missing_auth_returns_401_or_403",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_conversation_missing_auth_returns_401_or_403",
  ]

  [[feature.behavior]]
  id = "chat.conversations.read"
  says = "GET /api/v1/conversations lists the caller's conversations and rejects an invalid source with 400; GET by id matches the spec, honors limit and sort order, and answers 400 for a malformed id and 404 for an unknown one."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversations_includes_two_stream_created",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversations_invalid_source_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversation_by_id_response_matches_spec",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversation_by_id_with_limit_caps_messages",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversation_by_id_with_sort_order_variants",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversation_by_id_invalid_conversation_id_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_get_conversation_by_id_nonexistent_returns_404",
  ]

  [[feature.behavior]]
  id = "chat.conversations.title"
  says = "PATCH title renames the conversation, and rejects an invalid payload with 400, a malformed id with 400 and an unknown conversation with 404."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_conversation_title_response_matches_spec",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_conversation_title_invalid_payload_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_conversation_title_invalid_conversation_id_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_patch_conversation_title_nonexistent_returns_404",
  ]

  [[feature.behavior]]
  id = "chat.conversations.delete"
  says = "DELETE removes the conversation so it can no longer be read, answers 404 for an unknown id and 400 for a malformed one."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_delete_conversation_lifecycle",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_delete_conversation_nonexistent_returns_404",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_delete_conversation_invalid_conversation_id_returns_400",
    "node:tests/modules/enterprise_search/controller/es_controller.delete-conversation.test.ts",
  ]

  [[feature.behavior]]
  id = "chat.conversations.pin"
  says = "The owner pins a conversation and it is listed first; pinning twice is safe, an archived chat cannot be pinned, and pinning does not change the chat's activity time."
  priority = "P1"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.pin.test.ts"]

  [[feature.behavior]]
  id = "chat.conversations.page"
  says = "The chat page loads, shows the input and the sidebar list, and keeps pinned and unread conversations in order."
  priority = "P1"
  tests = ["e2e:tests/e2e/chat/chat-basic.spec.ts", "fe:app/(main)/chat/__tests__/chat-page.test.tsx"]

[[feature]]
id = "chat.answers"
title = "Streaming and non-streaming answers"
flow = "chat-citations"
what = "A user asks a question and gets an answer grounded in their knowledge, streamed as events or returned in one reply. They can add follow-ups, edit the last question, regenerate the answer, stop a running answer and rate it."
routes = [
  "POST /api/v1/conversations/create",
  "POST /api/v1/conversations/stream",
  "POST /api/v1/conversations/{conversationId}/messages",
  "POST /api/v1/conversations/{conversationId}/messages/stream",
  "POST /api/v1/conversations/{conversationId}/message/{messageId}/regenerate",
  "POST /api/v1/conversations/{conversationId}/cancel",
  "POST /api/v1/conversations/{conversationId}/message/{messageId}/feedback",
]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/controller/non-streaming-chat.controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/stream-lifecycle.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/agui.ts",
  "backend/python/app/api/routes/chatbot.py",
  "backend/python/app/agents/agent_loop/**",
  "frontend/app/(main)/chat/streaming.ts",
  "frontend/app/(main)/chat/agui-event-handler.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.answers.stream"
  says = "POST /api/v1/conversations/stream answers with events that end in a complete answer and a saved conversation, and the response matches the spec."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_conversation_chat_mode_returns_answer",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_conversation_response_matches_spec",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_add_message_updates_conversation",
  ]

  [[feature.behavior]]
  id = "chat.answers.validation"
  says = "A stream request with an invalid payload or an unsupported chat mode gets 400, and a follow-up on a malformed id gets 400; a follow-up on an unknown conversation emits an error event."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_conversation_invalid_payload_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_add_message_invalid_payload_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_add_message_invalid_conversation_id_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_stream_add_message_nonexistent_conversation_emits_error_event",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversationStreamOpenApiRequestContract::test_rejects_missing_or_unsupported_chat_mode",
  ]

  [[feature.behavior]]
  id = "chat.answers.non-streaming"
  says = "POST create and POST messages return the persisted conversation with a grounded answer in one reply, a follow-up appends one turn and reports the records used, and an unknown conversation is 404."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation_non_streaming.py::TestConversationNonStreaming::test_create_returns_the_persisted_conversation_and_a_grounded_answer",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation_non_streaming.py::TestConversationNonStreaming::test_follow_up_appends_one_turn_and_reports_records_used",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation_non_streaming.py::TestConversationNonStreaming::test_follow_up_on_unknown_conversation_returns_404",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation_non_streaming.py::TestConversationNonStreaming::test_invalid_payload_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation_non_streaming.py::TestConversationNonStreaming::test_missing_auth_returns_401_or_403",
  ]

  [[feature.behavior]]
  id = "chat.answers.regenerate"
  says = "Regenerate streams a new answer for the last bot message to completion; a message that is not the last one emits an error event, and a missing token gets 401 or 403."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_regenerate_last_bot_message_streams_to_complete",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_regenerate_non_last_message_id_emits_sse_error",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_regenerate_missing_auth_returns_401_or_403",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_regenerate_invalid_body_returns_400",
  ]

  [[feature.behavior]]
  id = "chat.answers.cancel"
  says = "Cancel stops an in-flight answer for its owner, answers cancelled false for a run that is gone, and refuses another user's run with 403."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_chatbot_cancel.py", "node:tests/modules/enterprise_search/utils/stream-lifecycle.test.ts"]

  [[feature.behavior]]
  id = "chat.answers.edit-question"
  says = "Editing the last question replaces that turn and asks again; the old answer does not remain."
  priority = "P1"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.edit-question.test.ts", "e2e:tests/e2e/chat/chat-edit-question.spec.ts"]

  [[feature.behavior]]
  id = "chat.answers.feedback"
  says = "The owner and a recipient of a shared chat rate a bot answer; rating a user question is 400, and sharing with one person does not let the rest of the org rate it."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_message_feedback_on_bot_response_matches_spec",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_message_feedback_on_user_query_returns_400",
    "node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts",
  ]

  [[feature.behavior]]
  id = "chat.answers.browser-stream"
  says = "In the browser the answer streams in, can be stopped, and a stream error shows a readable message."
  priority = "P1"
  tests = ["e2e:tests/e2e/chat/chat-streaming.spec.ts", "fe:app/(main)/chat/__tests__/streaming-stop.test.ts", "fe:app/(main)/chat/__tests__/stream-error.test.ts"]

  [[feature.behavior]]
  id = "chat.answers.error-text"
  says = "A failed chat turn shows plain advice: server stack traces saved with a failed answer never reach the browser, and raw text of a 5xx error is replaced."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.error-stacks.test.ts", "node:tests/modules/enterprise_search/utils/chat-error-messages.test.ts"]

[[feature]]
id = "chat.attachments"
title = "Chat attachments"
flow = "chat-citations"
what = "A user attaches files to a question and removes them. Image bytes are checked, so a file labelled as PNG that is not a PNG is refused."
routes = ["POST /api/v1/conversations/attachments/upload", "DELETE /api/v1/conversations/attachments/{recordId}"]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/python/app/agents/chat_modes/attachments.py",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.attachments.image-check"
  says = "SVG bytes labelled as PNG, a PNG whose pixels do not decode, and an image over 50 megapixels are rejected; a real image is stored as the type its bytes are."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.attachment-validation.test.ts"]

  [[feature.behavior]]
  id = "chat.attachments.upload-ask"
  says = "A user uploads a document and the answer to a question about it cites it; DOCX, XLSX and CSV attachments are read."
  priority = "P1"
  tests = ["e2e:tests/e2e/chat/chat-cited-answer.spec.ts", "e2e:tests/e2e/chat/chat-document-attachment.spec.ts"]

  [[feature.behavior]]
  id = "chat.attachments.permissions"
  says = "Sharing a conversation grants read on its attachments to the recipients and unsharing revokes it; a user who was not given access cannot read the attachment."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.agent-share.test.ts"]

  [[feature.behavior]]
  id = "chat.attachments.delete"
  says = "DELETE /api/v1/conversations/attachments/{recordId} relays to the AI service with the caller's token and answers 204 when the attachment is removed."
  priority = "P1"
  tests = []

  [[feature.behavior]]
  id = "chat.attachments.limits"
  says = "An upload takes at most 10 files of 5 MB each in PDF, JPEG, PNG, TXT, MD, MDX, DOCX, XLSX, CSV or TSV; a generic content type falls back to the file extension and an upload with no file gets 400."
  priority = "P1"
  tests = []

[[feature]]
id = "chat.sharing"
title = "Sharing a conversation"
flow = "chat-citations"
what = "The owner shares a conversation with users and revokes access. A recipient reads it but sees a placeholder for every citation, excerpt or attachment they cannot read themselves."
routes = ["POST /api/v1/conversations/{conversationId}/share", "POST /api/v1/conversations/{conversationId}/unshare"]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/viewer-redaction.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/share-notification.ts",
  "frontend/app/(main)/chat/share-adapter.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.sharing.share"
  says = "The owner shares with users and unshares; an invalid payload gets 400, an unknown conversation 404 and a missing token 401 or 403."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_share_conversation_response_matches_spec",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_unshare_conversation_response_matches_spec",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_share_conversation_invalid_payload_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_unshare_conversation_invalid_payload_returns_400",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_share_conversation_nonexistent_returns_404",
    "it:response-validation/enterprise-search/conversations/integration_test_conversation.py::TestConversations::test_post_share_conversation_missing_auth_returns_401_or_403",
  ]

  [[feature.behavior]]
  id = "chat.sharing.viewer-redaction"
  says = "A viewer gets a placeholder for each citation, excerpt and attachment they cannot read; if the access check fails, answers non-200 or is malformed, every record reference is hidden."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.viewer-redaction.test.ts"]

  [[feature.behavior]]
  id = "chat.sharing.read-only"
  says = "A read-only recipient cannot add messages to, rename or delete the shared conversation."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts"]

  [[feature.behavior]]
  id = "chat.sharing.notify"
  says = "Each newly added recipient gets one unread notification that a chat was shared with them that opens the chat; sharing again with someone who already has access does not notify them again, and a failed notification does not fail the share."
  priority = "P1"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.share-notify-archive.test.ts"]

  [[feature.behavior]]
  id = "chat.sharing.archived-hidden"
  says = "When the owner archives a shared chat, recipients get 404 and it leaves their shared list; unarchiving gives it back."
  priority = "P1"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.share-notify-archive.test.ts"]

[[feature]]
id = "chat.archive"
title = "Archived chats"
flow = "chat-citations"
what = "A user archives a conversation to hide it from the list, finds it again in the archived chats page by search or date range, and unarchives it."
routes = [
  "PATCH /api/v1/conversations/{conversationId}/archive",
  "PATCH /api/v1/conversations/{conversationId}/unarchive",
  "GET /api/v1/conversations/show/archives",
  "GET /api/v1/conversations/show/archives/search",
]
pages = ["frontend/app/(main)/workspace/archived-chats/page.tsx", "frontend/app/(main)/@sidebar/workspace/archived-chats/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "frontend/app/(main)/workspace/archived-chats/**",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.archive.lifecycle"
  says = "An archived conversation appears in the archived list and leaves the normal one; unarchiving a conversation that is not archived is 400, and an unknown id is 404."
