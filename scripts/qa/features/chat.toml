  "frontend/app/(main)/chat/components/message-area/response-tabs/citations/**",
]
status = "draft"

  [[feature.behavior]]
  id = "chat.citations.grounded"
  says = "A grounded answer cites its sources, and every cited record can be retrieved again."
  priority = "P0"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_retrieval_integrity.py::TestRetrievalIntegrity::test_grounded_turn_cites_its_sources",
