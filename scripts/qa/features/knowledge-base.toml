[[feature]]
id = "knowledge-base.trash"
title = "Recently deleted and restore"
flow = "knowledge-base"
what = "A writer sees a collection's recently deleted items and restores one or many of them; items past the retention period (14 days by default) are purged by a background job."
routes = [
  "GET /api/v1/knowledgeBase/{kbId}/trash",
  "POST /api/v1/knowledgeBase/record/{recordId}/restore",
  "POST /api/v1/knowledgeBase/records/restore",
]
pages = [
  "frontend/app/(main)/knowledge-base/recently-deleted/page.tsx",
  "frontend/app/(main)/@sidebar/knowledge-base/recently-deleted/page.tsx",
]
code = [
  "backend/python/app/connectors/sources/localKB/handlers/kb_service.py",
  "backend/python/app/connectors/services/trash_purge.py",
  "backend/nodejs/apps/src/modules/knowledge_base/validators/validators.ts",
  "frontend/app/(main)/knowledge-base/recently-deleted/**",
]
status = "draft"

  [[feature.behavior]]
  id = "knowledge-base.trash.list"
  says = "GET .../{kbId}/trash lists the deleted items with where each was, who deleted it and when it will go; a bad page or a limit over 100 gets 400."
  priority = "P1"
  tests = [
    "py:tests/unit/connectors/sources/localKB/test_kb_trash_list.py",
    "node:tests/modules/knowledge_base/routes/kb.routes.records.http.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.trash.list-roles"
  says = "A reader gets 403 and a user with no role gets 404 from the trash listing, and the listing needs kb:delete."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/connectors/sources/localKB/test_kb_trash_list.py",
    "node:tests/modules/knowledge_base/routes/kb.routes.scoping.http.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.trash.restore"
  says = "Restoring an item brings back everything deleted with it under its own id, searchable again; a name now taken beside it comes back as 'name (restored)'."
  priority = "P0"
  tests = [
    "py:tests/unit/connectors/sources/localKB/test_kb_restore.py",
    "it:resilience/test_soft_delete_trash.py::test_a_restored_record_comes_back_under_its_id_and_is_searchable_again",
  ]

  [[feature.behavior]]
  id = "knowledge-base.trash.restore-rules"
  says = "Restore is refused with 403 when the trash is turned off or the caller lacks the delete role, 404 for a record in another org, and 409 while the folder it was in is still in the trash."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/connectors/sources/localKB/test_kb_restore.py"]

  [[feature.behavior]]
  id = "knowledge-base.trash.bulk-limit"
  says = "POST /api/v1/knowledgeBase/records/restore needs 1 to 100 ids and refuses other bodies before any work is done."
  priority = "P2"
  tests = [
    "py:tests/unit/connectors/sources/localKB/test_kb_restore_router.py",
    "node:tests/modules/knowledge_base/routes/kb.routes.records.http.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.trash.purge"
  says = "The purge job removes an item from every store only after the retention period, runs on one replica at a time, and stops when its kill switch is off."
  priority = "P1"
  tests = [
    "py:tests/unit/connectors/services/test_trash_purge.py",
    "it:resilience/test_soft_delete_trash.py::test_the_purge_removes_the_record_from_every_store",
  ]

