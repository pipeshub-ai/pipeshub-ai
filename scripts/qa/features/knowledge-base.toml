[[feature]]
id = "knowledge-base.storage-config"
title = "Storage configuration"
flow = "knowledge-base"
what = "An admin chooses where uploaded files are kept: local disk, Amazon S3 or Azure Blob. Credentials are stored encrypted and are never handed to a browser session."
routes = [
  "GET /api/v1/configurationManager/storageConfig",
  "POST /api/v1/configurationManager/storageConfig",
]
pages = []
code = [
  "backend/nodejs/apps/src/modules/configuration_manager/routes/cm_routes.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/controller/cm_controller.ts",
  "backend/nodejs/apps/src/modules/storage/config/storage.config.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "knowledge-base.storage-config.admin-only"
  says = "GET and POST storageConfig need an admin and the config scope; a member gets 403."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/routes/cm_routes.guards.test.ts"]

  [[feature.behavior]]
  id = "knowledge-base.storage-config.no-secrets-to-browser"
  says = "GET storageConfig from a user session returns an empty object for S3, Azure and local storage; only the service token gets the decrypted values."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/storage/controllers/storage.controller.storage-config.test.ts"]

  [[feature.behavior]]
  id = "knowledge-base.storage-config.validation"
  says = "POST storageConfig checks the body by storage type; S3 with only one of the access key and secret gets 400, and with neither it uses the machine's IAM role."
  priority = "P1"
  tests = [
    "node:tests/modules/configuration_manager/validators/validators.test.ts",
    "node:tests/modules/configuration_manager/controller/cm_controller.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.storage-config.switch"
  says = "After the storage type is changed, new uploads go to the new store without a restart."
  priority = "P1"
  tests = []
  manual = "Needs a real S3 or Azure account; the repo has no simulator for them."

