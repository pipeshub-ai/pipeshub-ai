# Knowledge bases ("collections"), folders, files, trash, storage and public URLs.

[[feature]]
id = "knowledge-base.collections"
title = "Collections (knowledge bases)"
flow = "knowledge-base"
what = "A user creates, lists, opens, renames and deletes collections. What a user can do depends on their role on the collection (owner, writer, reader)."
routes = [
  "POST /api/v1/knowledgeBase",
  "GET /api/v1/knowledgeBase",
  "GET /api/v1/knowledgeBase/{kbId}",
  "PUT /api/v1/knowledgeBase/{kbId}",
  "DELETE /api/v1/knowledgeBase/{kbId}",
]
pages = [
  "frontend/app/(main)/knowledge-base/page.tsx",
  "frontend/app/(main)/@sidebar/knowledge-base/page.tsx",
]
code = [
  "backend/nodejs/apps/src/modules/knowledge_base/routes/kb.routes.ts",
  "backend/nodejs/apps/src/modules/knowledge_base/controllers/kb_controllers.ts",
  "backend/python/app/connectors/sources/localKB/api/kb_router.py",
  "backend/python/app/connectors/sources/localKB/handlers/kb_service.py",
  "frontend/app/(main)/knowledge-base/**",
]
status = "draft"

  [[feature.behavior]]
  id = "knowledge-base.collections.create"
  says = "POST /api/v1/knowledgeBase with a name creates a collection and makes the caller its owner; an empty or blank name gets 400."
  priority = "P0"
  tests = [
    "it:response-validation/knowledgebase/integration_test_knowledgebase_crud.py::TestKnowledgeBaseCrud::test_create_knowledge_base_success",
    "it:response-validation/knowledgebase/integration_test_knowledgebase_crud.py::TestKnowledgeBaseCrud::test_create_knowledge_base_negative",
  ]

  [[feature.behavior]]
  id = "knowledge-base.collections.list-get"
  says = "GET /api/v1/knowledgeBase lists only the collections the caller has a role on, and GET /api/v1/knowledgeBase/{kbId} returns one with the caller's role."
  priority = "P0"
  tests = [
    "it:response-validation/knowledgebase/integration_test_knowledgebase_crud.py::TestKnowledgeBaseCrud::test_list_knowledge_bases_success",
    "it:response-validation/knowledgebase/integration_test_knowledgebase_crud.py::TestKnowledgeBaseCrud::test_get_knowledge_base_success",
  ]

  [[feature.behavior]]
  id = "knowledge-base.collections.no-role-404"
  says = "A user with no role on a collection gets 404, not 403, from every collection route, so ids cannot be probed; a user with a role that is too low gets 403."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/connectors/sources/test_kb_service_access_control.py",
    "node:tests/modules/knowledge_base/routes/kb.routes.scoping.http.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.collections.scopes"
  says = "A token without kb:read gets 403 from the GET routes, without kb:write from create and update, and without kb:delete from DELETE /api/v1/knowledgeBase/{kbId}; a call with no sign-in gets 401."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/knowledge_base/routes/kb.routes.scoping.http.test.ts"]

  [[feature.behavior]]
  id = "knowledge-base.collections.update"
  says = "PUT /api/v1/knowledgeBase/{kbId} renames a collection for a writer or owner; an empty body gets 400 and an empty name gets 400."
  priority = "P1"
  tests = ["it:response-validation/knowledgebase/integration_test_knowledgebase_crud.py::TestKnowledgeBaseCrud::test_update_knowledge_base_success"]

  [[feature.behavior]]
  id = "knowledge-base.collections.delete-owner-only"
  says = "Only the owner can delete a collection (a writer gets 403, except for a hidden collection with no owner left); the delete removes its records, stored files and vectors."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/knowledgebase/integration_test_knowledgebase_crud.py::TestKnowledgeBaseCrud::test_delete_knowledge_base_success",
    "py:tests/unit/connectors/sources/localKB/test_kb_delete_stored_files.py",
    "e2e:tests/e2e/knowledge-base/kb-delete-collection.spec.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.collections.deleting-state"
  says = "While a collection is being deleted, every change to it (upload, folder, rename) gets 409 with the code KB_BEING_DELETED, and a caller with no role is not told that."
  priority = "P1"
  tests = [
    "py:tests/unit/connectors/sources/localKB/test_kb_deleting.py",
    "node:tests/modules/knowledge_base/routes/kb.routes.http.deleting.test.ts",
  ]

[[feature]]
id = "knowledge-base.folders"
title = "Folders and moving items"
flow = "knowledge-base"
what = "A writer creates, renames and deletes folders (nested up to 20 levels) and moves files and folders inside a collection."
routes = [
  "POST /api/v1/knowledgeBase/{kbId}/folder",
  "POST /api/v1/knowledgeBase/{kbId}/folder/{folderId}/subfolder",
  "PUT /api/v1/knowledgeBase/{kbId}/folder/{folderId}",
  "DELETE /api/v1/knowledgeBase/{kbId}/folder/{folderId}",
  "PUT /api/v1/knowledgeBase/{kbId}/record/{recordId}/move",
]
code = [
  "backend/nodejs/apps/src/modules/knowledge_base/routes/kb.routes.ts",
  "backend/python/app/connectors/sources/localKB/api/kb_router.py",
  "backend/python/app/connectors/sources/localKB/handlers/kb_service.py",
  "frontend/app/(main)/knowledge-base/utils/**",
]
status = "draft"

  [[feature.behavior]]
  id = "knowledge-base.folders.create"
  says = "POST .../folder creates a folder at the root of the collection and POST .../folder/{folderId}/subfolder creates one inside a folder; a root create never lands in a subfolder because of a stray parent id in the query or body."
  priority = "P0"
  tests = [
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_create_root_folder_success",
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_create_subfolder_success",
    "node:tests/modules/knowledge_base/routes/kb.routes.folder.http.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.folders.name-rules"
  says = "A folder name that is empty, contains markup, or is already used by a sibling folder is refused (400 or 409); a folder nested deeper than 20 levels gets 400."
  priority = "P1"
  tests = [
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_create_root_folder_negative",
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_update_folder_negative",
  ]

  [[feature.behavior]]
  id = "knowledge-base.folders.rename-delete"
  says = "PUT .../folder/{folderId} renames a folder and DELETE removes it with everything inside; delete needs kb:delete and the delete role."
  priority = "P1"
  tests = [
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_update_folder_success",
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_delete_folder_success",
  ]

  [[feature.behavior]]
  id = "knowledge-base.folders.move"
  says = "PUT .../record/{recordId}/move moves a file or folder into another folder or to the root of the same collection; a move into a trashed folder or a name already used there is refused."
  priority = "P1"
  tests = [
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_move_record_to_folder_success",
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_move_record_to_root_success",
    "it:response-validation/knowledgebase/integration_test_folder_crud.py::TestFolderCrud::test_move_record_negative",
  ]

  [[feature.behavior]]
  id = "knowledge-base.folders.reader-refused"
  says = "A reader of a collection gets 403 from folder create, rename, delete and move."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/knowledge_base/routes/kb.routes.scoping.http.test.ts"]

[[feature]]
id = "knowledge-base.upload"
title = "Upload files to a collection"
flow = "knowledge-base"
what = "A writer uploads files, or a whole folder tree, to a collection root or a folder; files are checked one by one and each reports its own result."
routes = [
  "POST /api/v1/knowledgeBase/{kbId}/upload",
  "GET /api/v1/knowledgeBase/limits",
]
code = [
  "backend/nodejs/apps/src/modules/knowledge_base/controllers/kb_controllers.ts",
  "backend/nodejs/apps/src/modules/knowledge_base/constants/kb.constants.ts",
  "backend/nodejs/apps/src/modules/knowledge_base/validators/validators.ts",
  "backend/nodejs/apps/src/modules/storage/mimetypes/mimetypes.ts",
  "frontend/app/(main)/knowledge-base/api.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "knowledge-base.upload.success"
  says = "Uploading a supported file stores it in the collection's storage area, creates a record in the collection and queues it for indexing."
  priority = "P0"
  tests = [
    "node:tests/modules/knowledge_base/routes/kb.routes.upload.http.test.ts",
    "e2e:tests/e2e/knowledge-base/kb-upload.spec.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.upload.partial"
  says = "In a batch, an oversize or unsupported file fails alone with its own message and the others are saved; when every file fails nothing is stored."
  priority = "P0"
  tests = [
    "node:tests/modules/knowledge_base/routes/kb.routes.upload.http.test.ts",
    "e2e:tests/e2e/knowledge-base/kb-upload.spec.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.upload.limits"
  says = "GET /api/v1/knowledgeBase/limits returns maxFilesPerRequest (1000) and maxFileSizeBytes (the platform setting, 30 MB by default); more files than the limit in one request is refused."
  priority = "P1"
  tests = [
    "it:response-validation/knowledgebase/integration_test_upload_limits.py::TestUploadLimits::test_get_upload_limits_success",
    "node:tests/modules/knowledge_base/constants/upload.constants.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.upload.role"
  says = "A reader, a user with no role, or a user for a missing collection or folder gets 403 or 404 and nothing is stored; a collection that is being deleted gets 409."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/knowledge_base/controllers/kb_upload_precheck.test.ts",
    "node:tests/modules/knowledge_base/routes/kb.routes.scoping.http.test.ts",
    "node:tests/modules/knowledge_base/routes/kb.routes.http.deleting.test.ts",
  ]

  [[feature.behavior]]
  id = "knowledge-base.upload.path-tricks"
  says = "A file name with path separators or traversal never stores the file outside the uploader's own storage area, and a file is judged by its extension, not the type the client claims."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/knowledge_base/routes/kb.routes.upload.http.test.ts"]

  [[feature.behavior]]
  id = "knowledge-base.upload.duplicate-name"
  says = "A file whose name is already used in the same folder, or twice in one batch, fails and the first copy is kept."
  priority = "P1"
  tests = [
    "e2e:tests/e2e/knowledge-base/kb-upload.spec.ts",
    "py:tests/integration/graph_db/test_kb_duplicate_name_checks.py",
  ]

