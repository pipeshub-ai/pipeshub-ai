  "GET /api/v1/toolsets/agents/{agentKey}",
  "POST /api/v1/toolsets/agents/{agentKey}/instances/{instanceId}/authenticate",
  "PUT /api/v1/toolsets/agents/{agentKey}/instances/{instanceId}/credentials",
  "DELETE /api/v1/toolsets/agents/{agentKey}/instances/{instanceId}/credentials",
  "POST /api/v1/toolsets/agents/{agentKey}/instances/{instanceId}/reauthenticate",
  "GET /api/v1/toolsets/agents/{agentKey}/instances/{instanceId}/oauth/authorize",
]
code = [
  "backend/nodejs/apps/src/modules/toolsets/controller/toolsets_controller.ts",
  "backend/python/app/api/routes/toolsets.py",
]
status = "draft"

  [[feature.behavior]]
  id = "toolsets.agent-credentials.edit-access"
  says = "Writing an agent's credentials or starting its sign-in needs edit access to the agent (403 otherwise) and the agent must be a service account (400 otherwise)."
  priority = "P0"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "toolsets.agent-credentials.declared-fields"
