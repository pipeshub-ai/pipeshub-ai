# Agent-scoped credentials

[[feature]]
id = "toolsets.agent-credentials"
title = "Agent toolset credentials"
flow = "agents-toolsets-mcp"
what = "A user with edit access to a service account agent gives that agent its own credentials or sign-in for an org toolset instance, so it does not use anyone's personal ones."
