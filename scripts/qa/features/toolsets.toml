  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_toolset_credential_fields.py"]

  [[feature.behavior]]
  id = "toolsets.agent-credentials.write-failure"
  says = "A failed store write on authenticate or credentials update is a 500, not a success."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_toolset_store_write_failure.py"]

  [[feature.behavior]]
  id = "toolsets.agent-credentials.oauth-flow"
  says = "An agent's OAuth callback stores tokens under the agent, and a callback by a user without edit access to the agent (403 or 404 from the check) is answered success false with agent_permission_denied."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_toolsets_full_coverage.py"]

  [[feature.behavior]]
  id = "toolsets.agent-credentials.scopes"
  says = "The agent routes need the agent:read and agent:write scopes on a token; a chat-only token cannot write agent toolset credentials."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/toolsets/routes/toolsets_routes.scopes.test.ts"]

