routes = []


[[feature]]
id = "agents.templates"
title = "Agent templates"
flow = "agents-toolsets-mcp"
what = "A user saves an agent setup (name, description, system prompt, tools, models, memory, tags) as a template, lists the templates they can open, opens, edits, copies and deletes one. The Python service serves these at POST /api/v1/agent/template/create, GET /api/v1/agent/template/list, GET, PUT and DELETE /api/v1/agent/template/{templateId} and POST /api/v1/agent/template/{templateId}/clone, none of which is in the OpenAPI spec; the Node API does not proxy them, and the web app does not call them. Reads need the agent:read scope and writes agent:write."
code = ["backend/python/app/api/routes/agent.py"]
status = "draft"

  [[feature.behavior]]
  id = "agents.templates.create"
  says = "Creating a template needs a name, a description and a system prompt (400 names the missing field); the creator and organisation come from the caller, never from the body, and the creator gets the OWNER permission edge."
  priority = "P0"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.templates.access"
  says = "Only users with a permission edge to a template, or a team they belong to, can open or list it; anyone else gets 404 and an empty list. Only the owner can update or delete it, and a delete only marks it deleted."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_agent_route_access.py",
    "py:tests/integration/graph_db/postgres/test_kb_listings.py",
  ]

  [[feature.behavior]]
  id = "agents.templates.clone"
  says = "Copying a template you can open makes a new template you own; a template you cannot open cannot be copied (404). If the copy's owner edge cannot be written, no copy is left behind."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.templates.outage"
  says = "When the graph cannot be read, listing, opening or deleting a template answers in plain words and leaks no internal detail."
  priority = "P2"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]
