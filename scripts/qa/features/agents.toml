# Feature map: agents (flow `agents-toolsets-mcp`). Agents and their chats, the agent runtime, skills, and the prompts page.

[[feature]]
id = "agents.crud"
title = "Agents: create, list, read, update, delete"
flow = "agents-toolsets-mcp"
what = "A user creates an agent with a name, models, instructions and attachments, lists the agents they can reach, reads one, edits it and deletes it. Every route needs the agent:read or agent:write scope."
routes = [
  "GET /api/v1/agents",
  "POST /api/v1/agents/create",
  "GET /api/v1/agents/{agentKey}",
  "PUT /api/v1/agents/{agentKey}",
  "DELETE /api/v1/agents/{agentKey}",
]
code = [
  "backend/python/app/api/routes/agent.py",
  "backend/nodejs/apps/src/modules/enterprise_search/routes/es.routes.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/validators/es_validators.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.crud.create-read"
  says = "POST /api/v1/agents/create with a name returns the new agent; GET /api/v1/agents/{agentKey} returns it with the caller's edit rights and its models enriched from the model catalogue. The creator and organisation come from the caller, never from the body."
  priority = "P0"
  tests = [
    "e2e:tests/e2e/agents/agent-create-chat.spec.ts",
    "py:tests/unit/api/routes/test_agent_route_access.py",
    "it:response-validation/enterprise-search/agents/integration_test_agents.py",
  ]

  [[feature.behavior]]
  id = "agents.crud.auth"
  says = "Create, list, read, update and delete without credentials are refused, and an OAuth token without agent:read (reads) or agent:write (writes) gets 403."
  priority = "P0"
  kind = "security"
  tests = [
    "it:response-validation/enterprise-search/agents/integration_test_agents.py::TestDeleteAgent::test_delete_agent_requires_auth",
    "it:response-validation/enterprise-search/agents/integration_test_agents.py::TestListAgents::test_list_agents_requires_auth",
    "it:response-validation/enterprise-search/agents/integration_test_agents.py::TestGetAgent::test_get_agent_requires_auth",
    "it:response-validation/enterprise-search/agents/integration_test_agents.py::TestUpdateAgent::test_update_agent_requires_auth",
  ]

  [[feature.behavior]]
  id = "agents.crud.validation"
  says = "Create refuses a body without a name, a model list with no reasoning model, a model object without a model key and unknown top-level fields. An update with an empty body, a malformed body or a name over the limit is refused, and an empty models list reverts to the organisation default model."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/agents/integration_test_agents.py",
    "py:tests/unit/api/routes/test_agent_route_access.py",
  ]

  [[feature.behavior]]
  id = "agents.crud.delete"
  says = "Only the owner deletes an agent; the delete is a soft delete, an agent outside the caller's reach reads as 404, and a failed delete is rolled back."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_agent_route_access.py",
    "it:response-validation/enterprise-search/agents/integration_test_agents.py::TestDeleteAgent::test_delete_agent_lifecycle",
  ]

  [[feature.behavior]]
  id = "agents.crud.list"
  says = "GET /api/v1/agents returns a paginated envelope, supports search, page, limit and sort order, ignores owner ids sent in the query and uses the caller's identity, and hides deleted agents unless asked."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/agents/integration_test_agents.py",
    "py:tests/unit/api/routes/test_agent_route_access.py",
  ]

  [[feature.behavior]]
  id = "agents.crud.outage"
  says = "A graph database outage while reading or updating an agent is reported as a server error in plain words, never as 404."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

[[feature]]
id = "agents.access"
title = "Agent permissions and organisation sharing"
flow = "agents-toolsets-mcp"
what = "An agent is private to its owner until the owner or an organizer shares it with the organisation. Owners and writers edit, only the owner deletes, and a colleague with read access can chat but not change it."
code = [
  "backend/python/app/api/routes/agent.py",
  "backend/python/app/services/graph_db/arango/arango_http_provider.py",
  "backend/python/app/services/graph_db/neo4j/neo4j_provider.py",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.access.private-by-default"
  says = "A new agent is not shared: no other user in the organisation can read, edit or chat with it, and it reads as 404 for them."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.access.org-share-read-only"
  says = "An agent shared with the organisation is read-only for a colleague (GET works, PUT and DELETE return 403) and invisible to a user from another organisation."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.access.share-right"
  says = "Only the owner or an organizer can turn organisation sharing on; a writer who tries gets 403, but a writer re-saving an agent whose sharing is unchanged is not refused."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.access.ownership-fields"
  says = "An update body cannot rewrite ownership fields, and sharing can only be with the caller's own organisation."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.access.personal-resources"
  says = "A personal toolset or personal MCP server cannot be attached to an agent shared with the organisation, and an agent that has one cannot be shared; a co-editor cannot share an agent that carries the owner's personal server."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_agent_personal_mcp_servers.py",
    "py:tests/unit/api/routes/test_agent_personal_toolsets.py",
    "py:tests/unit/api/routes/test_agent_route_access.py",
  ]

  [[feature.behavior]]
  id = "agents.access.chat-needs-permission"
  says = "Chatting with a named agent needs a permission edge to it (own or organisation); without one the chat route returns 404 and nothing is run."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_chat_route.py"]

[[feature]]
id = "agents.service-agents"
title = "Service agents"
flow = "agents-toolsets-mcp"
what = "An agent can be marked as a service agent: it is shared with the whole organisation, searches as a bound service account or as its creator, and runs with its own toolset credentials. The conversion cannot be undone."
code = [
  "backend/python/app/api/routes/agent.py",
  "backend/nodejs/apps/src/modules/oauth_provider/services/agent-registration.service.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.service-agents.always-shared"
  says = "Creating or converting an agent as a service agent forces organisation sharing, and a service agent cannot be unshared."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.service-agents.no-downgrade"
  says = "A service agent cannot be converted back to a regular agent; the update returns 400."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.service-agents.convert-admin-only"
  says = "Only the owner or an administrator can turn an agent into a service agent, and only an administrator can choose the service account it searches as. If the caller's role cannot be confirmed, nothing is saved and the answer is 503, not 403."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.service-agents.org-isolation"
  says = "A service agent of another organisation, or one whose creator is in another organisation, answers 404, the same as a missing agent. The internal service-account route answers 403 for a regular agent."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_agent_chat_route.py",
    "py:tests/unit/api/routes/test_agent_route_access.py",
  ]

  [[feature.behavior]]
  id = "agents.service-agents.identity"
  says = "A chat with a service agent retrieves as the bound account (or its creator), saves artifacts under the person chatting, and removes the agent's own MCP credentials when the agent is deleted."
  priority = "P1"
  tests = [
    "py:tests/unit/api/routes/test_agent_chat_route.py",
    "py:tests/unit/api/routes/test_agent_route_access.py",
  ]

[[feature]]
id = "agents.attachments"
title = "Agent knowledge, toolsets, MCP servers and skills"
flow = "agents-toolsets-mcp"
what = "When an agent is created or edited it can be given knowledge sources, toolset tools, MCP servers, API toolset tools, a web search provider and skills. Each attachment is validated against what the caller can see, and a failed save leaves the old attachments in place."
code = [
  "backend/python/app/api/routes/agent.py",
  "backend/python/app/agents/toolset_store.py",
  "backend/python/app/agents/registry/toolset_registry.py",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.attachments.visibility"
  says = "A toolset instance, MCP server or skill that does not exist, belongs to another organisation or to another user's personal list is refused with an error and nothing is written."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_agent_route_access.py",
  ]

  [[feature.behavior]]
  id = "agents.attachments.atomic"
  says = "A failure while creating an agent rolls back the whole create, and a failure while replacing toolsets, MCP servers or knowledge in an update keeps the previous set."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.attachments.knowledge-limit"
  says = "Saving an agent whose knowledge limit covers more records than the search cap (SEARCH_SELECTION_MAX_NODES) is refused with the number; a count that fails does not block the save. At chat time a caller's connection limit leaves out sources outside it, and a limit too large to check fails the turn with a clear message, unless internal search is off."
  priority = "P1"
  tests = [
    "py:tests/unit/api/routes/test_agent_knowledge_connection_limit.py",
    "py:tests/unit/api/routes/test_agent_knowledge_scope.py",
  ]

  [[feature.behavior]]
  id = "agents.attachments.tool-selection"
  says = "Only the tools picked for an agent are recorded and offered to the loop; an MCP server tool selection is kept per tool."
  priority = "P1"
  tests = [
    "py:tests/unit/api/routes/test_agent_mcp_tool_selection.py",
    "py:tests/unit/agents/adapter/test_tool_loader_tool_selection.py",
  ]

  [[feature.behavior]]
  id = "agents.attachments.skills-own-or-builtin"
  says = "Skills attach only if they are the caller's own or active built-in skills."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.attachments.knowledge-scope-chat"
  says = "At chat time the agent searches only its own knowledge: a knowledge base or connector of another organisation, or a hidden collection the caller cannot read, never reaches the loop."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_knowledge_scope.py"]

  [[feature.behavior]]
  id = "agents.attachments.live-tool-and-knowledge"
  says = "An agent built with a knowledge source and an MCP tool answers a knowledge question with citations without calling the tool, and calls the MCP tool for a tool question."
  priority = "P1"
  tests = ["it:ai_agents/integration_test_agent_tools_live.py"]

[[feature]]
id = "agents.usage-lookup"
title = "Model and web search usage by agents"
flow = "agents-toolsets-mcp"
what = "An admin screen asks which agents use an AI model or a web search provider before removing it. The answer is scoped to the caller's organisation."
routes = [
  "GET /api/v1/agents/web-search-usage/{provider}",
  "GET /api/v1/agents/model-usage/{model_key}",
]
code = ["backend/python/app/api/routes/agent.py"]
status = "draft"

  [[feature.behavior]]
  id = "agents.usage-lookup.org-scope"
  says = "model-usage and web-search-usage list only agents of the caller's organisation, a blank model key or an unsupported provider returns an empty list, and a database failure is a 500 so callers fail closed."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_agent_route_access.py"]

  [[feature.behavior]]
  id = "agents.usage-lookup.scope"
  says = "Both routes need the agent:read scope."
  priority = "P1"
  kind = "security"
  tests = []

[[feature]]
id = "agents.conversations"
title = "Agent conversations"
flow = "agents-toolsets-mcp"
what = "A user lists, opens, renames, archives, unarchives, deletes and links to a project the conversations they had with an agent, and rates an answer. Only the owner reads or changes a conversation, unless it was shared read-only."
routes = [
  "GET /api/v1/agents/{agentKey}/conversations",
  "POST /api/v1/agents/{agentKey}/conversations",
  "GET /api/v1/agents/{agentKey}/conversations/{conversationId}",
  "DELETE /api/v1/agents/{agentKey}/conversations/{conversationId}",
  "PATCH /api/v1/agents/{agentKey}/conversations/{conversationId}/title",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/archive",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/unarchive",
  "GET /api/v1/agents/conversations/show/archives",
  "GET /api/v1/agents/{agentKey}/conversations/show/archives",
  "PUT /api/v1/agents/{agentKey}/conversations/{conversationId}/project",
  "PATCH /api/v1/agents/{agentKey}/conversations/{conversationId}/project-visibility",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/message/{messageId}/feedback",
]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/routes/es.routes.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/schema/agent.conversation.schema.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/validators/es_validators.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.conversations.ownership"
  says = "A user who is not the owner, or a user of another organisation, gets 404 on an agent conversation and nothing is changed; the agent key in the URL must be the conversation's agent, otherwise the call is 404 or a no-op."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts",
    "it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_update_delete.py",
  ]

  [[feature.behavior]]
  id = "agents.conversations.scopes"
  says = "Listing and reading need agent:read; rename, delete, archive, share and project changes need agent:write; project changes also need project:write."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.agent-share.spec.test.ts"]

  [[feature.behavior]]
  id = "agents.conversations.list-and-open"
  says = "The list is paginated and filterable, and reading by id returns the transcript; a bad id is 400 and an unknown one 404."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_listing.py",
    "node:tests/modules/enterprise_search/controller/es_controller.listing.test.ts",
  ]

  [[feature.behavior]]
  id = "agents.conversations.archive-delete"
  says = "Archive and unarchive refuse a conversation already in that state; delete hides the conversation and a second delete changes nothing; rename needs a valid title and persists it."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_update_delete.py",
  ]

  [[feature.behavior]]
  id = "agents.conversations.feedback"
  says = "Feedback is accepted on a bot answer with a valid category and refused on a user question (400) or an unknown message id."
  priority = "P1"
  tests = ["it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_feedback.py"]

  [[feature.behavior]]
  id = "agents.conversations.project-link"
  says = "Only the person who started a conversation can link it to a project, and only to one they can open at any member role and that is not archived (404 otherwise); a null project id unlinks it. The call needs project:write as well as agent:write."
  priority = "P1"
  kind = "security"
  tests = [
    "node:tests/modules/enterprise_search/controller/set-conversation-project.test.ts",
    "it:response-validation/enterprise-search/projects/integration_test_project.py::TestProjectConversationLinking::test_link_to_project_caller_cannot_see_returns_404",
  ]

[[feature]]
id = "agents.chat"
title = "Chatting with an agent"
flow = "agents-toolsets-mcp"
what = "A user sends a message to an agent and gets a streamed answer, or a plain JSON answer from the non-streaming routes. They can attach files, regenerate the last answer and fork a conversation from a message. Only the owner can regenerate or fork."
routes = [
  "POST /api/v1/agents/{agentKey}/conversations/stream",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/messages/stream",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/messages",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/message/{messageId}/regenerate",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/message/{messageId}/fork",
  "POST /api/v1/agents/{agentKey}/conversations/attachments/upload",
  "DELETE /api/v1/agents/{agentKey}/conversations/attachments/{recordId}",
]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/controller/non-streaming-chat.controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/utils/fork-conversation.ts",
  "backend/python/app/api/routes/agent.py",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.chat.stream-answer"
  says = "A message to an agent streams an answer that is saved to the conversation, and an agent built with no models answers with the organisation default model."
  priority = "P0"
  tests = [
    "e2e:tests/e2e/agents/agent-create-chat.spec.ts",
    "it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_stream.py",
    "py:tests/integration/test_chat_stream_agent_loop_e2e.py",
  ]

  [[feature.behavior]]
  id = "agents.chat.auth-and-validation"
  says = "A stream without credentials gets 401 or 403, an invalid body or conversation id 400, an unknown or wrong agent key 404, and a deleted agent fails with an error event."
  priority = "P0"
  kind = "security"
  tests = ["it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_stream.py"]

  [[feature.behavior]]
  id = "agents.chat.execute-scope"
  says = "An OAuth token needs agent:execute to chat with a named agent; the built-in universal agent also accepts conversation:chat."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_agent_chat_route.py"]

  [[feature.behavior]]
  id = "agents.chat.non-streaming"
  says = "The non-streaming routes run the same pipeline as the stream and return the saved conversation as JSON."
  priority = "P1"
  tests = [
    "py:tests/unit/api/routes/test_agent_chat_non_streaming.py",
    "node:tests/modules/enterprise_search/controller/es_controller.non-streaming.test.ts",
  ]

  [[feature.behavior]]
  id = "agents.chat.regenerate-fork-owner-only"
  says = "Only the owner regenerates an answer or forks a conversation; a recipient of a shared conversation gets 404. Regenerate works only on the last answer, and a fork copies the artifacts of the earlier messages."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/enterprise_search/utils/utils.regeneration.test.ts",
    "node:tests/modules/enterprise_search/utils/fork-conversation.test.ts",
    "it:response-validation/enterprise-search/conversations/integration_test_agent_conversation_update_delete.py",
  ]

  [[feature.behavior]]
  id = "agents.chat.attachments"
  says = "Attachments upload up to 5 MB each and 10 files per request, need agent:execute, are returned as references the next message can name, and a delete returns 204."
  priority = "P1"
  tests = [
    "it:response-validation/enterprise-search/conversations/integration_test_agent_attachment_upload.py",
  ]

  [[feature.behavior]]
  id = "agents.chat.context-limits"
  says = "A first message or follow-up over the model's context length is refused with a clear message instead of failing mid-run."
  priority = "P1"
  tests = ["it:ai_agents/integration_test_ai_models_live.py"]

  [[feature.behavior]]
  id = "agents.chat.draining"
  says = "While the server is draining for shutdown, new agent chat requests are refused instead of started."
  priority = "P2"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.drain.test.ts"]

[[feature]]
id = "agents.cancel"
title = "Stopping an agent run"
flow = "agents-toolsets-mcp"
what = "A user stops an agent answer that is still streaming. The run ends at its next checkpoint, and only the run's owner in that conversation can stop it, even across several query-service replicas."
routes = ["POST /api/v1/agents/{agentKey}/conversations/{conversationId}/cancel"]
code = [
  "backend/python/app/agents/agent_loop/cancellation/**",
  "backend/python/app/agents/agent_loop/cancellation_transport.py",
  "backend/python/app/api/routes/chatbot.py",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.cancel.owner-only"
  says = "A cancel from another user, another organisation or another conversation is refused with 403 and leaves the run going."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/agents/agent_loop/cancellation/test_in_process.py",
    "py:tests/unit/api/routes/test_chatbot_cancel.py",
  ]

  [[feature.behavior]]
  id = "agents.cancel.conversation-checked"
  says = "The Node route first checks that the caller owns the conversation (404 otherwise) and forwards the conversation id so the owner check is scoped to it."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_chatbot_cancel.py",
    "node:tests/modules/enterprise_search/controller/es_controller.ownership.test.ts",
  ]

  [[feature.behavior]]
  id = "agents.cancel.outcomes"
  says = "Cancelling an active run answers cancelled true; an unknown or already finished run answers cancelled false, not an error; a missing or non-UUID run id is 400."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_chatbot_cancel.py"]

  [[feature.behavior]]
  id = "agents.cancel.multi-replica"
  says = "A cancel that lands on a replica that does not own the run is published through the key-value store and only the owning replica acts on it, after the same owner check."
  priority = "P1"
  tests = ["py:tests/unit/agents/agent_loop/cancellation/test_kv_backed.py"]

  [[feature.behavior]]
  id = "agents.cancel.duplicate-run-id"
  says = "Starting a chat with a runId that is already active returns 409."
  priority = "P2"
  tests = ["py:tests/unit/api/routes/test_agent_chat_route.py"]

[[feature]]
id = "agents.conversation-sharing"
title = "Sharing an agent conversation"
flow = "agents-toolsets-mcp"
what = "The owner of an agent conversation shares it read-only with named colleagues and removes them again. A recipient opens the transcript but cannot continue, regenerate, fork or change it."
routes = [
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/share",
  "POST /api/v1/agents/{agentKey}/conversations/{conversationId}/unshare",
]
code = [
  "backend/nodejs/apps/src/modules/enterprise_search/controller/es_controller.ts",
  "backend/nodejs/apps/src/modules/enterprise_search/schema/agent.conversation.schema.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "agents.conversation-sharing.owner-only"
  says = "Only the owner shares or unshares; a recipient, a stranger or a user of another organisation gets 404 and nothing changes."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/enterprise_search/controller/es_controller.agent-share.test.ts"]

  [[feature.behavior]]
  id = "agents.conversation-sharing.read-only"
  says = "Write access is refused: a share can only grant read access, and the recipient list is limited to fifty users."
  priority = "P0"
