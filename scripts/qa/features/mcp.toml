# Feature map: external MCP servers PipesHub calls (catalog, instances, credentials,
# OAuth, tool rules, attachment to agents, the chat runtime). The /mcp endpoint that
# PipesHub itself serves is in api-access.toml.

# ---------------------------------------------------------------------------
# Catalog
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.catalog"
title = "MCP server catalog"
flow = "agents-toolsets-mcp"
what = "A signed-in user lists and searches the built-in catalog of known MCP servers, or reads one entry. The catalog says each server's transport, sign-in methods and launch settings."
routes = [
  "GET /api/v1/mcp-servers/catalog",
  "GET /api/v1/mcp-servers/catalog/{typeId}",
]
code = [
  "backend/python/app/agents/mcp/catalog.py",
  "backend/python/app/agents/mcp/registry.py",
  "backend/python/app/agents/mcp/servers/**",
  "backend/python/app/api/routes/mcp_servers.py",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.catalog.list"
  says = "GET /catalog returns templates with total, page and limit. It pages (limit 1 to 200, default 50), filters by search, and reports customStdioAllowed."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_registry.py", "py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py", "py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.catalog.unknown-type"
  says = "GET /catalog/{typeId} for a type that is not in the catalog returns 404 'Unknown MCP server type'."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.catalog.replaced"
  says = "A catalog entry marked as replaced is not offered for new servers: creating one is refused with 400 that names the replacement, and servers already made from it keep working."
  priority = "P1"
  kind = "function"
  tests = [
    "py:tests/unit/api/routes/test_mcp_servers_replaced_catalog.py",
    "fe:app/(main)/workspace/mcp-servers/__tests__/catalog-replacement.test.tsx",
  ]

# ---------------------------------------------------------------------------
# Instances
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.instances"
title = "MCP server instances"
flow = "agents-toolsets-mcp"
what = "An administrator creates, edits and deletes organization MCP servers. Any user can create personal servers of their own. Members see an org server without its connection details."
routes = [
  "GET /api/v1/mcp-servers/instances",
  "POST /api/v1/mcp-servers/instances",
  "GET /api/v1/mcp-servers/instances/{instanceId}",
  "PUT /api/v1/mcp-servers/instances/{instanceId}",
  "DELETE /api/v1/mcp-servers/instances/{instanceId}",
]
code = [
  "backend/python/app/api/routes/mcp_servers.py",
  "backend/python/app/agents/mcp/service.py",
  "backend/python/app/agents/mcp/models.py",
  "backend/nodejs/apps/src/modules/mcp_servers/**",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.instances.admin-creates-org"
  says = "An administrator's POST /instances creates an org server (201); a non-administrator's creates a personal server even when it asks for org. Asking for scope 'personal' needs no role; an unknown scope is 400."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.instances.unconfirmed-role"
  says = "When the caller's role cannot be confirmed, creating an org-scope server fails with 503 and creates nothing, instead of making a personal one."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.instances.admin-list-only"
  says = "GET /instances is for administrators only: a member gets 403, and the list holds org servers only, never users' personal ones."
  priority = "P0"
  kind = "security"
  tests = [
    "it:permissions/test_admin_routes.py::TestMembersAreRefused::test_a_member_is_refused",
    "py:tests/unit/api/routes/test_mcp_servers_personal.py",
  ]

  [[feature.behavior]]
  id = "mcp.instances.manage-access"
  says = "Only an administrator may view, update or delete an org server, and only the owner may do so for a personal one. Another user, or an administrator, gets 403 on someone's personal server."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.instances.member-view"
  says = "A member listing servers gets no url, command, args, authorizationUrl, tokenUrl or scopes of an org server, because they can carry a credential. An administrator and the owner of a personal server get the full record."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.instances.personal-limits"
  says = "A personal server cannot use STDIO or a shared admin credential (400), its URL must be public, and a user may have at most 25 (MCP_MAX_PERSONAL_INSTANCES), after which creating returns 409."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.instances.validation"
  says = "A catalog server must keep its template's transport and command, and may only use sign-in methods the template supports. A custom SSE or streamable HTTP server needs a url (400)."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py", "py:tests/unit/api/routes/test_mcp_servers.py"]

  [[feature.behavior]]
  id = "mcp.instances.scope-fixed"
  says = "A server's scope (org or personal) is fixed at creation: updating it never moves it between the org and a user."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.instances.edit-resets-credentials"
  says = "Changing a server's url, token url, command or sign-in method removes every stored credential for it (response credentialsReset), before the new target is saved. A rename keeps them."
  priority = "P0"
  kind = "security"
  tests = [
    "py:tests/unit/api/routes/test_mcp_servers_correctness.py",
    "fe:app/(main)/workspace/mcp-servers/__tests__/edit-safety.test.tsx",
  ]

  [[feature.behavior]]
  id = "mcp.instances.delete-in-use"
  says = "Deleting a server that an agent uses returns 409 and names the agents. If the check cannot run, the delete fails and nothing is removed."
  priority = "P0"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py"]

  [[feature.behavior]]
  id = "mcp.instances.delete-removes-data"
  says = "Deleting a server removes its record first, then its credentials, OAuth app, logo and cached tools. A record that cannot be deleted is reported as 500, not hidden."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py", "py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.instances.org-isolation"
  says = "A server of another organization is 404 on get, update, delete, authenticate, OAuth config and refresh, and never appears in any listing."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_org_scoping.py"]

  [[feature.behavior]]
  id = "mcp.instances.not-found"
  says = "Get, update or delete of an unknown instance id returns 404 'MCP server instance not found'."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

# ---------------------------------------------------------------------------
# Feature flag and scopes (cross-cutting)
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.access-control"
title = "MCP routes: feature flag and token scopes"
flow = "agents-toolsets-mcp"
what = "Every MCP server route needs a signed-in caller and the matching scope (mcp:read, mcp:write, mcp:delete; agent:read and agent:write for the agent routes). The whole feature is off when the MCP platform flag is off."
code = [
  "backend/nodejs/apps/src/modules/mcp_servers/routes/mcp_servers.routes.ts",
  "backend/nodejs/apps/src/modules/mcp_servers/controller/mcp_servers.controller.ts",
  "backend/nodejs/apps/src/modules/mcp_servers/container/mcp_servers.container.ts",
  "backend/python/app/api/routes/mcp_servers.py",
  "backend/python/app/agents/mcp/service.py",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.access-control.scopes"
  says = "A token without the route's scope gets 403 from the Node route, and Python asks for the same scope on its own hop. Reads need mcp:read, writes mcp:write, deleting a server or a credential mcp:delete."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/mcp_servers/routes/mcp_servers.routes.test.ts",
    "py:tests/unit/api/test_mcp_route_scopes.py",
  ]

  [[feature.behavior]]
  id = "mcp.access-control.unauthenticated"
  says = "A request with no signed-in user is refused with 401 and is never forwarded to the connector service."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/mcp_servers/controller/mcp_servers.controller.test.ts"]

  [[feature.behavior]]
  id = "mcp.access-control.flag-off"
  says = "When MCP is disabled for the organization, every /api/v1/mcp-servers route returns 403 'MCP servers are disabled for this organization', and the pages send the user to Workspace general."
  priority = "P1"
  kind = "function"
  tests = []

  [[feature.behavior]]
  id = "mcp.access-control.proxy-headers"
  says = "The Node proxy forwards only Authorization and the tracing and language headers, so a client cannot inject an admin flag or other x- headers. Path parameters are URL-encoded and unsafe ones are refused."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/mcp_servers/controller/mcp_servers.controller.test.ts", "node:tests/modules/mcp_servers/routes/mcp_servers.routes.test.ts"]

  [[feature.behavior]]
  id = "mcp.access-control.proxy-retries"
  says = "Reads are retried on a transient failure, but writes and OAuth start and callback calls are sent once, so a retry cannot create a second server or start a second authorization."
  priority = "P1"
  kind = "function"
  tests = ["node:tests/modules/mcp_servers/controller/mcp_servers.controller.test.ts"]

  [[feature.behavior]]
  id = "mcp.access-control.spec"
  says = "Every MCP server route the Node router serves is in pipeshub-openapi.yaml with the same method and path."
  priority = "P2"
  kind = "function"
  tests = ["node:tests/modules/mcp_servers/mcp-servers-match-the-spec.test.ts"]

# ---------------------------------------------------------------------------
# My servers and tool discovery
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.my-servers"
title = "My MCP servers and tool discovery"
flow = "agents-toolsets-mcp"
what = "A user lists the org and personal servers they can use, with their own connection status and tools, and refreshes one server's tool list. A server that is down gives a coded reason the UI can act on."
routes = [
  "GET /api/v1/mcp-servers/my-mcp-servers",
  "GET /api/v1/mcp-servers/instances/{instanceId}/tools",
]
code = [
  "backend/python/app/api/routes/mcp_servers.py",
  "backend/python/app/agents/mcp/discovery.py",
  "backend/python/app/agents/mcp/failure.py",
  "backend/python/app/agents/mcp/client.py",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.my-servers.listing"
  says = "GET /my-mcp-servers lists the org servers plus the caller's own personal servers, never another user's, with the caller's connection state. includeTools=false skips connecting."
  priority = "P0"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_personal.py", "py:tests/unit/api/routes/test_mcp_servers_org_scoping.py"]

  [[feature.behavior]]
  id = "mcp.my-servers.tool-names-unique"
  says = "Tools in the listing carry a namespace that names exactly one instance, so two servers with the same name or type never share a tool name."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_namespaces_per_viewer.py", "py:tests/unit/agents/mcp/test_naming.py"]

  [[feature.behavior]]
  id = "mcp.my-servers.expired-token"
  says = "A listing that finds an expired OAuth token refreshes it once and lists the tools. A refused refresh is reported as a reconnect, a provider outage as 'sign-in couldn't be renewed'."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py", "py:tests/unit/api/routes/test_mcp_servers_error_detail.py"]

  [[feature.behavior]]
  id = "mcp.my-servers.tools-not-signed-in"
  says = "GET /instances/{id}/tools for a server the caller has not connected to returns 409 'Not authenticated for this MCP server instance'."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.my-servers.failure-codes"
  says = "A sign-in problem returns 409 with a reason code, other connection failures 502 with a short message. A server's STDIO stderr is shown to administrators only."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_error_detail.py", "py:tests/unit/agents/mcp/test_failure.py"]

  [[feature.behavior]]
  id = "mcp.my-servers.slow-server"
  says = "One slow server cannot hold up the listing: each server is cut off after its own time budget and shown as slow, not broken."
  priority = "P1"
  kind = "performance"
  tests = ["py:tests/unit/agents/mcp/test_timeouts_and_reuse.py", "fe:app/(main)/workspace/mcp-servers/__tests__/connection-state.test.tsx"]

  [[feature.behavior]]
  id = "mcp.my-servers.cached-tools"
  says = "GET /instances/{id}/tools?cached=true returns the stored list with syncedAt without connecting. Refresh connects live and replaces the stored list."
  priority = "P2"
  kind = "performance"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_tool_cache.py"]

  [[feature.behavior]]
  id = "mcp.my-servers.live-server"
  says = "Against a real MCP server, discovery lists the server's tools and the SDK client can call them."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_client_e2e.py", "it:unit/test_mcp_fixture_server.py"]

# ---------------------------------------------------------------------------
# Logos
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.logos"
title = "Custom MCP server logos"
flow = "agents-toolsets-mcp"
what = "The owner of a custom MCP server uploads or removes its logo. Catalog servers always show the vendor's logo. Users see the logos of the servers they can see."
routes = [
  "GET /api/v1/mcp-servers/logos",
  "PUT /api/v1/mcp-servers/instances/{instanceId}/logo",
  "DELETE /api/v1/mcp-servers/instances/{instanceId}/logo",
]
code = [
  "backend/python/app/agents/mcp/logo.py",
  "backend/python/app/api/routes/mcp_servers.py",
  "frontend/app/(main)/workspace/mcp-servers/logo-*.ts",
  "frontend/app/(main)/workspace/mcp-servers/components/mcp-logo-image.tsx",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.logos.who"
  says = "An administrator sets the logo of an org custom server and a member of their own. A member cannot change an org server's logo, and someone else's personal server is 404 even for an administrator."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_logo.py"]

  [[feature.behavior]]
  id = "mcp.logos.custom-only"
  says = "A catalog server takes no logo (400) and shows its vendor's, even if one is stored."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_logo.py"]

  [[feature.behavior]]
  id = "mcp.logos.normalize"
  says = "Only whole PNG, JPEG, WebP or GIF files are kept, decided by the bytes. They are shrunk to a small PNG; SVG, oversized files and oversized canvases are refused with the reason."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_logo.py", "py:tests/unit/api/routes/test_mcp_servers_logo.py"]

  [[feature.behavior]]
  id = "mcp.logos.listing"
  says = "GET /logos returns the logos of the custom servers the caller can see, by instance id, and leaves out servers without one."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_logo.py"]

  [[feature.behavior]]
  id = "mcp.logos.ui"
  says = "The UI resizes a chosen image before upload and shows a server's logo, or a default icon when it has none."
  priority = "P2"
  kind = "function"
  tests = [
    "fe:app/(main)/workspace/mcp-servers/__tests__/logo-file.test.ts",
    "fe:app/(main)/workspace/mcp-servers/__tests__/logo-store.test.tsx",
    "fe:app/(main)/workspace/mcp-servers/__tests__/mcp-server-icon.test.tsx",
  ]

# ---------------------------------------------------------------------------
# Credentials (token, headers, shared admin credential)
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.credentials"
title = "MCP server credentials (API token, headers, shared)"
flow = "agents-toolsets-mcp"
what = "A user saves, replaces or removes their own token or header value for an MCP server, or uses the shared administrator credential when the server has one. Only administrators manage a shared credential."
routes = [
  "POST /api/v1/mcp-servers/instances/{instanceId}/authenticate",
  "PUT /api/v1/mcp-servers/instances/{instanceId}/credentials",
  "DELETE /api/v1/mcp-servers/instances/{instanceId}/credentials",
  "POST /api/v1/mcp-servers/instances/{instanceId}/auto-authenticate",
  "POST /api/v1/mcp-servers/instances/{instanceId}/reauthenticate",
]
code = [
  "backend/python/app/api/routes/mcp_servers.py",
  "backend/python/app/agents/mcp/service.py",
  "frontend/app/(main)/workspace/mcp-servers/components/mcp-auth-dialog.tsx",
  "frontend/app/(main)/workspace/mcp-servers/components/mcp-disconnect-dialog.tsx",
  "frontend/app/(main)/workspace/mcp-servers/connection-state.tsx",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.credentials.save"
  says = "POST /authenticate stores the caller's apiToken (API token mode) or headerValue (headers mode) under the caller's own id and returns isAuthenticated. A missing token or header value is 400."
  priority = "P0"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_handlers.py", "py:tests/unit/api/routes/test_mcp_servers.py"]

  [[feature.behavior]]
  id = "mcp.credentials.mode-checks"
  says = "Saving a token for an OAuth server is 400 ('use /oauth/authorize'), and for a No authentication server is 400. PUT /credentials applies the same checks as POST."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers.py", "py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.credentials.stdio-env"
  says = "For a STDIO server only the server's declared required and optional env names are kept from the payload, and a missing required one is 400."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers.py"]

  [[feature.behavior]]
  id = "mcp.credentials.shared-admin-only"
  says = "On a server with a shared admin credential, saving, replacing, removing or clearing that credential is 403 for a non-administrator. Everyone else reads the credential an administrator saved."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py", "py:tests/unit/api/routes/test_mcp_servers.py"]

  [[feature.behavior]]
  id = "mcp.credentials.shared-only-token-or-headers"
  says = "A shared credential applies only to API token or header servers. OAuth sign-in is always per person, even with the shared option set, and personal servers cannot use it."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py", "py:tests/unit/api/routes/test_mcp_servers_personal.py"]

  [[feature.behavior]]
  id = "mcp.credentials.auto-authenticate"
  says = "POST /auto-authenticate succeeds when the administrator's shared credential exists, is 400 when the server does not use one, and 409 when the administrator has not set it yet."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py", "py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.credentials.disconnect"
  says = "DELETE /credentials and POST /reauthenticate remove only the caller's own credential, including OAuth tokens, and cancel its refresh task. The shared OAuth client other users rely on stays."
  priority = "P0"
  kind = "function"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_correctness.py", "py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.credentials.never-returned"
  says = "No response of these routes contains the stored token, header value or env values; they return success and isAuthenticated only."
  priority = "P0"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "mcp.credentials.ui-state"
  says = "The UI shows connect, connected, slow or blocked per server, asks a member to connect only when they never have, and lets only an administrator add a missing shared credential."
  priority = "P2"
  kind = "function"
  tests = [
    "fe:app/(main)/workspace/mcp-servers/__tests__/connection-state.test.tsx",
    "fe:app/(main)/workspace/mcp-servers/__tests__/personal-mcp-servers.test.tsx",
  ]

# ---------------------------------------------------------------------------
# OAuth sign-in
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.oauth"
title = "MCP server OAuth sign-in"
flow = "agents-toolsets-mcp"
what = "A user connects to an OAuth MCP server in a popup: PipesHub discovers the server's OAuth endpoints, registers or uses a client, sends the user to the provider, and stores the tokens when the callback returns. Tokens refresh on demand and in the background."
routes = [
  "GET /api/v1/mcp-servers/instances/{instanceId}/oauth/authorize",
  "POST /api/v1/mcp-servers/instances/{instanceId}/oauth/refresh",
  "POST /api/v1/mcp-servers/oauth/discover",
  "GET /api/v1/mcp-servers/oauth/callback",
]
pages = ["frontend/app/(public)/mcp-servers/oauth/callback/page.tsx"]
code = [
  "backend/python/app/api/routes/mcp_servers.py",
  "backend/python/app/agents/mcp/dcr.py",
  "backend/python/app/agents/mcp/oauth_client.py",
  "backend/python/app/agents/mcp/token_refresh.py",
  "backend/python/app/agents/mcp/cimd.py",
  "backend/python/app/agents/mcp/www_authenticate.py",
  "frontend/app/(public)/mcp-servers/oauth/callback/**",
  "frontend/app/(main)/workspace/mcp-servers/hooks/use-mcp-oauth-popup.ts",
  "frontend/app/(main)/workspace/mcp-servers/oauth/**",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.oauth.authorize-url"
  says = "GET /oauth/authorize returns an authorizationUrl with a PKCE challenge, a random state and the redirect URI. It is 400 for a server that does not use OAuth. The stored state expires after 10 minutes."
  priority = "P0"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_dcr.py", "py:tests/unit/api/routes/test_mcp_servers_handlers.py"]

  [[feature.behavior]]
  id = "mcp.oauth.web-urls-only"
  says = "An authorization address that is not a web address is refused, so the popup is never sent to a script or other scheme."
  priority = "P0"
