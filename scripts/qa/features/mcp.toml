what = "A background service in the connectors process renews MCP OAuth tokens before they expire, so chats keep working without the user signing in again. It also clears sign-in states that were never completed."
code = [
  "backend/python/app/connectors/core/base/token_service/mcp_token_refresh_service.py",
  "backend/python/app/connectors/core/base/token_service/startup_service.py",
  "backend/python/app/agents/mcp/token_refresh.py",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.token-refresh-service.schedule"
  says = "After a sign-in, a refresh is scheduled for each stored OAuth credential, using the token url saved on the credential, so custom servers refresh too. Disconnecting cancels the task."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/connectors/test_mcp_token_refresh_service.py", "py:tests/unit/agents/mcp/test_token_refresh.py"]

  [[feature.behavior]]
  id = "mcp.token-refresh-service.rejected"
  says = "When the provider permanently rejects a refresh token, the credential is marked signed out so the user is asked to reconnect, instead of retrying forever."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/connectors/test_mcp_token_refresh_service.py", "py:tests/unit/agents/mcp/test_token_refresh.py"]

  [[feature.behavior]]
  id = "mcp.token-refresh-service.orphans"
  says = "A credential whose server is gone is removed, not refreshed."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_lifecycle.py", "py:tests/unit/connectors/test_mcp_token_refresh_service.py"]

  [[feature.behavior]]
  id = "mcp.token-refresh-service.logging"
  says = "Each refresh logs the server, owner and outcome without the token or the provider's response."
  priority = "P1"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_token_refresh_logging.py", "py:tests/unit/connectors/test_mcp_token_refresh_service_logging.py"]

# ---------------------------------------------------------------------------
# Network guard
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.url-guard"
title = "Network guard for MCP connections"
flow = "agents-toolsets-mcp"
what = "Every request PipesHub makes to an MCP server or its OAuth endpoints goes through a guard that refuses internal addresses. Only an administrator's server may use the private network, and that can be turned off for the deployment."
code = [
  "backend/python/app/agents/mcp/url_guard.py",
  "backend/python/app/agents/mcp/wire.py",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.url-guard.blocked"
  says = "Loopback, link-local and cloud-metadata addresses (including mapped IPv6 forms) are refused for every server, with a message that does not name the resolved address."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_url_guard.py", "py:tests/unit/agents/mcp/test_url_guard_httpx2.py"]

  [[feature.behavior]]
  id = "mcp.url-guard.save-time"
  says = "Creating or updating a server with a loopback server url or a metadata token url is 400, and an update leaves the stored record unchanged."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_url_guard.py"]

  [[feature.behavior]]
  id = "mcp.url-guard.private-network"
  says = "A private-network host is allowed only on an administrator's server and only for the host the server names. A personal server is always public-only, and MCP_ALLOW_PRIVATE_NETWORK_URLS=false turns it off for all."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_url_guard.py", "py:tests/unit/api/routes/test_mcp_servers_url_guard.py"]

  [[feature.behavior]]
  id = "mcp.url-guard.rebinding"
  says = "A request goes to the address that was checked (pinned), and a redirect to another origin never reaches the network, so DNS rebinding and redirects cannot reach an internal host."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_url_guard.py", "py:tests/unit/agents/mcp/test_url_guard_httpx2.py"]

# ---------------------------------------------------------------------------
# STDIO launch policy
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.stdio-policy"
title = "STDIO server launch policy"
flow = "agents-toolsets-mcp"
what = "Catalog servers always run their catalog command. A custom STDIO server (a local program PipesHub starts) is off by default and, when an administrator turns it on, may only run allowed launchers."
code = [
  "backend/python/app/agents/mcp/stdio_policy.py",
  "backend/python/app/api/routes/mcp_servers.py",
  "frontend/app/(main)/workspace/mcp-servers/components/mcp-stdio-policy.tsx",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.stdio-policy.off-by-default"
  says = "Custom STDIO is off unless MCP_ALLOW_CUSTOM_STDIO is exactly true. Creating one when off is 403 and says how to enable it; the catalog's customStdioAllowed says which."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_stdio_policy.py", "py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py"]

  [[feature.behavior]]
  id = "mcp.stdio-policy.command"
  says = "A custom command must be an allowed launcher or listed exactly. Shells, inline-code flags and NUL bytes are refused (400), also for paths and combined short flags."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_stdio_policy.py", "py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py"]

  [[feature.behavior]]
  id = "mcp.stdio-policy.env-names"
  says = "Env names that load code (such as interpreter search paths) and invalid names are refused."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_stdio_policy.py", "py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py"]

  [[feature.behavior]]
  id = "mcp.stdio-policy.launch-time"
  says = "A stored record is checked again when launched: a tampered catalog record runs the template command, and a custom shell command or code-loading env name cannot be launched."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py"]

  [[feature.behavior]]
  id = "mcp.stdio-policy.template-wins"
  says = "A catalog server's command, args, transport and url cannot be overridden by the request; a different transport is 400."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/api/routes/test_mcp_servers_stdio_policy.py"]

  [[feature.behavior]]
  id = "mcp.stdio-policy.ui"
  says = "The server form starts a new custom server on STDIO with a warning when the setting is on, and keeps a STDIO form unsavable when the setting turns off."
  priority = "P2"
  kind = "function"
  tests = ["fe:app/(main)/workspace/mcp-servers/team/components/__tests__/mcp-instance-config-panel.stdio-policy.test.tsx"]

# ---------------------------------------------------------------------------
# Tool list cache
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.tool-cache"
title = "MCP tool list cache"
flow = "agents-toolsets-mcp"
what = "PipesHub keeps each sign-in's list of a server's tools between chats, so a turn does not connect to every server just to learn what it offers."
code = ["backend/python/app/agents/mcp/tool_cache.py"]
status = "draft"

  [[feature.behavior]]
  id = "mcp.tool-cache.per-sign-in"
  says = "A sign-in reads only its own cached list; a shared administrator credential is one sign-in for everyone, and a list shared by all is used only when the server says so and an administrator set it up."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_tool_cache.py"]

  [[feature.behavior]]
  id = "mcp.tool-cache.invalidation"
  says = "A new credential, a changed server target, an expired entry or a blob that fails its hash check is a miss. An empty list is never kept."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_tool_cache.py"]

  [[feature.behavior]]
  id = "mcp.tool-cache.server-hints"
  says = "The cache lasts a day by default, honors a shorter server hint, drops what a server says not to cache, and has a kill switch that reads and writes nothing."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_tool_cache.py"]

# ---------------------------------------------------------------------------
# Cleanup when a user goes away
# ---------------------------------------------------------------------------

[[feature]]
id = "mcp.cleanup"
title = "MCP data cleanup"
flow = "agents-toolsets-mcp"
what = "When a user or an agent is deleted, the MCP servers, credentials and tokens that belonged to them are removed. A failed delete does not stop the rest."
code = [
  "backend/python/app/agents/mcp/lifecycle.py",
  "backend/python/app/services/messaging/kafka/handlers/entity.py",
]
status = "draft"

  [[feature.behavior]]
  id = "mcp.cleanup.user-deleted"
  says = "A user-deleted event removes that user's personal servers, credentials, tokens and rules, and nothing of other users."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/mcp/test_lifecycle.py"]

  [[feature.behavior]]
  id = "mcp.cleanup.agent-deleted"
  says = "A deleted agent loses only its own MCP credentials."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_lifecycle.py"]

  [[feature.behavior]]
  id = "mcp.cleanup.best-effort"
  says = "One failing delete does not stop the others, and a cleanup failure does not fail the event."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/agents/mcp/test_lifecycle.py"]

