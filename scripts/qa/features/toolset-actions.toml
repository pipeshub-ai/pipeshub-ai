[[feature]]
id = "toolset-actions.clickup"
title = "ClickUp tools"
flow = "agents-toolsets-mcp"
what = "An agent reads workspaces, spaces, folders, lists, tasks, comments, checklists and docs in ClickUp, and creates and updates most of them."
toolsets = ["clickup"]
code = ["backend/python/app/agents/actions/clickup/**"]
status = "draft"

  [[feature.behavior]]
  id = "toolset-actions.clickup.tools"
  says = "The ClickUp toolset registers its tools (get_spaces, get_tasks, create_task, update_task, create_task_comment, create_checklist, create_doc_page, and more (26 tools)) so an agent can call them, and every tool carries a type tag that sets its approval rule."
  priority = "P1"
  tests = ["py:tests/unit/agents/test_standard_toolset_modules.py", "py:tests/unit/agents/test_toolset_tool_kinds.py"]

  [[feature.behavior]]
  id = "toolset-actions.clickup.auth"
  says = "ClickUp uses OAuth; every call carries the connecting user's bearer token, and the token never appears in a failure message."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/agents/actions/test_clickup_toolset.py"]

  [[feature.behavior]]
  id = "toolset-actions.clickup.call"
  says = "A tool call reaches the ClickUp API with the user's credential and returns the result as JSON text."
  priority = "P0"
  tests = ["py:tests/unit/agents/actions/test_clickup_toolset.py"]

  [[feature.behavior]]
  id = "toolset-actions.clickup.failure"
  says = "When the ClickUp call fails or the credential is missing, the tool returns a failed result carrying the error message, not an exception."
  priority = "P1"
  tests = ["py:tests/unit/agents/actions/test_clickup_toolset.py"]


