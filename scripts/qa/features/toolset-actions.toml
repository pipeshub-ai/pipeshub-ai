# Toolset actions: what the tools of each agent toolset do (flow agents-toolsets-mcp). The platform (APIs, credentials, OAuth) is in toolsets.toml.

[[feature]]
id = "toolset-actions.airtable"
title = "Airtable tools"
flow = "agents-toolsets-mcp"
what = "An agent creates, reads, lists, updates, deletes and searches records in an Airtable base. It is not offered to agents today: the module is not listed in STANDARD_TOOLSET_MODULES."
toolsets = ["airtable"]
code = ["backend/python/app/agents/actions/airtable/**"]
status = "draft"

  [[feature.behavior]]
  id = "toolset-actions.airtable.tools"
  says = "The module defines 6 tools (create_records, get_record, list_records, update_records, delete_records, search_records), but it is commented out of STANDARD_TOOLSET_MODULES, so agents are not offered the toolset."
  priority = "P2"
  tests = []

