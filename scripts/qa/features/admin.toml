  says = "POST and GET platform/settings and GET feature-flags/available need an administrator with the config scope; a member gets 403."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/routes/cm_routes.guards.test.ts"]

  [[feature.behavior]]
  id = "admin.platform-settings.save"
  says = "A saved upload limit and flag map are returned by the next GET; the limit must be a positive integer of at most 1 GB and the flags must be booleans, otherwise 400."
  priority = "P0"
  tests = [
    "node:tests/modules/configuration_manager/controller/cm_controller.test.ts",
    "node:tests/modules/configuration_manager/validators/validators.test.ts",
  ]

  [[feature.behavior]]
  id = "admin.platform-settings.available"
  says = "feature-flags/available lists only flags that are not hidden, each with its label, description and default."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

  [[feature.behavior]]
  id = "admin.platform-settings.effective"
  says = "feature-flags/effective is readable by any signed-in user and returns only booleans, with defaults filled in for flags that were never saved."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

  [[feature.behavior]]
  id = "admin.platform-settings.artifact-interlock"
  says = "Turning artifact reads on, or shadow reads on from both off, is refused with 409 while an older indexing member runs or the membership check cannot be seen. Turning flags off is never refused. The generation stamp is set by the server, never from the body."
