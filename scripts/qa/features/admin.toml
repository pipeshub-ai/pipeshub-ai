  [[feature.behavior]]
  id = "admin.platform-settings.fail-closed"
  says = "The Python services read the saved flags live. The MCP gate reads them fail-closed: when the stored settings cannot be read, the flag is off instead of its default."
  priority = "P1"
  tests = ["py:tests/unit/services/featureflag/test_platform_settings_fail_closed.py"]

  [[feature.behavior]]
  id = "admin.platform-settings.labs-page"
  says = "The Labs page shows the upload limit with its validation messages, saves or discards changes with a toast, and hides advanced flags in their own group."
  priority = "P1"
  tests = ["e2e:tests/e2e/workspace/labs.spec.ts", "fe:app/(main)/workspace/labs/__tests__/page.test.tsx"]

