[[feature]]
id = "admin.config-migrations"
title = "Startup migrations of the settings service"
flow = "admin-settings"
what = "At startup the Node API runs one-time data migrations (admin roles, sign-in policies, chat history, scheduled syncs and more). Each one is safe to run again, writes its done flag only when it finished without errors, and a failure never stops the API from starting."
code = [
  "backend/nodejs/apps/src/modules/configuration_manager/services/migration.service.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/services/migrations/**",
  "backend/nodejs/apps/src/modules/auth/utils/removedSignInMethods.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.config-migrations.admin-role"
  says = "Members of the legacy admin group get role admin, users without a role become member, and the group is soft-deleted. A group is never soft-deleted when its organization would be left with no admin."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/services/migrations/admin_role.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.sign-in-policies"
  says = "Sign-in methods that were removed are taken out of every stored policy, a policy that named one also gets password sign-in so nobody is locked out, and Azure AD settings are copied to Microsoft unless Microsoft settings already exist. If the copy fails the policies are left unchanged."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/configuration_manager/services/migrations/sign_in_methods_removal.migration.test.ts",
    "node:tests/modules/auth/utils/removedSignInMethods.test.ts",
  ]

  [[feature.behavior]]
  id = "admin.config-migrations.chat-sessions"
  says = "Legacy conversations and agent conversations are copied into chat sessions and their messages in order. The copy waits until the chat filter migration is done, refuses a document with duplicate or missing message ids, and counts a document as migrated only when the stored message count matches."
  priority = "P0"
  tests = ["node:tests/modules/configuration_manager/services/migrations/chat_sessions.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.chat-kb-filters"
  says = "Collection filters stored on old chat messages under the legacy knowledge base tag move to the apps list. The migration waits for the connector service migration it depends on (up to 10 tries with growing delay) and leaves its done flag unset if that never finishes."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/migrations/chat_kb_filters.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.document-org-id"
  says = "Storage documents without an organization id get the id of the one organization. With no organization found, nothing is changed and the done flag is not written."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/migrations/document_orgid_backfill.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.group-name-index"
  says = "A unique index on active user group names per organization is added when no active groups share a name. If some do, the migration lists them in the log, renames and deletes nothing, and tries again on the next start."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/migrations/user_group_name_index.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.service-accounts"
  says = "The ids of live service accounts, and which of them are switched off, are staged for the connector service to mark in the graph. The migration never records itself as done, stages again when an account is added or switched off, and stages nothing when there are more than 10,000."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/migrations/service_account_kind_backfill.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.sync-schedules"
  says = "Each active connector set to a scheduled sync gets its crawl job, connectors that already have one are skipped, and one failing connector does not block the others. A repair pass on a timer recreates a job that went missing, and a fresh install with no organization is marked done without calling the connector service."
  priority = "P1"
  tests = [
    "node:tests/modules/configuration_manager/services/migrations/scheduled_jobs_backfill.migration.test.ts",
    "node:tests/modules/configuration_manager/services/migration.service.test.ts",
  ]

  [[feature.behavior]]
  id = "admin.config-migrations.delegation-retention"
  says = "At every start the expiry of the delegation log is set to the configured retention in place, a missing collection or index is left alone, and a database error is logged without stopping the service."
  priority = "P2"
  tests = ["node:tests/modules/configuration_manager/migrations/delegation_log_retention.migration.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.failure-isolated"
  says = "The service account staging runs first, then the sign-in policy rewrite, and then the others. A migration that throws or finishes with errors is logged and the rest still run."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/migration.service.test.ts"]

  [[feature.behavior]]
  id = "admin.config-migrations.postgres-skip"
  says = "On a PostgreSQL install the migrations that read legacy MongoDB data (admin role, sign-in policies, chat history, document organization ids, group name index, delegation retention) are skipped."
  priority = "P2"
  tests = []

[[feature]]
id = "admin.models-decision"
title = "Decision models"
flow = "admin-settings"
what = "An admin adds a decision model (OpenAI, OpenAI Compatible, OpenRouter, Azure OpenAI, LiteLLM Proxy or TypeSafe) under AI models, for decisions. The product uses the default one to answer yes or no questions with probabilities."
code = ["backend/python/app/services/ai_models/decision/**"]
status = "draft"

  [[feature.behavior]]
  id = "admin.models-decision.providers"
  says = "The registry lists every decision provider, the factory builds each one and refuses an unknown provider, and the gateway providers need an endpoint."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/services/ai_models/test_decision_model_wiring.py", "py:tests/unit/services/ai_models/test_decision_models.py"]

  [[feature.behavior]]
  id = "admin.models-decision.wire-format"
  says = "Each provider sends its own request format to its own endpoint (OpenRouter to its decisions endpoint, the OpenAI gateways to {endpoint}/decisions, Azure to the deployment path) and reads the answers back; a refusal or a missing answer is refused."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/services/ai_models/test_decision_models.py"]

  [[feature.behavior]]
  id = "admin.models-decision.health-check"
  says = "The health check asks one question and reports healthy; a bad key is reported as a settings error, and a model with no name or no answer fails."
  priority = "P1"
  kind = "function"
  tests = ["py:tests/unit/services/ai_models/test_decision_model_wiring.py"]

  [[feature.behavior]]
  id = "admin.models-decision.endpoint-guard"
  says = "A decision model endpoint that points at a cloud metadata address is refused."
  priority = "P0"
  kind = "security"
  tests = ["py:tests/unit/services/ai_models/test_decision_models.py"]

  [[feature.behavior]]
  id = "admin.models-decision.retries"
  says = "A rate-limited call is retried, a Retry-After longer than the limit is not waited for, and a single-attempt call never retries."
  priority = "P2"
  kind = "function"
  tests = ["py:tests/unit/services/ai_models/test_decision_models.py"]
