  "GET /api/v1/configurationManager/ai-models/registry/capabilities",
  "GET /api/v1/configurationManager/ai-models/registry/{providerId}/schema",
]
code = [
  "backend/python/app/config/ai_models/**",
  "backend/python/app/api/routes/ai_models_registry.py",
  "frontend/app/(main)/workspace/ai-models/capability-i18n.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.models-registry.admin-only"
  says = "The registry routes need an administrator with the config:read scope; a member gets 403."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/routes/cm_routes.guards.test.ts"]

  [[feature.behavior]]
  id = "admin.models-registry.list"
  says = "The registry lists every provider with its supported model types, and the schema route answers each provider's field list (with secret fields marked) or an error for an unknown provider."
  priority = "P1"
  tests = ["py:tests/unit/api/routes/test_ai_models_registry_api.py", "py:tests/unit/config/ai_models/test_ai_model_registry.py", "py:tests/unit/config/ai_models/test_ai_model_providers.py"]

  [[feature.behavior]]
  id = "admin.models-registry.factory"
  says = "Each provider's registry fields are enough to build its client."
  priority = "P2"
  tests = ["py:tests/unit/utils/test_ai_model_factory_contract.py"]

[[feature]]
id = "admin.models-openai-catalog"
title = "OpenAI-compatible model list"
flow = "admin-settings"
what = "A client that speaks the OpenAI API lists the configured models, or reads one, at /v1/models and /api/v1/models."
routes = ["GET /api/v1/models", "GET /api/v1/models/{modelId}"]
code = [
  "backend/nodejs/apps/src/modules/configuration_manager/routes/openai_models.routes.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/controller/openai_models.controller.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/services/openaiModelList.ts",
  "backend/python/app/services/ai_models/openai_catalog.py",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.models-openai-catalog.scope"
  says = "Both routes need a signed-in caller with the config:read scope."
  priority = "P0"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "admin.models-openai-catalog.list"
  says = "The list has the OpenAI shape (object list, data with id, object model), with one entry per configured model name and no credential in it."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/openaiModelList.test.ts", "py:tests/unit/services/ai_models/test_openai_catalog.py"]

  [[feature.behavior]]
  id = "admin.models-openai-catalog.retrieve"
  says = "Retrieving a model whose id contains a percent sign or a slash works, and an unknown id answers 404 in the OpenAI error shape."
  priority = "P2"
  tests = ["node:tests/modules/configuration_manager/controller/openai_models.controller.test.ts", "py:tests/unit/services/ai_models/test_openai_catalog.py"]

