# Admin: workspace settings, AI models, SMTP and mail, health and metrics (flows admin-settings and notifications-mail).
# Every /configurationManager user route needs an administrator and a config:read or config:write scope, except the
# member routes listed in the behaviors below. Internal routes take a service token and are not user features.

[[feature]]
id = "admin.health"
title = "Health and service status"
flow = "admin-settings"
what = "Anyone can read the health of the Node API and its data stores, and of the Python services, without signing in. The Services page shows both."
routes = ["GET /api/v1/health", "GET /api/v1/health/services"]
pages = ["frontend/app/(main)/workspace/services/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/tokens_manager/routes/health.routes.ts",
  "frontend/app/(main)/workspace/services/**",
  "frontend/lib/store/services-health-store.ts",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.health.stores"
  says = "GET /api/v1/health always answers 200. Its status is healthy only when the cache, message broker, document store (MongoDB or PostgreSQL), graph store and vector store answer. etcd is checked only when it is the key-value store. Each store is named with its deployment type. A graph or vector store whose type is not yet known shows pending and does not make the answer unhealthy."
  priority = "P0"
  tests = ["node:tests/modules/tokens_manager/routes/health.routes.test.ts"]

  [[feature.behavior]]
  id = "admin.health.unhealthy"
  says = "A store that throws or reports false is shown as unhealthy and makes the whole answer unhealthy."
  priority = "P1"
  tests = ["node:tests/modules/tokens_manager/routes/health.routes.test.ts"]

  [[feature.behavior]]
  id = "admin.health.connector-refused"
  says = "While the connector service refuses connections, the graph and vector stores are reported as unknown, not unhealthy, and the whole answer is unhealthy."
  priority = "P1"
  tests = ["node:tests/modules/tokens_manager/routes/health.routes.test.ts"]

  [[feature.behavior]]
  id = "admin.health.local-storage-warning"
  says = "Local blob storage on several app replicas adds a warning to the answer while the status stays healthy."
  priority = "P2"
  tests = ["node:tests/modules/tokens_manager/routes/health.routes.test.ts"]

  [[feature.behavior]]
  id = "admin.health.services"
  says = "GET /api/v1/health/services always answers 200 and lists query, connector, indexing, docling and embedding (plus parsing and extraction when enabled); the overall status is healthy only when query and connector are healthy."
  priority = "P1"
  tests = ["node:tests/modules/tokens_manager/routes/health.routes.test.ts"]

  [[feature.behavior]]
  id = "admin.health.page"
  says = "The Services page lists each service with its status. Check now refreshes and shows a toast saying all services are healthy or some are unhealthy."
  priority = "P1"
  tests = ["e2e:tests/e2e/workspace/services.spec.ts"]

[[feature]]
id = "admin.vector-memory"
title = "Vector database memory check"
flow = "admin-settings"
what = "An administrator sees whether the vector database has the memory to keep search fast. The answer is advisory and never changes a service status."
routes = ["GET /api/v1/health/vector-db/memory"]
code = [
  "backend/nodejs/apps/src/modules/tokens_manager/routes/health.routes.ts",
  "frontend/app/(main)/workspace/services/vector-db-memory.tsx",
  "backend/python/app/services/vector_db/**",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.vector-memory.admin-only"
  says = "GET /api/v1/health/vector-db/memory needs an administrator with the config:read scope; a member gets 403."
  priority = "P0"
  kind = "security"
  tests = [
    "node:tests/modules/tokens_manager/routes/health.routes.test.ts",
    "py:tests/unit/test_connectors_main.py",
  ]

  [[feature.behavior]]
  id = "admin.vector-memory.report"
  says = "The answer has a status of ok, insufficient, unknown or unsupported, with the needed and available bytes when known. When the vector service fails or cannot be reached, the route answers 502 with status unknown."
  priority = "P2"
  tests = [
    "fe:app/(main)/workspace/services/__tests__/api.test.ts",
    "py:tests/unit/services/vector_db/test_memory_sizing.py",
  ]

  [[feature.behavior]]
  id = "admin.vector-memory.warning"
  says = "The Services page shows a warning only when the report is insufficient, and shows nothing when the report cannot be fetched."
  priority = "P2"
  tests = ["fe:app/(main)/workspace/services/__tests__/vector-db-memory.test.tsx"]

[[feature]]
id = "admin.smtp"
title = "SMTP settings"
flow = "notifications-mail"
what = "An administrator saves, reads, turns off and deletes the SMTP settings used to send invites and reset links on the Mail page. The settings are checked against the mail server before they are saved."
routes = ["* /api/v1/configurationManager/smtpConfig", "PUT /api/v1/configurationManager/smtpConfig/enabled", "GET /api/v1/configurationManager/smtpConfig/status"]
pages = ["frontend/app/(main)/workspace/mail/page.tsx"]
code = [
  "backend/nodejs/apps/src/modules/configuration_manager/controller/cm_controller.ts",
  "backend/nodejs/apps/src/modules/configuration_manager/utils/maskConfigSecrets.ts",
  "backend/nodejs/apps/src/modules/mail/utils/smtp-transport.ts",
  "frontend/app/(main)/workspace/mail/**",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.smtp.admin-only"
  says = "POST, GET and DELETE smtpConfig and PUT smtpConfig/enabled need an administrator with the config scope; a member gets 403."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/routes/cm_routes.guards.test.ts"]

  [[feature.behavior]]
  id = "admin.smtp.verify"
  says = "Saving settings that the mail server refuses (wrong login, nothing listening, any other refusal) answers 400 with a plain reason and stores nothing."
  priority = "P0"
  tests = ["node:tests/modules/mail/utils/smtp-transport.test.ts", "node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

  [[feature.behavior]]
  id = "admin.smtp.validation"
  says = "POST smtpConfig without host, port or fromEmail is rejected with 400."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/validators/validators.test.ts"]

  [[feature.behavior]]
  id = "admin.smtp.encrypted"
  says = "The settings are stored encrypted, and the mail service is told to reload them after a save, a delete and a change of the enabled switch."
  priority = "P1"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

  [[feature.behavior]]
  id = "admin.smtp.mask"
  says = "With HIDE_SECRET_CONFIG on, GET smtpConfig returns the host, username, from address and password as the placeholder unless the admin asks with reveal=true; a save that sends the placeholder back keeps the stored value."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/configuration_manager/utils/maskConfigSecrets.test.ts", "node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

  [[feature.behavior]]
  id = "admin.smtp.status"
  says = "GET smtpConfig/status answers only {configured: boolean}, true when host, port and from address are set and sending is not turned off, and is open to any signed-in member so invite screens know whether mail will work."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

  [[feature.behavior]]
  id = "admin.smtp.turn-off"
  says = "PUT smtpConfig/enabled keeps the settings while turning sending off or on, answers 404 when nothing is configured, and a later save does not turn sending back on."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/controller/cm_controller.test.ts"]

[[feature]]
id = "admin.mail-delivery"
title = "Mail delivery"
flow = "notifications-mail"
what = "The mail service sends templated emails (invites, password resets, verification) from the SMTP settings, either on request from another service or from a queue with retries. An administrator is notified when delivery keeps failing."
routes = ["POST /api/v1/mail/emails/sendEmail", "POST /api/v1/mail/updateSmtpConfig"]
code = [
  "backend/nodejs/apps/src/modules/mail/**",
]
status = "draft"

  [[feature.behavior]]
  id = "admin.mail-delivery.service-token"
  says = "Both mail routes accept only a scoped service token (send-mail for sendEmail, fetch-config for updateSmtpConfig); a user session is refused."
  priority = "P0"
  kind = "security"
  tests = []

  [[feature.behavior]]
  id = "admin.mail-delivery.unconfigured"
  says = "sendEmail answers 400 when SMTP host, port or from address is missing, and 503 when the stored settings cannot be read."
  priority = "P0"
  tests = [
    "node:tests/modules/mail/middlewares/checkSmtpConfig.test.ts",
    "node:tests/modules/mail/controller/mail.controller.test.ts",
  ]

  [[feature.behavior]]
  id = "admin.mail-delivery.failure"
  says = "A send the SMTP server refuses answers 502 with a plain reason for the admin, and an unexpected failure answers 500 without the library's text."
  priority = "P1"
  tests = ["node:tests/modules/mail/controller/mail.controller.test.ts"]

  [[feature.behavior]]
  id = "admin.mail-delivery.reload"
  says = "updateSmtpConfig makes the running mail service use the newly saved settings without a restart."
  priority = "P1"
  tests = ["node:tests/modules/configuration_manager/services/updateConfig.reloadResponses.test.ts"]

  [[feature.behavior]]
  id = "admin.mail-delivery.templates"
  says = "Each email template renders with the product brand and the data it is given."
  priority = "P2"
  tests = ["node:tests/modules/mail/utils/emailTemplates.test.ts", "node:tests/modules/mail/utils/emailTemplates.brand.test.ts"]

  [[feature.behavior]]
  id = "admin.mail-delivery.attachments"
  says = "An attachment can never make the mail library read a local file or fetch a URL."
  priority = "P0"
  kind = "security"
  tests = ["node:tests/modules/mail/utils/smtp-transport.test.ts"]

  [[feature.behavior]]
  id = "admin.mail-delivery.queue-retry"
  says = "The queue consumer makes up to four attempts per job, with backoff and inside a time budget. A permanent failure, an indeterminate result or a paused SMTP server is not retried."
  priority = "P1"
  tests = ["node:tests/modules/mail/services/mail.consumer.test.ts"]

  [[feature.behavior]]
  id = "admin.mail-delivery.failure-notice"
  says = "On a delivery failure, administrators get a notification right away. Further failures in the next five minutes are counted, and one summary with the count follows when the window closes."
  priority = "P1"
  tests = ["node:tests/modules/mail/services/mail.consumer.test.ts"]

[[feature]]
id = "admin.platform-settings"
