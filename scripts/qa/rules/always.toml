# Rules outside any model's control: the floor that always runs, the files
# that force full runs, and the selection profiles.

# More changed files than this is treated as "everything changed".
max_files = 300

# Files that count as tests: each must belong to a suite or an [[unowned]] entry.
test_files = ["**/test_*.py", "**/*_test.py", "**/integration_test_*.py", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/*.itest.ts", "**/*.test.mjs"]

matrix_entries = ["kafka", "redis-streams", "qdrant", "opensearch", "redis", "neo4j", "arangodb", "etcd"]

# Tracked files: a change runs the named suites in full ("*" = every suite).
[[full_run]]
paths = [".github/workflows/**", "scripts/qa/**", "scripts/*/qa/**"]
suites = "*"

[[full_run]]
paths = ["backend/python/pyproject.toml", "backend/python/uv.lock", "backend/python/pytest.ini", "backend/python/tests/conftest.py", "backend/python/.coveragerc"]
suites = ["py-unit", "py-integration", "py-evals"]

[[full_run]]
paths = ["backend/nodejs/apps/package.json", "backend/nodejs/apps/package-lock.json", "backend/nodejs/apps/.mocharc.yaml", "backend/nodejs/apps/tsconfig*.json", "backend/nodejs/apps/tests/helpers/**"]
suites = ["node-unit"]

[[full_run]]
paths = ["frontend/package.json", "frontend/package-lock.json", "frontend/vitest.config.ts", "frontend/tsconfig*.json"]
suites = ["fe-unit", "electron"]

[[full_run]]
paths = ["frontend/playwright.config.ts", "frontend/tests/e2e/fixtures/**", "frontend/tests/e2e/helpers/**"]
suites = ["e2e"]

[[full_run]]
paths = ["Dockerfile", "Dockerfile.base", "deployment/docker-compose/docker-compose.integration.*.yml", "integration-tests/conftest.py", "integration-tests/helper/**", "integration-tests/pytest.ini", "integration-tests/pyproject.toml", "integration-tests/stack/**"]
suites = ["it-stack", "it-helpers"]

[branch_overrides]
"sync-latest-oss*" = "full"
"release/*" = "conservative"

# planner        "default" uses QA_PLANNER (or claude_code); "none" skips the model
# import_depth   reverse-import hops followed from a changed module
# graph_db       graph DB(s) the integration stack runs against
# integration    false defers integration tests to a later run (listed, not run)
# extra_minutes  budget for model additions; the floor is never trimmed
[profiles.fast]
planner = "none"
import_depth = 1
graph_db = "neo4j"
integration = false
extra_minutes = 0

[profiles.standard]
planner = "default"
import_depth = 2
graph_db = "neo4j"
integration = true
extra_minutes = 60

[profiles.conservative]
planner = "default"
import_depth = 4
graph_db = "both"
integration = true
extra_minutes = 180

[profiles.full]
planner = "none"
import_depth = 99
graph_db = "both"
integration = true
extra_minutes = 0
full = true

# Suites with `profiles = ["weekly"]` run only here, and this profile runs only the suites it lists.
[profiles.weekly]
planner = "none"
import_depth = 99
graph_db = "neo4j"
integration = true
extra_minutes = 0
full = true
suites = ["it-weekly"]

# Stack variants: a test that needs `stack:<name>` (through suites.toml marker_needs)
# runs in its own stack job. Hooks read the name from QA_STACK_VARIANT.
[variants.perf]
description = "stack for the performance smoke"

[variants.upgrade]
description = "stack that boots the previous release, then the head image, on the same volumes"
upgrade_from = "previous-release"
before_marker = "upgrade_before"

# Always-run selections beyond changed tests (those always run).
[[always]]
id = "e2e-smoke"
suite = "e2e"
grep = "@smoke"
when = ["frontend/**", "backend/nodejs/apps/src/**"]

[[always]]
id = "scripts-unittest"
suite = "scripts"
when = ["scripts/**"]

# Seconds assumed per selected unit when history has no measurement.
[default_seconds]
unittest = 1
pytest = 3
mocha = 3
vitest = 3
npm-script = 120
playwright = 30
it-pytest = 90

# Paths or modules a reviewer must look at twice. Overlays add entries.
[[review_risk]]
id = "migrations"
title = "Database or config migrations"
paths = ["backend/python/app/**/migrations/**", "backend/nodejs/apps/src/**/migrations/**"]

[[review_risk]]
id = "auth"
title = "Authentication and permission paths"
modules = ["auth", "oauth", "user-management"]

# Test files no suite runs, with what runs them instead ("not run" is a valid answer).
[[unowned]]
paths = ["frontend/tests/e2e/responsive/**/*visual.spec.ts"]
reason = "run by the nightly visual diff with E2E_VISUAL=true; the e2e suite's project does not exist without it"

[[unowned]]
paths = ["backend/db/tests/**"]
reason = "run by the db-migrations workflow"

[[unowned]]
paths = ["backend/nodejs/apps/tests/**/*.itest.ts"]
reason = "run by npm run test:pg and test:pg-services against a database"

[[unowned]]
paths = ["backend/python/app/scripts/*_integration_test.py"]
reason = "manual script, not a test"

[[unowned]]
paths = ["deployment/helm/tests/**"]
reason = "run by the helm-chart workflow"

[[unowned]]
paths = ["frontend/**/*.node.test.mjs", "frontend/scripts/*.test.mjs"]
reason = "node test runner scripts run directly with node --test"

[[unowned]]
paths = ["frontend/tests/text-fragments/**"]
reason = "text-fragment browser tests run by hand"

[[unowned]]
paths = ["integration-tests/examples/**"]
reason = "examples, not run"

[[unowned]]
paths = ["integration-tests/helper/**"]
reason = "run by the integration-suite-guards workflow"

[[unowned]]
paths = ["integration-tests/sdk_tests/handwritten/**"]
reason = "run by the sdk-tests workflow"

[[unowned]]
paths = ["loadtest/tests/**"]
reason = "load-test harness, run by hand"
