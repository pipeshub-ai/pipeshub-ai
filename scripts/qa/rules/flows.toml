# Flows: the user journeys a release must not break. Triggers say which changes
# touch a flow; tests say what proves it still works.
#
# id        the name reports and reviews use
# title     what a person calls it
# priority  "P0" | "P1" | "P2"
# critical  true marks a P0 flow whose failure blocks everything (default false)
# modules   module ids the flow spans (scripts/qa/rules/modules.toml)
# triggers  globs over source files that put the flow in scope
# tests     globs over test file paths (any suite)
# markers   integration-tests markers; selects every it-stack test carrying one.
#           Prefer explicit tests: a marker pulls in every test that carries it.
#
# An overlay may repeat a flow id to add triggers, tests, markers and modules;
# it cannot change the priority or critical flag.

[[flow]]
id = "edition-seams"
title = "Edition seams"
priority = "P0"
critical = true
modules = ["edition-wiring"]
triggers = ["backend/python/app/edition_*.py", "backend/nodejs/apps/src/config.ts", "backend/nodejs/apps/src/edition.ts", "frontend/config-pages.ts"]
tests = ["backend/python/tests/unit/test_edition_*.py"]

[[flow]]
id = "signup-onboarding"
title = "Sign-up and onboarding"
priority = "P0"
modules = ["user-management", "messaging", "frontend"]
triggers = ["backend/nodejs/apps/src/modules/user_management/**org*", "backend/nodejs/apps/src/libs/services/outbox/**", "backend/python/app/services/messaging/kafka/handlers/entity.py", "frontend/app/(public)/sign-up/**", "frontend/app/(main)/onboarding/**"]
tests = ["frontend/tests/e2e/first-run/**", "backend/python/tests/unit/services/messaging/test_entity_handler*.py"]

