# Modules: the product areas the registry knows. A file belongs to the first
# module (in load order, overlays after this file) whose `paths` match it, so a
# more specific module goes before a broader one.
#
# id      the name flows and impact rules refer to
# title   what a person calls it
# paths   globs over source and test files (suite mirrors are listed explicitly)

[[module]]
id = "edition-wiring"
title = "Edition wiring"
paths = ["backend/python/app/edition_*.py", "backend/python/tests/unit/test_edition_*.py", "backend/nodejs/apps/src/config.ts", "backend/nodejs/apps/src/edition.ts", "frontend/config-pages.ts"]

