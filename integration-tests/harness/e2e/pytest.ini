# The options-matrix runner (QA-6) runs on its own: its own rootdir keeps integration-tests/conftest.py out.
[pytest]
testpaths = .
addopts = -p no:cacheprovider -p no:randomly -m "not slow and not measure"
markers =
    stack(id): the row's stack profile (04 §4.1)
    slow: waits out a real bound of the product (MCP-E2E: the capability re-checks, about 11 minutes); run with -m slow
    measure: a measurement written to a report, not a gate (MCP-E2E LZ); run with -m measure
    mcp_hub: an MCP-E2E module: its own stack with the MCP hub on (run.sh E2E_MCP_HUB=1); run with --mcp-hub
