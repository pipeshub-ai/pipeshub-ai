[tool.setuptools.packages.find]
where = ["."]
include = ["helper", "connectors", "connectors.*", "messaging*", "response-validation*", "validation"]

[tool.setuptools.package-data]
validation = ["schemas/*.yaml", "schemas/edges/*.yaml"]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
etcd3 = { git = "https://github.com/kragniz/python-etcd3.git", rev = "e58a899579ba416449c4e225b61f039457c8072a" }
