[project]
name = "pipeshub-integration-tests"
version = "0.2.0"
description = "Full lifecycle integration test suite for Pipeshub connectors against test.pipeshub.com and remote Neo4j."
requires-python = ">=3.12"
dependencies = [
  # The backend code these suites import. Every package it needs, at the versions it
  # pins, comes from backend/python/pyproject.toml; do not pin them again here.
  "ai-service",
  "pytest>=7.0",
  "pytest-asyncio>=0.21.0",
  "pytest-order>=1.1.0",
  "pytest-timeout>=2.2.0",
  "pytest-xdist>=3.5.0",
  "filelock>=3.13.0",
  "bcrypt>=4.0.0",
  "fastmcp==4.1.3",
  "psycopg[binary]>=3.1",
  "PyMySQL>=1.1",
  "pymongo>=4.5.0",
  # CPU builds, as in the image (TORCH_VERSION and TORCHVISION_VERSION in Dockerfile.base);
  # the PyPI wheels pull about 4 GB of CUDA libraries on Linux.
  "torch==2.12.0",
  "torchvision==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["helper", "connectors", "connectors.*", "messaging*", "response-validation*", "validation"]

[tool.setuptools.package-data]
validation = ["schemas/*.yaml", "schemas/edges/*.yaml"]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
ai-service = { path = "../backend/python", editable = true }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Same as backend/python/pyproject.toml: talon requires cchardet, which has no wheels
# for Python 3.12+ and does not build from source.
[tool.uv]
exclude-dependencies = ["cchardet"]
# torch has no Emscripten wheels, and the backend's mariadb[binary] none for Python 3.15
# yet. CI runs 3.12.
environments = ["python_full_version < '3.15' and sys_platform != 'emscripten'"]
