# Re-run of blog-dev after the agent-loop fixes (bounded search results,
# abandonment recovery, evidence-aware compaction, low-coverage fetch gate,
# turn cap 15 -> 25). Same corpus, same indexes, same models, same judges.
#
# Only the systems the comparison turns on are re-run: `pipeshub` is what
# changed, `oracle` is the unchanged control that says whether anything else
# drifted, and the strongest tuned baseline is the one the headline claim is
# measured against. The other 15 systems are read from the blog-dev run.
run_name: blog-dev-fixed
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  # Every gold article, and all but ~12 of ~12.5k articles, must reach Qdrant.
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: "OpenAI API pricing, standard tier, effective 2026-07-30"
systems:
  - kind: oracle
    concurrency: 8
  - {kind: advanced_rag, label: adv-std-hybrid-decompose-rerank-s2b, concurrency: 2, options: {index: standard, retrieval: hybrid, transform: decomposition, rerank: true, small_to_big: 3}}
  - kind: pipeshub
    concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
