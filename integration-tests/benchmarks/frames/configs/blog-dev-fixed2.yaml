# Second re-run: the low-coverage fetch gate from blog-dev-fixed is REVERTED.
# It fired on 195/200 questions and hijacked the final answer (the model
# reported on the fetch instead of answering), costing 16.5pp. What remains:
# bounded search results, abandonment recovery, evidence-aware compaction,
# confidence cap, turn cap 15 -> 25.
#
# oracle is the in-run control. The tuned baseline is dropped — it is measured
# twice already (91.0, 88.0), which is the run-to-run noise floor to read any
# delta against.
run_name: blog-dev-fixed2
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  # Every gold article, and all but ~12 of ~12.5k articles, must reach Qdrant.
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: "OpenAI API pricing, standard tier, effective 2026-07-30"
systems:
  - kind: oracle
    concurrency: 8
  - kind: pipeshub
    concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
