# Wiring check for blog-dev.yaml: 10 dev questions, gold-only corpus built for
# them, one variant per code path. Its margin says nothing about quality.
run_name: blog-smoke
dataset:
  split: dev
  limit: 10
corpus:
  tier: G
  scope: selected_questions
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: "OpenAI API pricing, standard tier, effective 2026-07-30"
systems:
  - kind: closed_book
    concurrency: 4
  - kind: naive_rag
    concurrency: 4
  - {kind: advanced_rag, label: adv-hybrid-expand, concurrency: 4, options: {retrieval: hybrid, transform: expansion}}
  - {kind: advanced_rag, label: adv-hybrid-decompose-rerank-s2b, concurrency: 2, options: {retrieval: hybrid, transform: decomposition, rerank: true, small_to_big: 2}}
  - {kind: advanced_rag, label: adv-std-hybrid-expand, concurrency: 4, options: {index: standard, retrieval: hybrid, transform: expansion}}
  - kind: pipeshub
    concurrency: 2
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_error_rate: 0.3
  min_items_for_breaker: 5
