# PipesHub's agent loop on all 824 FRAMES questions, on the same index and
# with the same answering model, embeddings, judges and price table as
# full-rag.yaml and full-rag-rerank.yaml, so its row joins that board. The oracle is the in-run
# control. PipesHub answers in enterprise-search mode (`internal_search`),
# whose instructions ground it in the knowledge base; every correct answer is
# checked against the blocks it was shown.
#
# PipesHub stack env (docker-compose.benchmark.override.yml):
#   PIPESHUB_ENABLE_CODE_EXECUTION=false
#   PIPESHUB_ENABLE_SKILLS=false
#   PIPESHUB_AGENT_DISABLED_TOOLSETS unset - the calculator is deliberately ON.
#   ENABLE_USER_CONTEXT platform flag off.
run_name: full-pipeshub
dataset:
  split: all
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  # Every gold article, and all but ~12 of ~12.5k articles, must reach Qdrant.
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
  # The workspace "Custom Instructions" setting, which any admin can set for
  # search mode. Added after hand review found 13 answers that filled one
  # linking fact from the model's memory; setup-pipeshub writes it.
  custom_instructions: "DO NOT ANSWER QUESTIONS FROM YOUR TRAINING MEMORY"
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: "OpenAI API pricing, standard tier, effective 2026-07-30"
systems:
  - kind: oracle
    concurrency: 12
  - kind: pipeshub
    concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 600
  max_error_rate: 0.2
