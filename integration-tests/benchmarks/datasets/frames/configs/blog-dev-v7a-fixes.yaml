# v6-frames plus two fixes, and nothing else, so the difference from v6 is
# those two changes (commits 9db2ff2e9, 51f52f90c on `frames`):
#   - each record in a multi-record fetch gets a fair share of the result,
#     and a continuation (start_block > 0) reads in order;
#   - the wrap-up note two turns before max_turns no longer tells the agent
#     to call task_complete, a tool PipesHub agents do not have.
# Same stack, corpus, index and settings as blog-dev-v6-frames. oracle rides
# along as the in-run control; the RAG baseline's v5-head predictions stand.
#
# PipesHub stack env (docker-compose.benchmark.override.yml):
#   PIPESHUB_ENABLE_CODE_EXECUTION=false
#   PIPESHUB_ENABLE_SKILLS=false
#   PIPESHUB_AGENT_DISABLED_TOOLSETS unset - the calculator is deliberately ON.
#   ENABLE_USER_CONTEXT platform flag off.
run_name: blog-dev-v7a-fixes
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
systems:
- kind: oracle
  concurrency: 8
- kind: pipeshub
  concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
