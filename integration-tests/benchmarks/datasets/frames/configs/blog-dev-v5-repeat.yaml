# Pure repeat of blog-dev-v5-head's PipesHub measurement: same image, same
# flags, same corpus, same judges, nothing changed. The point is to find out
# whether 85.5% is where PipesHub actually sits or where one run happened to
# land — every pairwise McNemar so far (p=0.80, 0.21, 0.08) says the apparent
# 89.5 -> 88.5 -> 85.5 slide is not distinguishable from noise.
#
# oracle rides along as the control: it shares the answerer and judges but has
# no retrieval, so if it moves too, the drift is not PipesHub's.
#
# Caveat on conditions: the head run competed with 17 other systems on a host
# at 94% CPU; this one has the machine largely to itself (memory is still
# tight). Lighter load is itself a difference from head, so a higher score
# here cannot cleanly separate noise from starvation relief.
#
# PipesHub stack env: code execution off, skills off, calculator ON,
# ENABLE_USER_CONTEXT platform flag off.
run_name: blog-dev-v5-repeat
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
systems:
- kind: oracle
  concurrency: 8
- kind: pipeshub
  concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
