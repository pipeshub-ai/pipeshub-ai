# Open WebUI v0.11.4 (slim) on the same corpus, answer model, embedding model
# and judges as blog-dev-v7d-tables, so its row compares directly with
# PipesHub v7d and the RAG baseline. Parity contract and deviations: the
# "FRAMES: other RAG systems" plan.
#
# Open WebUI's own settings live in benchmarks/competitors/openwebui/
# docker-compose.yml: pgvector store, native hybrid search (BM25 weight 0.5),
# RAG_TOP_K=50, no reranker, 1,000-char chunks with 100 overlap, Azure
# text-embedding-3-small, Azure gpt-5.6-luna through the Responses API with
# reasoning effort high sent per request, and no query generation, titles,
# tags or follow-ups. Bring it up with that directory's up.sh and export
# OPENWEBUI_API_KEY. oracle rides along as the in-run control.
run_name: blog-dev-openwebui
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
systems:
- kind: oracle
  concurrency: 8
- kind: openwebui
  concurrency: 3
  options:
    base_url: http://localhost:8080
    api_key_env: OPENWEBUI_API_KEY
    upload_workers: 8
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
