# Open WebUI v0.11.4 at its strongest configuration on the dev split: a chat
# with a knowledge base attached (native tool calling: up-front retrieval plus
# the builtin knowledge tools the model can call repeatedly), retrieval query
# generation on, and the RAG baselines' cross-encoder as its external reranker
# (100 candidates reranked to 50). Same corpus, answer model, embedding model
# and judges as the PipesHub and RAG runs.
#
# Open WebUI's own settings live in benchmarks/competitors/openwebui/
# docker-compose.yml: pgvector store, native hybrid search (BM25 weight 0.5),
# 1,000-char chunks with 100 overlap, Azure text-embedding-3-small, and the
# answer model through the Responses API at high reasoning effort. Bring it up
# with that directory's up.sh, start the shared reranker
# (python -m benchmarks.harness.systems.rag.rerank_server --port 8787) and
# export OPENWEBUI_API_KEY. The oracle rides along as the in-run control.
#
# Grounded variant: PipesHub's enterprise-search grounding instruction ("answer
# only from the knowledge base; say so when the answer isn't there") added to
# the system's prompt, the same instruction PipesHub itself answers under.
run_name: blog-dev-openwebui-strongest-grounded
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
systems:
- kind: oracle
  concurrency: 8
- kind: openwebui
  label: openwebui-strongest-grounded
  # Each fallback from native hybrid search loads the whole collection
  # (~300K chunks) into memory; more overlap than this runs out of RAM.
  concurrency: 2
  options:
    base_url: http://localhost:8080
    api_key_env: OPENWEBUI_API_KEY
    query_generation: true
    ui_chat: true
    rag_template: |-
      ### Task:
      Respond to the user query using the provided context, incorporating inline citations in the format [id] **only when the <source> tag includes an explicit id attribute** (e.g., <source id="1">).

      ### Guidelines:
      - Answer ONLY from the provided context. Do not use your own training knowledge to answer factual questions. If the answer is not present in the retrieved context, say so explicitly rather than guessing.
      - If you don't know the answer, clearly state that.
      - If uncertain, ask the user for clarification.
      - Respond in the same language as the user's query.
      - If the context is unreadable or of poor quality, inform the user and provide the best possible answer.
      - **Only include inline citations using [id] (e.g., [1], [2]) when the <source> tag includes an id attribute.**
      - Do not cite if the <source> tag does not contain an id attribute.
      - Do not use XML tags in your response.
      - Ensure citations are concise and directly related to the information provided.

      ### Example of Citation:
      If the user asks about a specific topic and the information is found in a source with a provided id attribute, the response should include the citation like in the following example:
      * "According to the study, the proposed method increases efficiency by 20% [1]."

      ### Output:
      Provide a clear and direct response to the user's query, including inline citations in the format [id] only when the <source> tag with id attribute is present in the context.

      <context>
      {{CONTEXT}}
      </context>
    reranker:
      url: http://host.docker.internal:8787/v1/rerank
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      candidates: 100
    upload_workers: 8
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
