# RAG-approaches comparison, dev split (200 questions). Every system uses the
# same answering model at the same reasoning effort and reads the same PipesHub
# index (same chunks, same embedding model); cost comes from one pinned price
# table applied to per-call token counts. Pick the best advanced_rag configs
# here, then rerun only those plus naive_rag and pipeshub on the held-out split.
# The `*-std` systems read the baselines' own standard-chunked collection instead.
#
# PipesHub stack env (docker-compose.benchmark.override.yml):
#   PIPESHUB_ENABLE_CODE_EXECUTION=false
#   PIPESHUB_AGENT_DISABLED_TOOLSETS=calculator,date_calculator,image_generator,artifacts
#   PIPESHUB_AGENT_MAX_TURNS unset (15) — set it and relabel `pipeshub` for the turn sweep.
run_name: blog-dev
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  # Every gold article, and all but ~12 of ~12.5k articles, must reach Qdrant.
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: "OpenAI API pricing, standard tier, effective 2026-07-30"
systems:
  - kind: closed_book
    concurrency: 8
  - kind: oracle
    concurrency: 8
  - kind: naive_rag
    concurrency: 6
    options: {top_k: 50}
  - {kind: advanced_rag, label: adv-sparse, concurrency: 6, options: {retrieval: sparse}}
  - {kind: advanced_rag, label: adv-hybrid, concurrency: 6, options: {retrieval: hybrid}}
  - {kind: advanced_rag, label: adv-hybrid-rerank, concurrency: 2, options: {retrieval: hybrid, rerank: true}}
  - {kind: advanced_rag, label: adv-dense-expand, concurrency: 6, options: {retrieval: dense, transform: expansion}}
  - {kind: advanced_rag, label: adv-hybrid-expand, concurrency: 6, options: {retrieval: hybrid, transform: expansion}}
  - {kind: advanced_rag, label: adv-hybrid-expand-rerank, concurrency: 2, options: {retrieval: hybrid, transform: expansion, rerank: true}}
  - {kind: advanced_rag, label: adv-dense-decompose, concurrency: 6, options: {retrieval: dense, transform: decomposition}}
  - {kind: advanced_rag, label: adv-hybrid-decompose, concurrency: 6, options: {retrieval: hybrid, transform: decomposition}}
  - {kind: advanced_rag, label: adv-hybrid-decompose-rerank, concurrency: 2, options: {retrieval: hybrid, transform: decomposition, rerank: true}}
  - {kind: advanced_rag, label: adv-hybrid-decompose-rerank-s2b, concurrency: 2, options: {retrieval: hybrid, transform: decomposition, rerank: true, small_to_big: 3}}
  # Same pipelines on the baselines' own standard-chunked collection (512/64,
  # BM25 with IDF): checks the result doesn't hinge on PipesHub's chunker.
  - {kind: naive_rag, label: naive-std, concurrency: 6, options: {index: standard}}
  - {kind: advanced_rag, label: adv-std-hybrid, concurrency: 6, options: {index: standard, retrieval: hybrid}}
  - {kind: advanced_rag, label: adv-std-hybrid-expand-rerank, concurrency: 2, options: {index: standard, retrieval: hybrid, transform: expansion, rerank: true}}
  - {kind: advanced_rag, label: adv-std-hybrid-decompose-rerank-s2b, concurrency: 2, options: {index: standard, retrieval: hybrid, transform: decomposition, rerank: true, small_to_big: 3}}
  - kind: pipeshub
    concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
