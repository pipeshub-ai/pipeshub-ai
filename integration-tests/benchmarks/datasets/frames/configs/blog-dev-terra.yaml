# Same three systems as blog-dev-v5-head, answered by gpt-5.6-terra instead of
# gpt-5.6-luna. Terra is the more capable and ~10x more expensive model, so this
# measures what the extra spend buys on FRAMES.
#
# Everything else is held fixed: same corpus, same embeddings, same judges, same
# PipesHub image and flags. The answerer is set explicitly rather than relying on
# terra now being PipesHub's default, so oracle and the RAG baseline use the same
# model as PipesHub.
#
# Terra pricing is 10x luna's at identical structure (same 272k long-context
# threshold, same 2.0x input / 1.5x output multipliers). Crossing the threshold
# re-prices the WHOLE call, which matters here: PipesHub averages ~215k input
# tokens per question, close enough to 272k that some questions will bill at the
# long-context rate.
#
# PipesHub stack env: code execution off, skills off, calculator ON,
# ENABLE_USER_CONTEXT platform flag off.
run_name: blog-dev-terra
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-terra
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
  gpt-5.6-terra:
    input_per_mtok: 2.0
    cached_input_per_mtok: 0.2
    output_per_mtok: 12.0
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: eesel.ai and pricepertoken.com, standard tier, retrieved 2026-09-22
systems:
- kind: oracle
  concurrency: 8
- kind: advanced_rag
  label: adv-std-hybrid-decompose-rerank-s2b
  concurrency: 2
  options:
    index: standard
    retrieval: hybrid
    transform: decomposition
    rerank: true
    small_to_big: 3
- kind: pipeshub
  concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
