# PipesHub built from the `frames` branch, on the same stack, corpus, index and
# settings as blog-dev-v5-head, so the two runs differ only in PipesHub's code:
# IDF on the BM25 leg, one relevance-ordered context pipeline, relevance-ranked
# block budget, fan-out rank fusion, each block shown once (a full fetch
# supersedes search copies), and fetch sized to the tool-result cap. The Labs
# reranker stays off (its default), so it is not part of this comparison.
#
# The RAG baseline is not re-run: nothing it depends on changed, and its
# v5-head predictions stand. oracle rides along as the in-run control.
#
# PipesHub stack env (docker-compose.benchmark.override.yml):
#   PIPESHUB_ENABLE_CODE_EXECUTION=false
#   PIPESHUB_ENABLE_SKILLS=false
#   PIPESHUB_AGENT_DISABLED_TOOLSETS unset - the calculator is deliberately ON.
#   ENABLE_USER_CONTEXT platform flag off.
run_name: blog-dev-v6-frames
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
systems:
- kind: oracle
  concurrency: 8
- kind: pipeshub
  concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
