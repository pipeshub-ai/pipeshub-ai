# Every RAG technique on all 824 FRAMES questions, grounded (part A of 3):
# the controls and every pipeline without a cross-encoder reranker. Parts B
# (full-rag-rerank.yaml) and C (full-rag-s2b.yaml) hold the rest; they run side by side
# on the same stack because systems within one run are asked one after another.
#
# RAG baselines answer with `rag-answer-v2` ("answer ONLY from the sources"),
# and every correct answer is checked against the evidence it was shown.
# Same answering model, embeddings, judges and price table as the PipesHub
# run (full-pipeshub.yaml) and the same index: PipesHub's points from the
# rebased `frames` build. The `-std` rows read the baselines' own 512/64
# collection, so no result hinges on PipesHub's chunker.
run_name: full-rag
dataset:
  split: all
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  # Every gold article, and all but ~12 of ~12.5k articles, must reach Qdrant.
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.20
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.20
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: "OpenAI API pricing, standard tier, effective 2026-07-30"
systems:
  - kind: closed_book
    concurrency: 12
  - kind: oracle
    concurrency: 12
  - kind: naive_rag
    concurrency: 10
    options: {top_k: 50}
  - {kind: advanced_rag, label: adv-sparse, concurrency: 10, options: {retrieval: sparse}}
  - {kind: advanced_rag, label: adv-hybrid, concurrency: 10, options: {retrieval: hybrid}}
  - {kind: advanced_rag, label: adv-dense-expand, concurrency: 10, options: {retrieval: dense, transform: expansion}}
  - {kind: advanced_rag, label: adv-hybrid-expand, concurrency: 10, options: {retrieval: hybrid, transform: expansion}}
  - {kind: advanced_rag, label: adv-dense-decompose, concurrency: 10, options: {retrieval: dense, transform: decomposition}}
  - {kind: advanced_rag, label: adv-hybrid-decompose, concurrency: 10, options: {retrieval: hybrid, transform: decomposition}}
  - {kind: naive_rag, label: naive-std, concurrency: 10, options: {index: standard}}
  - {kind: advanced_rag, label: adv-std-hybrid, concurrency: 10, options: {index: standard, retrieval: hybrid}}
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 600
  max_error_rate: 0.2
