# blog-dev-v7a-fixes plus one fix, so the difference from v7a is exactly that
# fix (commit c34ed126f on `frames`, built as 661e5ff0d = 51f52f90c + it):
# the wrap-up note two turns before max_turns rides on the latest tool
# result's loop footer instead of an injected user message, which Azure
# OpenAI's content filter rejected (the agent then answered with a canned
# refusal). Same stack, corpus, index and settings otherwise.
#
# PipesHub stack env (docker-compose.benchmark.override.yml):
#   PIPESHUB_ENABLE_CODE_EXECUTION=false
#   PIPESHUB_ENABLE_SKILLS=false
#   PIPESHUB_AGENT_DISABLED_TOOLSETS unset - the calculator is deliberately ON.
#   ENABLE_USER_CONTEXT platform flag off.
run_name: blog-dev-v7b-footer
dataset:
  split: dev
corpus:
  tier: GD
  scope: all
  distractor_count: 10000
pipeshub:
  index_timeout_s: 172800
  stream_timeout_s: 1800
  min_gold_indexed_ratio: 1.0
  min_indexed_ratio: 0.999
answerer:
  model: gpt-5.6-luna
  provider: azureOpenAI
  is_reasoning: true
  reasoning_effort: high
embedding:
  model: text-embedding-3-small
  provider: azureOpenAI
pricing:
  gpt-5.6-luna:
    input_per_mtok: 0.2
    cached_input_per_mtok: 0.02
    output_per_mtok: 1.2
    long_context_threshold: 272000
    long_context_input_multiplier: 2.0
    long_context_output_multiplier: 1.5
    source: OpenAI API pricing, standard tier, effective 2026-07-30
systems:
- kind: oracle
  concurrency: 8
- kind: pipeshub
  concurrency: 3
grading:
  primary:
    model: claude-sonnet-5
    provider: anthropic
  secondary:
    model: gemini-3.8-flash
    provider: gemini
limits:
  max_cost_usd: 300
  max_error_rate: 0.2
