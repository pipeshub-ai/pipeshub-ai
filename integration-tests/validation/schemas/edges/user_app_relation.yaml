name: user_app_relation_edge
description: UserAppRelation edge document (matches Arango userAppRelation collection).
fields:
  syncState:
    required: false
    type: string
    enum:
      - NOT_STARTED
      - IN_PROGRESS
      - PAUSED
      - COMPLETED
      - FAILED
  lastSyncUpdate:
    required: false
    type: integer
  sourceUserId:
    required: false
    type: string
  # Written on every user-app edge since #3115: true for someone who reached the app
  # only through a share, false for an app member.
  isExternalUser:
    required: false
    type: boolean
  # The collaborator reaper's mark (two passes): set when no grant keeps a flagged edge, cleared by a write of the membership.
  reapMarkedAt:
    required: false
    type: integer
  # PostgreSQL only: the id of the reaper transaction that marked the edge (its horizon).
  reapMarkXid:
    required: false
    type: string
  createdAtTimestamp:
    required: false
    type: integer
  updatedAtTimestamp:
    required: false
    type: integer
