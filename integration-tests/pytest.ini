[pytest]
minversion = 7.0

# Only look for tests inside this integration-tests package.
# `storage` switches the server's storage backend for the whole deployment, so
# it cannot share a run with suites that are uploading files. It is excluded
# from the shards and runs on its own, last, in the nightly (-m storage).
testpaths =
    unit
    permissions
    cleanup
    security
    retrieval
    messaging
    connectors
    storage
    response-validation
    parsers
# The published MCP package driven against this stack. Marked `integration`, so
# the core shard picks it up without the shard lists needing to know about it.
    mcp_package
# Skipped unless selected with -m resilience: it restarts shared services.
    resilience

# Match our test file naming patterns
python_files = integration_test_*.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    retrieval: search quality scenarios (what a query actually returns)
    permissions: what a non-admin member can see, for each way content is shared with them
    security: credential change and session invalidation scenarios
    cleanup: cross-store cleanup scenarios (deletion clears graph, vector, blob and Mongo)
    integration: marks tests as integration tests (require external services)
    unit: marks fast helper unit tests (no external services)
    asyncio: marks tests as asyncio-based tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    s3: marks tests specific to S3 connector
    postgres: marks tests specific to PostgreSQL connector
    mariadb: marks tests specific to MariaDB connector
    nextcloud: marks tests specific to the Nextcloud connector
    bookstack: marks tests specific to the BookStack connector
    zammad: marks tests specific to the Zammad connector
    minio: marks tests specific to MinIO connector
    sharepoint: marks tests specific to SharePoint Online connector
    gcs: marks tests specific to GCS connector
    azure_blob: marks tests specific to Azure Blob connector
    azure_files: marks tests specific to Azure Files connector
    confluence: marks tests specific to Confluence connector
    jira: marks tests specific to Jira connector
    linear: marks tests specific to Linear connector
    github_teams: marks tests specific to GitHub Teams connector
    github: marks tests specific to the GitHub (personal) connector
    gitlab: marks tests specific to GitLab connector
    google_drive_workspace: marks tests specific to Google Drive Workspace connector
    google_drive_individual: marks tests specific to Google Drive personal (individual) connector
    notion: marks tests specific to Notion connector
    web: marks tests specific to the Web (crawler) connector
    rss: marks tests specific to the RSS connector
    local_fs: marks tests specific to the Local FS connector
    demo: marks the Acme Corp demo-data acceptance test (needs an LLM on the instance)
    oauth_clients: marks tests for /api/v1/oauth-clients Node API contracts
    oauth_provider: marks tests for /api/v1/oauth2 and OIDC discovery routes
    mcp: marks tests that connect an MCP client to /mcp and check the served tool surface
    order: marks test execution order
    storage: storage-backend tests; they repoint the deployment's storage, so they run alone (-m storage)
    requires_kafka: marks tests that need MESSAGE_BROKER=kafka and a running Kafka broker
    resilience: restarts or kills stack services mid-run; run alone, never beside other tests
    authenticated_as: marks tests for authenticatedAs identity links (seeded graph, no external service)

# Output settings
# pytest-order defaults to session scope: all order(1) tests across every file run first,
# then all order(2), etc. That interleaves S3/GCS/Azure Blob/Azure Files and keeps four
# module-scoped connector fixtures alive at once (heavy sync/graph load → timeouts).
# Module scope = finish one connector file (order 1→5) before the next, like -m azure_blob.
addopts =
    -v
    --tb=long
    --strict-markers
    --order-scope=module

# Async mode for pytest-asyncio
asyncio_mode = auto
# Session scope needed for session-scoped async graph_provider fixture
asyncio_default_fixture_loop_scope = session

# Log settings
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
