appId: com.pipeshub.desktop
productName: PipesHub
icon: electron/out/logo/pipes-hub-1024.png
directories:
  output: dist-electron
files:
  - electron/compile/main.js
  - electron/compile/preload.js
  - electron/compile/deep-link.js
  - electron/compile/navigation.js
  - electron/compile/static-export.js
  - electron/compile/local-mode.js
  - electron/compile/local-server/**/*.js
  - electron/compile/local-repos/**/*.js
  - electron/compile/session-vault.js
  - electron/package.json
  - electron/compile/local-sync/**/*.js
  - "!electron/compile/local-sync/**/*.test.js"
  - electron/out/**/*
  - "!electron/node_modules"
  # Only keep the runtime deps the Electron main process actually needs.
  # The static export in electron/out/ has all browser-side code baked in.
  - "!node_modules/**/*"
  - node_modules/chokidar/**/*
  - node_modules/anymatch/**/*
  - node_modules/binary-extensions/**/*
  - node_modules/braces/**/*
  - node_modules/fill-range/**/*
  - node_modules/glob-parent/**/*
  - node_modules/is-binary-path/**/*
  - node_modules/is-extglob/**/*
  - node_modules/is-glob/**/*
  - node_modules/is-number/**/*
  - node_modules/normalize-path/**/*
  - node_modules/picomatch/**/*
  - node_modules/readdirp/**/*
  - node_modules/to-regex-range/**/*
  - node_modules/fsevents/**/*
  # socket.io-client and its transitive deps: the main process holds the
  # desktop socket the connector service pulls file events over.
  - node_modules/socket.io-client/**/*
  - node_modules/socket.io-parser/**/*
  - node_modules/engine.io-client/**/*
  - node_modules/engine.io-parser/**/*
  - node_modules/@socket.io/component-emitter/**/*
  - node_modules/ws/**/*
  - node_modules/xmlhttprequest-ssl/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
# The native launcher bundle ("run on this computer"), the WHOLE folder (launcher +
# pg/ py/ app/ models/ node/, ~2.1 GB; the launcher finds them beside itself): read-only app content,
# staged into resources/pipeshub-native by scripts/electron/stage-launcher.mjs.
# When nothing is staged the folder is empty and the app offers server mode only.
# Its data lives in the OS app-data folder, never in here.
extraResources:
  - from: resources/pipeshub-native
    to: pipeshub-native
    filter:
      - "**/*"
asarUnpack:
  - electron/compile/preload.js
# Sign-in opens in the default browser, which returns the result through this
# scheme. Writes CFBundleURLTypes on macOS and the .desktop MimeType on Linux;
# Windows is registered at runtime by app.setAsDefaultProtocolClient.
protocols:
  - name: PipesHub
    schemes:
      - pipeshub
afterPack: scripts/electron/after-pack.cjs
mac:
  category: public.app-category.productivity
  darkModeSupport: true
  # Every Mach-O file in the bundle is also listed for signing by scripts/electron/after-pack.cjs.
  # Used only when a signing identity is present (CSC_LINK / CSC_NAME); unsigned
  # builds ignore them. The bundled Bun, Python and PostgreSQL binaries inherit
  # the same entitlements (see scripts/electron/entitlements.mac.plist).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: scripts/electron/entitlements.mac.plist
  entitlementsInherit: scripts/electron/entitlements.mac.plist
  # Single `dmg` target — arch comes from the CLI (`--x64` / `--arm64`) in
  # `scripts/electron/build.mjs`. Listing both archs here makes electron-builder
  # build two DMGs in one process; both mount `/Volumes/<dmg.title>` and the
  # second fails (hdiutil detach / broken Applications symlink).
  target:
    - dmg
dmg:
  title: PipesHub
  artifactName: PipesHub-mac-${arch}.${ext}
win:
  # Stub: the Windows installer builds, but there is no Windows launcher bundle,
  # so the app offers server mode only.
  # Arch is selected per `build.mjs` invocation via `--x64` / `--arm64`.
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PipesHub
  runAfterFinish: true
  artifactName: PipesHub-win-${arch}.${ext}
linux:
  # Arch is selected per `build.mjs` invocation via `--x64` / `--arm64`.
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: PipesHub Desktop App
  description: PipesHub Desktop App
  maintainer: PipesHub
  vendor: PipesHub
appImage:
  artifactName: PipesHub-linux-${arch}.${ext}
deb:
  artifactName: PipesHub-linux-${arch}.${ext}
