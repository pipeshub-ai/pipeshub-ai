# MinIO backing service for the load harness.
#
# Joins the stack's own network so the connector can reach it at
# http://minio:9000, while the seeder reaches it from the host on :9100. The
# host port is deliberately not 9000 to avoid colliding with a MinIO the
# developer may already be running.
#
#   docker compose -f loadtest/compose/minio.yml up -d
#
# Sizing note: no memory limit is set on purpose. MinIO is not the system under
# test, and starving it would show up as connector-service slowness.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LT_MINIO_ACCESS_KEY:-loadtest}
      MINIO_ROOT_PASSWORD: ${LT_MINIO_SECRET_KEY:-loadtest123}
      # Deterministic corpora are re-uploaded per run; retaining versions would
      # let one run's deletions inflate the next run's listing cost.
      MINIO_BROWSER: "off"
    ports:
      - "${LT_MINIO_HOST_PORT:-9100}:9000"
      - "${LT_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - lt_minio_data:/data
    networks:
      - pipeshub
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  lt_minio_data:
    driver: local

networks:
  pipeshub:
    external: true
    name: pipeshub-ai_network
