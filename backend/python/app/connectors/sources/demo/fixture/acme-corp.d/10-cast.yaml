# Acme Corp, grown into a knowledge-graph test bed: the cast.
#
# New people, organisations, groups and containers only. Everyone and everything in
# acme-corp.yaml stays as it is; the loader merges these lists into it and rejects
# a duplicate id. The story bible (kg-eval/BIBLE.md) says who does what in which story.
#
# Existing members have no `team` field (acme-corp.yaml is frozen); their teams are
# in the bible. Group membership comes only from `people[].groups`, so existing people
# are not members of the groups added here. That matters only for sign-in personas,
# all of which are new people with their memberships set below.

groups:
  # Open to all staff (not the contractor): the company wiki, help centre and #general.
  - id: all-staff
    name: All staff
    installer_joins: true
  # The Kubernetes migration (Project Keel). The only group the contractor is in.
  - id: migration-team
    name: Project Keel migration team
    installer_joins: true
  # The four restricted spaces. The installer joins none of them.
  - id: exec-staff
    name: Exec staff
  - id: recruiting
    name: Recruiting
  - id: hr-casework
    name: People casework
  - id: security-incident
    name: Security incident response

