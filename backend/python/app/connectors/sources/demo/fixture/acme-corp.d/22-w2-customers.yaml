  - id: kb-sales-answers-hipaa
    container: kb-sales-answers
    type: KB_FILE
    title: "HIPAA and business associate agreements"
    author: daniel
    created: 2026-04-20T10:00:00Z
    web_url: https://kb.acme-demo.example/collections/rfp-answers/hipaa
    body: |
      **Q: Is Acme HIPAA compliant? Will you sign a BAA?**

      Acme supports customers who handle protected health information (PHI). We sign
      a business associate agreement (BAA) with Enterprise customers in healthcare,
      using our template. Our COO signs BAAs on Acme's behalf; account teams do not.

      Standard terms in our BAA:
      - Breach notification to the customer within 72 hours of discovery.
      - PHI stored only in our US region, encrypted at rest (AES-256) and in transit.
      - Subcontractors with PHI access bound by equivalent terms.
      - Remote audit rights once a year on request.

      Not covered: PHI in free-text fields synced from systems outside the BAA's scope.
      Acme Flow connections to clinical systems must be listed in the BAA.

  - id: kb-sales-answers-data-residency
    container: kb-sales-answers
    type: KB_FILE
    title: "Data residency and hosting regions"
    author: jack
    created: 2026-03-10T10:00:00Z
    web_url: https://kb.acme-demo.example/collections/rfp-answers/data-residency
    body: |
      **Q: Where is customer data hosted? Can it stay in one region?**

      Acme runs in two regions: United States (Virginia) and European Union
      (Frankfurt). A workspace lives in one region, including backups and search
      indexes; data does not leave it except when a customer exports it. Moving an
      existing workspace between regions takes a scheduled two-hour window.

      **Q: Can we have a dedicated (single-tenant) cluster?**
      Not as a standard offering. Workspaces share regional infrastructure with
      logical isolation per customer. Ask your account executive for current options.

  - id: kb-sales-answers-sso
    container: kb-sales-answers
    type: KB_FILE
    title: "Single sign-on and user provisioning"
    author: jack
    created: 2026-02-05T10:00:00Z
    web_url: https://kb.acme-demo.example/collections/rfp-answers/sso
    body: |
      **Q: Do you support SAML SSO?**
      Yes, SAML 2.0 on every Enterprise plan, with any compliant identity provider
      (Okta, Entra ID, Google Workspace tested). SSO can be enforced per workspace.

      **Q: Do you support SCIM or group sync?**
      Users can be created on first SAML login, and the SAML group claim can set the
      user's role at first login. Ongoing group membership sync from the identity
      provider is not available today.

      **Q: Can admins see login events?**
      Yes, in the in-app audit view.

