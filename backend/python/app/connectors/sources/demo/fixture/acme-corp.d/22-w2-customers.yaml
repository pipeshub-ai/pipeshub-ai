  # --- Zendesk: Globex and Globus tickets --------------------------------------

  - id: sn-4488
    container: zendesk-support
    type: TICKET
    title: "Zendesk #4488: SAML logins fail after IdP certificate rotation — Globex"
    author: chioma
    reporter: victor
    assignee: chioma
    created: 2026-03-12T09:05:00Z
    updated: 2026-03-13T15:00:00Z
    web_url: https://zendesk.acme-demo.example/agent/tickets/4488
    mentions_orgs: [globex]
    body: |
      **Customer:** Globex Corporation (Enterprise) · **Status:** Solved · **Priority:** P2

      All SAML logins for Globex fail with "Signature validation failed" since their
      IdP certificate rotation this morning. 180 users affected.

      Work notes:
      - Compared the certificate fingerprint in the workspace (expires 2026-03-11)
        with the one in their IdP metadata: different.
      - Customer admin uploaded the new metadata under Admin → Security; logins
        working again at 14:50 UTC on 13 March.
      - Suggested they add the workspace to their certificate-rotation checklist.

  - id: sn-4496
    container: zendesk-support
    type: TICKET
    title: "Zendesk #4496: Acme Flow drops custom fields with dots (Globex)"
    author: chioma
    reporter: victor
    assignee: chioma
    created: 2026-04-15T10:20:00Z
    updated: 2026-04-28T17:30:00Z
    web_url: https://zendesk.acme-demo.example/agent/tickets/4496
    relations:
      - { type: RELATED, to: jira-flow-312 }
    mentions_orgs: [globex]
    body: |
      **Customer:** Globex Corporation (Enterprise) · **Status:** Open (awaiting customer) ·
      **Priority:** P3

      Globex maps CRM custom fields such as `region.code` and `cost.centre` into their
      workspace with Acme Flow. Any field whose name contains a dot arrives empty; the
      rest of the record syncs. 14 fields affected across two connections.

      Work notes:
      - 15 Apr: reproduced with a test connection; filed FLOW-312 for engineering.
      - 15 Apr: workaround sent — rename the source field without the dot, or map it
        through a calculated field.
      - 28 Apr: FLOW-312 fix merged. Asked the customer to re-run a full sync and
        confirm the 14 fields now populate. Waiting on their confirmation.

  - id: sn-4497
    container: zendesk-support
    type: TICKET
    title: "Zendesk #4497: Globex: SSO login loop in Safari"
    author: lucas
    reporter: victor
    assignee: lucas
    created: 2026-04-22T08:40:00Z
    updated: 2026-04-27T14:10:00Z
    web_url: https://zendesk.acme-demo.example/agent/tickets/4497
    mentions_orgs: [globex]
    body: |
      **Customer:** Globex Corporation (Enterprise) · **Status:** Open · **Priority:** P3

      Some Globex users on Safari (macOS 15) are bounced between the IdP and the
      workspace login page until the browser gives up. Chrome and Firefox are fine.
      Around 25 users affected.

      Work notes:
      - 22 Apr: interim workaround sent to the customer — turn off "Prevent cross-site
        tracking" in Safari's privacy settings for the duration, or use Chrome.
      - 23 Apr: captured a HAR file from one affected user. Chioma to review the SAML
        trace, since she handled their certificate rollover in March.
      - 27 Apr: still investigating whether the session cookie is dropped on the
        redirect back from the IdP.

