    owner: hannah
    reporter: olivia
    created: 2026-04-14T16:05:00Z
    updated: 2026-04-24T11:30:00Z
    web_url: https://acme-demo.lightning.force.example/lightning/r/Case/500GLOBEX0044/view
    mentions_orgs: [globex]
    body: |
      **Account:** Globex Corporation · **Status:** Open · **Priority:** Medium ·
      **Origin:** Email · **Type:** Feature request

      ## Description
      As part of the expansion, Globex procurement asks whether Acme can run their
      workspace on a dedicated cluster with data kept in the EU (Frankfurt). Their
