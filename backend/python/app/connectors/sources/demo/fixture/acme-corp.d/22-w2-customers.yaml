    body: |
      ## Who they are
      Tessera Analytics sells a reporting suite with a sync product, TesseraSync.
      Their trademark objection is why Acme Sync became Acme Flow on 1 March.

      ## Where we meet them
      - Northwind Traders booked a Tessera demo in April during the export problem;
        cancelled after the fix (16 April).
      - Bluebird Health is running a Tessera trial alongside our pilot.

      ## Their weak spots
      1. TesseraSync is one-way: changes made in Tessera don't flow back to the source.
      2. No SAML SSO below their top tier.
      3. Hosting in the US only; no EU region.

      ## Our answer
      Two-way sync with Acme Flow, SSO on every Enterprise plan, US and EU regions.
      Don't attack the reporting suite: it is good.

