  # --- Salesforce: cases ------------------------------------------------------

  - id: sf-case-globex-0037
    container: sf-acct-globex
    type: CASE
    title: "Case 00001037: SAML certificate rollover failed"
    owner: chioma
    reporter: victor
    created: 2026-03-12T08:55:00Z
    updated: 2026-03-13T15:10:00Z
    web_url: https://acme-demo.lightning.force.example/lightning/r/Case/500GLOBEX0037/view
    mentions_orgs: [globex]
    body: |
      **Account:** Globex Corporation · **Status:** Closed · **Priority:** High ·
      **Origin:** Email · **Type:** Problem

      ## Description
      Globex rotated their IdP signing certificate on 12 March and every SAML login
      started failing with "Signature validation failed". About 180 users locked out
      of the web app; API tokens unaffected.

      ## Resolution
      The new certificate had been uploaded to Globex's IdP but not to their Acme
      workspace. Walked their admin through uploading the new metadata XML under
      Admin → Security on 13 March; logins restored at 14:50 UTC. Mirrored in
      Zendesk as #4488.

  - id: sf-case-globex-0041
    container: sf-acct-globex
    type: CASE
    title: "Case 00001041: Acme Flow sync running hours behind"
    owner: hannah
    reporter: victor
    created: 2026-04-08T13:15:00Z
    updated: 2026-04-11T10:20:00Z
    web_url: https://acme-demo.lightning.force.example/lightning/r/Case/500GLOBEX0041/view
    relations:
      - { type: RELATED, to: jira-sup-125 }
    mentions_orgs: [globex]
    body: |
      **Account:** Globex Corporation · **Status:** Closed · **Priority:** High ·
      **Origin:** Email · **Type:** Problem

      ## Description
      Customer reports that tickets created in their ticketing system since early
      morning have not appeared in their workspace. Their email calls it "Sync"; this
      is Acme Flow. Last successful sync for their main connection 07:02 UTC.

      ## Resolution
      Part of the Acme Flow delay affecting several customers (SUP-125, incident
      INC-2040). Engineering raised the flow-engine memory limit on 10 April and the
      backlog drained the same afternoon. Customer confirmed on 11 April that
      tickets were current and that no records were lost. Closed.

