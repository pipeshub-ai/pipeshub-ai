  - id: sn-4500
    container: zendesk-support
    type: TICKET
    title: "Zendesk #4500: Globex: audit log export has no SSO login events"
    author: chioma
    reporter: olivia
    assignee: chioma
    created: 2026-04-21T11:00:00Z
    updated: 2026-04-29T09:20:00Z
    web_url: https://zendesk.acme-demo.example/agent/tickets/4500
    relations:
      - { type: RELATED, to: jira-sup-127 }
    mentions_orgs: [globex]
    body: |
      **Customer:** Globex Corporation (Enterprise) · **Status:** Open · **Priority:** P3

      Globex's audit log export for 1–20 April contains workspace and permission
      events but no SSO login or logout events. Their auditors need them for the
      expansion's security review. Same request is on the account's Salesforce case.

      Work notes:
      - 21 Apr: reproduced on a SAML test workspace; the events are visible in the
        in-app audit view but absent from the CSV export. Escalated as SUP-127.
      - 29 Apr: no engineering update yet. Told the customer we will report back by
        8 May.

  - id: jira-sup-127
    container: jira-sup
    type: TICKET
    title: "SUP-127: Audit log CSV export omits SSO events (Globex)"
    author: chioma
    reporter: chioma
    assignee: yusuf
    created: 2026-04-21T11:30:00Z
    updated: 2026-04-29T09:00:00Z
    web_url: https://jira.acme-demo.example/browse/SUP-127
    relations:
      - { type: RELATED, to: sn-4500 }
    mentions_orgs: [globex]
    body: |
      **Priority:** Medium · **Status:** Open

      The audit log CSV export drops every event of type `sso.login` and `sso.logout`.
      The in-app audit view shows them, so the events are recorded; something in the
      export path filters them out. Customer: Globex Corporation (#4500), who
      need the events for a security review before signing their expansion.

      Steps: enable SAML on a test workspace, log in twice, export the audit log for
      today. Expected: two `sso.login` rows. Actual: none.

      Not yet triaged to a root cause.

