  - id: mail-support-0414
    container: gmail-lucas
    type: MAIL
    title: "Incident summary: Acme Flow sync delays, 8–10 April"
    from: lucas
    to: [kwame, jonas, victor]
    cc: [hannah, chioma]
    created: 2026-04-14T14:00:00Z
    web_url: https://mail.acme-demo.example/mail/u/lucas/#sent/support-0414
    relations:
      - { type: RELATED, to: mail-support-0410 }
    body: |
      Hello,

      As promised, a summary of the Acme Flow delays:

      - What happened: from about 06:10 UTC on 8 April the sync engine repeatedly ran
        out of memory after moving to new infrastructure. Connections stayed "running"
        but stopped writing. The longest delay was a little over six hours.
      - Fix: on 10 April engineering raised the engine's memory and added an alert on
        sync lag. All backlogs drained by 15:00 UTC that day.
      - Data: no records were lost or duplicated.
      - Next: per-connection lag in the admin console and an Acme Flow component on
        our status page, both in progress.

      Lucas Moreau
      Acme Support, EMEA

