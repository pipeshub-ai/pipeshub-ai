        Customer asked not to delete anything until the fix is in.
      - 20 Feb: fix deployed; engineering ran the de-duplication script against the
        workspace at 15:30 UTC. 2,297 duplicates removed, none of the originals.
        Customer verified a sample of 50 and confirmed. Solved.

