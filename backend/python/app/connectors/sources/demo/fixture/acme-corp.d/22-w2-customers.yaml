  - id: cf-sales-security-review
    container: cf-sales
    type: PAGE
    title: "How to run a customer security review"
    author: daniel
    last_modified_by: jack
    created: 2025-11-18T10:00:00Z
    updated: 2026-04-16T14:00:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/SALES/pages/2050/security-review
    body: |
      ## Questionnaires
      1. Send the questionnaire to the solutions engineer on the account the day it
         arrives. Target turnaround: 10 business days.
      2. Pre-fill from the Security and RFP answer library; flag anything new.
      3. Attach the SOC 2 Type II report only under NDA.

      ## Contracts that need a signature beyond the order form
      - Data processing addendum: legal approves; standard template preferred.
      - HIPAA BAA: our template; the COO signs. Expect two to four weeks.
      - Custom security schedules: legal and the platform team review together.

      ## After the review
      Add new answers to the library within a week so the next team can reuse them.

