  - id: drive-dealdesk-globex
    container: drive-deal-desk
    type: FILE
    title: "Deal desk decision — Globex Corporation expansion"
    owners: [lena]
    last_modified_by: jack
    created: 2026-04-28T10:30:00Z
    updated: 2026-04-28T12:10:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-dealdesk-globex
    group: deal-desk
    mentions_orgs: [globex]
    body: |
      **Deal desk members only** · Decided 28 April 2026

      ## Request
      Globex Corporation expansion, 180 → 750 seats, $212,000 ARR at list. Account
      executive requested 18% off on a one-year term (procurement pressure; April
      sync incident).

      ## Decision
      Approved 15% off list, conditional on a two-year term with the discount on both
      years. 18% on one year declined. Floor price for this deal: $238 per seat per
      year; any further concession below that comes back to the deal desk.

      ## Reasoning
      Two years of committed revenue justify the concession; a one-year term at 18%
      would set the reference price for the renewal. No service credit stacking with
      the new SLA.

