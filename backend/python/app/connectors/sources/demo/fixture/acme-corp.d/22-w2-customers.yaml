  - id: cf-sup-flow-delay-macro
    container: cf-sup
    type: PAGE
    title: "Macro: Acme Flow sync delay"
    author: lucas
    last_modified_by: chioma
    created: 2026-04-09T09:00:00Z
    updated: 2026-04-15T11:20:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/SUPKB/pages/3301/macro-flow-delay
    body: |
      Use when a customer reports that Acme Flow records are missing or late.

      ## Check first
      1. Admin console → Flow → Connections: compare "last synced" with now. More than
         15 minutes behind on an active connection counts as a delay.
      2. Look at #support-escalations and open SUP tickets: if two or more workspaces
         lag, treat it as platform-wide and link your ticket to the open SUP.

      ## Reply to the customer
      "Thanks for reporting this. Acme Flow is currently behind for your workspace.
      Records waiting to sync are queued and will not be lost. We will update you
      within two hours, or sooner when it catches up."

      ## When it is fixed
      - Ask the customer to spot-check five records created during the delay.
      - Close only after they confirm.

      ## Do not
      Do not ask the customer to reconnect or re-authorise a connection during a
      delay: it resets the queue position and can create duplicates (see the
      February duplicates case).

  - id: cf-sup-flow-known-issues
    container: cf-sup
    type: PAGE
    title: "Acme Flow — known issues and workarounds"
    author: chioma
    last_modified_by: lucas
    created: 2026-03-03T10:00:00Z
    updated: 2026-04-28T16:00:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/SUPKB/pages/3240/flow-known-issues
    body: |
      Acme Flow was called Acme Sync until 1 March 2026. The API path is still
      `/v1/sync`; customers may use either name.

      | Issue | Workaround | Status |
      |---|---|---|
      | Custom fields with a dot in the name arrive empty (FLOW-312) | Rename the source field without the dot, or map it through a calculated field | Fix merged 28 Apr; confirm with the customer after a full re-sync |
      | Sync lag under heavy load (April) | None needed; queued records are kept | Fixed 10 Apr; lag alert in place |
      | Webhook retries duplicated records (February) | — | Fixed 20 Feb |
      | Field mapping UI times out above 400 fields | Map in two passes | Open, low priority |

  - id: cf-sup-escalation-guide
    container: cf-sup
    type: PAGE
    title: "When and how to escalate to engineering"
    author: bob
    last_modified_by: bob
    created: 2025-12-01T10:00:00Z
    updated: 2026-03-20T09:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/SUPKB/pages/3005/escalation-guide
    body: |
      ## Escalate (open a SUP ticket) when any of these is true
      - Two or more customers report the same symptom within 24 hours.
      - Data is lost, duplicated or visible to the wrong people.
      - A workaround does not exist or the customer cannot use it.
      - An Enterprise customer has been blocked for more than four business hours.

      ## How
      1. Open a SUP ticket with steps to reproduce, the customer tickets, and impact.
      2. Post the SUP number in #support-escalations.
      3. The support lead assigns engineering; you stay the customer's contact.

      ## Severity hints
      Platform-wide outages go straight to the on-call incident commander; do not
      wait for the SUP ticket to be triaged.

