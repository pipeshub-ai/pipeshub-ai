    mentions_orgs: [contoso]
    body: |
      **Customer:** Contoso (Enterprise) · **Status:** Solved · **Priority:** P2

      Contoso reports that Acme Sync created duplicate copies of about 2,300 records
      overnight in their workspace. Every duplicate came from their CRM connection;
      the timestamps line up with a burst of webhook retries from 01:10 to 01:55 UTC.

