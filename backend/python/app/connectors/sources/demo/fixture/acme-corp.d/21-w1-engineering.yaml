  - id: gh-pr-702
    container: gh-flow-engine
    type: PULL_REQUEST
    title: "PR #702: Rename sync-engine to flow-engine"
    author: grace
    assignees: [grace]
    reviewers: [dana]
    created: 2026-02-26T15:00:00Z
    updated: 2026-03-02T11:30:00Z
