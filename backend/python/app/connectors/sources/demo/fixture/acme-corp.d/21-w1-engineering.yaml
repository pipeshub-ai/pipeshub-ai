  - id: jira-mig-31
    container: jira-mig
    type: TICKET
    title: "KEEL-31: Network policy — egress allowlist for the payments provider"
    author: priya-nair
    reporter: priya-nair
    assignee: yusuf
    created: 2026-03-30T09:15:00Z
    updated: 2026-04-16T15:40:00Z
    web_url: https://jira.acme-demo.example/browse/KEEL-31
    body: |
      **Status:** Done · **Blocks:** KEEL-38

      The billing worker talks to Stripe. Under the default-deny baseline (PR #609)
      nothing in the `payments` namespace can reach the internet, and the payments
      provider requires that our outbound traffic comes from the two NAT addresses
      registered with them.

      Needed before svc-billing-worker can move:
      - egress NetworkPolicy allowing only api.stripe.com:443 from `payments`
      - route `payments` egress through the registered NAT gateway

      This is why the billing-worker cutover moved from 11 Apr to 18 Apr. Implemented
      in platform-infra PR #620, merged 16 Apr.

