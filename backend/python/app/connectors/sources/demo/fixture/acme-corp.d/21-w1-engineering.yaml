    created: 2026-02-09T15:00:00Z
    updated: 2026-04-27T10:00:00Z
    web_url: https://jira.acme-demo.example/browse/KEEL-1
    body: |
      **Type:** Epic · **Status:** In progress · **Due:** 2026-05-29

      Move svc-export, flow-engine, svc-billing-worker and svc-invoicing off the
      hand-managed VMs and onto the managed Kubernetes cluster (keel-prod) by the end
      of May. The VMs are on an OS release that loses security updates in July.

      Child work, in cutover order:
      - KEEL-20 svc-export — done 24 Mar
      - KEEL-27 flow-engine — done 2 Apr
      - KEEL-38 svc-billing-worker — done 18 Apr
      - KEEL-45 svc-invoicing — planned 12 May

      Supporting tickets: KEEL-5 cluster, KEEL-8 ingress, KEEL-16 dashboards,
      KEEL-31 network policy, KEEL-35 certificates, KEEL-42 VM decommissioning.

  - id: jira-mig-5
    container: jira-mig
    type: TICKET
    title: "KEEL-5: Provision keel-prod and keel-staging clusters"
    author: priya-nair
    reporter: raj
    assignee: priya-nair
    created: 2026-02-10T09:30:00Z
    updated: 2026-02-27T16:45:00Z
    web_url: https://jira.acme-demo.example/browse/KEEL-5
    body: |
      **Status:** Done · **Resolution:** Fixed

      Provision two managed clusters in eu-west-1 via Terraform (platform-infra PR #601).

      Production (keel-prod): Kubernetes 1.29, one system pool of 3 × m6i.large and a
      general pool `pool-general` of m6i.2xlarge nodes, autoscaling 4 to 12.
      Staging (keel-staging): same versions, general pool 2 to 4 nodes.

      Both clusters use the managed control plane with private endpoints only; kubectl
      goes through the bastion. Done 27 Feb after the node pool quota increase came
      through on the 26th.

