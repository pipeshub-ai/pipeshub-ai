      - Customers affected: Bluebird Health (in pilot), Contoso and Globex. No data
        lost.
      - Cause: memory limits set too low when flow-engine moved to Kubernetes.
      - Fixed by raising the limits; we now page on lag per customer.
      - Keel continues: billing worker moves this Saturday, invoicing on 12 May.

      Postmortem (Grace) is in the ENG space.

      Raj

