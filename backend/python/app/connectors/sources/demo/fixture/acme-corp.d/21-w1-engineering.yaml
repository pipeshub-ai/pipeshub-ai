  - id: gh-pr-705
    container: gh-flow-engine
    type: PULL_REQUEST
    title: "PR #705: Backpressure for webhook bursts"
    author: grace
    assignees: [grace]
    reviewers: [dana, yusuf]
    created: 2026-03-12T10:00:00Z
    updated: 2026-03-18T16:20:00Z
    web_url: https://github.acme-demo.example/flow-engine/pull/705
    body: |
      **Merged** 2026-03-18 · Closes FLOW-307

      The webhook receiver now accepts into a bounded queue (10,000 deliveries per
      pod). When full it answers 429 with `Retry-After: 30`. Partners retry, nothing is
      dropped, and the receiver's memory stays flat under a 20,000-per-minute burst in
      the load test.

  - id: gh-pr-709
    container: gh-flow-engine
    type: PULL_REQUEST
    title: "PR #709: Export flow_queue_lag_seconds per tenant"
    author: grace
    assignees: [grace]
    reviewers: [priya-nair]
    created: 2026-03-27T11:00:00Z
    updated: 2026-04-01T10:00:00Z
    web_url: https://github.acme-demo.example/flow-engine/pull/709
    body: |
      **Merged** 2026-04-01

      Exposes `flow_queue_lag_seconds` (age of the oldest queued sync) overall and per
      tenant, so the Kubernetes autoscaler can scale on lag and dashboards can show
      one customer at a time.

  - id: gh-issue-711
    container: gh-flow-engine
    type: TICKET
    title: "Issue #711: Field mapper splits API names on dots"
    author: grace
    created: 2026-04-16T09:00:00Z
    updated: 2026-04-28T15:00:00Z
    web_url: https://github.acme-demo.example/flow-engine/issues/711
    relations:
      - { type: RELATED, to: jira-flow-312 }
    body: |
      **Closed by #713**

      `FieldMapper.resolve()` splits every source field name on `.` to support nested
      JSON paths. Custom field API names may legally contain dots, so `region.code` is
      looked up as `region` → `code` and silently dropped. Tracked in FLOW-312.

  - id: gh-pr-713
    container: gh-flow-engine
    type: PULL_REQUEST
    title: "PR #713: Treat dotted custom field names as literal keys"
    author: grace
    assignees: [grace]
    reviewers: [yusuf]
    created: 2026-04-22T14:00:00Z
    updated: 2026-04-28T15:00:00Z
    web_url: https://github.acme-demo.example/flow-engine/pull/713
    relations:
      - { type: IMPLEMENTS, to: jira-flow-312 }
      - { type: IMPLEMENTS, to: gh-issue-711 }
    body: |
      **Merged** 2026-04-28 · Closes #711, FLOW-312

      The mapper first looks for an exact key match and only then treats dots as a
      nested path. Mappings can also use bracket syntax (`["region.code"]`) to force a
      literal key. Fields that resolve to nothing are now logged as a mapping warning
      instead of being dropped silently.

  - id: gh-pr-713-c1
    container: gh-flow-engine
    type: COMMENT
    title: "Review comment on PR #713 — Yusuf Demir"
    author: yusuf
    created: 2026-04-27T16:00:00Z
    parent: gh-pr-713
    body: |
      Approve. Exact-match-first is the right order. Can you add a test where both
      `region.code` and a nested `region: {code}` exist? Exact key should win.

  - id: gh-pr-716
    container: gh-flow-engine
    type: PULL_REQUEST
    title: "PR #716: Back off on Salesforce 429 responses"
    author: yusuf
    assignees: [yusuf]
    reviewers: [grace]
    created: 2026-04-29T10:00:00Z
    updated: 2026-04-30T09:00:00Z
    web_url: https://github.acme-demo.example/flow-engine/pull/716
    body: |
      **Open** · For FLOW-318

      Salesforce connector retries 429s with exponential backoff (base 5 s, cap 5 min)
      and reads `Sforce-Limit-Info` to slow bulk jobs before the daily limit runs out.

