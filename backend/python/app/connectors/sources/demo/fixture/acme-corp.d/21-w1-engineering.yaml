  - id: jira-inc-2044
    container: jira-inc
    type: TICKET
    title: "INC-2044: Export download links failing with certificate errors"
    author: yusuf
    reporter: grace
    assignee: yusuf
    created: 2026-04-24T09:12:00Z
    updated: 2026-04-24T15:10:00Z
    web_url: https://jira.acme-demo.example/browse/INC-2044
    relations:
      - { type: RELATED, to: gh-pr-618 }
    body: |
      **Severity:** SEV-3 · **Status:** Resolved

      Export download links failed for 22 minutes, 09:05–09:27 UTC on 24 April.
      Browsers rejected the certificate on the export host: cert-manager had renewed
      it from the staging issuer added in PR #618, which is not publicly trusted.

      Mitigation 09:27: certificate reissued from the production issuer by hand.
      Fix: PR #622 removes the staging issuer from production and adds a CI check.
      Exports themselves kept running; customers could download again once the link
      was retried.

  - id: cf-eng-postmortem-inc-2040
    container: cf-eng
    type: PAGE
    title: "Postmortem: INC-2040 Acme Flow sync delays (8–10 April)"
    author: grace
    last_modified_by: raj
    created: 2026-04-13T10:00:00Z
    updated: 2026-04-14T09:20:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ENG/pages/postmortem-inc-2040
    mentions_orgs: [globex, bluebird, contoso]
    relations:
      - { type: RELATED, to: jira-inc-2040 }
    body: |
      ## Summary
      Six days after flow-engine moved to Kubernetes, its sync pods were OOM-killed at
      512Mi when large tenants' backfills ran. Syncs fell up to 6h20m behind for
      Bluebird Health, Contoso and Globex. Fixed on 10 April by raising limits to 2Gi
      (PR #614).

      ## What went wrong
      - Memory limits were copied from VM heap usage, not whole-process usage.
      - The autoscaler scaled on lag, so it added pods that hit the same limit.
      - No alert on lag; support heard from customers before we noticed.

      ## What went right
      Support connected three tickets to one cause within the morning; the interim
      fix took effect within 40 minutes of being applied.

      ## Action items
      | Action | Owner | Status |
      |---|---|---|
      | Per-tenant lag alert that pages | Grace | Done 14 Apr (PR #616) |
      | HPA on queue lag | Tobias | Already done before the incident (PR #611) |
      | Customer comms and all-clear | Lucas | Done 10 Apr |
      | Review limits for every Keel workload | Tobias | KEEL-33 |
      | Tune lag alert thresholds after two weeks | Grace | PLAT-204 |

  - id: cf-eng-postmortem-inc-2044
    container: cf-eng
    type: PAGE
    title: "Postmortem: INC-2044 export download links (24 April)"
    author: yusuf
    last_modified_by: priya-nair
    created: 2026-04-27T11:00:00Z
    updated: 2026-04-28T10:15:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ENG/pages/postmortem-inc-2044
    relations:
      - { type: RELATED, to: jira-inc-2044 }
    body: |
      ## Summary
      For 22 minutes (09:05–09:27 UTC, 24 April) export download links failed with a
      certificate error. 1,140 download requests failed; exports themselves were not
      lost and retried links worked after 09:27.

      ## Timeline
      - 09:05 cert-manager renews the export host certificate using the staging issuer
      - 09:08 Grace's synthetic check on download links fires
      - 09:15 Yusuf identifies the issuer; incident opened
      - 09:27 certificate reissued from the production issuer by hand
      - 15:00 PR #622 merged: staging issuer removed from production, CI check added

      ## Why the staging issuer was used
      PR #618 added both issuers. The svc-export chart's ingress had no issuer
      annotation and fell back to a default that pointed at staging. The manual
      certificate kept working until it came up for renewal.

      ## Action items
      - Remove the staging issuer from production — Yusuf, done (PLAT-228)
      - Alert 14 days before any ingress certificate expires and on any certificate
        not from the production issuer — Grace (PLAT-225)
      - CI check on charts — done in PR #622

