  - id: jira-sec-7
    container: jira-sec
    type: TICKET
    title: "SEC-7: platform-infra CI deploy token printed in a public build log"
    author: yusuf
    reporter: yusuf
    assignee: priya-nair
    created: 2026-04-12T11:40:00Z
    updated: 2026-04-14T16:00:00Z
    web_url: https://jira.acme-demo.example/browse/SEC-7
    body: |
      **Severity:** High · **Status:** Resolved · **Incident commander:** Raj Mehta

      ## What happened
      At 11:32 UTC on 12 April Yusuf noticed that a CI run triggered by a forked pull
      request against platform-infra had printed the deploy token in its public build
      log (a debug step echoed the environment). The log had been public since 09:58.

      ## Exposure
      The deploy token could push images to the staging registry only. It had no
      access to production, to keel-prod, or to any customer data.

      ## Response
      - 11:45 log deleted, workflow disabled
      - 13:40 token rotated and old token revoked (under 2 hours from discovery)
      - 13:00–15:00 registry audit: no pushes or pulls from unknown addresses (SEC-10)

      ## Follow-ups
      SEC-8 mask secrets in CI logs (Yusuf); SEC-9 stop workflows running with
      secrets on forks (Priya Nair).

  - id: jira-sec-8
    container: jira-sec
    type: TICKET
    title: "SEC-8: Mask secrets in CI logs"
    author: priya-nair
    reporter: priya-nair
    assignee: yusuf
    created: 2026-04-12T15:00:00Z
    updated: 2026-04-27T11:00:00Z
    web_url: https://jira.acme-demo.example/browse/SEC-8
    body: |
      **Status:** In progress · **Follow-up of:** SEC-7

      Register every repository secret with the CI masker, remove the debug step that
      echoed the environment, and add a log scanner that fails the run when a string
      matching a token pattern is printed. Rolled out to platform-infra; four other
      repositories to go.

  - id: jira-sec-9
    container: jira-sec
    type: TICKET
    title: "SEC-9: Don't run workflows with secrets on forked pull requests"
    author: raj
    reporter: raj
    assignee: priya-nair
    created: 2026-04-12T15:05:00Z
    updated: 2026-04-14T15:30:00Z
    web_url: https://jira.acme-demo.example/browse/SEC-9
    body: |
      **Status:** Done · **Follow-up of:** SEC-7

      Workflows triggered from forks now run without secrets and require a maintainer
      to approve the run. The staging registry push step runs only on branches in the
      main repository.

