  - id: cf-eng-dunning-proposal
    container: cf-eng
    type: PAGE
    title: "Proposal: dunning for failed renewals"
    author: priya
    last_modified_by: fatima
    created: 2026-04-09T13:00:00Z
    updated: 2026-04-23T16:10:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ENG/pages/dunning-proposal
    body: |
      ## Problem
      When a renewal charge fails after all retries, nothing tells the customer. In Q1,
      214 workspaces lapsed this way; support found out when users could not log in.

      ## Proposal
      After a renewal finally fails, the billing worker emits `renewal_failed` and a
      dunning schedule starts:
      - day 1, day 4 and day 10: payment-failed emails to workspace owners and billing
        contacts, each with a link to update the card
      - day 14: final notice
      - day 21: workspace suspended (read-only, data kept for 90 days)
      A successful payment at any point stops the schedule.

      ## Out of scope
      Changing retry behaviour (PR #482 already did that) and any change to prices.

      ## Plan
      Events from svc-billing-worker (PAY-88), email copy (PAY-89), suspension
      (PAY-90). Launch target **19 May 2026**.

      ## Changes
      23 Apr: dropped the day-7 email after copy review; day 14 is now the final notice.

