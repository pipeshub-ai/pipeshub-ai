  # --- KEEL Confluence pages --------------------------------------------------

  - id: cf-mig-kickoff
    container: cf-mig
    type: PAGE
    title: "Project Keel kickoff — 9 February 2026"
    author: raj
    last_modified_by: raj
    created: 2026-02-09T16:00:00Z
    updated: 2026-02-10T09:00:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/KEEL/pages/keel-kickoff
    mentions_orgs: [globus]
    body: |
      ## Why
      Four services still run on hand-built VMs whose OS stops getting security
      updates in July. Every deploy is a shell script; scaling means a ticket.

      ## Goal
      Move svc-export, flow-engine, svc-billing-worker and svc-invoicing to the managed
      Kubernetes cluster by the end of May. Nothing customer-facing changes.

      ## People
      Priya Nair leads the migration technically. Yusuf owns ingress, DNS and network
      policy; Grace owns dashboards and alerts; Dana reviews the architecture. A
      contract engineer from Globus Partners joins on 16 Feb for Helm charts and
      autoscaling, through 30 June. Each service's owning team signs off its own
      cutover.

      ## Ways of working
      Tickets in the KEEL project, chat in #proj-keel, weekly check-in Mondays 15:00.
      One cutover at a time, never on a Friday.

  - id: cf-mig-keel-plan
    container: cf-mig
    type: PAGE
    title: "Project Keel — Kubernetes migration plan"
    author: dana
    last_modified_by: priya-nair
    created: 2026-02-12T11:00:00Z
    updated: 2026-04-06T17:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/KEEL/pages/keel-migration-plan
    body: |
      ## Scope
      svc-export, flow-engine, svc-billing-worker and svc-invoicing move from VMs to
      keel-prod. Stateful stores (Postgres, Redis, object storage) stay where they are.

      ## Order and dates
      | Service | Cutover | Ticket |
      |---|---|---|
      | svc-export | Tue 24 March | KEEL-20 |
      | flow-engine | Thu 2 April | KEEL-27 |
      | svc-billing-worker | **Sat 18 April** | KEEL-38 |
      | svc-invoicing | Tue 12 May | KEEL-45 |

      The billing worker moved from 11 April to 18 April (6 Apr): it needs the egress
      allowlist for the payments provider (KEEL-31) in place first.

      ## Approach
      Each service gets a Helm chart, runs a week on keel-staging, then cuts over with
      weighted DNS (10% → 50% → 100%) using the cutover checklist. VMs stay warm for at
      least a week after each cutover.

      ## Risks
      - Memory sizing copied from VMs may be wrong for containers.
      - Billing must never charge twice: scale VM workers to zero before pods start.
      - svc-invoicing renders PDFs and needs its fonts inside the image.

  - id: cf-mig-cutover-checklist
    container: cf-mig
    type: PAGE
    title: "Keel cutover checklist"
    author: priya-nair
    last_modified_by: tobias
    created: 2026-03-16T10:00:00Z
    updated: 2026-04-15T12:00:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/KEEL/pages/keel-cutover-checklist
    body: |
      ## Day before
      1. Service has run 7 days on keel-staging without restarts above 2/day.
      2. Dashboard and alerts exist for the service (KEEL-16 pattern).
      3. Owning team has named who verifies the service after cutover.

      ## On the day
      4. Announce in #proj-keel and #platform 30 minutes before.
      5. Shift weighted DNS 10% → 50% → 100%, holding each step for at least 20
         minutes. Whole cutover takes about 90 minutes.
      6. For workers that charge or send email, scale VM workers to zero *before*
         starting the pods.

      ## Roll back if
      - p95 latency above 800 ms for 5 minutes, or
      - 5xx rate above 1% for 5 minutes, or
      - the owning team's verification fails.
      Rollback is DNS weights back to 0% on Kubernetes; VMs must still be warm.

      ## After
      7. Keep the VMs warm for 7 days, then open a decommission ticket.
      8. Readiness probes must point at the service port, not the metrics port
         (added 15 Apr after the svc-export cutover retro).

  - id: cf-mig-helm-conventions
    container: cf-mig
    type: PAGE
    title: "Keel Helm chart conventions"
    author: tobias
    last_modified_by: yusuf
    created: 2026-03-03T09:30:00Z
    updated: 2026-04-20T10:40:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/KEEL/pages/keel-helm-conventions
    body: |
      Every Keel service chart lives in `platform-infra/charts/<service>`.

      - **Values**: `resources.requests` and `resources.limits` are set for every
        container; requests equal limits for memory, CPU has no limit.
      - **Names**: Deployments are `<service>-<role>`, e.g. `flow-engine-sync`,
        `svc-export-worker`.
      - **Labels**: `app.kubernetes.io/name`, `app.kubernetes.io/component`,
        `acme.io/team` (payments or platform) and `acme.io/oncall` (rota name).
      - **Probes**: readiness on the service port, liveness on `/healthz`, never the
        metrics port.
      - **Secrets**: from the external secrets operator only; no secrets in values.
      - **Ingress**: annotate with `cert-manager.io/cluster-issuer: letsencrypt-prod`
        (added 20 Apr; do not reference any other issuer in production charts).
      - **Versioning**: chart version bumps on every change; app version is the
        image tag.

