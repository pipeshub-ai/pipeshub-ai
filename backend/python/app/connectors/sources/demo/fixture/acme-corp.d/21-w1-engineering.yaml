  - id: jira-flow-301
    container: jira-flow
    type: TICKET
    title: "FLOW-301: Acme Sync — OAuth token refresh fails for HubSpot connections"
    author: dana
    reporter: chioma
    assignee: grace
    created: 2026-02-03T10:00:00Z
    updated: 2026-02-10T15:00:00Z
    web_url: https://jira.acme-demo.example/browse/FLOW-301
    body: |
      **Status:** Done

      Acme Sync connections to HubSpot stop after 6 hours because the refresh token
      request sends the client secret in the query string, which HubSpot started
      rejecting on 1 Feb. Send it in the request body. Seven customers' connections
      affected; they reconnect automatically once fixed.

  - id: jira-flow-304
    container: jira-flow
    type: TICKET
    title: "FLOW-304: Acme Sync — durable dedupe key for webhook deliveries"
    author: grace
    reporter: dana
    assignee: grace
    created: 2026-02-20T09:30:00Z
    updated: 2026-03-05T14:00:00Z
    web_url: https://jira.acme-demo.example/browse/FLOW-304
    relations:
      - { type: RELATED, to: jira-inc-2036 }
    body: |
      **Status:** Done

      Follow-up from INC-2036. The hotfix dedupes webhook deliveries on the partner's
      event id in memory for 24 hours, which is lost on restart. Store processed event
      ids in Redis with a 72-hour TTL so every Acme Sync worker shares them.

  - id: jira-flow-307
    container: jira-flow
    type: TICKET
    title: "FLOW-307: Backpressure for webhook bursts"
    author: grace
    reporter: grace
    assignee: grace
    created: 2026-03-09T10:00:00Z
    updated: 2026-03-18T16:30:00Z
    web_url: https://jira.acme-demo.example/browse/FLOW-307
    body: |
      **Status:** Done

      A partner sending 20,000 webhooks in a minute fills the receiver's memory. Accept
      deliveries into a bounded queue and answer 429 with Retry-After when it is full,
      instead of buffering everything. Done in PR #705.

  - id: jira-flow-309
    container: jira-flow
    type: TICKET
    title: "FLOW-309: Rename user-facing strings from Sync to Flow"
    author: grace
    reporter: grace
    assignee: dana
    created: 2026-02-18T11:00:00Z
    updated: 2026-02-27T17:00:00Z
    web_url: https://jira.acme-demo.example/browse/FLOW-309
    body: |
      **Status:** Done

      The product becomes Acme Flow on 1 March. Replace "Acme Sync" with "Acme Flow"
      in the admin UI, email templates and error messages. Do **not** change the API
      path: `/v1/sync` stays until 2027 so customer integrations keep working.
      412 strings changed.

  - id: jira-flow-312
    container: jira-flow
    type: TICKET
    title: "FLOW-312: Custom fields with dots in their names are dropped by field mapping"
    author: chioma
    reporter: chioma
    assignee: grace
    created: 2026-04-15T14:30:00Z
    updated: 2026-04-28T17:00:00Z
    web_url: https://jira.acme-demo.example/browse/FLOW-312
    mentions_orgs: [globex]
    body: |
      **Status:** Done · **Fix version:** flow-engine 2026.04.28

      Reported by Globex: custom fields whose API names contain a dot (for example
      `region.code`) never arrive in the destination. The field mapper treats the dot
      as a path separator, looks for a nested `region` object, finds nothing and drops
      the value silently.

      Steps: create a custom field `region.code` in the source CRM, map it in Acme
      Flow, run a sync. Expected: value copied. Actual: field empty, no error.

      Fixed by flow-engine PR #713, merged 28 Apr.

