    type: TICKET
    title: "PAY-95: Validate the VAT number on every invoice line (FIN-38)"
    author: ingrid
    reporter: ingrid
    assignee: kenji
    created: 2026-04-23T09:30:00Z
    updated: 2026-04-29T17:00:00Z
    web_url: https://jira.acme-demo.example/browse/PAY-95
    mentions_orgs: [contoso]
    body: |
      **Status:** In review · **Finance ticket:** FIN-38

      Contoso's April invoice charged VAT on a line that should have been reverse
      charge, because svc-invoicing checks the customer's VAT number once per invoice
      and an add-on line created before the number was saved slipped through. Finance
      reissued the invoice (FIN-37); this ticket fixes the rule.

      Acceptance: every line of an invoice for an EU business customer with a valid
      VAT number is reverse charge; lines are re-validated when the invoice is
      generated, not when the line was created; a test covers an add-on added before
      the VAT number.

      Code change: svc-invoicing PR #321.

