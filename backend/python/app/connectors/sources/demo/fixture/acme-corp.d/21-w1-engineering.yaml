  - id: cf-mig-dedicated-cluster-options
    container: cf-mig
    type: PAGE
    title: "KEEL-40: Dedicated cluster options for Globex Corporation"
    author: priya-nair
    last_modified_by: dana
    created: 2026-04-20T09:00:00Z
    updated: 2026-04-28T14:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/KEEL/pages/keel-40-options
    mentions_orgs: [globex]
    body: |
      Globex Corporation asked for dedicated infrastructure and EU-only data.

      ## Option A — dedicated node pool on keel-prod
      Tainted pool `pool-globex`, Globex workloads in their own namespace. Data stays
      in eu-west-1 (already EU). Shared control plane, so "dedicated cluster" is not
      literally true. About 1 week of platform work.

      ## Option B — separate cluster, eu-central-1
      Same Terraform module as keel-prod. Truly dedicated, but doubles upgrade and
      on-call work and every Keel chart needs a tenant flag. About 3 weeks before the
      first service could run there.

      ## Open questions
      - Does "data residency" mean EU or Germany? Account team to confirm.
      - Cost: not estimated yet for either option; needs node sizing first.

      Dana (28 Apr): prefer A unless the customer needs a separate control plane in
      writing; B blocks the Keel finish date.

  # --- Drive: the two copies of the plan and migration docs -------------------

  - id: drive-eng-keel-plan
    container: drive-engineering
    type: FILE
    title: "Project Keel — Kubernetes migration plan"
    owners: [dana]
    last_modified_by: dana
    created: 2026-02-05T14:00:00Z
    updated: 2026-02-12T10:20:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-keel-migration-plan
    body: |
      ## Scope
      svc-export, flow-engine, svc-billing-worker and svc-invoicing move from VMs to the
      managed Kubernetes cluster. Postgres, Redis and object storage are not moving.

      ## Order and dates (draft)
      - svc-export — Tuesday 24 March (smallest blast radius, already stateless)
      - flow-engine — Thursday 2 April
      - svc-billing-worker — **Saturday 11 April**
      - svc-invoicing — Tuesday 12 May (after the April invoice run)

      ## Approach
      Helm chart per service, a week on staging, weighted DNS cutover, VMs warm for a
      week afterwards.

      ## Open questions
      - Do we need per-namespace network policy from day one?
      - Who verifies billing after its cutover?
      - Memory sizing: copy from the VMs, then tune.

  - id: drive-mig-cost-model
    container: drive-migration
    type: FILE
    title: "Keel cost model — VMs vs cluster"
    owners: [priya-nair]
    last_modified_by: raj
    created: 2026-02-20T11:00:00Z
    updated: 2026-03-12T16:00:00Z
    web_url: https://docs.acme-demo.example/spreadsheets/d/acme-keel-cost-model
    body: |
      | Line | Today (VMs) | After Keel |
      |---|---|---|
      | Compute, 4 services | $14,300/month | $8,700/month (pool-general, avg 7 nodes) |
      | Load balancers and NAT | $2,100/month | $1,600/month |
      | Monitoring agents | $2,200/month | $1,600/month |
      | **Total** | **$18,600/month** | **$11,900/month** |

      Assumptions: the four services fit on an average of 7 m6i.2xlarge nodes with
      30% headroom; autoscaling to 12 nodes at month-end invoice runs; managed
      control plane fee included in compute. One-off cost of the migration (contractor
      and team time) is tracked by finance, not here.

      Raj (12 Mar): numbers reviewed; use the $11,900 figure in the board update.

  - id: drive-mig-contractor-onboarding
    container: drive-migration
    type: FILE
    title: "Keel contractor onboarding"
    owners: [raj]
    last_modified_by: priya-nair
    created: 2026-02-13T10:00:00Z
    updated: 2026-02-16T08:30:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-keel-contractor-onboarding
    mentions_orgs: [globus]
    body: |
      For engineers joining Project Keel through Globus Partners.

      ## Access you get
      - acme/platform-infra (write; merges need one platform approval)
      - the KEEL Jira project and the KEEL Confluence space
      - #proj-keel on Slack
      - the Project Keel Drive folder
      - kubectl on keel-staging; read-only on keel-prod until your first cutover

      ## Access you don't get
      Incident tickets, the ENG Confluence space and customer support tools stay
      employee-only. Ask in #proj-keel and someone will share what you need.

      ## First week
      Day 1 laptop and SSO; day 2 read the migration plan and the Helm conventions;
      day 3 pair with Priya Nair on keel-staging; by Friday pick up KEEL-12.

  - id: drive-mig-export-cutover-retro
    container: drive-migration
    type: FILE
    title: "Retro — svc-export cutover, 24 March"
    owners: [tobias]
    last_modified_by: tobias
    created: 2026-03-26T10:00:00Z
    updated: 2026-03-26T15:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-keel-export-retro
    body: |
      ## What happened
      At 14:12 UTC, moving from 10% to 50%, about three minutes of 502s on export
      requests (roughly 140 failed requests). Rolled the weight back to 10%, fixed,
      went to 50% at 14:25 and 100% at 14:40.

      ## Root cause
      The readiness probe in the svc-export chart checked port 9090 (metrics) instead
      of 8080 (the service). Pods were marked ready before the app had loaded its
      config, so the new pods received traffic they could not serve.

      ## What we changed
      - Probe fixed in the chart the same afternoon.
      - Checklist step: readiness probes on the service port, never the metrics port.
      - Hold each weight step 20 minutes instead of 10.

      ## What went well
      Alice's verification exports passed first time; rollback took under a minute.

