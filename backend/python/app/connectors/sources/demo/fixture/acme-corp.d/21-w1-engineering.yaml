  - id: cf-eng-vat-rules
    container: cf-eng
    type: PAGE
    title: "How svc-invoicing decides VAT"
    author: kenji
    last_modified_by: kenji
    created: 2026-04-23T15:00:00Z
    updated: 2026-04-28T09:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ENG/pages/invoicing-vat-rules
    mentions_orgs: [contoso]
    body: |
      ## Today
      1. Customer outside the EU: no VAT.
      2. EU consumer, or EU business without a validated VAT number: VAT at the
         customer's country rate.
      3. EU business with a VAT number validated against VIES: reverse charge, 0% VAT,
         with the line "Reverse charge — Article 196, Council Directive 2006/112/EC".

      The VAT number is validated when it is saved and re-checked every 30 days.

      ## Known gap
      Treatment is stored on each line when the line is created. A line created before
      the VAT number was saved keeps VAT (Contoso, April). Fix in review: PAY-95 /
      PR #321 decides treatment per line at invoice generation. Until it merges,
      finance checks EU add-on invoices by hand.

