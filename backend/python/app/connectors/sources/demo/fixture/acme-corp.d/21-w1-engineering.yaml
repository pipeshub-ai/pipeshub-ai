  - id: jira-inc-2036
    container: jira-inc
    type: TICKET
    title: "INC-2036: Acme Sync webhook retries duplicated records"
    author: dana
    reporter: sam
    assignee: grace
    created: 2026-02-19T10:40:00Z
    updated: 2026-02-20T15:30:00Z
    web_url: https://jira.acme-demo.example/browse/INC-2036
    mentions_orgs: [contoso]
    body: |
      **Severity:** SEV-3 · **Status:** Resolved

      ## Impact
      Contoso saw duplicate contact records created by Acme Sync between 18 Feb 22:00
      and 19 Feb 11:30 UTC: 3,870 duplicates across two connected CRMs. No data lost.

      ## Cause
      A partner API timed out after accepting webhook deliveries. Acme Sync retried
      the delivery, and because webhook handling had no idempotency key, each retry
      created the record again.

      ## Fix
      Deduplicate on the partner's event id for 24 hours (sync-engine hotfix, 19 Feb
      14:05). Duplicates cleaned up with Contoso's admin on 20 Feb. Longer-term
      dedupe key work in FLOW-304.

  - id: jira-inc-2040
    container: jira-inc
    type: TICKET
    title: "INC-2040: Acme Flow sync delays after flow-engine moved to Kubernetes"
    author: raj
    reporter: lucas
    assignee: grace
    created: 2026-04-08T06:10:00Z
    updated: 2026-04-14T10:00:00Z
    web_url: https://jira.acme-demo.example/browse/INC-2040
    mentions_orgs: [globex, bluebird, contoso]
    relations:
      - { type: RELATED, to: jira-mig-27 }
    body: |
      **Severity:** SEV-2 · **Status:** Resolved

      ## Impact
      From 06:10 UTC on 8 April, Acme Flow syncs ran hours behind. Queue lag peaked at
      6h20m. Customers who reported delays: Bluebird Health (first, 07:30), Contoso
      (11:00) and Globex (13:15). No data was lost; every queued sync completed.

      ## Cause
      flow-engine moved to Kubernetes on 2 April with a 512Mi memory limit copied from
      the VM sizing. When large tenants' nightly backfills started, sync pods were
      OOM-killed; the autoscaler added pods that died the same way, and the queue
      backed up.

      ## Resolution
      - 8 Apr 16:40: limit raised by hand to 1Gi, restarts stopped, lag began to fall.
      - 10 Apr 11:05: platform-infra PR #614 merged — limits 2Gi, lag alerting.
      - 10 Apr 14:00: lag under 2 minutes for all tenants; support sent the all-clear.

      Postmortem in the ENG space.

