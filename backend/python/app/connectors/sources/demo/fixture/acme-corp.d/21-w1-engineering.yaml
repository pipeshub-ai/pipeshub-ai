  - id: mail-eng-0416
    container: gmail-raj
    type: MAIL
    title: "FLOW-312: dropped custom fields — workaround until the fix"
    from: raj
    to: [chioma]
    cc: [grace]
    group: support-readers
    created: 2026-04-16T11:00:00Z
    web_url: https://mail.acme-demo.example/mail/u/raj/eng-0416
    mentions_orgs: [globex]
    body: |
      Hi Chioma,

      Thanks for the clear report on FLOW-312. Grace has found the cause: the mapper
      reads a dot in a field's API name as a nested path, so `region.code` is dropped.

      Workaround Globex can use today: in the mapping editor switch to Advanced and
      write the source field as `["region.code"]` (square brackets and quotes). That
      forces a literal key lookup. Renaming the field without a dot also works but
      changes their API.

      A proper fix is expected the week of 27 April.

      Raj

  - id: mail-eng-0429
