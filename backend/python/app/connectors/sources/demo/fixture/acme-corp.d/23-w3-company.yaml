  - id: cf-wiki-flow-rename
    container: cf-wiki
    type: PAGE
    title: "Acme Sync is now Acme Flow"
    author: elena
    last_modified_by: mateo
    created: 2026-02-17T09:00:00Z
    updated: 2026-03-02T15:10:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1360
    mentions_orgs: [tessera]
    body: |
      ## What happened
      On 1 March 2026 our integration product Acme Sync was renamed **Acme Flow**.

      ## Why
      On 28 January 2026 Tessera Analytics' lawyers objected that "Acme Sync" was too
      close to their TesseraSync trademark. Rather than a long dispute, we decided on
      10 February to rename. Tessera Analytics has since confirmed the matter is closed.

      ## Timeline
      - 10 February: decision.
      - 17 February: announced to staff (this page).
      - 24 February: customer admins emailed.
      - 1 March: new name live in the product, help centre and website.
      - 2 March: repository sync-engine renamed acme/flow-engine (PR #702).

      ## What did not change
      The API path /v1/sync stays until 2027. Webhooks, connectors and customer
      configuration are untouched. Old help-centre links redirect.

      ## How to talk about it
      Say "Acme Flow (formerly Acme Sync)" until 30 June. Some customers will keep saying
      Sync; that's fine, don't correct them.

