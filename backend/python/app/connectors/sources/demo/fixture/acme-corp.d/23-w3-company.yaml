  - id: drive-exec-board-q1
    container: drive-exec
    type: FILE
    title: "Q1 2026 board update"
    owners: [owen]
    last_modified_by: rafael
    created: 2026-04-06T09:00:00Z
    updated: 2026-04-14T20:40:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-board-q1-2026
    mentions_orgs: [northwind, globex]
    body: |
      Board meeting: Thursday 16 April 2026. Quarter ended 31 March 2026.

      ## Headline numbers
      - Revenue: $3.48M for Q1 (Q4 2025: $3.21M).
      - ARR: $14.2M at 31 March, up from $13.1M at 31 December 2025.
      - Net revenue retention: 111% (trailing twelve months).
      - Gross churn: 3.1% (trailing twelve months).
      - Cash runway: 31 months at the Q1 net burn.

      ## Risks
      1. Northwind Traders renewal (30 June; Omar). Early-April export timeouts broke
         their monthly reporting and they told us they were looking at alternatives.
         Fix shipped 14 April; joint check of their first export booked.
      2. Acme Flow reliability. INC-2040 (8–10 April): syncs ran up to six hours behind
         for three customers after the engine moved to Kubernetes. Memory limit raised
         and a lag alert added; postmortem actions tracked by Platform.

      ## Upside
      Globex Corporation expansion from 180 to 750 seats, $212,000 ARR, in negotiation
      (Sofia). Target close end of May.

      ## Team
      Headcount reaches 30 on 20 April when the Payments hire starts. Plan: 36 by the
      end of Q3 through six requisitions, four to open in Q2 and two in Q3.

      ## Asks of the board
      Approve the hiring plan; views on how far we go on the Northwind renewal.

