      ## Who
      Chair: Priya Nair. Members: Yusuf Demir, Grace Liu, Daniel Kim. Guest for Project
      Keel: Tobias Weber.

      ## When
      Every other Thursday, 16:00–16:45 CET. Notes go on this page.

