  - id: cf-wiki-security-training
    container: cf-wiki
    type: PAGE
    title: "Security awareness training 2026"
    author: owen
    last_modified_by: owen
    created: 2026-03-02T09:00:00Z
    updated: 2026-04-21T09:20:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1371
    body: |
      Everyone at Acme completes the annual security awareness course: a 45-minute
      module and a ten-question phishing quiz (pass mark 8).

      **Due: 15 May 2026.**

      ## What it covers
      Phishing and payment-change fraud, handling customer data, reporting a lost device,
      and secrets in code and logs.

      ## How
      Sign in to the training portal with SSO. Completion is recorded automatically;
      the cyber insurer asks for the completion rate.

      ## Change
      21 April: the deadline moved from 30 April to 15 May, because the updated
      phishing module only went live on 20 April.

  - id: cf-wiki-requesting-software
    container: cf-wiki
    type: PAGE
    title: "Requesting software and subscriptions"
    author: ingrid
    last_modified_by: ingrid
    created: 2026-01-20T10:00:00Z
    updated: 2026-04-08T14:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1352
    body: |
      ## The rule
      Any software subscription, whatever it costs, needs finance approval through a
      FIN ticket. This comes from the expense policy; it applies to monthly plans and
      to free tiers that ask for a card.

      ## How to ask
      Open a FIN ticket with: the tool, the price and billing period, the number of seats,
      who owns it, and whether it will hold customer data.

      ## If it holds customer data
      Security review first. The COO approves; allow five working days.

      ## Trials
      A trial of up to 30 days is fine without a ticket if no customer data goes in and
      no card is needed.

      ## Never
      Put a subscription on a personal card and expense it.

  - id: cf-wiki-office-days
    container: cf-wiki
    type: PAGE
    title: "Office and remote days"
    author: tomas
    last_modified_by: tomas
    created: 2026-02-02T10:00:00Z
    updated: 2026-04-14T09:00:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1345
    body: |
      We have offices in Berlin and Lisbon.

      ## Office days
      If you live within 50 km of an office, come in on **Tuesdays and Thursdays**. Other
      days are your choice. If you live further away you are remote, and we pay travel
      for team weeks.

      ## Team weeks
      Each team meets in person for one week a quarter. Book travel through the travel
      tool at least three weeks ahead.

      ## Working abroad
      More than four weeks outside your country of employment needs People approval;
      raise an HR desk ticket.

  - id: cf-wiki-device-policy
    container: cf-wiki
    type: PAGE
    title: "Laptops and devices"
    author: owen
    last_modified_by: yusuf
    created: 2025-11-05T10:00:00Z
    updated: 2026-03-10T11:00:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1320
    body: |
      ## Your laptop
      Company laptops are encrypted and enrolled in device management on day one. Keep
      the operating system updated within 14 days of a release.

      ## Lost or stolen
      Report it **within one hour** to security@acme-demo.example and your manager,
      even at night. We wipe the device remotely and rotate your sessions; you get a
      replacement within two working days. A police report is needed only for theft.

      ## Personal devices
      Slack and email on your phone are fine with the company profile installed.
      Customer data never goes on a personal device.

