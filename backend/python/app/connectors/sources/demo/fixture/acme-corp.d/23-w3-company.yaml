    body: |
      For decision at exec staff on Monday 27 April.

      ## Proposal
      Set up a Customer Success team from 1 June 2026, led by Hannah Schmidt, reporting
      to Owen. Support stays with Bob as it is today.

      ## Why now
      Northwind Traders and Contoso both renew this year, Globex Corporation is
      expanding to 750 seats and Bluebird Health is mid-pilot. Adoption and renewal
      health sit with whoever has time; April showed what that costs.

      ## Scope
      Onboarding and adoption reviews for Enterprise accounts; renewal health checks
      90 days out; the voice of the customer in roadmap reviews.

      ## People
      Hannah moves from technical account management. One new hire: REQ-17, customer
      success manager, posted once this is agreed. The posting should not name the
      team lead until we have told Support.

      ## Cost
      One requisition already inside the six the board approved; no extra budget.

