      - 19 March: running stateful services on Kubernetes (tech talk, see the wiki).
      - 26 March: deploying the connector agent in customer clusters.
      - 9 April: cert-manager issuers, staging vs production, and how not to mix them.

      ## Getting help
      Ask in #platform. For customer-cluster questions about the connector agent, start
      with the help-centre article.

  - id: cf-wiki-talk-stateful-k8s
    container: cf-wiki
    type: PAGE
    title: "Tech talk: running stateful services on Kubernetes"
    author: priya-nair
    last_modified_by: priya-nair
    created: 2026-03-19T17:00:00Z
    updated: 2026-03-20T09:15:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1395
    body: |
      Notes and slides from Thursday's talk (19 March).

      ## Takeaways
      1. StatefulSets give stable names and volumes, not safety: you still need
         PodDisruptionBudgets and a tested restore.
      2. Drain one node at a time and watch the replication lag before the next.
      3. Keep the queue consumers stateless and the state in the managed database;
         most of our services can do this.
      4. Readiness probes must check the dependency the pod actually needs.

      ## Q&A
      Most questions were about cutover order for Project Keel: export first, then the
      Flow engine, then the billing worker and invoicing.

      Thanks to Priya Natarajan for the billing-worker case study on retries during a
      cutover.

  - id: cf-wiki-talk-retries
    container: cf-wiki
    type: PAGE
    title: "Tech talk: retries without thundering herds"
    author: priya
    last_modified_by: priya
    created: 2026-04-02T17:00:00Z
    updated: 2026-04-03T08:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1402
    body: |
      Notes from the 2 April talk.

      ## The problem
      In March twelve billing-worker replicas retried the payments provider on the same
      5-second tick and turned a short blip into a 90-minute delay (INC-2031).

      ## The fix
      Exponential backoff with full jitter, capped at 120 seconds, six attempts, and a
      histogram of the actual delay so you can see the spread.

      ## Q&A
      "Does this change on Kubernetes?" No. The backoff lives in the worker, wherever
      it runs; autoscaling more replicas makes jitter more important, not less.

  - id: cf-wiki-talk-alerting
    container: cf-wiki
    type: PAGE
    title: "Tech talk: alert on symptoms, not causes"
    author: grace
    last_modified_by: grace
    created: 2026-04-16T17:00:00Z
    updated: 2026-04-16T17:30:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1407
    body: |
      Notes from the 16 April talk.

      - Page on what customers feel: sync lag, error rate, failed exports. Not on CPU.
      - Every page needs a runbook link and an owner.
      - Our new Acme Flow lag alert fires at 15 minutes behind for 10 minutes; it would
        have caught last week's delays two hours earlier.
      - Dashboards are for diagnosis, alerts are for waking people up. Keep them apart.

  - id: kb-help-agent-on-k8s
    container: kb-help
    type: KB_FILE
    title: "Running the Acme connector agent on Kubernetes"
    author: daniel
    created: 2026-03-26T14:00:00Z
    web_url: https://kb.acme-demo.example/collections/help-centre/agent-on-kubernetes
    body: |
      Some customers run the connector agent inside their own network. On Kubernetes,
      install it with our Helm chart, `acme/connector-agent` version 2.3 or later.

      ## Resources
      Requests: 250m CPU and 512Mi memory per replica. Limits: 1 CPU and 1Gi. One replica
      handles up to 50 connectors; add replicas beyond that.

      ## Network
      Outbound HTTPS (443) to your Acme region endpoint only. If you use NetworkPolicy,
      allow that egress and DNS; no inbound traffic is needed.

      ## Secrets
      Store the agent token in a Kubernetes Secret and reference it in `values.yaml`;
      never in a ConfigMap.

      ## Supported versions
      Kubernetes 1.27 to 1.30.

