  - id: kb-help-flow-name-faq
    container: kb-help
    type: KB_FILE
    title: "Acme Flow (formerly Acme Sync): name change FAQ"
    author: mateo
    created: 2026-03-01T08:00:00Z
    web_url: https://kb.acme-demo.example/collections/help-centre/flow-name-faq
    body: |
      **Is Acme Flow a new product?**
      No. Acme Sync was renamed Acme Flow on 1 March 2026. Same product, same team.

      **Do I need to change my API calls or webhooks?**
      No. The API path /v1/sync keeps working until 2027, and we will give at least
      twelve months' notice before any change.

      **Do I need to reconnect my connectors?**
      No. Connections, schedules and field mappings are unchanged.

      **Why the new name?**
      The old name was too close to another company's trademark.

      **Will my invoice change?**
      Only the name of the line item, from April invoices onwards.

