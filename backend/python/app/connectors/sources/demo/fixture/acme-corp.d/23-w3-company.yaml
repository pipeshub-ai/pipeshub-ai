  - id: kb-help-reset-sso
    container: kb-help
    type: KB_FILE
    title: "Reset SSO for a customer workspace"
    author: chioma
    created: 2026-03-03T11:00:00Z
    web_url: https://kb.acme-demo.example/collections/help-centre/reset-sso
    body: |
      Use this when a customer's identity provider changed or its certificate expired
      and nobody can sign in. You need the **owner** role on the workspace; admins
      cannot do this.

      1. In Admin → Security, turn off **Enforce SSO**. Owners can now sign in with
         email and password.
      2. Under SAML settings choose **Reset IdP metadata**, then upload the new metadata
         XML or paste the metadata URL.
      3. Test with **Sign in with SSO** in a private window.
      4. Turn **Enforce SSO** back on.

      If the owner is locked out too, Support can send a one-time recovery link after
      verifying the request with a second owner.

  - id: kb-help-large-exports
    container: kb-help
    type: KB_FILE
    title: "Downloading a large workspace export"
    author: mateo
    created: 2026-04-21T09:00:00Z
    web_url: https://kb.acme-demo.example/collections/help-centre/large-exports
    body: |
      Since 14 April, exports of more than 5,000 records run in the background.

      1. Choose **Export workspace**. You'll see "Export in progress".
      2. We email you a download link, usually within a few minutes.
      3. The link works for 24 hours. After that, start a new export.

      Smaller exports still download immediately.

