  - id: cf-wiki-interview-rubric
    container: cf-wiki
    type: PAGE
    title: "Interview rubric"
    author: zara
    last_modified_by: tomas
    created: 2026-01-12T10:00:00Z
    updated: 2026-03-30T14:20:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1388
    body: |
      Every interview at Acme is scored on the same four dimensions:

      1. **Problem solving** — breaks a problem down, checks assumptions.
      2. **Craft** — quality of the work itself: code, writing, a customer reply.
      3. **Collaboration** — listens, explains, takes and gives feedback.
      4. **Ownership** — follows through, owns mistakes, thinks about the customer.

      Each dimension is scored 1 to 4 (1 clear concern, 2 some concern, 3 meets the bar,
      4 well above).

      ## Outcomes
      - **Strong hire:** no score below 3.
      - **Hire:** average of 3 or more with at most one 2.
      - **No hire:** anything else.

      ## Process
      File your scorecard in the requisition folder within 24 hours, before you talk to
      other interviewers. The debrief happens within two working days of the onsite.

      ## Change log
      30 March 2026: "strong hire" used to mean an average of 3 or more; it now needs no
      score below 3. Scorecards older than this date are not re-scored.

  - id: cf-wiki-referral-policy
    container: cf-wiki
    type: PAGE
    title: "Employee referral policy"
    author: tomas
    last_modified_by: zara
    created: 2025-09-01T10:00:00Z
    updated: 2026-04-02T09:40:00Z
    web_url: https://confluence.acme-demo.example/wiki/spaces/ACME/pages/1212
    body: |
      ## Bonus
      If someone you refer is hired, you get **$3,000**, paid with the payroll after your
      referral's 90th day at Acme. (Raised from $2,000 on 2 April 2026.)

      ## How to refer
      Send the CV and a line on how you know the person to the talent partner, or use the
      referral form on the careers page. Tell the candidate first.

      ## Who is not eligible
      Hiring managers for their own requisitions, interviewers on the same loop, and
      the People team.

