    title: "Engineering on-call handbook"
    author: marcus
    created: 2025-11-10T10:00:00Z
    updated: 2026-02-03T09:15:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-oncall-handbook
    body: |
      ## Rota
      One primary and one secondary per team, rotating weekly. Swaps are recorded
      in the rota by the Thursday before.

      ## Public holidays
      On-call over a public holiday is voluntary and paid at 1.5× the standard
      on-call rate. Nobody is scheduled on a public holiday without agreeing to it.

      ## Escalation
      SEV-1: page the incident commander immediately. SEV-2: page the owning
      team's on-call; incident commander is optional. Open an incident channel
      within 15 minutes for SEV-2 and above.

      ## Postmortems
      Every SEV-2 or higher gets a blameless postmortem within five working days,
      owned by the on-call engineer at the time of the incident.

