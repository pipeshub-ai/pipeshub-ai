  # ---------------------------------------------------------------------------
  # Story 7 — holiday carry-over and onboarding (HR)
  # ---------------------------------------------------------------------------

  - id: drive-people-handbook
    container: drive-people
    type: FILE
    title: "Employee handbook"
    author: tomas
    created: 2025-06-01T10:00:00Z
    updated: 2025-12-01T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-handbook
    body: |
      **Owner:** Tomás Rivera (People)

      ## Working hours
      Core hours are 10:00 to 16:00 in your time zone.

      ## Annual leave
      Everyone gets 25 days of paid annual leave a year. You can bring up to three
      days of unused leave into the next year; anything above that is lost on
      31 December.

      ## Remote work
      Work from anywhere in your country of employment. Working abroad for more than
      four weeks needs People approval.

  - id: slack-people-0302-1
    container: slack-people
    type: MESSAGE
    title: "#people — Tomás Rivera, 2026-03-02 09:30"
    author: tomas
    created: 2026-03-02T09:30:00Z
    thread: slack-people-0302
    body: |
      Change for 2026: you can now carry up to five days of unused annual leave
      into the next year (it was three). The handbook will be updated next month;
      this message is the policy until then.

  - id: slack-people-0302-2
    container: slack-people
    type: MESSAGE
    title: "#people — Tomás Rivera, 2026-03-02 09:34"
    author: tomas
    created: 2026-03-02T09:34:00Z
    thread: slack-people-0302
    body: |
      To answer the first question: yes, it applies to leave left over at the end
      of 2026, so the first carry-over under the new limit happens in January 2027.

  - id: sn-hr-1203
    container: servicenow-hr
    type: TICKET
    title: "ServiceNow HR0001203: How much leave can I carry into next year?"
    author: sam
    created: 2026-03-11T10:00:00Z
    updated: 2026-03-12T09:00:00Z
    web_url: https://servicenow.acme-demo.example/sn_hr_core_case.do?number=HR0001203
    body: |
      **Status:** Closed

      Question: the handbook says three days, but I heard it changed.
      Answer (People team): it changed on 2 March 2026 — up to five days now. The
      handbook update is pending; the #people announcement is the current policy.

  - id: drive-people-onboarding-eng
    container: drive-people
    type: FILE
    title: "Onboarding checklist — engineers"
    author: tomas
    created: 2025-08-01T10:00:00Z
    updated: 2026-02-10T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-onboarding-engineers
    body: |
      ## Day 1
      Laptop, accounts (GitHub, Jira, Slack), and a welcome session with your
      manager and your onboarding buddy.

      ## Week 1
      - Ship a small change to production with your buddy.
      - Read the engineering on-call handbook; you shadow an on-call week in your
        second month, not your first.
      - Read the last two postmortems from your team.

      ## Month 1
      Take ownership of one small project; agree your 90-day goals with your manager.

  - id: drive-people-parental-leave
    container: drive-people
    type: FILE
    title: "Parental leave policy"
    author: tomas
    created: 2025-05-01T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-parental-leave
    body: |
      Every new parent gets 20 weeks of fully paid leave, to be taken within 12
      months of the birth or adoption. Tell your manager and the People team at
      least eight weeks before your leave starts.

  - id: drive-people-comp-bands
    container: drive-people
    type: FILE
    title: "Compensation bands 2026"
    author: tomas
    created: 2026-01-05T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-comp-bands-2026
    group: people-managers
    body: |
      **People managers only**

      Engineering, United States base salary bands for 2026:
      - L4 (engineer): $128,000 to $150,000
      - L5 (senior engineer): $152,000 to $168,000
      - L6 (staff engineer): $175,000 to $205,000

questions:
  - id: q1
    ask: "Why was the payment service architecture changed, and how was the decision made?"
    must_cite: [gh-pr-482, jira-inc-2031, slack-eng-payments-0315, drive-billing-resilience]
    min_cite: 3
    must_not_cite: [gh-pr-211, jira-sup-114, drive-export-runbook, drive-pricing-2026, drive-oncall-handbook]
    personas: { alice: cites, bob: cites }

  - id: q2
    ask: "Which customers reported export timeouts, and what fixed it?"
    # The answer names the customers from the ServiceNow cases every time, but the
    # model doesn't always attach a citation marker to a bulleted list; the fix
    # citation is the reliable one. ServiceNow cited is the stretch, tracked separately.
    must_cite_any_of: [gh-pr-211, gh-issue-207, drive-export-runbook]
    stretch_cite_any_of: [sn-4471, sn-4478, sn-4480]
    answer_must_mention: ["Northwind", "Contoso", "Fabrikam", "queue"]
    must_not_cite: [gh-pr-482, jira-inc-2031, drive-billing-resilience, drive-pricing-2026]
    personas: { alice: cites, bob: cites }

  - id: q3
    ask: "What's our policy on being on-call over a public holiday?"
    must_cite: [drive-oncall-handbook]
    must_not_cite: [gh-pr-482, jira-inc-2031, gh-pr-211, jira-sup-114, drive-pricing-2026, drive-release-notes-q2]
    personas: { alice: cites, bob: cites }

  - id: q4
    ask: "Who reviewed and approved PR #482 in the billing worker, and what did Dana ask for before it merged?"
    must_cite_any_of: [gh-pr-482, gh-pr-482-c1, gh-pr-482-c2, slack-eng-payments-0315]
    answer_must_mention: ["Marcus Webb", "Dana Okafor", "histogram"]
    must_not_cite: [jira-inc-2031, drive-billing-resilience, gh-pr-211]
    personas: { alice: cites, bob: cites }

  - id: q5
    ask: "What is the enterprise pricing strategy for 2026?"
    must_cite: [drive-pricing-2026]
    must_not_cite: [gh-pr-482]
    answer_must_mention: ["platform fee", "48"]
    # For Alice, "none" means: no restricted record cited and the answer says it found nothing.
    # Citing an unrestricted near-miss (the release notes) while saying so is correct behaviour.
    restricted: [drive-pricing-2026, slack-pricing-0402]
    # Phrases only the restricted records contain; an answer that repeats one has leaked.
    restricted_facts: ["platform fee", "usage band", "$48,000", "$48k", "early-migration"]
    personas: { alice: none, bob: cites }

