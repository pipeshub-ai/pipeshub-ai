  - id: jira-sup-114
    container: jira-sup
    type: TICKET
    title: "SUP-114: Escalation — workspace export times out for large workspaces"
    author: sam
    created: 2026-04-03T10:15:00Z
    updated: 2026-04-14T12:00:00Z
    web_url: https://acme-demo.atlassian.net/browse/SUP-114
    relations:
      - { type: RELATED, to: sn-4471 }
      - { type: RELATED, to: sn-4478 }
      - { type: RELATED, to: sn-4480 }
    body: |
      **Priority:** High · **Reporter:** Sam Reyes · **Status:** Done

      Three customers (ServiceNow cases CS0004471, CS0004478, CS0004480) report that full-workspace
      export fails with "Request timed out" after 30 seconds. Reproduced internally
      at ~20k records and above.

      Customer-facing workaround: export per project. Needs an engineering fix —
      exports for large workspaces cannot complete inside a single request.

      Engineering tracking: acme/svc-export issue #207. Resolved by PR #211
      (exports moved to a background queue with a download link), released
      2026-04-14. Customers on all three tickets notified — see the ServiceNow cases
      for who was affected.

  - id: slack-eng-exports-0404-1
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Sam Reyes, 2026-04-04 09:10"
    author: sam
    created: 2026-04-04T09:10:00Z
    thread: slack-eng-exports-0404
    body: |
      Escalating SUP-114 here — three customers now with export timeouts on big
      workspaces. It's always exactly 30 seconds, which smells like the API gateway
      limit rather than the export itself.

  - id: slack-eng-exports-0404-2
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Dana Okafor, 2026-04-04 09:18"
    author: dana
    created: 2026-04-04T09:18:00Z
    thread: slack-eng-exports-0404
    body: |
      It is the gateway limit. The export runs synchronously inside the request
      handler and streams the zip back; anything over ~20k records can't finish
      in 30s. We should have made this a background job from the start.

  - id: slack-eng-exports-0404-3
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Alice Chen, 2026-04-04 09:25"
    author: alice
    created: 2026-04-04T09:25:00Z
    thread: slack-eng-exports-0404
    body: |
      I can pick this up. Plan: enqueue the export, write the zip to object
      storage, email a signed download link, and show "Export in progress" in the
      UI. Filing it as #207 in svc-export.

  - id: slack-eng-exports-0404-4
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Sam Reyes, 2026-04-04 09:27"
    author: sam
    created: 2026-04-04T09:27:00Z
    thread: slack-eng-exports-0404
    body: |
      Thanks Alice. I'll keep the per-project workaround in the tickets until it
      ships. Can we get a runbook for support once it's done?

  - id: slack-eng-exports-0404-5
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Alice Chen, 2026-04-04 09:28"
    author: alice
    created: 2026-04-04T09:28:00Z
    thread: slack-eng-exports-0404
    body: |
      Yes — "Export runbook" in the Support Drive folder, I'll write it alongside
