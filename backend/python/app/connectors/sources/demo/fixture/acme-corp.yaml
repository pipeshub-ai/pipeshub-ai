      **Two weeks after launch (21 April – 5 May)**

      - Admin email: 41% open rate, 9% click-through.
      - 312 background exports scheduled in the first week.
      - 2 support tickets about exports in two weeks, down from 14 in the two
        weeks before the fix.
      - Account executives shared the note with Northwind, Contoso and Fabrikam.

      ## Learnings
      Waiting a week after the engineering release cost nothing and meant the
      launch had a real customer story to tell.

  - id: drive-mkt-messaging
    container: drive-marketing
    type: FILE
    title: "Messaging guide 2026"
    author: nina
    created: 2026-01-20T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-messaging-2026
    body: |
      Describe features by what the customer can now do, not by how it works.
      Name customers only with their written permission. Avoid "revolutionary",
      "seamless" and "game-changing".

  - id: drive-mkt-insights-embargo
