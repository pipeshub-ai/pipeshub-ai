    type: FILE
    title: "Next launch — embargoed brief"
    author: nina
    created: 2026-04-28T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-next-launch
    group: launch-core
    body: |
      **Launch core team only — embargoed**

      Our next launch is Acme Insights, an analytics add-on built on the export
      pipeline. Announcement date: September 9. Engineering lead: Alice Chen.
      Do not share outside the launch core team before the announcement.

  # ---------------------------------------------------------------------------
  # Story 6 — the Contoso VAT invoice (Finance, from a support ticket)
  # ---------------------------------------------------------------------------

  - id: jira-fin-37
    container: jira-fin
    type: TICKET
    title: "FIN-37: Reissue Contoso invoice INV-2026-0412 without VAT on the exempt line"
    author: ingrid
    created: 2026-04-20T14:00:00Z
    updated: 2026-04-22T10:00:00Z
    web_url: https://jira.acme-demo.example/browse/FIN-37
    body: |
      **Status:** Done · **Related:** SUP-121

      Contoso's April invoice charged VAT on a line that is exempt for them as an
      EU business customer with a valid VAT number. Credit note issued and the
      invoice reissued on 22 April. Root cause tracked in FIN-38.

  - id: jira-fin-38
    container: jira-fin
    type: TICKET
    title: "FIN-38: Billing applies VAT to reverse-charge EU customers"
    author: ingrid
    created: 2026-04-21T09:00:00Z
    updated: 2026-05-06T15:00:00Z
    web_url: https://jira.acme-demo.example/browse/FIN-38
    body: |
      **Status:** Done · **Related:** FIN-37, SUP-121

      The billing system's VAT rule ignored the reverse-charge flag for EU business
      customers when a line was added mid-term. Fixed on 6 May: the rule now
      checks the customer's validated VAT number for every line. Three other
      affected invoices (all April) were found and reissued.

  - id: jira-fin-40
    container: jira-fin
    type: TICKET
    title: "FIN-40: Renew the monitoring vendor contract"
    author: ingrid
    created: 2026-03-10T10:00:00Z
    web_url: https://jira.acme-demo.example/browse/FIN-40
    body: |
      **Status:** In progress. Annual renewal due 1 June; engineering confirmed the
      same plan size. Awaiting the vendor's quote.

  - id: drive-fin-expense-policy
    container: drive-finance
    type: FILE
    title: "Expense policy"
    author: ingrid
    created: 2025-07-01T10:00:00Z
    updated: 2026-01-15T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-expense-policy
    body: |
      **Owner:** Ingrid Larsen (finance)

      ## Approvals
      - Up to **$250** per purchase: no approval needed; submit the receipt within
        30 days.
      - $250 to $2,500: your manager approves.
      - Over $2,500, and any software subscription: finance approves, via a FIN
        ticket.

      ## Travel
      Book through the travel tool. Economy class for flights under six hours.

  - id: drive-fin-q2-budget
    container: drive-finance
