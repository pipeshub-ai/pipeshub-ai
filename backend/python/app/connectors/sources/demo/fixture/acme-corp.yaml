    body: |
      **For:** Support · **Owner:** Alice Chen · **Updated:** 2026-04-14

      ## How exports work now (since 2026-04-14)
      - Workspaces under 5,000 records: export is immediate, as before.
      - Larger workspaces: the export is queued. The customer sees "Export in
        progress" and receives an email with a download link within a few minutes.
        Links are valid for 24 hours.

      ## If a customer reports a timeout
      1. Check the workspace size in the admin panel.
      2. If it's over 5,000 records and they saw a timeout, they are on a version
         before 2026-04-14 — confirm they've refreshed and try again.
      3. If the queued export hasn't emailed a link within 30 minutes, escalate in
         #eng-exports with the job id from the admin panel.

      ## Background
      This replaced the synchronous export that hit the 30-second gateway limit
      (SUP-114, svc-export #207, fixed by PR #211).

