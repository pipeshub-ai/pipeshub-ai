  - id: drive-pricing-2026
    container: drive-pricing
    type: FILE
    title: "Enterprise pricing strategy 2026"
    author: lena
    created: 2026-03-28T09:00:00Z
    updated: 2026-04-02T17:15:00Z
    web_url: https://docs.google.com/document/d/acme-pricing-2026
    group: pricing-committee
    body: |
      **Owner:** Lena Fischer · **Restricted to the pricing committee**

      ## Direction for 2026
      Move Enterprise from per-seat pricing to a platform fee plus usage bands.
      Target: a $48,000 annual platform fee covering up to 250 seats, with usage
      bands at 250, 1,000, and 5,000 seats. Existing customers are grandfathered
      through their current term and offered a 12% discount to migrate early.

      ## Rationale
      Per-seat pricing penalises the broad rollouts we most want. Three of the five
      largest expansion deals last year stalled on seat count.

      ## Timing
      Announce to the sales team in May; new contracts from 1 July; public price
      page update in Q3.

  - id: slack-pricing-0402-1
    container: slack-pricing-committee
    type: MESSAGE
    title: "#pricing-committee — Lena Fischer, 2026-04-02 16:50"
    author: lena
    created: 2026-04-02T16:50:00Z
    thread: slack-pricing-0402
    group: pricing-committee
    body: |
      Final draft of the 2026 enterprise pricing strategy is in the Pricing folder.
