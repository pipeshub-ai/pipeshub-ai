    title: "Q2 2026 budget review"
    author: ingrid
    created: 2026-04-30T10:00:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-budget-q2-2026
    body: |
      ## Summary
      Spend is 4% under budget for the quarter to date. Card processing fees rose
      with renewal volume, in line with forecast. The April invoice reissues
      (FIN-37, FIN-38) cost about $1,900 in credit notes.

      ## Watch items
      Monitoring vendor renewal (FIN-40) and travel for the June customer reviews.

