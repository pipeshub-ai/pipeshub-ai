  # ---------------------------------------------------------------------------

  - id: drive-oncall-handbook
    container: drive-engineering
    type: FILE
    title: "Engineering on-call handbook"
    author: marcus
    created: 2025-11-10T10:00:00Z
    updated: 2026-02-03T09:15:00Z
    web_url: https://docs.google.com/document/d/acme-oncall-handbook
    body: |
      ## Rota
      One primary and one secondary per team, rotating weekly. Swaps are recorded
      in the rota by the Thursday before.

      ## Public holidays
      On-call over a public holiday is voluntary and paid at 1.5× the standard
      on-call rate. Nobody is scheduled on a public holiday without agreeing to it.

      ## Escalation
      SEV-1: page the incident commander immediately. SEV-2: page the owning
      team's on-call; incident commander is optional. Open an incident channel
      within 15 minutes for SEV-2 and above.

      ## Postmortems
      Every SEV-2 or higher gets a blameless postmortem within five working days,
      owned by the on-call engineer at the time of the incident.

  - id: drive-release-notes-q2
    container: drive-engineering
    type: FILE
    title: "Release notes — April 2026"
    author: marcus
    created: 2026-04-30T16:00:00Z
    web_url: https://docs.google.com/document/d/acme-release-notes-2026-04
    body: |
      ## svc-export
      - Large workspace exports (over 5,000 records) now run in the background and
        deliver a download link by email (PR #211).

      ## svc-billing-worker
      - Retries now use exponential backoff with jitter; renewals may take longer
        to give up on a failing charge (PR #482, March).
      - Dependency bump: stripe-python 9.4 (PR #490).

      ## svc-search
      - Query logging now excludes personal data (PR #133).

