records:

  # ---------------------------------------------------------------------------
  # Story 1 — the billing worker retries (Engineering)
  # ---------------------------------------------------------------------------

  - id: jira-inc-2031
    container: jira-inc
    type: TICKET
    title: "INC-2031: Synchronised billing retries overloaded the payments provider"
    author: marcus
    created: 2026-03-14T11:05:00Z
    updated: 2026-03-18T16:20:00Z
    web_url: https://jira.acme-demo.example/browse/INC-2031
    body: |
      **Severity:** SEV-2 · **Owner:** Marcus Webb · **Status:** Resolved

      ## Impact
      Roughly 3,400 subscription renewals were delayed by up to 90 minutes on
      2026-03-14. No charges were lost or duplicated.

      ## Timeline (UTC)
      - 09:12 Stripe returned elevated 429 (rate-limit) responses after a brief upstream blip.
      - 09:13 All 12 billing worker replicas began retrying failed charges on a fixed 5-second schedule.
      - 09:20 Retry volume reached 12× steady state; Stripe's rate limiting tightened further.
      - 09:45 On-call (Marcus) paused the workers to let the queue drain.
      - 10:40 Workers resumed at reduced concurrency; backlog cleared.

      ## Root cause
      The billing worker used a fixed, un-jittered retry interval. When a transient
      upstream failure hit every replica at once, every replica retried at the same
      moment, turning a small blip into a sustained overload — a thundering herd.

      ## Action items
      1. Replace the fixed retry with exponential backoff and jitter — PR #482 (Priya).
      2. Add a retry-delay histogram so this pattern is visible on the dashboard — PR #482.
      3. Write up the resilience approach — "Billing worker resilience" design doc (Dana).

  - id: slack-eng-payments-0315-1
    container: slack-eng-payments
    type: MESSAGE
    title: "#eng-payments — Marcus Webb, 2026-03-15 08:41"
    author: marcus
    created: 2026-03-15T08:41:00Z
    thread: slack-eng-payments-0315
    body: |
      Postmortem for yesterday's INC-2031 is up. Short version: every worker retried
      Stripe on the same 5s tick and we DDoS'd ourselves.

  - id: slack-eng-payments-0315-2
    container: slack-eng-payments
    type: MESSAGE
    title: "#eng-payments — Priya Natarajan, 2026-03-15 08:47"
    author: priya
    created: 2026-03-15T08:47:00Z
    thread: slack-eng-payments-0315
    body: |
      I'll take the fix. Proposal: exponential backoff with full jitter, cap at 2
      minutes, and bump max attempts to 6 since they'll be spread out. That's the
      pattern from the AWS architecture blog.

  - id: slack-eng-payments-0315-3
    container: slack-eng-payments
    type: MESSAGE
    title: "#eng-payments — Dana Okafor, 2026-03-15 08:52"
    author: dana
    created: 2026-03-15T08:52:00Z
    thread: slack-eng-payments-0315
    body: |
      +1 on full jitter over equal jitter — with 12 replicas we want the spread.
      Can we also emit the actual delay as a histogram? I want to see the
      distribution on the dashboard, not guess.

  - id: slack-eng-payments-0315-4
    container: slack-eng-payments
    type: MESSAGE
    title: "#eng-payments — Priya Natarajan, 2026-03-15 08:55"
    author: priya
    created: 2026-03-15T08:55:00Z
    thread: slack-eng-payments-0315
    body: |
      Yes, adding `billing_retry_delay_seconds`. PR #482 incoming this week.

  - id: slack-eng-payments-0315-5
    container: slack-eng-payments
    type: MESSAGE
    title: "#eng-payments — Marcus Webb, 2026-03-15 09:02"
    author: marcus
    created: 2026-03-15T09:02:00Z
    thread: slack-eng-payments-0315
    body: |
      Great. Dana, can you write up the resilience approach as a short design doc
      so we don't re-derive this next year?

  - id: slack-eng-payments-0315-6
    container: slack-eng-payments
    type: MESSAGE
    title: "#eng-payments — Dana Okafor, 2026-03-15 09:03"
    author: dana
    created: 2026-03-15T09:03:00Z
    thread: slack-eng-payments-0315
    body: |
      On it — "Billing worker resilience", in the Engineering Drive folder.

  - id: drive-billing-resilience
    container: drive-engineering
    type: FILE
    title: "Billing worker resilience"
    author: dana
    created: 2026-03-17T14:00:00Z
    updated: 2026-03-19T10:30:00Z
    web_url: https://docs.acme-demo.example/document/d/acme-billing-resilience
    body: |
      **Author:** Dana Okafor · **Status:** Approved · **Last updated:** 2026-03-19

      ## Context
      The billing worker charges subscription renewals through Stripe. INC-2031
      showed that our retry strategy could turn a brief upstream failure into a
      self-inflicted outage, because all replicas retried in lockstep.

      ## Decision
      Retries use **exponential backoff with full jitter** so that retry load is
      spread across time and across replicas, and a transient provider error
      decays instead of amplifying. The base delay, cap and attempt limit are set
      in the implementing pull request, not here.

      ## How this was decided
      The options — fixed interval, backoff without jitter, equal jitter, full
      jitter — and the choice of max attempts were discussed in #eng-payments on
      2026-03-15, the day after the incident. That thread is the record of the
      reasoning; this document records the outcome.

      ## Observability
      `billing_retry_delay_seconds` (histogram) and `billing_retry_attempt_total`
      (counter) are on the Payments dashboard.

      ## Implemented in
      PR #482 in acme/svc-billing-worker, merged 2026-03-21.

  - id: gh-pr-482
    container: gh-svc-billing-worker
    type: PULL_REQUEST
    title: "PR #482: Add jittered exponential backoff to the billing worker"
    author: priya
    created: 2026-03-18T15:10:00Z
    updated: 2026-03-21T11:45:00Z
    web_url: https://github.acme-demo.example/svc-billing-worker/pull/482
    relations:
      - { type: RELATED, to: jira-inc-2031 }
      - { type: RELATED, to: drive-billing-resilience }
    body: |
      **Merged** 2026-03-21 · **Reviewers:** Marcus Webb (approved), Dana Okafor (approved after her requested histogram-bucket change)
      **References:** INC-2031

      ## Summary
      Replaces the fixed 5-second retry in `charge_retry.py` with exponential
      backoff (base 2s, cap 120s) plus full jitter. Retries across worker replicas
      are no longer synchronised.

      ## Why
      During INC-2031 on 2026-03-14, all 12 billing worker replicas retried failed
      charges on the same 5-second cadence. Stripe rate-limited us, which produced
      more failures, which produced more synchronised retries. See the postmortem
      and the #eng-payments thread from 2026-03-15.

      ## Changes
      - `charge_retry.py`: `backoff = min(120, 2 ** attempt) * random.uniform(0, 1)`
      - `worker_config.yaml`: `max_attempts` raised from 3 to 6
      - Metrics: new `billing_retry_delay_seconds` histogram

      ## Review
      - Dana Okafor requested changes: add an explicit 120s bucket to the
        `billing_retry_delay_seconds` histogram so the cap is visible on the
        dashboard. Added in the second revision; Dana then approved.
      - Marcus Webb approved and asked for the `max_attempts` change to be
        noted in the release notes for support.

  - id: gh-pr-482-c1
    container: gh-svc-billing-worker
    type: COMMENT
    title: "Review comment on PR #482 — Dana Okafor"
    author: dana
    created: 2026-03-19T09:20:00Z
    parent: gh-pr-482
    body: |
      Dana Okafor requested changes before merge: please add an explicit 120s
      bucket to the `billing_retry_delay_seconds` histogram so the cap shows up
      as its own bucket on the dashboard. Otherwise this is exactly the
      full-jitter shape we discussed — approving once that is in.

  - id: gh-pr-482-c2
    container: gh-svc-billing-worker
    type: COMMENT
    title: "Review comment on PR #482 — Marcus Webb"
    author: marcus
    created: 2026-03-20T17:05:00Z
    parent: gh-pr-482
    body: |
      Marcus Webb: Approved. Please note the max_attempts change in the release
      notes — support will want to know renewals can now take longer to give up.

  # ---------------------------------------------------------------------------
  # Story 2 — export timeouts (Support → Engineering)
  # ---------------------------------------------------------------------------

  - id: sn-4471
    container: servicenow
    type: TICKET
    title: "ServiceNow CS0004471: Export timeout on full-workspace export — Northwind Traders"
    author: sam
    created: 2026-04-02T13:12:00Z
    updated: 2026-04-09T10:00:00Z
    web_url: https://servicenow.acme-demo.example/sn_customerservice_case.do?number=CS0004471
    body: |
      **Customer:** Northwind Traders (Enterprise) · **Status:** Solved

      Northwind Traders reports that "Export workspace" spins for about 30 seconds and then
      shows "Request timed out." Their workspace has ~48,000 records. Reproduced on
      our side with a similar-sized workspace: the export request is cut off at the
      30-second gateway limit.

      Workaround given: export per-project instead of the whole workspace.
      Escalated to engineering as SUP-114 on 2026-04-03.

  - id: sn-4478
    container: servicenow
    type: TICKET
    title: "ServiceNow CS0004478: Export timeout, twice in one day — Contoso"
    author: sam
    created: 2026-04-03T09:40:00Z
    updated: 2026-04-09T10:05:00Z
    web_url: https://servicenow.acme-demo.example/sn_customerservice_case.do?number=CS0004478
    body: |
      **Customer:** Contoso (Enterprise) · **Status:** Solved

      Contoso is the second customer this week reporting export timeouts on a large workspace (about
      61,000 records). Same symptom as #4471: 30 seconds, then "Request timed out."
      Linked to SUP-114. Customer accepted the per-project workaround for now and
      asked to be told when full-workspace export works again.

  - id: sn-4480
