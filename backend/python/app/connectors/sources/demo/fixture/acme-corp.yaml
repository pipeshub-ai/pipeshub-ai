  - id: jira-sup-114
    container: jira-sup
    type: TICKET
    title: "SUP-114: Escalation — workspace export times out for large workspaces"
    author: sam
    created: 2026-04-03T10:15:00Z
    updated: 2026-04-14T12:00:00Z
    web_url: https://jira.acme-demo.example/browse/SUP-114
    relations:
      - { type: RELATED, to: sn-4471 }
      - { type: RELATED, to: sn-4478 }
      - { type: RELATED, to: sn-4480 }
    body: |
      **Priority:** High · **Reporter:** Sam Reyes · **Status:** Done

      Three customers (ServiceNow cases CS0004471, CS0004478, CS0004480) report that full-workspace
      export fails with "Request timed out" after 30 seconds. Reproduced internally
      at ~20k records and above.

      Customer-facing workaround: export per project. Needs an engineering fix —
      exports for large workspaces cannot complete inside a single request.

      Engineering tracking: acme/svc-export issue #207. Resolved by PR #211
      (exports moved to a background queue with a download link), released
      2026-04-14. Customers on all three tickets notified — see the ServiceNow cases
      for who was affected.

  - id: slack-eng-exports-0404-1
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Sam Reyes, 2026-04-04 09:10"
    author: sam
    created: 2026-04-04T09:10:00Z
    thread: slack-eng-exports-0404
    body: |
      Escalating SUP-114 here — three customers now with export timeouts on big
      workspaces. It's always exactly 30 seconds, which smells like the API gateway
      limit rather than the export itself.

  - id: slack-eng-exports-0404-2
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Dana Okafor, 2026-04-04 09:18"
    author: dana
    created: 2026-04-04T09:18:00Z
    thread: slack-eng-exports-0404
    body: |
      It is the gateway limit. The export runs synchronously inside the request
      handler and streams the zip back; anything over ~20k records can't finish
      in 30s. We should have made this a background job from the start.

  - id: slack-eng-exports-0404-3
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Alice Chen, 2026-04-04 09:25"
    author: alice
    created: 2026-04-04T09:25:00Z
    thread: slack-eng-exports-0404
    body: |
      I can pick this up. Plan: enqueue the export, write the zip to object
      storage, email a signed download link, and show "Export in progress" in the
      UI. Filing it as #207 in svc-export.

  - id: slack-eng-exports-0404-4
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Sam Reyes, 2026-04-04 09:27"
    author: sam
    created: 2026-04-04T09:27:00Z
    thread: slack-eng-exports-0404
    body: |
      Thanks Alice. I'll keep the per-project workaround in the tickets until it
      ships. Can we get a runbook for support once it's done?

  - id: slack-eng-exports-0404-5
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Alice Chen, 2026-04-04 09:28"
    author: alice
    created: 2026-04-04T09:28:00Z
    thread: slack-eng-exports-0404
    body: |
      Yes — "Export runbook" in the Support Drive folder, I'll write it alongside
      the PR.

  - id: slack-eng-exports-0404-6
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Dana Okafor, 2026-04-04 09:31"
    author: dana
    created: 2026-04-04T09:31:00Z
    thread: slack-eng-exports-0404
    body: |
      One thing: keep the synchronous path for small workspaces (say under 5k
      records) so the common case stays instant. Only queue when it would time out.

  - id: slack-eng-exports-0404-7
    container: slack-eng-exports
    type: MESSAGE
    title: "#eng-exports — Alice Chen, 2026-04-04 09:33"
    author: alice
    created: 2026-04-04T09:33:00Z
    thread: slack-eng-exports-0404
    body: |
      Good call, will add a threshold. Small exports stay synchronous, large ones
      go to the queue.

  - id: gh-issue-207
    container: gh-svc-export
    type: TICKET
    title: "Issue #207: Full-workspace export blocks the request past the 30s gateway limit"
    author: alice
    created: 2026-04-04T09:40:00Z
    updated: 2026-04-14T11:00:00Z
    web_url: https://github.acme-demo.example/svc-export/issues/207
    relations:
      - { type: RELATED, to: jira-sup-114 }
    body: |
      **Status:** Closed by #211

      Export for workspaces above roughly 20,000 records cannot finish inside the
      API gateway's 30-second request limit, so customers see "Request timed out"
      (support escalation SUP-114; three enterprise customers affected).

      Proposed fix: move large exports to a background queue. Enqueue the job,
      write the archive to object storage, email a signed download link, and show
      progress in the UI. Keep the synchronous path below a size threshold so
      small exports stay instant.

  - id: gh-pr-211
    container: gh-svc-export
    type: PULL_REQUEST
    title: "PR #211: Move large workspace exports to a background queue"
    author: alice
    created: 2026-04-09T16:30:00Z
    updated: 2026-04-14T10:50:00Z
    web_url: https://github.acme-demo.example/svc-export/pull/211
    relations:
      - { type: IMPLEMENTS, to: gh-issue-207 }
      - { type: RELATED, to: drive-export-runbook }
    body: |
      **Merged** 2026-04-14 · **Reviewers:** Dana Okafor (approved), Marcus Webb (approved)
      **Closes** #207

      ## Summary
      Fixes the export timeouts support escalated in SUP-114: Northwind Traders,
      Contoso and Fabrikam saw "Request timed out" when a full-workspace export ran
      past the gateway's 30-second limit.

      Workspace exports above 5,000 records are now queued instead of run inside
      the request. The worker writes the archive to object storage and emails a
      signed download link (valid 24 hours). Exports under the threshold keep the
      existing synchronous path.

      ## Changes
      - New `ExportJob` queue consumer in `export_worker.py`
      - `POST /export` returns `202 Accepted` with a job id when queued
      - UI shows "Export in progress — we'll email you a link"
      - `export_threshold_records` config (default 5000)

      ## Rollout
      Released 2026-04-14. Support notified via SUP-114; runbook in the Support
      Drive folder.

