[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --timeout=30
filterwarnings =
    ignore:invalid escape sequence.*:SyntaxWarning:^talon(\..+)?$
markers =
    integration: marks tests as integration tests (requires running Docker services)
    arango_only: an integration test that applies to ArangoDB only; it is not collected for the Neo4j `env` parameter
    unit: marks tests as unit tests (default)
    confluence_datacenter: marks tests specific to the Confluence Data Center connector
    slow: marks tests that need >30s (contract tests running real sandbox processes)
    docker: marks tests needing a reachable Docker daemon and the sandbox image
    browser: marks tests that drive a real Chromium (skipped when none is installed)
    chaos: kills a process, container or connection mid-operation (nightly)
