[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --timeout=30 --strict-markers
filterwarnings =
    ignore:invalid escape sequence.*:SyntaxWarning:^talon(\..+)?$
markers =
    live_smoke: boots the fleet state on a real Redis and runs a real client through a real storm and recovery in wall-clock time (about 3 minutes); nightly, not in the per-PR job
    integration: marks tests as integration tests (requires running Docker services)
    redis_restart: restarts a Redis container started with --appendonly yes (REDIS_VECTOR_RESTART_CONTAINER); run by hand, deselected in CI
    arango_only: an integration test that applies to ArangoDB only; it is not collected for the Neo4j `env` parameter
    neo4j_only: an integration test that applies to Neo4j only; it is not collected for the ArangoDB backend parameter
    unit: marks tests as unit tests (default)
    confluence_datacenter: marks tests specific to the Confluence Data Center connector
    confluence_datacenter_personal: marks tests specific to the Confluence Data Center personal-space connector
    slow: gate runs only (crash matrices, fault drills, benchmarks, live-model lanes); registered in tests/cohesion/test_c25_slow_lanes.py
    followups: runs with UX5's suggested next questions on (off for every other test: tests/conftest.py _followups_off)
    mcp_hub_default: runs with the MCP hub following the harness while MCP_HUB is unset, as production does (off for every other test: tests/conftest.py _mcp_hub_default_off)
    stress: a probabilistic load test (burner processes, floods); runs only with RUN_STRESS_TESTS=1 or -m stress, never in the per-PR unit job
    docker: marks tests needing a reachable Docker daemon and the sandbox image
    journal_history_unchecked(reason): the test writes an invalid journal history on purpose (JRN-22 check skipped)
    network: may connect beyond loopback (live model lanes); every other test is refused by tests/support/no_network.py
    browser: marks tests that drive a real Chromium (skipped when none is installed)
    ga26: GA-26 offline P0 journeys (G-49); in the default run, `-m ga26` selects them alone
    chaos: kills a process, container or connection mid-operation (nightly)
    perf: a cost or scale check on a real backend (pg_runtime's ordered-claim page count); runs with its suite
    import_runtime: imports a service entry module in a fresh interpreter and checks which libraries it loaded (slow)
    real_docling: needs the real docling library (slow import; give it a long timeout)
