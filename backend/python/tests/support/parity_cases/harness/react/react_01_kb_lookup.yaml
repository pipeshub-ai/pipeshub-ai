id: react-01-kb-lookup
category: react
chat_mode: react
knowledge_base: true
task: How many days of paid leave do I get?
fixtures:
  knowledge:
    - {id: kb-leave, title: Leave policy, text: "Full-time employees get 25 days of paid leave per calendar year."}
script:
  turns:
    - reply: {text: "Find how many days of paid leave the user gets."}
    - reply: {tool_calls: [{id: c1, name: knowledgegraph__search, args: {query: paid leave}}]}
    - reply: {text: "You get 25 days of paid leave per calendar year."}
grader:
  - regex: "(?i)\\b25 (paid[- ]leave )?days\\b"
  - tool_called: knowledgegraph__search
