id: react-02-ticket-error-then-success
category: react
chat_mode: react
task: What is the status of ticket PROJ-42?
fixtures:
  tickets:
    - {key: PROJ-42, summary: Login returns 500, status: Resolved, owner: Priya}
script:
  turns:
    - reply: {text: "Look up Jira ticket PROJ-42 and report its status."}
    - reply: {tool_calls: [{id: c1, name: jira__get_issue, args: {issue_key: PROJ-4}}]}
    - expect: {tool_result_for: jira__get_issue, status: failed}
      reply: {tool_calls: [{id: c2, name: jira__get_issue, args: {issue_key: PROJ-42}}]}
    - reply: {text: "PROJ-42 is Resolved."}
grader:
  - contains: Resolved
