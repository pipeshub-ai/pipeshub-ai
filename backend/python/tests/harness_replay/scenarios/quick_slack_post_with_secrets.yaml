id: quick-slack-post-with-secrets
description: >
  A requested write whose inputs carry secrets and emails: the scrubber must
  remove them and keep the recording replayable.
chat_mode: quick
task: "Post a summary of the #ops handover to #eng and tell me who to contact."
fixtures:
  slack:
    ops:
      - {user: sam, text: "Handover: rotate the bot token xoxb-2231-99887766-AbCdEfGhIjKl before Friday. Contact dana.lee@corp.example or https://admin:hunter22@ops.corp.example/runbook"}
script:
  turns:
    - reply: {tool_calls: [{id: call-1, name: slack__read_channel, args: {channel: "#ops"}}]}
    - reply:
        tool_calls:
          - id: call-2
            name: slack__send_message
            args: {channel: "#eng", text: "Ops handover: rotate the bot token before Friday; contact dana.lee@corp.example."}
    - reply: {text: "Posted to #eng. Contact dana.lee@corp.example for the handover."}
