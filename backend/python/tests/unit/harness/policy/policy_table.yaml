  # I. FG2: a read's request goes to the system it reads (sink `self` untagged) and is never held; a
  # read whose request carries what the model chose to an outside host (`sink=external`: the replay world's fetch, an
  # open-world MCP read) is held after a private or unknown read, on every path, and never before one or after only
  # public web pages (plain browsing). The product's own web search always runs, whatever the run read
  # (`flow=platform_web`), and so does its fetch_url for an address the run was given (`address`: a search result, the
