# QA-10 (TGW-17, TEST-STRATEGY 2.3): the approval and flow-guard decision table.
#
# One row is one tool call. Inputs: the path (`durable` loop, `legacy` loop, `engine` run), the tool's tags as a
# toolset declares them (`<effect>/<sink egress>`, `unclassified` = no tags, `world:<name>` = the replay world's tool),
# what the run has read before the call (`context`: P2.5a's ledger; `child-*`: the label a parent passed at the
# spawn), the approvals document (`document`), the deployment's flow settings (`deployment`), the engine profile's
# approvals (`profile`) and the conversation's grants (`grant`). Omitted inputs take their first preset.
#
# `expect` is what the run does with the call: `allow`, `ask/<rule>` (the rule the card explains: `flow_external_write`;
# `writes`, `effect_class` or `tool` when a layer's own approval rule asks, an engine run's included, since no grant
# answers it (QA6-F6); `engine_writes` when an engine run's default alone asks) or `deny/<rule>` (the rule the model is told;
# `approval_unavailable` is today's loop's refusal where the durable paths ask). Rows were written from the documented
# rules (P2.6c, SEC1, SEC2, UX1, UX2, UX3, UX4), not from the code; `test_policy_table.py` runs each on the product's
# own composition for its path.
#
# `xfail` (strict): the row states the intended behaviour, which today's code does not have yet; the reason names
# the WP or finding that changes it. When that lands, the row passes, the strict xfail fails, and the marker goes.
# `mandatory`: one of TEST-STRATEGY 2.3's mandatory row classes; the runner checks each is present.

presets:
  # The approvals document (/services/agentHarness/approvals) for org-1, agent-1; `unreadable`: the store fails.
  document:
    none: null
    empty: {}
    writes-allow: {"default": {"writes": "allow"}}
    writes-ask: {"default": {"writes": "ask"}}
    writes-deny: {"default": {"writes": "deny"}}
    tool-ask: {"default": {"tools": {"local@default/acme_send": "ask"}}}
    tool-deny: {"default": {"tools": {"local@default/acme_send": "deny"}}}
    read-ask: {"default": {"classes": {"read": "ask"}}}
    default-writes-ask: {"default": {"writes": "ask"}}
    agent-writes-deny: {"agents": {"agent-1": {"writes": "deny"}}}
    agent-writes-ask: {"agents": {"agent-1": {"writes": "ask"}}}
    layers-deny-ask-allow: {"default": {"writes": "allow"}, "agents": {"agent-1": {"writes": "ask", "tools": {"local@default/acme_send": "deny"}}}}
    layers-ask-allow: {"default": {"writes": "allow"}, "agents": {"agent-1": {"writes": "ask"}}}
    other-agent-deny: {"agents": {"agent-2": {"writes": "deny"}}}
    invalid-layer: {"default": {"writes": "maybe"}}
    invalid-document: {"org": {"org-1": {"writes": "allow"}}}
    unreadable: !unreadable
    flow-ask: {"default": {"flow": {"level": "ask"}}}
    flow-deny: {"default": {"flow": {"level": "deny"}}}
    flow-off: {"default": {"flow": {"level": "off"}}}
    flow-ask-private: {"default": {"flow": {"level": "ask", "above": "private"}}}
    flow-deny-private: {"default": {"flow": {"level": "deny", "above": "private"}}}
    agent-flow-deny: {"agents": {"agent-1": {"flow": {"level": "deny"}}}}
    flow-ask-writes-ask: {"default": {"writes": "ask", "flow": {"level": "ask"}}}
  # The deployment's flow settings (HARNESS_FLOW_GUARD*); every variable not named is unset.
  deployment:
    default: {}
    off: {"HARNESS_FLOW_GUARD": "false"}
    deny: {"HARNESS_FLOW_GUARD_LEVEL": "deny"}
    ask-private: {"HARNESS_FLOW_GUARD_ABOVE": "private"}
    deny-private: {"HARNESS_FLOW_GUARD_LEVEL": "deny", "HARNESS_FLOW_GUARD_ABOVE": "private"}
    invalid-level: {"HARNESS_FLOW_GUARD_LEVEL": "sometimes"}
    invalid-above: {"HARNESS_FLOW_GUARD_ABOVE": "secret"}
  # The engine profile's approvals (ProfileApprovals); the release profile asks before writes and executes.
  profile:
    release: {}
    write-deny: {"write": "deny"}
    execute-deny: {"execute": "deny"}
    write-allow: {"write": "allow"}
    read-ask: {"read": "ask"}
    workspace-ask: {"workspace": "ask"}

