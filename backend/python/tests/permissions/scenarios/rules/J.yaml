- id: RULE-J10
  title: 'Jira: top-level issue, U is its reporter and Browse is granted to the reporter only'
  source: rule cases R1-R13 (spec)
  rule: jira
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, app_type: JIRA}
      - {id: proj, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: i, kind: record, connector: A, rule: OPEN, parents: [proj], inherits: [proj], belongs: [proj]}
      - {id: att, kind: record, connector: A, rule: OPEN, parents: [{id: i, rel: ATTACHMENT}], inherits: [i], belongs: [proj]}
    grants:
      - [u, i]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {i: admit, att: admit}
  tags: [rules, jira]
  comment: "jira_issue_security.py:699-717 (project_open with browse_holder_grants). U has no grant on the project, the direct grant must be enough, so the issue is OPEN, not STRICT."
- id: RULE-J11
  title: 'Jira: sub-task of an issue U reads as its reporter, U is not the sub-task''s reporter'
  source: rule cases R1-R13 (spec)
  rule: jira
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, app_type: JIRA}
      - {id: proj, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: i, kind: record, connector: A, rule: OPEN, parents: [proj], inherits: [proj], belongs: [proj]}
      - {id: sub, kind: record, connector: A, rule: STRICT, parents: [i], inherits: [i], belongs: [proj]}
    grants:
      - [u, i]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {i: admit, sub: deny}
  tags: [rules, jira]
  comment: A child follows its parent and gets no per-issue grant (jira_issue_security.py:699-717), so it stays STRICT and needs the project too.
