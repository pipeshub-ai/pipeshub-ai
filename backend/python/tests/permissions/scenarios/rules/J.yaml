- id: RULE-J08
  title: 'Jira (W5a write shape): unleveled story under an epic in a scheme project'
  source: rule cases R1-R13 (spec)
  rule: jira
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, app_type: JIRA}
      - {id: proj, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: epic, kind: record, connector: A, rule: STRICT, parents: [proj], inherits: [proj], belongs: [proj]}
      - {id: story, kind: record, connector: A, rule: STRICT, parents: [epic], inherits: [proj], belongs: [proj]}
    grants:
      - [u, proj]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {story: deny}
  tags: [rules, jira]
  comment: "W5a writes inherit->project but the hierarchy parent stays the epic (DSEP:755-769, :1494-1495). Jira shows the story to Browse holders; PipesHub hides it. See spec \xA76 B1 (verified through DSEP in run_dsep_jira.py)."
