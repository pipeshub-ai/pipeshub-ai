- id: RULE-J08
  title: 'Jira (inherit edge to the project): unleveled story under an epic in a scheme project'
  source: rule cases R1-R13 (spec)
  rule: jira
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, app_type: JIRA}
      - {id: proj, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: epic, kind: record, connector: A, rule: STRICT, parents: [proj], inherits: [proj], belongs: [proj]}
      - {id: story, kind: record, connector: A, rule: STRICT, parents: [epic], inherits: [proj], belongs: [proj]}
    grants:
      - [u, proj]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {story: deny}
  tags: [rules, jira]
  comment: "An inherit edge to the project while the hierarchy parent stays the epic does not count (data_source_entities_processor.py:1537-1544). Jira shows the story to Browse holders; PipesHub hides it."
