- id: RULE-K08
  title: 'KB: file in a folder (folder BELONGS_TO KB; file only PARENT_CHILD under folder)'
  source: rule cases R1-R13 (spec)
  rule: kb
  world:
    principals:
      - {id: u}
    nodes:
      - {id: KB, kind: app, app_type: KB}
      - {id: folder, kind: record, connector: KB, rule: OPEN, origin: UPLOAD, parents: [KB], belongs: [KB]}
      - {id: f, kind: record, connector: KB, rule: OPEN, origin: UPLOAD, parents: [folder]}
    grants:
      - [u, KB]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, kb]
