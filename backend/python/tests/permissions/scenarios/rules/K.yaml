    grants:
      - [u, KB]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, kb]
- id: RULE-K07
  title: 'KB: org member with no KB grant'
  source: rule cases R1-R13 (spec)
  rule: kb
  world:
    principals:
      - {id: u}
    nodes:
