- id: RULE-S01
  title: OPEN granted file under an inaccessible folder is a seed
  source: rule cases R1-R13 (spec)
  rule: drive
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app}
      - {id: S, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: folder, kind: record, connector: A, rule: OPEN, parents: [S], belongs: [S]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [folder], belongs: [S]}
    grants:
      - [u, f]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, drive]
- id: RULE-S02
  title: STRICT granted node under an inaccessible parent is not a seed
  source: rule cases R1-R13 (spec)
  rule: any
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app}
      - {id: S, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: STRICT, parents: [S], belongs: [S]}
    grants:
      - [u, f]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: deny}
  tags: [rules, any]
  comment: Only OPEN nodes seed; STRICT means 'every ancestor must pass'.
