- id: RULE-S08
  title: Granted OPEN group (record group seed), records inherit
  source: rule cases R1-R13 (spec)
  rule: box
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, app_type: BOX}
      - {id: top, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: sub, kind: group, connector: A, rule: OPEN, parents: [top]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [sub], inherits: [sub], belongs: [sub]}
    grants:
      - [u, sub]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, box]
