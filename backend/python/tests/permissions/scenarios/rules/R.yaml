- id: RULE-R01
  title: 'RGL group granted: RESTRICTED non-inheriting record that BELONGS_TO it is admitted'
  source: rule cases R1-R13 (spec)
  rule: gmail/slack
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, app_type: GMAIL}
      - {id: mailbox, kind: group, connector: A, rule: OPEN, model: RECORD_GROUP_LEVEL, parents: [A], belongs: [A]}
      - {id: mail, kind: record, connector: A, rule: RESTRICTED, parents: [mailbox], belongs: [mailbox]}
    grants:
      - [u, mailbox]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {mail: admit}
  tags: [rules, gmail/slack]
  comment: Declared arm ignores the record's own rule.
- id: RULE-R02
  title: Gmail mailbox (RGL) of another user
  source: rule cases R1-R13 (spec)
  rule: gmail
  world:
    principals:
      - {id: u}
      - {id: v}
    nodes:
      - {id: A, kind: app, app_type: GMAIL}
      - {id: mailbox, kind: group, connector: A, rule: OPEN, model: RECORD_GROUP_LEVEL, parents: [A], belongs: [A]}
      - {id: mail, kind: record, connector: A, rule: OPEN, parents: [mailbox], inherits: [mailbox], belongs: [mailbox]}
    grants:
      - [v, mailbox]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {mail: deny}
  tags: [rules, gmail]
