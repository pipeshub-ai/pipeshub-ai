      x_rec: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      u_rg: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      x_rg: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      u_org: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      x_org: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
    cite:
    - {viewer: c, vrid: same, record: null, indexed_only: false}
    - {viewer: m, vrid: same, record: null, indexed_only: false}
    - {viewer: u_uar, vrid: same, record: j, indexed_only: false}
    - {viewer: x_uar, vrid: same, record: j, indexed_only: false}
    - {viewer: u_src, vrid: same, record: j, indexed_only: false}
    - {viewer: x_rec, vrid: same, record: null, indexed_only: false}
  tags: [rules, access-limit, access-limit-matrix]
  comment: 'Viewers: c the creator; m a member with no link; i an inactive member with a user-app edge; cx a creator-like user outside the org with a user-app edge; u_<kind> a member and x_<kind> a user outside the org, each holding
    one link kind on both A and B (uar user-app edge, perm permission edge to the app, team/grp/role a membership whose team, group or role is linked to the app and holds record grants, src a linked source account holding grants, rec
    record grants, rg a record-group grant, org the org-wide shares every member holds). B is never limited: its verdicts are the unlimited world''s.'
- id: RULE-L20
  title: A record of a limited connector filed in a knowledge base is not read through the knowledge base
  source: 'licence gate design B (accessLimit): the read-side matrix'
  rule: access-limit
  world:
    principals:
    - {id: c}
    - {id: o}
    - {id: x, org_member: false}
    nodes:
    - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
    - {id: K, kind: app, app_type: KB, created_by: o}
    - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
    - {id: f, kind: record, connector: A, rule: OPEN, parents: [K], belongs: [K], inherits: [K]}
    - {id: f2, kind: record, connector: A, rule: OPEN, parents: [d, K], belongs: [K, A], inherits: [d, K]}
    - {id: q, kind: record, connector: K, rule: OPEN, parents: [K], belongs: [K]}
    grants: [[o, f], [o, f2], [x, f], [o, K], [x, K]]
    gates: [[o, A]]
  expect:
    verdicts:
      c: {A: admit, K: deny, d: admit, f: deny, f2: admit, q: deny}
      o: {A: deny, K: admit, d: deny, f: deny, f2: deny, q: admit}
      x: {A: deny, K: admit, d: deny, f: deny, f2: deny, q: admit}
  tags: [rules, access-limit, access-limit-matrix]
  comment: f is filed only in K; f2 in both. o is a member of K, holds grants on both records and a user-app edge to A; x shares K from outside the org.
- id: RULE-L21
  title: 'A knowledge base limited to its creator: no share, team share or org share admits anyone else'
  source: 'licence gate design B (accessLimit): the read-side matrix'
  rule: access-limit
  world:
    principals:
    - {id: c}
    - {id: o}
    - {id: t, kind: team, org_member: false}
    - {id: p}
    nodes:
    - {id: K, kind: app, app_type: KB, access_limit: CREATOR, created_by: c}
    - {id: fo, kind: group, connector: K, rule: OPEN, parents: [K], belongs: [K]}
    - {id: q, kind: record, connector: K, rule: OPEN, parents: [fo], belongs: [K]}
    memberships: [[p, t]]
    grants: [[o, q], [org, q, ORG], [o, K], [t, K, TEAM], [org, K, ORG]]
  expect:
    verdicts:
      c: {K: admit, fo: admit, q: admit}
      o: {K: deny, fo: deny, q: deny}
      p: {K: deny, fo: deny, q: deny}
  tags: [rules, access-limit, access-limit-matrix]
  comment: o holds a share, p a team share, and the organization an org share of the knowledge base.
- id: RULE-L22
  title: 'Records and groups that cross connectors: a limited connector''s records under an open one stay closed, and the other way round'
  source: 'licence gate design B (accessLimit): the read-side matrix'
  rule: access-limit
  world:
    principals:
    - {id: c}
    - {id: o}
    nodes:
    - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
    - {id: B, kind: app, created_by: o}
    - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A], inherits: [A]}
    - {id: e, kind: group, connector: B, rule: OPEN, parents: [B], belongs: [B], inherits: [B]}
    - {id: fa, kind: record, connector: A, rule: OPEN, parents: [e], inherits: [e], belongs: [e], vrid: two}
    - {id: fb, kind: record, connector: A, rule: OPEN, parents: [d, e], inherits: [d, e]}
    - {id: jb, kind: record, connector: B, rule: OPEN, parents: [d], inherits: [d], belongs: [d]}
    - {id: jc, kind: record, connector: B, rule: OPEN, parents: [e], inherits: [e], vrid: two}
    - {id: ja, kind: record, connector: B, rule: OPEN, parents: [fb], inherits: [fb]}
    grants: [[o, fa], [o, fb], [o, d]]
    gates: [[o, B], [o, A]]
  expect:
    verdicts:
      c: {A: admit, B: deny, d: admit, e: deny, fa: deny, fb: admit, jb: deny, jc: deny, ja: deny}
      o: {A: deny, B: admit, d: deny, e: admit, fa: deny, fb: deny, jb: deny, jc: admit, ja: admit}
  tags: [rules, access-limit, access-limit-matrix]
  comment: fa and fb are A's records under B's group e (o reaches B, the creator c only A); jb and ja are B's records under A's group d and record fb. fa and jc share content.
