# The connector's access limit (App.accessLimit). While it is set the connector is written APP_LEVEL, so whoever passes
# the gate reads every record of it; the limit alone decides who passes, whatever edges, links or grants exist.
- id: RULE-L01
  title: 'Limited to the creator: the creator passes with no edge and reads everything'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: c}
      - {id: o}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
  expect:
    verdicts:
      c: {A: admit, d: admit, f: admit}
      o: {A: deny, d: deny, f: deny}
  tags: [rules, access-limit]
- id: RULE-L02
  title: 'Limited to the creator: another user with a user-app edge does not pass'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: c}
      - {id: o}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    gates:
      - [c, A]
      - [o, A]
      - [o, A, PERMISSION]
  expect:
    verdicts:
      c: {A: admit, f: admit}
      o: {A: deny, d: deny, f: deny}
  tags: [rules, access-limit]
- id: RULE-L03
  title: 'Limited to the creator: a team or group edge does not pass'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: t, kind: team, org_member: false}
      - {id: g, kind: group, org_member: false}
      - {id: c}
      - {id: o}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    memberships:
      - [o, t]
      - [o, g]
      - [c, t]
    gates:
      - [t, A]
      - [g, A]
      - [org, A, PERMISSION]
  expect:
    verdicts:
      c: {f: admit}
      o: {A: deny, f: deny}
  tags: [rules, access-limit]
  comment: The creator is a member of the team too; the team edge neither adds nor takes away.
- id: RULE-L04
  title: 'Limited to the creator: an authenticatedAs link does not pass'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: c}
      - {id: o}
      - {id: s, org_member: false}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [s, f]
    links:
      - [o, s, A]
  expect:
    verdicts:
      c: {f: admit}
      o: {A: deny, f: deny}
  tags: [rules, access-limit]
- id: RULE-L05
  title: 'Limited to the creator: a grant on a record or group does not pass'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: c}
      - {id: o}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [o, d]
      - [o, f]
      - [org, f, ORG]
  expect:
    verdicts:
      c: {f: admit}
      o: {d: deny, f: deny}
  tags: [rules, access-limit]
- id: RULE-L06
  title: 'Opened to the org: every member passes with no edge, a user outside the org does not'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: c}
      - {id: o}
      - {id: x, org_member: false}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: ORG, created_by: c}
      - {id: d, kind: group, connector: A, rule: RESTRICTED, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    gates:
      - [x, A]
  expect:
    verdicts:
      c: {A: admit, d: admit, f: admit}
      o: {A: admit, d: admit, f: admit}
      x: {A: deny, f: deny}
  tags: [rules, access-limit]
  comment: x has no BELONGS_TO to the organization, so the org-wide limit does not reach it, and its own edge no longer counts.
- id: RULE-L07
  title: 'Opened to the org: an app of another org stays closed'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app, org: other, model: APP_LEVEL, access_limit: ORG, created_by: u}
      - {id: d, kind: group, connector: A, rule: OPEN, org: other, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, org: other, parents: [d]}
      - {id: B, kind: app, org: other, model: APP_LEVEL, access_limit: CREATOR, created_by: u}
      - {id: e, kind: record, connector: B, rule: OPEN, org: other, parents: [B]}
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {A: deny, f: deny, B: deny, e: deny}
  tags: [rules, access-limit, org-isolation]
  comment: The limit is weighed only for apps of the org the request is made in, as every gate arm is.
- id: RULE-L08
  title: 'A limit stored as null is no limit: the gate is as today'
  source: licence gate design B (accessLimit); ArangoDB stores a cleared field as null
  rule: access-limit
  world:
    principals:
      - {id: u}
      - {id: v}
      - {id: w}
    nodes:
      - {id: A, kind: app, access_limit_null: true, created_by: v}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [u, f]
      - [w, f]
    gates:
      - [u, A]
      - [v, A]
  expect:
    verdicts:
      u: {A: admit, f: admit}
      v: {A: admit, f: deny}
      w: {A: deny, f: deny}
  tags: [rules, access-limit]
- id: RULE-L09
  title: 'No limit field at all: the gate is as today, and the creator gets nothing extra'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: u}
      - {id: v}
      - {id: w}
    nodes:
      - {id: A, kind: app, created_by: w}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [u, f]
      - [w, f]
    gates:
      - [u, A]
      - [v, A]
  expect:
    verdicts:
      u: {A: admit, f: admit}
      v: {A: admit, f: deny}
      w: {A: deny, f: deny}
  tags: [rules, access-limit]
- id: RULE-L10
  title: 'Limited to the creator: restricted and non-inheriting nodes are read by the creator (APP_LEVEL)'
  source: licence gate design B (accessLimit)
  rule: access-limit
  world:
    principals:
      - {id: c}
      - {id: o}
    nodes:
      - {id: A, kind: app, model: APP_LEVEL, access_limit: CREATOR, created_by: c}
      - {id: d, kind: group, connector: A, rule: RESTRICTED, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: RESTRICTED, parents: [d]}
      - {id: g, kind: record, connector: A, rule: STRICT, parents: [d]}
      - {id: h, kind: record, connector: A, rule: OPEN, parents: [d]}
      - {id: k, kind: record, connector: A, rule: PARENT_AND_GRANT, parents: [h]}
      - {id: z, kind: record, connector: A, rule: OPEN, parents: [d], deleted: true}
    grants:
      - [o, d]
      - [o, f]
    gates:
      - [o, A]
  expect:
    verdicts:
      c: {d: admit, f: admit, g: admit, h: admit, k: admit, z: deny}
      o: {d: deny, f: deny, g: deny, h: deny, k: deny}
  tags: [rules, access-limit]
  comment: No node inherits and only o holds grants; APP_LEVEL opens every hop for whoever passes the gate. A deleted node still blocks.
# The read-side matrix (RULE-L11 onwards): every limit value against every link kind a viewer can hold, from inside and from outside the org,
# with a second connector that is never limited; then knowledge bases and records that cross connectors.
- id: RULE-L11
  title: 'No limit: every link kind gates as today, on both connectors'
  source: 'licence gate design B (accessLimit): the read-side matrix'
  rule: access-limit
  world:
    principals:
    - {id: c}
    - {id: m}
    - {id: i, active: false}
    - {id: cx, org_member: false}
    - {id: t, kind: team, org_member: false}
    - {id: g, kind: group, org_member: false}
    - {id: r, kind: role, org_member: false}
    - {id: s, org_member: false}
    - {id: u_uar}
    - {id: x_uar, org_member: false}
    - {id: u_perm}
    - {id: x_perm, org_member: false}
    - {id: u_team}
    - {id: x_team, org_member: false}
    - {id: u_grp}
    - {id: x_grp, org_member: false}
    - {id: u_role}
    - {id: x_role, org_member: false}
    - {id: u_src}
    - {id: x_src, org_member: false}
    - {id: u_rec}
    - {id: x_rec, org_member: false}
    - {id: u_rg}
    - {id: x_rg, org_member: false}
    - {id: u_org}
    - {id: x_org, org_member: false}
    nodes:
    - {id: A, kind: app, created_by: c}
    - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A], inherits: [A]}
    - {id: f, kind: record, connector: A, rule: OPEN, parents: [d], inherits: [d], vrid: same}
    - {id: h, kind: record, connector: A, rule: RESTRICTED, parents: [d], inherits: [d]}
    - {id: k, kind: record, connector: A, rule: STRICT, parents: [d]}
    - {id: z, kind: record, connector: A, rule: OPEN, parents: [d], inherits: [d], deleted: true}
    - {id: B, kind: app, created_by: c}
    - {id: e, kind: group, connector: B, rule: OPEN, parents: [B], belongs: [B], inherits: [B]}
    - {id: j, kind: record, connector: B, rule: OPEN, parents: [e], inherits: [e], vrid: same}
    grants: [[u_perm, A], [u_rec, h], [u_rec, k], [u_rg, d], [u_perm, B], [u_rec, j], [u_rg, e], [x_perm, A], [x_rec, h], [x_rec, k], [x_rg, d], [x_perm, B], [x_rec, j], [x_rg, e], [g, A, GROUP], [g, B, GROUP], [r, A, ROLE], [r, B,
        ROLE], [s, k], [s, j], [t, k], [g, h], [r, k], [org, k, ORG], [org, h, ORGANIZATION], [org, j, ANYONE]]
    memberships: [[u_team, t], [u_grp, g], [u_role, r], [x_team, t], [x_grp, g], [x_role, r]]
    gates: [[u_uar, A], [u_uar, B], [x_uar, A], [x_uar, B], [t, A], [t, B], [i, A], [i, B], [cx, A]]
    links: [[u_src, s, A], [u_src, s, B], [x_src, s, A], [x_src, s, B]]
  expect:
    verdicts:
      c: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      m: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      i: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      cx: {A: admit, d: admit, f: admit, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      u_uar: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      x_uar: {A: admit, d: admit, f: admit, h: deny, k: deny, z: deny, B: admit, e: admit, j: admit}
      u_perm: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      x_perm: {A: admit, d: admit, f: admit, h: deny, k: deny, z: deny, B: admit, e: admit, j: admit}
      u_team: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      x_team: {A: admit, d: admit, f: admit, h: deny, k: admit, z: deny, B: admit, e: admit, j: admit}
      u_grp: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      x_grp: {A: admit, d: admit, f: admit, h: admit, k: deny, z: deny, B: admit, e: admit, j: admit}
      u_role: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      x_role: {A: admit, d: admit, f: admit, h: deny, k: admit, z: deny, B: admit, e: admit, j: admit}
      u_src: {A: admit, d: admit, f: admit, h: admit, k: admit, z: deny, B: admit, e: admit, j: admit}
      x_src: {A: admit, d: admit, f: admit, h: deny, k: admit, z: deny, B: admit, e: admit, j: admit}
      u_rec: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      x_rec: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      u_rg: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      x_rg: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      u_org: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
      x_org: {A: deny, d: deny, f: deny, h: deny, k: deny, z: deny, B: deny, e: deny, j: deny}
    cite:
    - {viewer: c, vrid: same, record: null, indexed_only: false}
    - {viewer: m, vrid: same, record: null, indexed_only: false}
    - {viewer: u_uar, vrid: same, record: f, indexed_only: false}
    - {viewer: x_uar, vrid: same, record: f, indexed_only: false}
    - {viewer: u_src, vrid: same, record: f, indexed_only: false}
    - {viewer: x_rec, vrid: same, record: null, indexed_only: false}
  tags: [rules, access-limit, access-limit-matrix]
  comment: 'Viewers: c the creator; m a member with no link; i an inactive member with a user-app edge; cx a creator-like user outside the org with a user-app edge; u_<kind> a member and x_<kind> a user outside the org, each holding
    one link kind on both A and B (uar user-app edge, perm permission edge to the app, team/grp/role a membership whose team, group or role is linked to the app and holds record grants, src a linked source account holding grants, rec
    record grants, rg a record-group grant, org the org-wide shares every member holds). B is never limited: its verdicts are the unlimited world''s.'
- id: RULE-L12
  title: 'Limited to the creator: no link of any kind, from a member or from outside the org, admits anyone else'
