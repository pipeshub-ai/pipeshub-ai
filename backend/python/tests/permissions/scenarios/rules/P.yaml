- id: RULE-P01
  title: Direct user grant on a non-inheriting OPEN file (Drive My Drive)
  source: rule cases R1-R13 (spec)
  rule: drive
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app}
      - {id: mydrive, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [mydrive]}
    grants:
      - [u, f]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, drive]
- id: RULE-P02
  title: Grant to a group the user is a direct member of
  source: rule cases R1-R13 (spec)
  rule: drive
  world:
    principals:
      - {id: u}
      - {id: g, kind: group, org_member: false}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [g, f]
    memberships:
      - [u, g]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, drive]
- id: RULE-P03
  title: 'Nested group: U in G1, G1 in G2, grant to G2'
  source: rule cases R1-R13 (spec)
  rule: drive
  world:
    principals:
      - {id: u}
      - {id: g1, kind: group, org_member: false}
      - {id: g2, kind: group, org_member: false}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [g2, f]
    memberships:
      - [u, g1]
      - [g1, g2]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: deny}
  tags: [rules, drive]
  comment: Group nesting is not followed (one level). Connectors flatten nesting themselves, unevenly.
