- id: RULE-P06
  title: Membership edge typed GROUP instead of USER does not make U a member
  source: rule cases R1-R13 (spec)
  rule: any
  world:
    principals:
      - {id: u}
      - {id: g, kind: group, org_member: false}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [g, f]
    memberships:
      - [u, g, GROUP]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: deny}
  tags: [rules, any]
  comment: Only PERMISSION{type:'USER'} user->group counts; DSEP writes USER (DSEP:5440-5461).
- id: RULE-P07
  title: BELONGS_TO user->group (legacy membership shape) is not membership for the verifier
  source: rule cases R1-R13 (spec)
  rule: any
  world:
    principals:
      - {id: u}
      - {id: g, kind: group, org_member: false}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [g, f]
    memberships:
      - [u, g, USER, BELONGS_TO]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: deny}
  tags: [rules, any]
  comment: The legacy enumeration reads BELONGS_TO->Group (N:6573-6576); the verifier does not. Prefilter superset, no leak.
