- id: RULE-P12
  title: 'Grant to another user V does not admit U (anyone-with-link: Drive grants the syncing user only)'
  source: rule cases R1-R13 (spec)
  rule: drive
  world:
    principals:
      - {id: u}
      - {id: v}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [v, f]
    gates:
      - [u, A]
      - [v, A]
  expect:
    verdicts:
      u: {f: deny}
  tags: [rules, drive]
  comment: ANYONE/ANYONE_WITH_LINK write no edge; Drive gives the listing user a USER grant (DT:1063-1065, 1201-1209).
