- id: RULE-P17
  title: Grant held by a deleted-flagged group still counts (principal liveness not checked)
  source: rule cases R1-R13 (spec)
  rule: any
  world:
    principals:
      - {id: u}
      - {id: g, kind: group, org_member: false}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [g, f]
    memberships:
      - [u, g]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: admit}
  tags: [rules, any]
  comment: Neither Group.isDeleted nor User.isActive is read by the gate or v3 access.
