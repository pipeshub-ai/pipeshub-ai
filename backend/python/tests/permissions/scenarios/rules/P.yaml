- id: RULE-P10
  title: Org edge typed DOMAIN grants nothing
  source: rule cases R1-R13 (spec)
  rule: drive
  world:
    principals:
      - {id: u}
    nodes:
      - {id: A, kind: app}
      - {id: d, kind: group, connector: A, rule: OPEN, parents: [A], belongs: [A]}
      - {id: f, kind: record, connector: A, rule: OPEN, parents: [d]}
    grants:
      - [org, f, DOMAIN]
    gates:
      - [u, A]
  expect:
    verdicts:
      u: {f: deny}
  tags: [rules, drive]
  comment: DSEP drops DOMAIN/ANYONE/LINK before writing (DSEP:2084-2101); an edge that slipped through still grants nothing.
