# A knowledge base opened to a team (container rule: the KB app is the permission scope). The KB is an App of type KB,
# which opens every record that belongs to it to every user gated into it (rule R12); a team's PERMISSION edge to the
# app gates its members (data_source_entities_processor.py:1316-1360 links records to the app; localKB/connector.py:57).
principals:
  - {id: mia}
  - {id: nate}
  - {id: olu}
  - {id: t:support, kind: team}
nodes:
  - {id: kb, kind: app, app_type: KB}
  - {id: folder:faq, kind: record, connector: kb, rule: OPEN, origin: UPLOAD, parents: [kb], inherits: [kb], belongs: [kb], stamp: container}
  - {id: file:refunds, kind: record, connector: kb, rule: OPEN, origin: UPLOAD, parents: [folder:faq], inherits: [folder:faq], belongs: [kb], stamp: container}
  - {id: file:shipping, kind: record, connector: kb, rule: OPEN, origin: UPLOAD, parents: [kb], inherits: [kb], belongs: [kb], stamp: container}
grants:
  - [t:support, kb]
memberships:
  - [mia, t:support]
  - [nate, t:support]
