# Where the product oracle (what the graph check does on main) differs from the source oracle (what the vendor
# shows). A scenario lists the vendor's verdicts; every listed pair the oracle does not give must be named here with
# its direction, and every entry must still be observed. test_scenarios_oracle.py fails on an unlisted difference and
# on a stale entry.
# public: set on an entry that is published in the documentation (written for the reader, no code or internal ids): the connector,
# the source permission and what differs. gen_docs.py renders only these. An entry without it stays internal.
# direction: over-share (the product shows what the vendor hides) | under-share (it hides what the vendor shows).
deltas:
  - id: DELTA-02
    public:
      connector: Google Drive
      source: "A file shared by link only: anyone with the link, or anyone in your domain with the link, can open it, but it cannot be found in Drive search"
      differs: "The link gives no one access in PipesHub. People it is shared with directly or through a group still see it. So do the people a share with your domain or with anyone reaches when the share can be found in Drive search, unless the file is in another organisation's shared drive."
    direction: under-share
    scenarios: [DRIVE-S-03]
    pairs: [DRIVE-S-03/fay/notes]
    reason: >
      Anyone who holds the link of a link-only share can open the file ("Anyone on the internet who has the link can
      open the file", https://support.google.com/drive/answer/2494822), but the permission names no one, so the
      connector cannot know who holds it and stores no grant for it (allowFileDiscovery false,
      google/drive/team/connector.py:1393-1394). Google: allowFileDiscovery is "Whether the permission allows the file
      to be discovered through search. This is only applicable for permissions of type domain or anyone."
      (https://developers.google.com/workspace/drive/api/reference/rest/v3/permissions). A discoverable domain or
      anyone share is granted to its audience group since #5726 (DRIVE-C-08), so only the link-only share differs,
      except on an item in a shared drive the account's own listing does not return (drives.list with
      useDomainAdminAccess, connector.py:2421): there audiences_apply is false (connector.py:1817) and no audience
      is granted, which the public text names.
      Fail-closed by design.
    fix: "None planned: Drive does not say who holds a link. People it is shared with directly, through a group or with a discoverable share keep their access."
  - id: DELTA-05
    public:
      connector: Confluence
      source: "A page nested very deep in a space"
      differs: "A page more than 50 levels below its space is hidden from everyone. Move it closer to the top of the space."
    direction: under-share
    scenarios: [CONF-S-05]
    pairs: [CONF-S-05/v/page:52]
    reason: >
      The walk up the hierarchy stops at 50 hops (ACCESS_WALK_MAX_DEPTH, services/graph_db/interface/graph_db_provider.py:47;
      rule R7), so a page nested deeper is hidden from everyone.
    fix: "Raise the cap in check_access or flatten depth at write time; ticket candidate."
  - id: DELTA-17
    public:
      connector: Gmail
      source: "A delegate added to a mailbox"
      differs: "Delegates cannot search the mailbox in PipesHub. Only the mailbox owner can."
    direction: under-share
    scenarios: [GM-C-01]
    pairs: [GM-C-01/cat/mail:ann-1, GM-C-01/cat/mail:ann-2]
    reason: >
      A Gmail delegate added at the source gets no access in PipesHub: the connector writes only the owner's grant
      (google/gmail/team/connector.py:1310-1324, _create_owner_permission); 'delegation' in that connector means domain-wide impersonation.
    fix: "Read mailbox delegates and grant them the mailbox, or accept and document the gap."
