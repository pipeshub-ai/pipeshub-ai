- id: CONF-S-01
  title: Salary bands, the worked example (Bob, Dave, Carol, Erin)
  source: permission model doc, confluence section
  rule: intersection
  world: golden/confluence_hr
  expect:
    verdicts:
      bob: {space:HR: admit, page:Compensation: admit, page:Handbook: admit, page:2027-bands: admit}
      dave: {space:HR: admit, page:Compensation: deny, page:Handbook: admit, page:2027-bands: deny}
      carol: {space:HR: deny, page:Compensation: deny, page:Handbook: deny, page:2027-bands: deny}
      erin: {space:HR: admit, page:Compensation: deny, page:Handbook: admit, page:2027-bands: deny}
  tags: [confluence, "cell:confluence/space-only", "cell:confluence/restricted-page", "cell:confluence/nested-restrictions", "cell:confluence/named-no-space"]
- id: CONF-S-02
