- id: LIN-C-01
  title: Team made private; Platform's grants are replaced and Ben loses its issues
  source: permission model doc, linear section
  rule: override
  world: golden/linear_teams
  mutations:
    - {kind: grant_removed, node: team:Platform, ref: g:workspace-members}
  expect:
    before: {ben: {PLAT-7: admit}}
    verdicts:
      ann: {PLAT-7: admit}
      ben: {PLAT-7: admit}
      gus: {PLAT-7: deny}
    index_writes: 0
  tags: [linear, "cell:linear/visibility-change"]
- id: LIN-C-02
  title: Team made public; Payments is also granted to the workspace members and Ben gains its issues
  source: permission model doc, linear section
  rule: override
  world: golden/linear_teams
  mutations:
    - {kind: grant_added, node: team:Payments, ref: g:workspace-members}
  expect:
    before: {ben: {PAY-12: deny}}
    verdicts:
      ben: {PAY-12: admit}
      ann: {PAY-12: admit}
    index_writes: 0
  tags: [linear, "cell:linear/visibility-change"]
- id: LIN-C-03
  title: Member added to a team; Ben joins Payments and sees its issues at once
  source: permission model doc, linear section
  rule: override
  world: golden/linear_teams
  mutation: {kind: member_added, node: g:team-payments, ref: ben}
  expect:
    before: {ben: {PAY-12: deny}}
    verdicts:
      ben: {PAY-12: admit}
      gus: {PAY-12: deny}
    index_writes: 0
  tags: [linear, "cell:linear/member-change"]
- id: LIN-C-04
  title: Guest added to a private team; Gus joins Payments and sees its issues
  source: permission model doc, linear section
  rule: override
  world: golden/linear_teams
  mutation: {kind: member_added, node: g:team-payments, ref: gus}
  expect:
    verdicts:
      gus: {PAY-12: admit}
    index_writes: 0
  tags: [linear, "cell:linear/member-change", "cell:linear/guest"]
- id: LIN-C-05
  title: Issue moved to another team; PLAT-7 moved to Payments follows the new team
  source: permission model doc, linear section
  rule: override
  world: golden/linear_teams
  mutation: {kind: moved, node: PLAT-7, ref: team:Payments, value: team:Payments}
  expect:
    before: {ben: {PLAT-7: admit}}
    verdicts:
      ann: {PLAT-7: admit}
      ben: {PLAT-7: deny}
    index_writes: 1
  tags: [linear, "cell:linear/move"]
- id: LIN-C-06
  title: User removed from the workspace; Ann should lose everything
  source: permission model doc, linear section
  rule: override
  comment: >
    The connector leaves inactive users out of the users it syncs (linear/connector.py:996-1005), so they are in no team
    group and not in the workspace-members group (:940), and every team grant is a group grant: she reads nothing.
  world: golden/linear_teams
  mutation: {kind: user_deactivated, node: ann}
  expect:
    before: {ann: {PAY-12: admit}}
    verdicts:
      ann: {PLAT-7: deny, PAY-12: deny, SUP-3: deny}
    index_writes: 0
  tags: [linear, "cell:linear/user-removed", narrowing]
