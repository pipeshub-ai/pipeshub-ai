# Stores behind the storage service for tests/integration/test_artifact_store_contract.py.
#
#   docker compose -f tests/integration/compose/storage.yml up -d --wait
#
# Then run the Node API's storage routes against MongoDB here and one of the
# file stores (local disk, MinIO as S3, Azurite as Azure Blob), and point the
# test at it:
#
#   ARTIFACTS_IT_STORAGE_URL=http://127.0.0.1:3000 ARTIFACTS_IT_SCOPED_SECRET=... \
#   ARTIFACTS_IT_STORAGE_TYPE=s3 pytest tests/integration/test_artifact_store_contract.py -m integration
#
# Published on the loopback interface only: the credentials below are
# throwaway (MinIO) or Azurite's published development key.

services:
  mongodb-storage-it:
    image: mongo:8.0.17
    ports:
      - "127.0.0.1:${MONGO_STORAGE_IT_PORT:-19117}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-storage-it:
    # Chainguard's build: MinIO's own images no longer allow anonymous pulls.
    # The -dev variant carries mc for the healthcheck. Pinned by digest.
    image: cgr.dev/chainguard/minio:latest-dev@sha256:4b862594d23cb20ae0fbeb93311ed312a5b566ecba2293220b204c89ef3c1fe2
    command: server /data
    environment:
      MINIO_ROOT_USER: storage-it
      MINIO_ROOT_PASSWORD: storage-it-secret
    ports:
      - "127.0.0.1:${MINIO_STORAGE_IT_PORT:-19100}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  azurite-storage-it:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "127.0.0.1:${AZURITE_STORAGE_IT_PORT:-19101}:10000"
