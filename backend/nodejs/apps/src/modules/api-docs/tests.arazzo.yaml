        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.header.Content-Type == application/json
          - condition: $response.body#/conversation/status == Complete
      # The value of cancelled for a never-registered runId is not checked: the spec says false, the server answers true.
      - stepId: cancelUnknownRun
        operationId: cancelAgentConversationStream
        parameters:
          - name: agentKey
            in: path
            value: $steps.createAgent.outputs.agentKey
          - name: conversationId
            in: path
