# SDK test cases. Speakeasy turns each workflow into one test per SDK (TypeScript, Python, Go).
#
# All three SDK suites run side by side against one app, so a workflow must check only what it
# created, by ID, never by count or by position in a list other suites can write to.
# A step whose output a later step uses needs a response-body condition, or Speakeasy skips the test.
# Speakeasy cannot generate tests for streaming operations, and reading a list item by position breaks the
# TypeScript build; tests that need either live in integration-tests/sdk_tests/handwritten.
arazzo: 1.0.1
info:
  title: Test Suite
  summary: Created from source_specs/pipeshub-sdk-openapi.yaml
  version: 0.0.1
x-speakeasy-test-server:
  baseUrl: "x-env: PIPESHUB_API_URL; http://localhost:3000/api/v1"
x-speakeasy-test-security:
  value:
    oauth2:
      clientId: "x-env: PIPESHUB_CLIENT_ID"
      clientSecret: "x-env: PIPESHUB_CLIENT_SECRET"
      tokenURL: "x-env: PIPESHUB_TOKEN_URL; http://localhost:3000/api/v1/oauth2/token"
