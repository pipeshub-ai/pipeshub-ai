# Vetted SECURITY DEFINER functions of schema kernel. Format and rules: db/lib/vetted.py.
# After editing: python -m db.lib.vetted render versions/kernel/vetted/manifest.yaml
functions:
  # Called by org_lineage only. An extra migration location may replace the body (extends: true); the signature is frozen,
  # and nobody else can execute it, so the body may trust that p_org is the caller's own org.
  - name: kernel.org_parent_ids
    class: read
    scope: helper
    args:
      - {name: p_org, type: text, pattern: '^[0-9a-f]{24}$'}
    returns: "text[]"
    body: |
      RETURN '{}';
    test:
      checks: [privileges, catalog]

  # The ancestor list the unit of work puts in app.org_lineage: the caller's org first, then its parents (at most 16, sorted,
  # well-formed ids only, so a comma or a stray value can never widen the lineage policy). Asking for another org's lineage
  # answers like having no org.
  - name: kernel.org_lineage
    class: read
    scope: lineage
    org_arg: p_org
    args:
      - {name: p_org, type: text, pattern: '^[0-9a-f]{24}$'}
    returns: "text[]"
    no_org: "'{}'"
    body: |
      RETURN ARRAY[v_org] || ARRAY(
        SELECT DISTINCT q FROM unnest(kernel.org_parent_ids(v_org)) q
        WHERE q ~ '^[0-9a-f]{24}$' AND q <> v_org ORDER BY q LIMIT 16);
    test:
      args: ["{org}"]
      own_result: [[["{org}"]]]
      other_result: [[[]]]
      no_org_result: [[[]]]
      bad_args: [["not-an-org"], ["{org},{org}"], [null]]

  # Called by the write fences only (assert_profile_epoch, assert_store_epoch), with the unit's org: true refuses the unit's writes
  # (25006, as a closed fence). An extra migration location may replace the body (extends: true); the signature is frozen, and
  # nobody else can execute it. This build holds no org's writes.
  - name: kernel.org_writes_held
    class: read
    scope: helper
    args:
      - {name: p_org, type: text, length: [1, 64]}
    returns: boolean
    body: |
      RETURN false;
    test:
      checks: [privileges, catalog]

  # The per-org steps of the maintenance jobs (they write through the jobs login, not through a unit of work, so no write fence
  # runs for them) call this first in their transaction: it takes the profile fence's barrier (7341) shared, to commit, as the
  # Python write units do, so whoever records a hold waits for the job too, and refuses (25006) an org whose writes
  # kernel.org_writes_held holds, so a held org gets no derived rows from a job either.
  - name: kernel.assert_org_writable
    class: jobs
    scope: global
    args:
      - {name: p_org, type: text, length: [1, 64]}
    returns: boolean
    body: |
      IF NOT pg_try_advisory_xact_lock_shared(7341, 1) THEN
        RAISE EXCEPTION 'the organisation writes are being held' USING ERRCODE = '25006';
      END IF;
      IF kernel.org_writes_held(p_org) THEN
        RAISE EXCEPTION 'the organisation writes are held' USING ERRCODE = '25006';
      END IF;
      RETURN true;
    test:
      checks: [privileges, catalog]
