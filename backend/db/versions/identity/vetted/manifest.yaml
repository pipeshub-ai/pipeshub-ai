# Vetted SECURITY DEFINER functions of schema identity. Format and rules: db/lib/vetted.py.
# After editing: python -m db.lib.vetted render versions/identity/vetted/manifest.yaml
#
# The two questions asked before an organisation is bound: which one is the install's organisation, and how many are there.
# Everything else in this schema is read and written as the organisation the unit runs as.
functions:
  - name: identity.oldest_org
    class: read
    scope: global
    grants: [pipeshub_node]
    args: []
    returns: text
    reads: [identity.orgs]
    body: |
      RETURN (SELECT o.org_id FROM identity.orgs o WHERE NOT o.is_deleted ORDER BY o.created_at, o.org_id LIMIT 1);
    test:
      checks: [privileges, catalog, shadowing]
      args: []

  - name: identity.org_count
    class: read
    scope: global
    grants: [pipeshub_node]
    args:
      - {name: p_live_only, type: boolean}
    returns: bigint
    reads: [identity.orgs]
    body: |
      RETURN (SELECT count(*) FROM identity.orgs o WHERE NOT p_live_only OR NOT o.is_deleted);
    test:
      checks: [privileges, catalog, shadowing]
      args: [true]

  # The organisation gauges (the jobs role): exactly the columns they chart, for every live organisation.
  - name: identity.gauge_user_counts
    class: jobs
    scope: global
    args: []
    returns: "TABLE (org_id text, n bigint)"
    reads: [identity.users]
    body: |
      RETURN QUERY SELECT u.org_id, count(*) FROM identity.users u WHERE NOT u.is_deleted GROUP BY u.org_id;
    test:
      checks: [privileges, catalog]
      args: []

  - name: identity.gauge_live_orgs
    class: jobs
    scope: global
    args: []
    returns: "TABLE (org_id text, account_type text, domain text)"
    reads: [identity.orgs]
    body: |
      RETURN QUERY SELECT o.org_id, o.account_type, o.domain FROM identity.orgs o WHERE NOT o.is_deleted;
    test:
      checks: [privileges, catalog]
      args: []

  - name: identity.gauge_auth_configs
    class: jobs
    scope: global
    args: []
    returns: "TABLE (org_id text, auth_steps jsonb)"
    reads: [identity.org_auth_config]
    body: |
      RETURN QUERY SELECT c.org_id, c.auth_steps FROM identity.org_auth_config c WHERE NOT c.is_deleted;
    test:
      checks: [privileges, catalog]
      args: []

  # A new organisation's chosen slug, claimed in its creation unit before its row is written: true when it is now the org's; false,
  # with nothing written, when it is malformed, the counter's 'org-<digits>' shape, held by an organisation (an imported one too) or
  # claimed by another unit, so the answer tells nothing about which. No ON CONFLICT (check 57): a concurrent claim of the same slug
  # waits for the first and then fails on the unique key.
  - name: identity.org_slug_claim
    class: write
    scope: org
    writer: pipeshub_node
    args:
      - {name: p_slug, type: text, length: [1, 200]}
    returns: boolean
    no_org: "false"
    reads: [identity.orgs]
    body: |
      IF length(p_slug) > 64 OR p_slug !~ '^[a-z0-9]+(-[a-z0-9]+)*$' OR p_slug ~ '^org-[0-9]+$'
         OR EXISTS (SELECT 1 FROM identity.orgs o WHERE o.slug = p_slug) THEN
        RETURN false;
      END IF;
      BEGIN
        INSERT INTO identity.org_slugs (org_id, slug) VALUES (v_org, p_slug);
      EXCEPTION WHEN unique_violation THEN
        RETURN false;
      END;
      RETURN true;
    test:
      needle: "DELETE FROM identity.org_slugs"
      state: "SELECT count(*) FROM identity.org_slugs WHERE org_id = '{org}'"
      args: ["needle-slug"]
      own_result: [[true]]
      other_result: [[true]]
      no_org_result: [[false]]
      bad_args: [[""], [null], ["xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"]]

  # The document copy's claim of a copied organisation's slug, in the unit that writes its row, so identity.org_slugs holds every
  # chosen slug and a claim racing the copy is decided by the unique key: a slug another organisation holds fails the copy's unit
  # with unique_violation, as its row would on MongoDB. The pair already there (a batch run again) answers false and writes nothing.
  # The copy never passes a counter slug ('org-<digits>'). The import role only.
  - name: identity.copied_org_slug_claim
    class: write
    scope: global
    writer: pipeshub_import
    args:
      - {name: p_org_id, type: text, length: [24, 24]}
      - {name: p_slug, type: text, length: [1, 200]}
    returns: boolean
    reads: [identity.org_slugs]
    body: |
      IF EXISTS (SELECT 1 FROM identity.org_slugs t WHERE t.org_id = p_org_id AND t.slug = p_slug) THEN
        RETURN false;
      END IF;
      INSERT INTO identity.org_slugs (org_id, slug) VALUES (p_org_id, p_slug);
      RETURN true;
    test:
      checks: [privileges, catalog, shadowing]
      needle: "DELETE FROM identity.org_slugs"
      args: ["aaaaaaaaaaaaaaaaaaaaaaaa", "needle-copied"]
