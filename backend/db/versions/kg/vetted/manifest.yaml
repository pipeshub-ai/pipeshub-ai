# Vetted SECURITY DEFINER writers of schema kg. Format and rules: db/lib/vetted.py; shapes the catalog accepts: db/README.md "Pinned writes".
# Only the connectors service executes them; each is pinned (kernel.vetted_write_pins), takes the org from app.org_id, and the tables have
# the per-org row policy for the vetted role. Written by gen from the same list as the tests; edit and run
# python -m db.lib.vetted render versions/kg/vetted/manifest.yaml
# The statements are exactly the pinned shapes: arrays are capped at 5000 items, every key is the whole primary key.
# A batch is sorted by key before it is written (writers that overlap take their row locks in key order, so they wait for each other instead of deadlocking),
# and a key named twice in one batch keeps its last item. `rule`, `model`, `origin` and `via` are closed sets and refused (22023) outside them; `gtype` (a
# permission type), `role` and `record_type` are named by the connectors and stay open. A malformed organisation in the session raises the table's
# format check (23514) on a write and finds nothing on a delete.
functions:
  - name: kg.w_nodes_upsert
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.node_keys", "set": []}]
    args:
      - {"name": "p_colls", "type": "smallint[]", "max_items": 5000, "item_not_null": true, "item_range": [1, 8]}
      - {"name": "p_ids", "type": "text[]", "max_items": 5000, "item_not_null": true, "item_length": [1, 256]}
    returns: "TABLE (o_coll smallint, o_id text, o_sk bigint)"
    reads: ["kg.node_keys"]
    body: |
      BEGIN
        IF cardinality(p_colls) <> cardinality(p_ids) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2), array_agg(s.c2 ORDER BY s.c1, s.c2) INTO p_colls, p_ids FROM (SELECT DISTINCT ON (k.c1, k.c2) k.c1, k.c2 FROM unnest(p_colls, p_ids) WITH ORDINALITY AS k(c1, c2, n) ORDER BY k.c1, k.c2, k.n DESC) s;
        INSERT INTO kg.node_keys (org_id, coll, id) SELECT v_org, k.a, k.b FROM unnest(p_colls, p_ids) AS k(a, b)
          ON CONFLICT (org_id, coll, id) DO NOTHING;
        RETURN QUERY SELECT k.coll, k.id, k.sk FROM kg.node_keys k JOIN unnest(p_colls, p_ids) AS x(c, i) ON k.coll = x.c AND k.id = x.i WHERE k.org_id = v_org LIMIT 5000;
      END;

  - name: kg.w_records_upsert
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.records", "set": ["coll", "id", "kind", "app_sk", "group_sk", "parent_sk", "rule", "model", "vrid", "name", "name_key", "updated_ms", "created_ms", "size_bytes", "record_type", "origin", "external_id", "deleted", "placeholder", "granted"]}]
    args:
      - {"name": "p_sks", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_colls", "type": "smallint[]", "max_items": 5000, "item_not_null": true, "item_range": [1, 3]}
      - {"name": "p_ids", "type": "text[]", "max_items": 5000, "item_not_null": true, "item_length": [1, 256]}
      - {"name": "p_kinds", "type": "smallint[]", "max_items": 5000, "item_not_null": true, "item_range": [1, 3]}
      - {"name": "p_app_sks", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_group_sks", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_parent_sks", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_rules", "type": "text[]", "max_items": 5000, "item_enum": ["OPEN", "STRICT", "RESTRICTED"]}
      - {"name": "p_models", "type": "text[]", "max_items": 5000, "item_enum": ["APP_LEVEL", "RECORD_LEVEL", "RECORD_GROUP_LEVEL"]}
      - {"name": "p_vrids", "type": "text[]", "max_items": 5000, "item_length": [0, 256]}
      - {"name": "p_names", "type": "text[]", "max_items": 5000, "item_length": [0, 4000]}
      - {"name": "p_name_keys", "type": "text[]", "max_items": 5000, "item_length": [0, 4000]}
      - {"name": "p_updated", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_created", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_sizes", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_record_types", "type": "text[]", "max_items": 5000, "item_length": [0, 64]}
      - {"name": "p_origins", "type": "text[]", "max_items": 5000, "item_enum": ["CONNECTOR", "UPLOAD"]}
      - {"name": "p_external_ids", "type": "text[]", "max_items": 5000, "item_length": [0, 2000]}
      - {"name": "p_deleted", "type": "boolean[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_placeholders", "type": "boolean[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_granted", "type": "boolean[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.records"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_colls) <> cardinality(p_sks) OR cardinality(p_ids) <> cardinality(p_sks) OR cardinality(p_kinds) <> cardinality(p_sks) OR cardinality(p_app_sks) <> cardinality(p_sks) OR cardinality(p_group_sks) <> cardinality(p_sks) OR cardinality(p_parent_sks) <> cardinality(p_sks) OR cardinality(p_rules) <> cardinality(p_sks) OR cardinality(p_models) <> cardinality(p_sks) OR cardinality(p_vrids) <> cardinality(p_sks) OR cardinality(p_names) <> cardinality(p_sks) OR cardinality(p_name_keys) <> cardinality(p_sks) OR cardinality(p_updated) <> cardinality(p_sks) OR cardinality(p_created) <> cardinality(p_sks) OR cardinality(p_sizes) <> cardinality(p_sks) OR cardinality(p_record_types) <> cardinality(p_sks) OR cardinality(p_origins) <> cardinality(p_sks) OR cardinality(p_external_ids) <> cardinality(p_sks) OR cardinality(p_deleted) <> cardinality(p_sks) OR cardinality(p_placeholders) <> cardinality(p_sks) OR cardinality(p_granted) <> cardinality(p_sks) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1), array_agg(s.c2 ORDER BY s.c1), array_agg(s.c3 ORDER BY s.c1), array_agg(s.c4 ORDER BY s.c1), array_agg(s.c5 ORDER BY s.c1), array_agg(s.c6 ORDER BY s.c1), array_agg(s.c7 ORDER BY s.c1), array_agg(s.c8 ORDER BY s.c1), array_agg(s.c9 ORDER BY s.c1), array_agg(s.c10 ORDER BY s.c1), array_agg(s.c11 ORDER BY s.c1), array_agg(s.c12 ORDER BY s.c1), array_agg(s.c13 ORDER BY s.c1), array_agg(s.c14 ORDER BY s.c1), array_agg(s.c15 ORDER BY s.c1), array_agg(s.c16 ORDER BY s.c1), array_agg(s.c17 ORDER BY s.c1), array_agg(s.c18 ORDER BY s.c1), array_agg(s.c19 ORDER BY s.c1), array_agg(s.c20 ORDER BY s.c1), array_agg(s.c21 ORDER BY s.c1) INTO p_sks, p_colls, p_ids, p_kinds, p_app_sks, p_group_sks, p_parent_sks, p_rules, p_models, p_vrids, p_names, p_name_keys, p_updated, p_created, p_sizes, p_record_types, p_origins, p_external_ids, p_deleted, p_placeholders, p_granted FROM (SELECT DISTINCT ON (k.c1) k.c1, k.c2, k.c3, k.c4, k.c5, k.c6, k.c7, k.c8, k.c9, k.c10, k.c11, k.c12, k.c13, k.c14, k.c15, k.c16, k.c17, k.c18, k.c19, k.c20, k.c21 FROM unnest(p_sks, p_colls, p_ids, p_kinds, p_app_sks, p_group_sks, p_parent_sks, p_rules, p_models, p_vrids, p_names, p_name_keys, p_updated, p_created, p_sizes, p_record_types, p_origins, p_external_ids, p_deleted, p_placeholders, p_granted) WITH ORDINALITY AS k(c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, n) ORDER BY k.c1, k.n DESC) s;
        INSERT INTO kg.records (org_id, sk, coll, id, kind, app_sk, group_sk, parent_sk, rule, model, vrid, name, name_key, updated_ms, created_ms, size_bytes, record_type, origin, external_id, deleted, placeholder, granted) SELECT v_org, k.a, k.b, k.c, k.d, k.e, k.f, k.g, k.h, k.i, k.j, k.k, k.l, k.m, k.n, k.o, k.p, k.q, k.r, k.s, k.t, k.u FROM unnest(p_sks, p_colls, p_ids, p_kinds, p_app_sks, p_group_sks, p_parent_sks, p_rules, p_models, p_vrids, p_names, p_name_keys, p_updated, p_created, p_sizes, p_record_types, p_origins, p_external_ids, p_deleted, p_placeholders, p_granted) AS k(a, b, c, d, e, f, g, h, i, j, k, l, m, n, o, p, q, r, s, t, u)
          ON CONFLICT (org_id, sk) DO UPDATE SET coll = excluded.coll, id = excluded.id, kind = excluded.kind, app_sk = excluded.app_sk, group_sk = excluded.group_sk, parent_sk = excluded.parent_sk, rule = excluded.rule, model = excluded.model, vrid = excluded.vrid, name = excluded.name, name_key = excluded.name_key, updated_ms = excluded.updated_ms, created_ms = excluded.created_ms, size_bytes = excluded.size_bytes, record_type = excluded.record_type, origin = excluded.origin, external_id = excluded.external_id, deleted = excluded.deleted, placeholder = excluded.placeholder, granted = excluded.granted;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_records_delete
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "delete", "rel": "kg.records", "key": ["sk"]}]
    args:
      - {"name": "p_sks", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.records"]
    body: |
      DECLARE v_n integer;
      BEGIN
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1) INTO p_sks FROM (SELECT DISTINCT ON (k.c1) k.c1 FROM unnest(p_sks) WITH ORDINALITY AS k(c1, n) ORDER BY k.c1, k.n DESC) s;
        DELETE FROM kg.records t USING unnest(p_sks) AS k(a) WHERE t.org_id = v_org AND t.sk = k.a;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_links_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.links", "set": []}]
    args:
      - {"name": "p_parents", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_kinds", "type": "smallint[]", "max_items": 5000, "item_not_null": true, "item_range": [1, 2]}
      - {"name": "p_children", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.links"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_kinds) <> cardinality(p_parents) OR cardinality(p_children) <> cardinality(p_parents) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c2 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c3 ORDER BY s.c1, s.c2, s.c3) INTO p_parents, p_kinds, p_children FROM (SELECT DISTINCT ON (k.c1, k.c2, k.c3) k.c1, k.c2, k.c3 FROM unnest(p_parents, p_kinds, p_children) WITH ORDINALITY AS k(c1, c2, c3, n) ORDER BY k.c1, k.c2, k.c3, k.n DESC) s;
        INSERT INTO kg.links (org_id, parent_sk, kind, child_sk) SELECT v_org, k.a, k.b, k.c FROM unnest(p_parents, p_kinds, p_children) AS k(a, b, c)
          ON CONFLICT (org_id, parent_sk, kind, child_sk) DO NOTHING;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_links_delete
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "delete", "rel": "kg.links", "key": ["parent_sk", "kind", "child_sk"]}]
    args:
      - {"name": "p_parents", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_kinds", "type": "smallint[]", "max_items": 5000, "item_not_null": true, "item_range": [1, 2]}
      - {"name": "p_children", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.links"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_kinds) <> cardinality(p_parents) OR cardinality(p_children) <> cardinality(p_parents) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c2 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c3 ORDER BY s.c1, s.c2, s.c3) INTO p_parents, p_kinds, p_children FROM (SELECT DISTINCT ON (k.c1, k.c2, k.c3) k.c1, k.c2, k.c3 FROM unnest(p_parents, p_kinds, p_children) WITH ORDINALITY AS k(c1, c2, c3, n) ORDER BY k.c1, k.c2, k.c3, k.n DESC) s;
        DELETE FROM kg.links t USING unnest(p_parents, p_kinds, p_children) AS k(a, b, c) WHERE t.org_id = v_org AND t.parent_sk = k.a AND t.kind = k.b AND t.child_sk = k.c;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_grants_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.scope_members", "set": ["role", "app_sk", "leaf"]}]
    args:
      - {"name": "p_principals", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_nodes", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_gtypes", "type": "text[]", "max_items": 5000, "item_not_null": true, "item_length": [1, 64]}
      - {"name": "p_roles", "type": "text[]", "max_items": 5000, "item_length": [0, 64]}
      - {"name": "p_apps", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_leaves", "type": "boolean[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.scope_members"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_nodes) <> cardinality(p_principals) OR cardinality(p_gtypes) <> cardinality(p_principals) OR cardinality(p_roles) <> cardinality(p_principals) OR cardinality(p_apps) <> cardinality(p_principals) OR cardinality(p_leaves) <> cardinality(p_principals) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c2 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c3 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c4 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c5 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c6 ORDER BY s.c1, s.c2, s.c3) INTO p_principals, p_nodes, p_gtypes, p_roles, p_apps, p_leaves FROM (SELECT DISTINCT ON (k.c1, k.c2, k.c3) k.c1, k.c2, k.c3, k.c4, k.c5, k.c6 FROM unnest(p_principals, p_nodes, p_gtypes, p_roles, p_apps, p_leaves) WITH ORDINALITY AS k(c1, c2, c3, c4, c5, c6, n) ORDER BY k.c1, k.c2, k.c3, k.n DESC) s;
        INSERT INTO kg.scope_members (org_id, principal_sk, node_sk, gtype, role, app_sk, leaf) SELECT v_org, k.a, k.b, k.c, k.d, k.e, k.f FROM unnest(p_principals, p_nodes, p_gtypes, p_roles, p_apps, p_leaves) AS k(a, b, c, d, e, f)
          ON CONFLICT (org_id, principal_sk, node_sk, gtype) DO UPDATE SET role = excluded.role, app_sk = excluded.app_sk, leaf = excluded.leaf;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_grants_delete
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "delete", "rel": "kg.scope_members", "key": ["principal_sk", "node_sk", "gtype"]}]
    args:
      - {"name": "p_principals", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_nodes", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_gtypes", "type": "text[]", "max_items": 5000, "item_not_null": true, "item_length": [1, 64]}
    returns: "int"
    no_org: "0"
    reads: ["kg.scope_members"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_nodes) <> cardinality(p_principals) OR cardinality(p_gtypes) <> cardinality(p_principals) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c2 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c3 ORDER BY s.c1, s.c2, s.c3) INTO p_principals, p_nodes, p_gtypes FROM (SELECT DISTINCT ON (k.c1, k.c2, k.c3) k.c1, k.c2, k.c3 FROM unnest(p_principals, p_nodes, p_gtypes) WITH ORDINALITY AS k(c1, c2, c3, n) ORDER BY k.c1, k.c2, k.c3, k.n DESC) s;
        DELETE FROM kg.scope_members t USING unnest(p_principals, p_nodes, p_gtypes) AS k(a, b, c) WHERE t.org_id = v_org AND t.principal_sk = k.a AND t.node_sk = k.b AND t.gtype = k.c;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_closure_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.principal_closure", "set": ["via"]}]
    args:
      - {"name": "p_users", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_principals", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_apps", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_vias", "type": "text[]", "max_items": 5000, "item_not_null": true, "item_enum": ["self", "membership", "org", "link", "link_badge"]}
    returns: "int"
    no_org: "0"
    reads: ["kg.principal_closure"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_principals) <> cardinality(p_users) OR cardinality(p_apps) <> cardinality(p_users) OR cardinality(p_vias) <> cardinality(p_users) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c2 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c3 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c4 ORDER BY s.c1, s.c2, s.c3) INTO p_users, p_principals, p_apps, p_vias FROM (SELECT DISTINCT ON (k.c1, k.c2, k.c3) k.c1, k.c2, k.c3, k.c4 FROM unnest(p_users, p_principals, p_apps, p_vias) WITH ORDINALITY AS k(c1, c2, c3, c4, n) ORDER BY k.c1, k.c2, k.c3, k.n DESC) s;
        INSERT INTO kg.principal_closure (org_id, user_sk, principal_sk, app_sk, via) SELECT v_org, k.a, k.b, k.c, k.d FROM unnest(p_users, p_principals, p_apps, p_vias) AS k(a, b, c, d)
          ON CONFLICT (org_id, user_sk, principal_sk, app_sk) DO UPDATE SET via = excluded.via;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_closure_delete
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "delete", "rel": "kg.principal_closure", "key": ["user_sk", "principal_sk", "app_sk"]}]
    args:
      - {"name": "p_users", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_principals", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_apps", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.principal_closure"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_principals) <> cardinality(p_users) OR cardinality(p_apps) <> cardinality(p_users) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c2 ORDER BY s.c1, s.c2, s.c3), array_agg(s.c3 ORDER BY s.c1, s.c2, s.c3) INTO p_users, p_principals, p_apps FROM (SELECT DISTINCT ON (k.c1, k.c2, k.c3) k.c1, k.c2, k.c3 FROM unnest(p_users, p_principals, p_apps) WITH ORDINALITY AS k(c1, c2, c3, n) ORDER BY k.c1, k.c2, k.c3, k.n DESC) s;
        DELETE FROM kg.principal_closure t USING unnest(p_users, p_principals, p_apps) AS k(a, b, c) WHERE t.org_id = v_org AND t.user_sk = k.a AND t.principal_sk = k.b AND t.app_sk = k.c;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

