  - name: kg.w_changes_delete
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "delete", "rel": "kg.graph_changes", "key": ["id"]}]
    args:
      - {"name": "p_ids", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    body: |
      DECLARE v_n integer;
      BEGIN
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1) INTO p_ids FROM (SELECT DISTINCT ON (k.c1) k.c1 FROM unnest(p_ids) WITH ORDINALITY AS k(c1, n) ORDER BY k.c1, k.n DESC) s;
        DELETE FROM kg.graph_changes t USING unnest(p_ids) AS k(a) WHERE t.org_id = v_org AND t.id = k.a;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_projection_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.projection_state", "set": ["code_epoch", "mode", "verify_digest", "backfill_cursor", "verified_at"]}]
    args:
      - {"name": "p_app_sk", "type": "bigint", "range": [0, 9223372036854775807]}
      - {"name": "p_code_epoch", "type": "int", "range": [0, 1000000]}
      - {"name": "p_mode", "type": "text", "enum": ["legacy", "shadow", "enforce"]}
      - {"name": "p_digest", "type": "text", "nullable": true, "length": [0, 128]}
      - {"name": "p_cursor", "type": "text", "nullable": true, "length": [0, 512]}
      - {"name": "p_verified_at", "type": "timestamptz", "nullable": true}
    returns: "boolean"
    no_org: "false"
    body: |
      INSERT INTO kg.projection_state (org_id, app_sk, code_epoch, mode, verify_digest, backfill_cursor, verified_at) VALUES (v_org, p_app_sk, p_code_epoch, p_mode, p_digest, p_cursor, p_verified_at)
          ON CONFLICT (org_id, app_sk) DO UPDATE SET code_epoch = excluded.code_epoch, mode = excluded.mode, verify_digest = excluded.verify_digest, backfill_cursor = excluded.backfill_cursor, verified_at = excluded.verified_at;
        RETURN true;

  - name: kg.w_classes_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.scope_classes", "set": []}]
    args:
      - {"name": "p_ids", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_app_sks", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_group_sks", "type": "bigint[]", "max_items": 5000}
      - {"name": "p_clauses", "type": "jsonb[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_hashes", "type": "bytea[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.scope_classes"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_app_sks) <> cardinality(p_ids) OR cardinality(p_group_sks) <> cardinality(p_ids) OR cardinality(p_clauses) <> cardinality(p_ids) OR cardinality(p_hashes) <> cardinality(p_ids) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        IF EXISTS (SELECT 1 FROM unnest(p_clauses) AS e WHERE jsonb_typeof(e) <> 'array') THEN
          RAISE EXCEPTION 'w_classes_set: the clauses of a class are an array' USING ERRCODE = '22023';
        END IF;
        -- A class is content-addressed: an id that is named twice, or already stored, with other content is refused, never silently kept as it was.
        IF EXISTS (SELECT 1 FROM unnest(p_ids, p_app_sks, p_group_sks, p_clauses, p_hashes) AS k(a, b, c, d, e) GROUP BY k.a HAVING count(DISTINCT (k.b, k.c, k.d, k.e)) > 1)
           OR EXISTS (SELECT 1 FROM kg.scope_classes t JOIN unnest(p_ids, p_app_sks, p_group_sks, p_clauses, p_hashes) AS k(a, b, c, d, e) ON t.id = k.a
                      WHERE t.org_id = v_org AND (t.app_sk <> k.b OR t.group_sk IS DISTINCT FROM k.c OR t.clauses <> k.d OR t.hash <> k.e)) THEN
          RAISE EXCEPTION 'w_classes_set: the class id is taken by other content' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1), array_agg(s.c2 ORDER BY s.c1), array_agg(s.c3 ORDER BY s.c1), array_agg(s.c4 ORDER BY s.c1), array_agg(s.c5 ORDER BY s.c1) INTO p_ids, p_app_sks, p_group_sks, p_clauses, p_hashes FROM (SELECT DISTINCT ON (k.c1) k.c1, k.c2, k.c3, k.c4, k.c5 FROM unnest(p_ids, p_app_sks, p_group_sks, p_clauses, p_hashes) WITH ORDINALITY AS k(c1, c2, c3, c4, c5, n) ORDER BY k.c1, k.n DESC) s;
        INSERT INTO kg.scope_classes (org_id, id, app_sk, group_sk, clauses, hash) SELECT v_org, k.a, k.b, k.c, k.d, k.e FROM unnest(p_ids, p_app_sks, p_group_sks, p_clauses, p_hashes) AS k(a, b, c, d, e)
          ON CONFLICT (org_id, id) DO NOTHING;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        -- A row a concurrent writer committed between the check above and the insert was skipped, not written: whatever is stored under each id is now read again,
        -- and an id that holds other content is refused as it was above (each statement sees what has been committed since the last).
        IF EXISTS (SELECT 1 FROM kg.scope_classes t JOIN unnest(p_ids, p_app_sks, p_group_sks, p_clauses, p_hashes) AS k(a, b, c, d, e) ON t.id = k.a
                   WHERE t.org_id = v_org AND (t.app_sk <> k.b OR t.group_sk IS DISTINCT FROM k.c OR t.clauses <> k.d OR t.hash <> k.e)) THEN
          RAISE EXCEPTION 'w_classes_set: the class id is taken by other content' USING ERRCODE = '22023';
        END IF;
        RETURN v_n;
      END;

  - name: kg.w_class_literals_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.class_literals", "set": []}]
    args:
      - {"name": "p_anchors", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
      - {"name": "p_classes", "type": "bigint[]", "max_items": 5000, "item_not_null": true}
    returns: "int"
    no_org: "0"
    reads: ["kg.class_literals"]
    body: |
      DECLARE v_n integer;
      BEGIN
        IF cardinality(p_classes) <> cardinality(p_anchors) THEN
          RAISE EXCEPTION 'the arrays differ in length' USING ERRCODE = '22023';
        END IF;
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1, s.c2), array_agg(s.c2 ORDER BY s.c1, s.c2) INTO p_anchors, p_classes FROM (SELECT DISTINCT ON (k.c1, k.c2) k.c1, k.c2 FROM unnest(p_anchors, p_classes) WITH ORDINALITY AS k(c1, c2, n) ORDER BY k.c1, k.c2, k.n DESC) s;
        INSERT INTO kg.class_literals (org_id, anchor_sk, class_id) SELECT v_org, k.a, k.b FROM unnest(p_anchors, p_classes) AS k(a, b)
          ON CONFLICT (org_id, anchor_sk, class_id) DO NOTHING;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;

  - name: kg.w_app_facts_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.projection_state", "set": ["opens", "has_group_level", "facts_set"]}]
    args:
      - {"name": "p_app_sk", "type": "bigint", "range": [0, 9223372036854775807]}
      - {"name": "p_opens", "type": "boolean"}
      - {"name": "p_group_level", "type": "boolean"}
    returns: "boolean"
    no_org: "false"
    body: |
      INSERT INTO kg.projection_state (org_id, app_sk, opens, has_group_level, facts_set) VALUES (v_org, p_app_sk, p_opens, p_group_level, true)
          ON CONFLICT (org_id, app_sk) DO UPDATE SET opens = excluded.opens, has_group_level = excluded.has_group_level, facts_set = excluded.facts_set;
        RETURN true;

  - name: kg.w_app_cross_set
    class: write
    scope: org
    writer: pipeshub_connectors
    custom_plan: true
    callers: ["python/app/services/graph_db/postgres/kg"]
    pins: [{"op": "upsert", "rel": "kg.projection_state", "set": ["cross_app"]}]
    args:
      - {"name": "p_app_sks", "type": "bigint[]", "max_items": 5000, "item_not_null": true, "item_range": [0, 9223372036854775807]}
    returns: "int"
    no_org: "0"
    reads: ["kg.projection_state"]
    body: |
      DECLARE v_n integer;
      BEGIN
        -- Sorted by key (locks are taken in key order) and a key named twice keeps its last item
        SELECT array_agg(s.c1 ORDER BY s.c1) INTO p_app_sks FROM (SELECT DISTINCT ON (k.c1) k.c1 FROM unnest(p_app_sks) WITH ORDINALITY AS k(c1, n) ORDER BY k.c1, k.n DESC) s;
        INSERT INTO kg.projection_state (org_id, app_sk, cross_app) SELECT v_org, k.a, true FROM unnest(p_app_sks) AS k(a)
          ON CONFLICT (org_id, app_sk) DO UPDATE SET cross_app = excluded.cross_app;
        GET DIAGNOSTICS v_n = ROW_COUNT;
        RETURN v_n;
      END;
