# Vetted SECURITY DEFINER functions of schema graph. Format and rules: db/lib/vetted.py.
# After editing: python -m db.lib.vetted render versions/graph/vetted/manifest.yaml
#
# The cross-org reads the services make under a system scope: the organisation list (start-up, every per-org background pass) and the
# connector instances (the schedule sweep). They answer for every org, so only the three graph-reading services may call them, and
# they return nothing but these two collections: a service needs no login that can read the whole graph. They return the whole document
# (organisation and connector-instance documents hold names, flags and settings, no credentials; the provider reads them as it reads
# any document of these collections). Ids are unique per organisation only, so every page continues after the last (org, id) pair it
# returned, never after an id alone.
functions:
  # One page of the organisations after the given (org, id) pair, in that order: internal or external, live ones only unless p_all.
  - name: graph.system_orgs
    class: read
    scope: global
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_all, type: boolean}
      - {name: p_external, type: boolean}
      - {name: p_after, type: text, default: "''", length: [0, 200]}
      - {name: p_after_id, type: text, default: "''", length: [0, 200]}
      - {name: p_limit, type: int, default: "1000", range: [1, 1000]}
    returns: "TABLE (org_id text, node_id text, node_json text)"
    reads: [graph.nodes]
    content_ok: true
    body: |
      RETURN QUERY SELECT n.org_id, n.id, n.doc::text FROM graph.nodes n
        WHERE n.coll = 'organizations' AND (n.doc @> '{"isExternal": true}') = p_external
          AND (p_all OR n.doc @> '{"isActive": true}') AND (n.org_id, n.id) > (p_after, p_after_id) ORDER BY n.org_id, n.id LIMIT p_limit;

  # One page of the connector instances (collection apps), across orgs, in (id, org) order after the given pair.
  - name: graph.system_apps
    class: read
    scope: global
    grants: [pipeshub_connectors, pipeshub_indexing]
    args:
      - {name: p_only_active, type: boolean}
      - {name: p_after_id, type: text, default: "''", length: [0, 200]}
      - {name: p_after_org, type: text, default: "''", length: [0, 200]}
      - {name: p_limit, type: int, default: "100", range: [1, 1000]}
    returns: "TABLE (org_id text, app_id text, node_json text)"
    reads: [graph.nodes]
    content_ok: true
    body: |
      RETURN QUERY SELECT n.org_id, n.id, n.doc::text FROM graph.nodes n
        WHERE n.coll = 'apps' AND (NOT p_only_active OR n.doc @> '{"isActive": true}')
        AND (n.id, n.org_id) > (p_after_id, p_after_org) ORDER BY n.id, n.org_id LIMIT p_limit;

  # One connector instance by id, whichever org holds it.
  - name: graph.system_app
    class: read
    scope: global
    grants: [pipeshub_connectors, pipeshub_indexing]
    args:
      - {name: p_id, type: text, length: [1, 200]}
    returns: "TABLE (org_id text, app_id text, node_json text)"
    reads: [graph.nodes]
    content_ok: true
    body: |
      RETURN QUERY SELECT n.org_id, n.id, n.doc::text FROM graph.nodes n WHERE n.coll = 'apps' AND n.id = p_id ORDER BY n.org_id LIMIT 1;

# ---- the code graph's hot lookups -------------------------------------------------------------------------------------------------
# A document read by a key of its document that has an expression index (graph_0001). Row-level security hides those indexes from
# the services' own role (the `->>` operator is not leakproof, so the planner may use only `org_id`), so the read goes through a function
# that applies the org itself. The org comes from app.org_id; the extra filters (p_keys, p_vals: the document key and its JSON value) are
# applied as the provider's own statement applies them, and p_null_absent selects its rule that a null value also matches an absent key.
# A page continues after p_after (ids ascending), so a read of every match pages by the last id.

  # The blocks of one record (index nodes_block_record).
  - name: graph.blocks_by_record
    class: read
    scope: org
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_record_id, type: text, length: [1, 200]}
      - {name: p_keys, type: "text[]", max_items: 32, item_not_null: true, item_length: [1, 200]}
      - {name: p_vals, type: "jsonb[]", max_items: 32, item_not_null: true}
      - {name: p_null_absent, type: boolean}
      - {name: p_after, type: text, default: "''", length: [0, 200]}
      - {name: p_limit, type: int, default: "1000", range: [1, 1000]}
    returns: "TABLE (node_id text, doc jsonb)"
    reads: [graph.nodes]
    content_ok: true
    custom_plan: true        # a generic plan walks the primary key in id order to meet the LIMIT instead of using the key's index
    body: |
      IF cardinality(p_keys) <> cardinality(p_vals) THEN RAISE EXCEPTION 'p_keys and p_vals differ in length' USING ERRCODE = '22023'; END IF;
      -- the matches are found by the key's index first (MATERIALIZED), then ordered: with the order in the same query the planner can walk the primary key in
      -- id order to meet the LIMIT, which filters the whole collection when it expects the key to be common
      RETURN QUERY WITH m AS MATERIALIZED (SELECT n.id, n.doc FROM graph.nodes n
        WHERE n.org_id = v_org AND n.coll = 'blocks' AND n.doc->>'recordId' = p_record_id
          AND NOT EXISTS (SELECT 1 FROM unnest(p_keys, p_vals) f(k, v)
            WHERE CASE WHEN p_null_absent AND f.v = 'null' THEN coalesce(n.doc->f.k, f.v) <> f.v
                       ELSE n.doc->f.k IS DISTINCT FROM f.v END))
        SELECT m.id, m.doc FROM m WHERE m.id > p_after ORDER BY m.id LIMIT p_limit;

  # The blocks of one connector with one folded name (index nodes_block_name).
  - name: graph.blocks_by_name
    class: read
    scope: org
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_connector_id, type: text, length: [1, 200]}
      - {name: p_name_folded, type: text, length: [1, 1000]}
      - {name: p_keys, type: "text[]", max_items: 32, item_not_null: true, item_length: [1, 200]}
      - {name: p_vals, type: "jsonb[]", max_items: 32, item_not_null: true}
      - {name: p_null_absent, type: boolean}
      - {name: p_after, type: text, default: "''", length: [0, 200]}
      - {name: p_limit, type: int, default: "1000", range: [1, 1000]}
    returns: "TABLE (node_id text, doc jsonb)"
    reads: [graph.nodes]
    content_ok: true
    custom_plan: true        # a generic plan walks the primary key in id order to meet the LIMIT instead of using the key's index
    body: |
      IF cardinality(p_keys) <> cardinality(p_vals) THEN RAISE EXCEPTION 'p_keys and p_vals differ in length' USING ERRCODE = '22023'; END IF;
      -- the matches are found by the key's index first (MATERIALIZED), then ordered: with the order in the same query the planner can walk the primary key in
      -- id order to meet the LIMIT, which filters the whole collection when it expects the key to be common
      RETURN QUERY WITH m AS MATERIALIZED (SELECT n.id, n.doc FROM graph.nodes n
        WHERE n.org_id = v_org AND n.coll = 'blocks' AND n.doc->>'connectorId' = p_connector_id AND n.doc->>'nameFolded' = p_name_folded
          AND NOT EXISTS (SELECT 1 FROM unnest(p_keys, p_vals) f(k, v)
            WHERE CASE WHEN p_null_absent AND f.v = 'null' THEN coalesce(n.doc->f.k, f.v) <> f.v
                       ELSE n.doc->f.k IS DISTINCT FROM f.v END))
        SELECT m.id, m.doc FROM m WHERE m.id > p_after ORDER BY m.id LIMIT p_limit;

  # The code files of one path (index nodes_codefile_path).
  - name: graph.code_files_by_path
    class: read
    scope: org
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_path, type: text, length: [1, 2000]}
      - {name: p_keys, type: "text[]", max_items: 32, item_not_null: true, item_length: [1, 200]}
      - {name: p_vals, type: "jsonb[]", max_items: 32, item_not_null: true}
      - {name: p_null_absent, type: boolean}
      - {name: p_after, type: text, default: "''", length: [0, 200]}
      - {name: p_limit, type: int, default: "1000", range: [1, 1000]}
    returns: "TABLE (node_id text, doc jsonb)"
    reads: [graph.nodes]
    content_ok: true
    custom_plan: true        # a generic plan walks the primary key in id order to meet the LIMIT instead of using the key's index
    body: |
      IF cardinality(p_keys) <> cardinality(p_vals) THEN RAISE EXCEPTION 'p_keys and p_vals differ in length' USING ERRCODE = '22023'; END IF;
      -- the matches are found by the key's index first (MATERIALIZED), then ordered: with the order in the same query the planner can walk the primary key in
      -- id order to meet the LIMIT, which filters the whole collection when it expects the key to be common
      RETURN QUERY WITH m AS MATERIALIZED (SELECT n.id, n.doc FROM graph.nodes n
        WHERE n.org_id = v_org AND n.coll = 'codeFiles' AND n.doc->>'filePath' = p_path
          AND NOT EXISTS (SELECT 1 FROM unnest(p_keys, p_vals) f(k, v)
            WHERE CASE WHEN p_null_absent AND f.v = 'null' THEN coalesce(n.doc->f.k, f.v) <> f.v
                       ELSE n.doc->f.k IS DISTINCT FROM f.v END))
        SELECT m.id, m.doc FROM m WHERE m.id > p_after ORDER BY m.id LIMIT p_limit;

# ---- more hot lookups (graph_0004) ------------------------------------------------------------------------------------------------
# The same reason as the code graph's reads above: a plain statement under the service role reaches an expression index on the document
# only through org_id. Each function answers one lookup the services make on every request or sync step, from the org of app.org_id.

  # The records of one connector with one external id (index nodes_record_external); the caller picks the live or deleted one. No ORDER BY: an ordered scan of the primary key can look cheaper to a plan than the index of the key.
  - name: graph.record_by_external
    class: read
    scope: org
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_connector_id, type: text, length: [1, 200]}
      - {name: p_external_id, type: text, length: [1, 2000]}
    returns: "TABLE (node_id text, doc jsonb)"
    reads: [graph.nodes]
    content_ok: true
    custom_plan: true
    body: |
      RETURN QUERY SELECT n.id, n.doc FROM graph.nodes n
        WHERE n.org_id = v_org AND n.coll = 'records' AND n.doc->>'connectorId' = p_connector_id AND n.doc->>'externalRecordId' = p_external_id
        LIMIT 100;

  # The user with one userId (index nodes_user_userid).
  - name: graph.user_by_user_id
    class: read
    scope: org
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_user_id, type: text, length: [1, 200]}
    returns: "TABLE (node_id text, doc jsonb)"
    reads: [graph.nodes]
    content_ok: true
    custom_plan: true
    body: |
      RETURN QUERY SELECT n.id, n.doc FROM graph.nodes n
        WHERE n.org_id = v_org AND n.coll = 'users' AND n.doc->>'userId' = p_user_id
        LIMIT 1;

  # The records of the org that hold any of the given virtual record ids (index nodes_record_vrid), whose own orgId is the org; up to 5000.
  - name: graph.records_by_virtual_id
    class: read
    scope: org
    grants: [pipeshub_connectors, pipeshub_indexing, pipeshub_query]
    args:
      - {name: p_vrids, type: "text[]", max_items: 1000, item_not_null: true, item_length: [1, 200]}
    returns: "TABLE (node_id text, doc jsonb)"
    reads: [graph.nodes]
    content_ok: true
    custom_plan: true
    body: |
      RETURN QUERY SELECT n.id, n.doc FROM graph.nodes n
        WHERE n.org_id = v_org AND n.coll = 'records' AND n.doc->>'virtualRecordId' = ANY(p_vrids) AND n.doc->>'orgId' = v_org
        LIMIT 5000;
