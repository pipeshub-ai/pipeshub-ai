name: Heavy suite result
description: >-
  One check per heavy workflow that branch protection can require instead of
  its label-gated jobs (scripts/heavy_result.py). On an event the gate acts on
  it fails when a heavy job of this run failed or was cancelled. On any other
  event (an unrelated label) it reports the result of this workflow's latest
  earlier run on the same commit, so a label can never turn a failure into a
  pass. The calling job must check out scripts/ and .github/actions/ first, and
  needs actions: read.

inputs:
  heavy:
    description: "'true' when the gate acts on this event (non-PR events, or the pull request's heavy/other flag)"
    required: true
  needs:
    description: toJSON(needs) of the calling job
    required: true
  job:
    description: The calling job's name, as earlier runs report it
    required: true

runs:
  using: composite
  steps:
    - name: Report the heavy jobs' result
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAVY: ${{ inputs.heavy }}
        NEEDS: ${{ inputs.needs }}
        RESULT_JOB: ${{ inputs.job }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 scripts/heavy_result.py
