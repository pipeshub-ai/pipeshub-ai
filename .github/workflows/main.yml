name: PR Validations

on:
  pull_request:
    branches:
      - 'main'

# Every job here checks out with persist-credentials: false. The workflow runs
# on pull_request, so each job executes pull-request-controlled code (a build, a
# test file, scripts/connector_coverage.py); leaving the checkout token in
# .git/config would let that code read it. No job pushes, commits or tags, so
# none needs it.
permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/nodejs/apps/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend/nodejs/apps
          npm install

      # Fails only on ESLint errors this pull request adds; the ruff-lint-pr job explains why.
      - name: Lint backend (changed files)
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD)
          mapfile -d '' -t CHANGED_FILES < <(git diff --diff-filter=d --name-only -z "$MERGE_BASE" -- ':(glob)backend/nodejs/apps/src/**/*.ts' || true)
          if ((${#CHANGED_FILES[@]})); then
            echo "Linting changed TypeScript files:"
            printf '%s\n' "${CHANGED_FILES[@]}"
            python3 .github/scripts/new_lint_findings.py eslint "$MERGE_BASE" "${CHANGED_FILES[@]}"
          else
            echo "No TypeScript files changed in backend, skipping ESLint."
          fi

      - name: Build backend
        run: |
          cd backend/nodejs/apps
          npm run build

      # - name: Run backend tests
      #   run: |
      #     cd backend/nodejs/apps
      #     npm test

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      # Parity keeps every locale in step with en-US; the key check catches an
      # en-US key that was deleted while code still asks for it, which parity
      # alone cannot see because it compares the catalogues to each other.
      - name: Check locale parity and translation keys
        working-directory: frontend
        run: npm run i18n:check && npm run i18n:keys && npm run test:i18n

      # The coverage run, not plain test:unit: the minimum lives in
      # frontend/vitest.config.ts (coverage.thresholds) and is checked only when
      # coverage is on. A run below it fails here with "Coverage for <metric>
      # does not meet global threshold".
      - name: Run frontend unit tests with coverage
        run: |
          cd frontend
          npm run test:unit:coverage

      # The Electron local-sync tests drive a real file watcher against a real
      # temporary directory, so they are slower than the vitest suite (~45s) and
      # must run one file at a time — see the note on test:electron.
      - name: Run Electron main-process tests
        run: |
          cd frontend
          npm run test:electron

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  ruff-lint-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # Runs every rule on the changed files, but fails only on findings this pull
      # request adds. Findings already on main are reported, not blocking, so a
      # small fix to a large file is not held up by that file's backlog.
      - name: Fail on new ruff findings in changed Python files
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD)
          mapfile -d '' -t CHANGED_FILES < <(git diff --diff-filter=d --name-only -z "$MERGE_BASE" -- ':(glob)backend/python/**/*.py' || true)
          if ((${#CHANGED_FILES[@]})); then
            echo "Linting changed Python files with full ruleset:"
            printf '%s\n' "${CHANGED_FILES[@]}"
            echo "---"
            python3 .github/scripts/new_lint_findings.py ruff "$MERGE_BASE" "${CHANGED_FILES[@]}"
          else
            echo "No Python files changed, skipping ruff."
          fi

      # A class or function defined twice in one test module replaces the
      # first, and pytest never runs it. This fails on any F811 in a changed
      # test file, including one already on main.
      - name: Fail on shadowed tests (F811) in changed test files
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD)
          CHANGED_TESTS=$(git diff --diff-filter=d --name-only $MERGE_BASE -- 'backend/python/tests/*.py' | sed 's|^backend/python/||' || true)
          if [ -z "$CHANGED_TESTS" ]; then
            echo "No Python test files changed, skipping the F811 check."
            exit 0
          fi
          cd backend/python
          echo "$CHANGED_TESTS" | xargs ruff check --select F811 --output-format=concise

  pyright-type-check-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd backend/python
          uv pip install --system pyright
          uv pip install --system -e . 2>&1 || true

      - name: Run pyright on changed Python files
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD)
          CHANGED_FILES=$(git diff --diff-filter=d --name-only $MERGE_BASE -- ':(glob)backend/python/**/*.py' | grep -v 'code-generator/' | grep -v 'example\.py$' | sed 's|^backend/python/||' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Type-checking changed Python files:"
            echo "$CHANGED_FILES"
            echo "---"
            cd backend/python
            echo "$CHANGED_FILES" | xargs pyright || echo "::warning::Pyright found type errors (non-fatal)"
          else
            echo "No Python files changed in backend/python, skipping pyright."
          fi

  validate-docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check changed deployment files
        id: changes
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD)
          CHANGED_FILES=$(git diff --diff-filter=d --name-only "$MERGE_BASE" -- \
            'deployment/docker-compose/**' \
            'deployment/docker-entrypoint.sh' \
            'deployment/process_monitor.sh' \
            '.github/workflows/main.yml' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Docker Compose validation will run for:"
            echo "$CHANGED_FILES"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Docker Compose deployment files changed, skipping validation."
          fi

      - name: Validate MongoDB compose stability settings
        if: steps.changes.outputs.changed == 'true'
        run: bash deployment/docker-compose/tests/mongodb_stability_test.sh

      # installer_test.sh has existed with ~184 assertions and was not run by
      # any workflow. It needs neither Docker nor network, so there is no
      # reason for it not to gate a deployment change.
      - name: Installer unit tests
        if: steps.changes.outputs.changed == 'true'
        run: bash deployment/docker-compose/tests/installer_test.sh

      - name: Release tooling unit tests
        if: steps.changes.outputs.changed == 'true'
        run: bash deployment/docker-compose/tests/release_tooling_test.sh

      - name: Entrypoint ownership pass tests
        if: steps.changes.outputs.changed == 'true'
        run: bash deployment/docker-compose/tests/entrypoint_ownership_test.sh

  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing validated the workflows themselves. actionlint catches shell
      # errors inside `run:` blocks, bad expressions, and invalid schema before
      # a push discovers them. Pinned to a release tarball rather than an
      # action, because actionlint does not publish one.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          # Checksum of the pinned release tarball. Without it this step trusts
          # whatever the URL returns, which is a release asset a third party can
          # replace — and it runs on every pull request.
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint workflows
        env:
          # actionlint runs shellcheck over every `run:` block. Info- and
          # style-level findings are noise here (SC2086 on a git SHA, SC2001 on
          # a sed call); gate on warning and above so this catches real
          # breakage rather than style preferences.
          SHELLCHECK_OPTS: -S warning
        run: actionlint -color

  connector-coverage:
    name: Connector integration coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The workflow trust check parses YAML; this is the version integration-tests/uv.lock pins.
      - name: Install the scripts' test dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Test the coverage script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Fails only when a connector is registered without an integration test
      # that was not already recorded as a known gap. Existing gaps do not fail
      # the build; the list can shrink freely and only grows on purpose.
      - name: Check no new connector ships without a test
        run: python3 scripts/connector_coverage.py --check

      - name: Report coverage
        if: always()
        run: python3 scripts/connector_coverage.py >> "$GITHUB_STEP_SUMMARY"
