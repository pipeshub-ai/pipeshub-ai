name: Harness Fault Suite

# The L4 crash-point catalog and the rolling-upgrade scenarios (integration-tests/harness/fault, TEST-STRATEGY
# 6.1) on real processes: the shipped MongoDB replica set, Node's production
# harness composition and app.harness_main's worker, with a scripted model and
# tools, once per message broker. Each scenario SIGKILLs a process and waits
# for lease expiry, so it is nightly (with integration-tests.yml), on demand,
# or on a PR labelled `harness-fault`. It needs no secrets.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      broker:
        description: 'Message broker'
        type: choice
        options: [all, redis, kafka]
        default: all
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-fault-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  crash-points:
    name: Crash points (${{ matrix.broker }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'harness-fault')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        broker: ${{ fromJSON((github.event.inputs.broker == 'redis' && '["redis"]') || (github.event.inputs.broker == 'kafka' && '["kafka"]') || '["redis","kafka"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/nodejs/apps/package-lock.json

      - name: Install Node dependencies
        working-directory: backend/nodejs/apps
        run: npm ci --ignore-scripts

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: backend/python
        run: |
          requirements/install.sh dev --project . --editable

      - name: Run the crash catalog
        working-directory: integration-tests/harness/fault
        run: |
          mkdir -p "$RUNNER_TEMP/harness-fault"
          python -m pytest -v --broker "${{ matrix.broker }}" \
            --fault-artifacts "$RUNNER_TEMP/harness-fault" \
            --junitxml "$RUNNER_TEMP/harness-fault/junit.xml"

      # Logs carry ids, counts and reason codes only; the suite fails if one holds content or a secret.
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-fault-${{ matrix.broker }}
          path: ${{ runner.temp }}/harness-fault
          retention-days: 14
