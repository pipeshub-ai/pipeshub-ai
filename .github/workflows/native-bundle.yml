name: native-bundle

# Builds the no-Docker bundle (deployment/native) for Linux x64 and macOS arm64, starts it for real (PostgreSQL, the schema
# steps, every service, the API's health), stops it, and uploads it. Unsigned: macOS binaries carry an ad-hoc signature only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deployment/native/**
      - .github/workflows/native-bundle.yml

permissions:
  contents: read

concurrency:
  group: native-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # glibc 2.28: the bundle runs on any Linux at least as new (RHEL 8, Debian 10, Ubuntu 18.10 and later)
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools
        run: |
          dnf install -y -q perl-IPC-Cmd perl-Time-Piece perl-Pod-Html zlib-devel flex bison
          # uv from the hashed tools lock (SEC-SC-07); it pins the UV_VERSION of deployment/native/versions.env
          PYTHON=/opt/python/cp312-cp312/bin/python sh backend/python/requirements/install.sh tools
          grep -q "^uv==$(sed -n 's/^UV_VERSION=//p' deployment/native/versions.env) " backend/python/requirements/tools.lock
          ln -sf /opt/python/cp312-cp312/bin/uv /usr/local/bin/uv
          # PostgreSQL's initdb and server refuse to run as root
          useradd -m builder && chown -R builder "$GITHUB_WORKSPACE"
      - name: Build the bundle
        run: su builder -c "deployment/native/bundle.sh $PWD/out/pipeshub-native --archive $PWD/out/pipeshub-native-linux-x64.tar.gz"
      - name: Start, check health and loopback-only listeners, stop
        run: su builder -c "deployment/native/smoke.sh $PWD/out/pipeshub-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeshub-native-linux-x64
          path: out/pipeshub-native-linux-x64.tar.gz
          retention-days: 7

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: uv version
        id: uv
        run: echo "version=$(sed -n 's/^UV_VERSION=//p' deployment/native/versions.env)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
      - name: Build the bundle
        run: deployment/native/bundle.sh "$PWD/out/pipeshub-native" --archive "$PWD/out/pipeshub-native-darwin-arm64.tar.gz"
      - name: Every Mach-O file is signed; PostgreSQL and Node load only bundle or system libraries
        run: |
          bad=0
          # The whole bundle: Python's extension modules and the API's native addons (sharp's *.node) are loaded by signed processes.
          while read -r f; do
            file -b "$f" | grep -q Mach-O || continue
            codesign --verify "$f" || { echo "unsigned: $f"; bad=1; }
            case $f in out/pipeshub-native/pg/*|out/pipeshub-native/node/*)
              otool -L "$f" | awk 'NR>1 {print $1}' | grep -vE '^(@rpath|@loader_path|/usr/lib/|/System/)' && { echo "absolute library path in $f"; bad=1; } ;;
            esac
          done < <(find out/pipeshub-native -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' -o -name '*.node' \))
          exit $bad
      # A real start: the API loads sharp, so a native addon macOS refuses to load fails here.
      - name: Start, check health and loopback-only listeners, stop
        run: deployment/native/smoke.sh "$PWD/out/pipeshub-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeshub-native-darwin-arm64
          path: out/pipeshub-native-darwin-arm64.tar.gz
          retention-days: 7
