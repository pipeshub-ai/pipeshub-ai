name: pg-runtime

# The PostgreSQL runtime (unit of work, key-value store, work queue, job scheduler, shared state) against real PostgreSQL 17 and 18
# and PgBouncer. The Python job runs tests/integration/db (throwaway clusters it starts itself), tests/integration/pg_runtime
# (a migrated database on the packaged server, Redis Streams for the cross-broker contract cases) and tests/integration/graph_db/postgres
# (the PostgreSQL graph provider on a migrated database). The Node job runs test:pg-services
# against the same kind of database; test:pg (the Node unit of work) runs in node-pg-runtime.yml. A skip is a failure here: the
# suites skip only when a service is missing, which in CI means the workflow is broken.
on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'backend/db/**'
      - 'backend/python/app/core/**'
      - 'backend/python/app/services/pg_*.py'
      - 'backend/python/app/services/messaging/**'
      - 'backend/python/app/services/redis/**'
      - 'backend/python/app/services/cache/**'
      - 'backend/python/app/config/**'
      - 'backend/python/tests/integration/db/**'
      - 'backend/python/tests/integration/pg_runtime/**'
      - 'backend/python/app/services/graph_db/postgres/**'
      - 'backend/python/app/services/graph_db/**'
      - 'backend/python/app/modules/code_graph/**'
      - 'backend/python/app/modules/indexing/vector_membership_backfill.py'
      - 'backend/python/app/models/entities.py'
      - 'backend/python/app/exceptions/graph_db_exceptions.py'
      - 'backend/python/app/utils/time_conversion.py'
      - 'backend/python/app/utils/user_messages.py'
      - 'backend/python/app/services/graph_db/graph_db_provider_factory.py'
      - 'backend/python/app/models/permission.py'
      - 'backend/python/tests/integration/graph_db/postgres/**'
      - 'backend/python/tests/integration/graph_db/test_code_graph_real_backends.py'
      - 'backend/python/tests/integration/graph_db/test_stage_states_it.py'
      - 'backend/python/tests/integration/real_graph.py'
      - 'backend/python/tests/permissions/**'
      - 'backend/python/tests/integration/graph_permissions/loaders.py'
      - 'backend/python/pyproject.toml'
      - 'backend/nodejs/apps/src/libs/db/**'
      - 'backend/nodejs/apps/src/libs/services/pg-*.ts'
      - 'backend/nodejs/apps/src/libs/keyValueStore/**'
      - 'backend/nodejs/apps/src/modules/crawling_manager/services/crawling_pg.ts'
      - 'backend/nodejs/apps/src/modules/crawling_manager/services/connector_schedule_sweep.ts'
      - 'backend/nodejs/apps/tests/modules/crawling_manager/services/crawling_pg.test.ts'
      - 'backend/nodejs/apps/tests/libs/services/pg-*'
      - 'backend/nodejs/apps/package.json'
      - 'backend/nodejs/apps/package-lock.json'
      - 'scripts/prepare_pg_test_db.sh'
      - 'scripts/ensure_pg_cluster.sh'
      - 'scripts/assert_no_skips.py'
      - '.github/workflows/pg-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # shard 1 is one test case of ~22-26 min serial (the not-current adversarial worlds), which no split can shorten
    timeout-minutes: ${{ matrix.shard == 1 && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
        # The graph suite took ~46 min in one job (over 60 on PostgreSQL 18), so it is split by measured time. graph_tests
        # are the pytest paths; graph_k splits one file by -k into sets that together hold each of its tests once; graph_cases
        # is the shard's case count. Shard 5 runs the folder minus what the others name, so a new test file runs there.
        # scripts/test_pg_runtime_shards.py checks that every case runs exactly once and that the counts add up.
        shard: [1, 2, 3, 4, 5]
        include:
          # test_conformance_kh_pg.py alone is longer than a shard should be: its two slowest cases run on their own
          - shard: 1
            graph_tests: tests/integration/graph_db/postgres/test_conformance_kh_pg.py
            graph_k: '[not_current-adversarial]'
            graph_cases: 1
          # also runs tests/integration/db and tests/integration/pg_runtime
          - shard: 2
            graph_tests: tests/integration/graph_db/postgres/test_conformance_kh_pg.py
            graph_k: not [not_current-adversarial] and [current-adversarial]
            graph_cases: 1
          - shard: 3
            graph_tests: tests/integration/graph_db/postgres/test_conformance_kh_pg.py
            graph_k: not [not_current-adversarial] and not [current-adversarial]
            graph_cases: 13
          # test_kg_read.py stays in shard 5, behind most of the files that run before it in the whole folder: its plan gate
          # depends on the statistics they leave.
          - shard: 4
            graph_tests: >-
              tests/integration/graph_db/postgres/test_accessible_scope_differential.py
              tests/integration/graph_db/postgres/test_conformance.py
              tests/integration/graph_db/postgres/test_kg_service.py
              tests/integration/graph_db/postgres/test_kg_stamps.py
              tests/integration/graph_db/postgres/test_kh_browse.py
              tests/integration/graph_db/postgres/test_kh_listing_flat.py
              tests/integration/graph_db/postgres/test_robustness.py
              tests/integration/graph_db/postgres/test_role_batch.py
            graph_cases: 244
          - shard: 5
            graph_tests: >-
              tests/integration/graph_db/postgres
              --ignore=tests/integration/graph_db/postgres/test_conformance_kh_pg.py
              --ignore=tests/integration/graph_db/postgres/test_accessible_scope_differential.py
              --ignore=tests/integration/graph_db/postgres/test_conformance.py
              --ignore=tests/integration/graph_db/postgres/test_kg_service.py
              --ignore=tests/integration/graph_db/postgres/test_kg_stamps.py
              --ignore=tests/integration/graph_db/postgres/test_kh_browse.py
              --ignore=tests/integration/graph_db/postgres/test_kh_listing_flat.py
              --ignore=tests/integration/graph_db/postgres/test_robustness.py
              --ignore=tests/integration/graph_db/postgres/test_role_batch.py
            graph_cases: 1455
    services:
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_BIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
      CI: 'true'
      KERNEL_TEST_PORT_BASE: '62500'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL ${{ matrix.pg }} and PgBouncer
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${{ matrix.pg }}" "postgresql-${{ matrix.pg }}-pgvector" pgbouncer
          sudo systemctl stop postgresql || true

      - name: Install the migration tool and the Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/migrate-venv"
          "$RUNNER_TEMP/migrate-venv/bin/pip" install -r backend/db/requirements.txt
          pip install uv
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"

      - name: Python database runtime (tests/integration/db)
        if: ${{ matrix.shard == 2 }}
        working-directory: backend/python
        env:
          KERNEL_TEST_PG_BINS: ${{ env.PG_BIN }}
          KERNEL_TEST_PGBOUNCER: /usr/sbin/pgbouncer
          KERNEL_TEST_MIGRATE_PYTHON: ${{ runner.temp }}/migrate-venv/bin/python
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest tests/integration/db -m integration --timeout=600 -p no:cacheprovider --junitxml="$RUNNER_TEMP/py-db-junit.xml"

      - name: Python runtime stores (tests/integration/pg_runtime)
        if: ${{ matrix.shard == 2 }}
        working-directory: backend/python
        run: |
          # the package does not always create "main" (the runner image already has PostgreSQL 16 configured), and the cluster that
          # exists is on another port than 5432
          PG_PORT="$("$GITHUB_WORKSPACE/scripts/ensure_pg_cluster.sh" "${{ matrix.pg }}")"
          eval "$(PG_ADMIN_URL="postgresql://postgres@127.0.0.1:${PG_PORT}/postgres" PREPARE_PG_PYTHON="$RUNNER_TEMP/migrate-venv/bin/python" "$GITHUB_WORKSPACE/scripts/prepare_pg_test_db.sh")"
          export REDIS_RUNTIME_TEST_URL=127.0.0.1:6379
          python -m pytest tests/integration/pg_runtime -m "not chaos" --timeout=600 -p no:cacheprovider --junitxml="$RUNNER_TEMP/py-runtime-junit.xml"

      - name: PostgreSQL graph provider (tests/integration/graph_db/postgres, shard ${{ matrix.shard }})
        working-directory: backend/python
        env:
          GRAPH_TESTS: ${{ matrix.graph_tests }}
          GRAPH_K: ${{ matrix.graph_k }}
        run: |
          PG_PORT="$("$GITHUB_WORKSPACE/scripts/ensure_pg_cluster.sh" "${{ matrix.pg }}")"
          eval "$(PG_ADMIN_URL="postgresql://postgres@127.0.0.1:${PG_PORT}/postgres" PREPARE_PG_PYTHON="$RUNNER_TEMP/migrate-venv/bin/python" "$GITHUB_WORKSPACE/scripts/prepare_pg_test_db.sh")"
          read -ra paths <<< "$GRAPH_TESTS"
          python -m pytest "${paths[@]}" ${GRAPH_K:+-k "$GRAPH_K"} -m integration --timeout=600 -p no:cacheprovider --junitxml="$RUNNER_TEMP/py-graph-junit.xml"

      - name: PostgreSQL clusters (on failure)
        if: ${{ failure() }}
        run: |
          pg_lsclusters || true
          ls -la /etc/postgresql /etc/postgresql/*/ 2>&1 || true
          cat /etc/postgresql-common/createcluster.conf 2>&1 | grep -v '^#' | grep . || true

      - name: No unexpected skips
        if: ${{ always() }}
        # exactly this shard's graph cases ran, none failed: a suite that registered nothing is not a pass
        run: |
          reports=("$RUNNER_TEMP/py-graph-junit.xml")
          if [ "${{ matrix.shard }}" = 2 ]; then reports+=("$RUNNER_TEMP/py-db-junit.xml" "$RUNNER_TEMP/py-runtime-junit.xml"); fi
          python3 scripts/assert_no_skips.py "${reports[@]}" --expect-suite "tests.integration.graph_db.postgres=${{ matrix.graph_cases }}"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/nodejs/apps/package-lock.json

      - name: Install PostgreSQL ${{ matrix.pg }} and the migration tool
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${{ matrix.pg }}" "postgresql-${{ matrix.pg }}-pgvector"
          python -m venv "$RUNNER_TEMP/migrate-venv"
          "$RUNNER_TEMP/migrate-venv/bin/pip" install -r backend/db/requirements.txt

      - name: Install Node dependencies
        working-directory: backend/nodejs/apps
        run: npm ci

      - name: Node job queue, LISTEN and runtime stores (test:pg-services)
        working-directory: backend/nodejs/apps
        run: |
          # the package does not always create "main" (the runner image already has PostgreSQL 16 configured), and the cluster that
          # exists is on another port than 5432
          PG_PORT="$("$GITHUB_WORKSPACE/scripts/ensure_pg_cluster.sh" "${{ matrix.pg }}")"
          eval "$(PG_ADMIN_URL="postgresql://postgres@127.0.0.1:${PG_PORT}/postgres" PREPARE_PG_PYTHON="$RUNNER_TEMP/migrate-venv/bin/python" PG_RUNTIME_ROLE=node "$GITHUB_WORKSPACE/scripts/prepare_pg_test_db.sh")"
          npm run test:pg-services -- --reporter xunit --reporter-option output="$RUNNER_TEMP/node-services-junit.xml"

      - name: PostgreSQL clusters (on failure)
        if: ${{ failure() }}
        run: |
          pg_lsclusters || true
          ls -la /etc/postgresql /etc/postgresql/*/ 2>&1 || true
          cat /etc/postgresql-common/createcluster.conf 2>&1 | grep -v '^#' | grep . || true

      - name: No unexpected skips
        if: ${{ always() }}
        run: python3 scripts/assert_no_skips.py "$RUNNER_TEMP/node-services-junit.xml"
