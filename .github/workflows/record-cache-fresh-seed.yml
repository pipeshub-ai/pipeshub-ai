name: Record cache fresh seeds

# The generated tests of the record-content cache run on fixed seeds in every PR. This weekly run takes a fresh
# seed range each time (the seed is printed in the log, so a failure replays with RECORD_CACHE_SEED=<seed>).
on:
  schedule:
    - cron: '30 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the cache's generated tests on a fresh seed
        working-directory: frontend
        env:
          RECORD_CACHE_SEED: random
        run: npx vitest run lib/record-content/__tests__/cache.generated.test.ts
