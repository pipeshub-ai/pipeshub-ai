name: Release — build, publish, verify

# The app images on Docker Hub are built and pushed by hand today. That is the
# slowest and least reproducible step in a release, and it is why nothing can
# gate on the artifact: there is no point in CI where the published image
# exists and has not yet been announced.
#
# This workflow closes that. On a tag it builds both variants, pushes them under
# a candidate tag only, runs the first-run smoke against the pushed images, and
# promotes to the release tags only if the smoke passes. A build that cannot
# install is never reachable as :latest or :slim.
#
# Manual runs are supported for rehearsal: workflow_dispatch with promote=false
# builds and verifies without touching any tag that already exists. The one
# thing it may publish is a prerelease version (1.2.3-rc.1) whose tags are not
# on Docker Hub yet, so a build for someone to try is a single run; :latest and
# :slim move only with promote=true, and never for a prerelease.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.7.1 (no leading v)'
        required: true
        type: string
      promote:
        description: 'Move :latest / :slim to this build after the smoke passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One key per version for both triggers (v1.2.3 from a tag push, or
  # inputs.version with a v prefix on dispatch), so two builds of one version
  # queue whatever branch they come from and cannot both pass the "tags
  # absent" check. The publish job adds a single group across all versions.
  group: release-publish-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  # `queue: max` keeps every waiting run; the default keeps only the newest
  # pending one and cancels the rest.
  queue: max
  cancel-in-progress: false

env:
  IMAGE: pipeshubai/pipeshub-ai
  BASE_IMAGE: pipeshubai/pipeshub-ai-base
  # The code-execution sandbox the app pulls at install time, tagged in step
  # with the app image (docker-compose.yml, sandbox-image). It was pushed by
  # hand for every release before this workflow built it.
  SANDBOX_IMAGE: pipeshubai/pipeshub-sandbox

jobs:
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      candidate: ${{ steps.v.outputs.candidate }}
      promote: ${{ steps.v.outputs.promote }}
    steps:
      - id: v
        # Dispatch inputs reach the script as data, never as script text (SEC-D-12).
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            promote="$INPUT_PROMOTE"
          else
            version="${GITHUB_REF_NAME#v}"
            promote="true"
          fi
          # A tag must look like a version. Refuse anything else rather than
          # publishing an image called ":oops".
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a semver version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "candidate=${version}-rc.${GITHUB_RUN_ID}"
            echo "promote=$promote"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version candidate=${version}-rc.${GITHUB_RUN_ID} promote=$promote"

      # Whatever publishes (a tag push, a promoting dispatch, or a prerelease dispatch, which publishes its version tags):
      # test_no_released_head_is_gone holds every later migration head to the ones the released tree records, so it must
      # record its own (backend/db/README.md, Released heads). A stable dispatch without promote is a rehearsal and is skipped.
      - name: Checkout
        if: github.event_name == 'push' || inputs.promote || contains(inputs.version, '-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The release records its migration heads
        if: github.event_name == 'push' || inputs.promote || contains(inputs.version, '-')
        working-directory: backend
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if ! python3 -m db.released_heads --check; then
            echo "::error::backend/db/released_heads.json does not hold the migration heads of this tree. On the commit you tag (main, or the release branch for a hotfix), run 'python -m db.released_heads v${VERSION}' from backend/ and merge it. Then release again: delete a tag that failed here on both sides first (git push --delete origin v${VERSION} && git tag -d v${VERSION}) and tag the corrected commit, or use the next patch version."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.variant }}
    needs: resolve
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64/volume=200gb
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            python_deps: python-deps
          - variant: slim
            python_deps: python-deps-slim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The base images are rebuilt deliberately, not on every release (see the
      # header of Dockerfile.base), and are built from by digest: a base tag
      # re-pushed on Docker Hub cannot reach a release unless a reviewed change
      # moves contracts/supply-chain/release-bases.json (SEC-D-04).
      - name: Pull base images by digest
        id: bases
        env:
          PYTHON_DEPS_TAG: ${{ matrix.python_deps }}
        run: |
          set -euo pipefail
          for tag in "$PYTHON_DEPS_TAG" runtime; do
            digest="$(jq -er --arg t "$tag" '.digests[$t]' contracts/supply-chain/release-bases.json)"
            ref="${BASE_IMAGE}@${digest}"
            if ! docker pull "$ref"; then
              echo "::error::${BASE_IMAGE}:${tag} at ${digest} is not on Docker Hub. Publish the base (Dockerfile.base) and record its digest in contracts/supply-chain/release-bases.json."
              exit 1
            fi
            echo "${tag//-/_}=${ref}" >> "$GITHUB_OUTPUT"
          done
          # The base is published by hand, so it can lag the Node the backend is built with and needs.
          # Read from the image's build history, so the arm64 image needs no emulation here.
          for platform in linux/amd64 linux/arm64; do
            node_major=$(docker buildx imagetools inspect "${BASE_IMAGE}:runtime" --format "{{json (index .Image \"${platform}\")}}" | grep -o 'setup_[0-9]*' | tail -n 1 | tr -dc '0-9' || true)
            if [ "${node_major:-0}" -lt 22 ]; then
              echo "::error::${BASE_IMAGE}:runtime for ${platform} has Node ${node_major:-of an unknown version}, below the backend's minimum of 22. Build and publish it from Dockerfile.base first (see its header)."
              exit 1
            fi
          done

      - name: Build and push candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            PYTHON_DEPS_IMAGE=${{ matrix.python_deps == 'python-deps' && steps.bases.outputs.python_deps || steps.bases.outputs.python_deps_slim }}
            RUNTIME_BASE_IMAGE=${{ steps.bases.outputs.runtime }}
            APP_VERSION=${{ needs.resolve.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve.outputs.candidate }}${{ matrix.variant == 'slim' && '-slim' || '' }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

  # ---------------------------------------------------------------------------
  # install.sh pulls pipeshubai/pipeshub-sandbox:${IMAGE_TAG}, so the candidate
  # needs a sandbox image under both its tags (slim installs use the -slim
  # tag). Without it compose tries to build the sandbox from source, which a
  # standalone install does not have, and every verify job fails.
  build-sandbox:
    name: Build sandbox
    needs: resolve
    runs-on: runs-on=${{ github.run_id }}/runner=8cpu-linux-x64/volume=200gb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the sandbox candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deployment/sandbox
          file: deployment/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.SANDBOX_IMAGE }}:${{ needs.resolve.outputs.candidate }}
            ${{ env.SANDBOX_IMAGE }}:${{ needs.resolve.outputs.candidate }}-slim
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max

  # ---------------------------------------------------------------------------
  # The gate. These images are on Docker Hub but no published tag points at them
  # yet, so this runs against exactly what a user would install.
  verify:
    name: Verify ${{ matrix.deploy }} candidate (${{ matrix.arch }}${{ matrix.graph && format(', {0}', matrix.graph) || '' }})
    needs: [resolve, build, build-sandbox]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build publishes linux/amd64 and linux/arm64. Docker resolves a
          # multi-arch tag to the runner's own architecture, so verifying only on
          # x64 would promote an arm64 image that nothing had ever started.
          - deploy: slim
            suffix: '-slim'
            arch: amd64
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=100gb
          - deploy: full
            suffix: ''
            arch: amd64
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=100gb
          - deploy: slim
            suffix: '-slim'
            arch: arm64
            runner: ubuntu-24.04-arm
          - deploy: full
            suffix: ''
            arch: arm64
            runner: ubuntu-24.04-arm
          # Customers can install on ArangoDB instead of Neo4j. Every other row
          # takes the installer's default (Neo4j), so without this one a release
          # that cannot start or upgrade on ArangoDB would still be promoted.
          - deploy: slim
            suffix: '-slim'
            arch: amd64
            graph: arango
            runner: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=100gb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GitHub-hosted arm64 runners have a much smaller disk than the
      # RunsOn x64 ones, and the full image is large. Reclaim what the image
      # ships with but this job never uses.
      - name: Reclaim disk space
        if: matrix.arch == 'arm64'
        run: |
          set -uo pipefail
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          # ${VAR:-} matters here: under `set -u` an unset variable aborts the
          # step before `|| true` can apply, which would fail the release.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free disk: ${before}G -> ${after}G"

      - name: Confirm the runner is really ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(dpkg --print-architecture)"
          echo "runner architecture: ${actual}"
          [ "$actual" = "${{ matrix.arch }}" ] || {
            echo "expected ${{ matrix.arch }} — this job would silently re-test the wrong image"
            exit 1
          }

      - name: First-run smoke against the candidate image
        env:
          PIPESHUB_DEPLOY_TYPE: ${{ matrix.deploy }}
          PIPESHUB_GRAPH_DB: ${{ matrix.graph }}
          PIPESHUB_VERSION: ${{ needs.resolve.outputs.candidate }}${{ matrix.suffix }}
          PIPESHUB_EXPECT_VERSION: ${{ needs.resolve.outputs.version }}
          PIPESHUB_EXPECT_COMMIT: ${{ github.sha }}
          PUBLISHED_HUB_SMOKE_DIAG: ${{ runner.temp }}/diag
        run: bash deployment/docker-compose/tests/published_hub_smoke.sh

      - name: Upgrade from the previous release
        env:
          PIPESHUB_TARGET_VERSION: ${{ needs.resolve.outputs.candidate }}${{ matrix.suffix }}
          PIPESHUB_DEPLOY_TYPE: ${{ matrix.deploy }}
          PIPESHUB_GRAPH_DB: ${{ matrix.graph }}
          PIPESHUB_UPGRADE_DIAG: ${{ runner.temp }}/diag
        run: bash deployment/docker-compose/tests/upgrade_smoke.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verify-${{ matrix.deploy }}-${{ matrix.arch }}${{ matrix.graph && format('-{0}', matrix.graph) || '' }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # C6.42: the security suite and the canary scans on this commit, the same gate every harness pull request
  # runs. No tag moves unless it passes.
  security:
    name: Harness security gate
    needs: resolve
    uses: ./.github/workflows/harness-security-gate.yml

  # ---------------------------------------------------------------------------
  # SEC-D-11: no candidate with a known, fixable CRITICAL vulnerability is
  # promoted. Trivy runs from a digest-pinned image, never a moving action tag.
  scan:
    name: Scan ${{ matrix.ref }}
    needs: [resolve, build, build-sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ref: [app, app-slim, sandbox]
    steps:
      - name: Trivy (CRITICAL, fixable)
        env:
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          WHICH: ${{ matrix.ref }}
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          set -euo pipefail
          case "$WHICH" in
            app) ref="${IMAGE}:${CANDIDATE}" ;;
            app-slim) ref="${IMAGE}:${CANDIDATE}-slim" ;;
            sandbox) ref="${SANDBOX_IMAGE}:${CANDIDATE}" ;;
          esac
          docker run --rm "$TRIVY_IMAGE" image --no-progress --exit-code 1 \
            --severity CRITICAL --ignore-unfixed --scanners vuln "$ref"

  # ---------------------------------------------------------------------------
  # SEC-D-04 (ADR-SEC-05): sign the verified candidates by digest before any
  # tag points at them. crane copy keeps the digest, so the release tags carry
  # these signatures, and install.sh checks them (cosign verify) before it runs
  # anything. Keyless: a Sigstore certificate naming this workflow at the
  # release tag, recorded in Rekor; no key exists to steal. It signs only for a
  # tag push once the owner has turned it on (repository variable
  # RELEASE_SIGNING: keyless, or key for the vault-held key in the
  # RELEASE_COSIGN_KEY secret), and waits for the release-signing environment's
  # reviewers: that approval is the owner's go-ahead for each release. Off, its
  # steps are no-ops and promotion goes ahead with unsigned images, as before.
  sign:
    name: Sign ${{ matrix.image }}
    needs: [resolve, verify, security, scan]
    # No job-level `if`: promote needs this job to succeed, and a skipped job must never stand in for a gate.
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: app
            repo: pipeshubai/pipeshub-ai
            suffix: ''
          - image: app-slim
            repo: pipeshubai/pipeshub-ai
            suffix: '-slim'
          - image: sandbox
            repo: pipeshubai/pipeshub-sandbox
            suffix: ''
          - image: sandbox-slim
            repo: pipeshubai/pipeshub-sandbox
            suffix: '-slim'
    steps:
      - name: Is signing on for this run
        id: plan
        env:
          MODE: ${{ vars.RELEASE_SIGNING }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ] && { [ "$MODE" = keyless ] || [ "$MODE" = key ]; }; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release images are not signed (RELEASE_SIGNING='${MODE}', ref type ${REF_TYPE}). install.sh pins their digests but cannot verify them."
          fi

      - name: Log in to Docker Hub
        if: steps.plan.outputs.on == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install crane
        if: steps.plan.outputs.on == 'true'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Install cosign
        if: steps.plan.outputs.on == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Resolve the candidate's digest
        if: steps.plan.outputs.on == 'true'
        id: digest
        env:
          REF: ${{ matrix.repo }}:${{ needs.resolve.outputs.candidate }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          digest="$(crane digest "$REF")"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign (keyless)
        if: steps.plan.outputs.on == 'true' && vars.RELEASE_SIGNING == 'keyless'
        env:
          REF: ${{ matrix.repo }}@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Sign (vault-held key)
        if: steps.plan.outputs.on == 'true' && vars.RELEASE_SIGNING == 'key'
        env:
          REF: ${{ matrix.repo }}@${{ steps.digest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$REF"

      # Signed SLSA provenance, pushed beside the image. The SBOM BuildKit
      # attached is inside the image index the signature covers.
      - name: Attest build provenance
        if: steps.plan.outputs.on == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ matrix.repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Check the signature as install.sh will
        if: steps.plan.outputs.on == 'true' && vars.RELEASE_SIGNING == 'keyless'
        env:
          REF: ${{ matrix.repo }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity-regexp '^https://github\.com/pipeshub-ai/pipeshub-ai/\.github/workflows/release-publish\.yml@refs/tags/v[0-9]' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      - name: Record the digest
        if: steps.plan.outputs.on == 'true'
        env:
          PINNED: ${{ matrix.repo }}:${{ needs.resolve.outputs.version }}${{ matrix.suffix }}@${{ steps.digest.outputs.digest }}
        run: printf '%s\n' "$PINNED" > "$RUNNER_TEMP/digest.txt"

      - name: Keep the digest for the release notes
        if: steps.plan.outputs.on == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.image }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # With promote=true the version tags are written (overwriting if present)
  # and, for a stable version, :latest and :slim move. With promote=false a
  # prerelease version is published only onto tags that do not exist yet, and
  # a stable version is a rehearsal that publishes nothing. crane copy
  # overwrites, so an existing tag is never replaced without promote.
  promote:
    name: Publish release tags
    needs: [resolve, verify, security, scan, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Every publisher of the shared tags queues here, across versions and
    # triggers, so two runs cannot interleave their copies of :latest/:slim
    # or undo each other's moves.
    concurrency:
      group: release-publish-tags
      # A waiting publish has already passed verify; the default queue would
      # cancel it when a third arrives, and its version would get no tags.
      queue: max
      cancel-in-progress: false
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install crane
        # Pinned by commit: a tag can be moved, and this step is what
        # promotes images to the tags users pull.
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # Copy by digest rather than rebuilding, so the tag a user pulls is
      # byte-identical to the image the smoke and upgrade tests just passed.
      # The sandbox moves with the app: install.sh pulls both under one tag.
      - name: Point release tags at the verified images
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          PROMOTE: ${{ needs.resolve.outputs.promote }}
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=false
          if printf '%s' "$VERSION" | grep -q -- '-'; then prerelease=true; fi
          if [ "$PROMOTE" != "true" ] && [ "$prerelease" != "true" ]; then
            echo "rehearsal of ${VERSION}: verified, publishing nothing"
            exit 0
          fi
          # One answer for "what is at this tag": present with its digest,
          # absent (the registry said not-found), or unknown (anything else).
          # Unknown is never treated as absent: both the pre-check and the
          # undo snapshot stop before a copy instead of guessing.
          # crane logs a "HEAD request failed, falling back on GET" line on
          # stderr before the GET's own error, so only the final error line
          # decides, and only the registry's not-found codes mean absent.
          tag_state() {
            local digest err
            if digest="$(crane digest "$1" 2>"${RUNNER_TEMP}/digest.err")"; then
              echo "present $digest"
              return
            fi
            err="$(grep -v 'falling back on GET' "${RUNNER_TEMP}/digest.err" | tail -n 1)"
            if printf '%s' "$err" | grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN'; then
              echo "absent"
            else
              echo "unknown ${err:-no error output}"
            fi
          }
          # Docker Hub removes a tag by name through its own API; the registry
          # API deletes manifests only by digest. Used to undo a half-written
          # set below and by the candidate cleanup step.
          hub_delete_tag() {
            local jwt
            jwt="$(curl -fsS -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg u "$HUB_USERNAME" --arg p "$HUB_TOKEN" '{username:$u,password:$p}')" \
              https://hub.docker.com/v2/users/login | jq -r .token)"
            curl -sS -o /dev/null -w "delete $1:$2 -> HTTP %{http_code}\n" -X DELETE \
              -H "Authorization: JWT ${jwt}" "https://hub.docker.com/v2/repositories/$1/tags/$2/"
          }
          # install.sh pulls the app and the sandbox under one tag, so the four
          # version tags are published as a set. Without promote: all absent
          # means copy them all, all present means leave them, a confirmed mix
          # means an earlier run stopped halfway (never papered over with
          # images that were not verified together), and a lookup that fails
          # for any reason other than not-found stops the step before any
          # copy, since "absent" must never be a guess.
          if [ "$PROMOTE" != "true" ]; then
            present=0; absent=0
            for repo in "$IMAGE" "$SANDBOX_IMAGE"; do
              for suffix in "" "-slim"; do
                ref="${repo}:${VERSION}${suffix}"
                state="$(tag_state "$ref")"
                case "$state" in
                  present*) present=$((present + 1)) ;;
                  absent)   absent=$((absent + 1)) ;;
                  *) echo "::error::could not tell whether ${ref} exists (${state#unknown }). Nothing was published; re-run once Docker Hub answers."; exit 1 ;;
                esac
              done
            done
            if [ "$present" -eq 4 ]; then
              echo "${VERSION}: all four tags already exist, left as they are (promote is off)"
              exit 0
            elif [ "$absent" -ne 4 ]; then
              echo "::error::${VERSION}: ${present} of the 4 version tags exist. A previous run stopped partway; delete the partial set on Docker Hub or re-run with promote=true."
              exit 1
            fi
            clobber=(--no-clobber)
          else
            clobber=()
          fi
          # Each set of tags is published as a unit. Every destination's
          # current digest is recorded first; if any copy in the set fails,
          # the tags this step already moved are pointed back at those
          # digests (or deleted if they did not exist), so an install that
          # pulls the app and the sandbox under one tag never gets one new
          # and one old.
          publish_set() {
            local -a prev=() written=() prevw=()
            local pair src dst state i=0 j
            for pair in "$@"; do
              dst="${pair#* }"
              state="$(tag_state "$dst")"
              case "$state" in
                present*) prev+=("${state#present }") ;;
                absent)   prev+=("") ;;
                *) echo "::error::could not read the current digest of ${dst} (${state#unknown }); nothing in this set was moved. Re-run once Docker Hub answers."; return 1 ;;
              esac
            done
            for pair in "$@"; do
              src="${pair% *}"; dst="${pair#* }"
              if ! crane copy "${clobber[@]}" "$src" "$dst"; then
                echo "::error::copy of ${dst} failed; putting back the ${#written[@]} tag(s) this step had already moved"
                for j in "${!written[@]}"; do
                  if [ -n "${prevw[$j]}" ]; then
                    crane tag "${written[$j]%%:*}@${prevw[$j]}" "${written[$j]#*:}" || true
                  else
                    hub_delete_tag "${written[$j]%%:*}" "${written[$j]#*:}" || true
                  fi
                done
                return 1
              fi
              written+=("$dst"); prevw+=("${prev[$i]}"); i=$((i + 1))
              echo "published ${dst}"
            done
          }
          publish_set \
            "${IMAGE}:${CANDIDATE} ${IMAGE}:${VERSION}" \
            "${IMAGE}:${CANDIDATE}-slim ${IMAGE}:${VERSION}-slim" \
            "${SANDBOX_IMAGE}:${CANDIDATE} ${SANDBOX_IMAGE}:${VERSION}" \
            "${SANDBOX_IMAGE}:${CANDIDATE}-slim ${SANDBOX_IMAGE}:${VERSION}-slim"
          if [ "$prerelease" = "true" ]; then
            echo "prerelease ${VERSION}: leaving :latest and :slim untouched"
          elif [ "$PROMOTE" != "true" ]; then
            echo "promote is off: leaving :latest and :slim untouched"
          else
            clobber=()
            publish_set \
              "${IMAGE}:${CANDIDATE} ${IMAGE}:latest" \
              "${IMAGE}:${CANDIDATE}-slim ${IMAGE}:slim" \
              "${SANDBOX_IMAGE}:${CANDIDATE} ${SANDBOX_IMAGE}:latest" \
              "${SANDBOX_IMAGE}:${CANDIDATE}-slim ${SANDBOX_IMAGE}:slim"
            echo "moved :latest and :slim to ${VERSION}"
          fi

      # Docker Hub deletes a manifest only by digest, so `crane delete` of a tag
      # fails there and the candidate tags used to linger. Its own API removes
      # a tag without touching the manifest the release tags share.
      - name: Remove candidate tags
        continue-on-error: true
        env:
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          jwt="$(curl -fsS -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg u "$HUB_USERNAME" --arg p "$HUB_TOKEN" '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login | jq -r .token)"
          for repo in "$IMAGE" "$SANDBOX_IMAGE"; do
            for tag in "${CANDIDATE}" "${CANDIDATE}-slim"; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: JWT ${jwt}" \
                "https://hub.docker.com/v2/repositories/${repo}/tags/${tag}/")"
              echo "delete ${repo}:${tag} -> HTTP ${code}"
            done
          done

  # ---------------------------------------------------------------------------
  # The digests users pin (install.sh writes them to .env; Helm takes
  # image.digest), attached to the GitHub release when it exists, and always to
  # this run's summary.
  publish-digests:
    name: Publish image digests
    needs: [resolve, sign, promote]
    if: github.ref_type == 'tag' && (vars.RELEASE_SIGNING == 'keyless' || vars.RELEASE_SIGNING == 'key')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests

      - name: Attach image-digests.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/digests" -name digest.txt -exec cat {} + | sort > "$RUNNER_TEMP/image-digests.txt"
          { echo '### Image digests'; echo '```'; cat "$RUNNER_TEMP/image-digests.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/image-digests.txt" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::notice::No GitHub release for ${TAG} yet; attach image-digests.txt from this run's summary when it is published."
          fi

  # ---------------------------------------------------------------------------
  # The air-gapped install's bundle (R41SUPPLY-FU-7, ADR-SEC-06 D2): the signed
  # app and sandbox images for one CPU architecture, saved and split under the
  # 2 GiB asset limit, with a manifest naming each part by SHA-256 and the image
  # tags the archive holds. The manifest is signed keyless like the images; its Sigstore bundle
  # carries the transparency-log proof, so install.sh --offline-bundle checks it
  # with no network against the trusted root it pins, before docker load.
  offline-bundle:
    name: Offline bundle (${{ matrix.arch }})
    needs: [resolve, sign, promote]
    if: github.ref_type == 'tag' && (vars.RELEASE_SIGNING == 'keyless' || vars.RELEASE_SIGNING == 'key')
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=100gb
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the signed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Save, split and describe the images
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bundle"; mkdir -p "$out"
          name="pipeshub-offline-${VERSION}-${ARCH}"
          refs=()
          for image in app sandbox; do
            pinned="$(cat "$RUNNER_TEMP/digests/image-digest-${image}/digest.txt")"
            repo="${pinned%%:*}"
            ref="${repo}:${VERSION}"
            docker pull --platform "linux/${ARCH}" "${repo}@${pinned##*@}"
            docker tag "${repo}@${pinned##*@}" "$ref"
            refs+=("$ref")
          done
          docker save "${refs[@]}" | gzip -1 | split -b 1900m -d -a 2 - "$out/${name}.tar.gz."
          {
            echo "pipeshub-offline-bundle 1"
            echo "version ${VERSION}"
            echo "arch ${ARCH}"
            for ref in "${refs[@]}"; do echo "image ${ref}"; done
            for part in "$out/${name}.tar.gz."*; do echo "part $(basename "$part") $(sha256sum "$part" | cut -d' ' -f1)"; done
          } > "$out/${name}.manifest"
          cp deployment/docker-compose/sigstore-trusted-root.json "$out/"
          cat "$out/${name}.manifest"

      - name: Sign the manifest (keyless)
        if: vars.RELEASE_SIGNING == 'keyless'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          m="$RUNNER_TEMP/bundle/pipeshub-offline-${VERSION}-${ARCH}.manifest"
          cosign sign-blob --yes --new-bundle-format --bundle "${m}.sigstore.json" "$m"

      - name: Sign the manifest (vault-held key)
        if: vars.RELEASE_SIGNING == 'key'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
          COSIGN_PRIVATE_KEY: ${{ secrets.RELEASE_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_COSIGN_PASSWORD }}
        run: |
          m="$RUNNER_TEMP/bundle/pipeshub-offline-${VERSION}-${ARCH}.manifest"
          cosign sign-blob --yes --new-bundle-format --key env://COSIGN_PRIVATE_KEY --bundle "${m}.sigstore.json" "$m"

      # install.sh's own functions, offline: a flag cosign does not take, or a
      # trusted root that no longer matches, fails here rather than on a customer's host.
      - name: Check the bundle as install.sh will
        if: vars.RELEASE_SIGNING == 'keyless'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          installer=deployment/docker-compose/install.sh
          eval "$(grep -E '^(PIPESHUB_SIGNER_IDENTITY|PIPESHUB_SIGNER_ISSUER|PIPESHUB_SIGSTORE_ROOT_SHA256)=' "$installer")"
          for fn in sha256_file offline_bundle_trusted_root verify_offline_bundle_signature; do
            eval "$(awk -v fn="$fn" '$0 ~ "^"fn"\\(\\) \\{"{g=1} g{print} g&&/^\}/{exit}' "$installer")"
          done
          # Read by the installer functions eval'd above.
          # shellcheck disable=SC2034
          SCRIPT_DIR="$PWD/deployment/docker-compose"
          m="$RUNNER_TEMP/bundle/pipeshub-offline-${VERSION}-${ARCH}.manifest"
          root="$(offline_bundle_trusted_root "$m")"
          test -n "$root"
          verify_offline_bundle_signature "$m" "$root"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/bundle/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::error::No GitHub release for ${TAG}; the offline bundle has nowhere to go."
            exit 1
          fi
