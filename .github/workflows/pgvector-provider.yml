name: pgvector-provider

# The pgvector vector-store provider against real PostgreSQL 17 and 18 with pgvector and PgBouncer. The suites start (and remove) their own
# throwaway clusters under $RUNNER_TEMP and clone a migrated database for each test. A skip is a failure here: these suites skip only when
# a binary is missing, which in CI means the workflow is broken.
on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'backend/db/**'
      - 'backend/python/app/services/vector_db/**'
      - 'backend/python/app/core/**'
      - 'backend/python/app/config/**'
      - 'backend/python/app/utils/**'
      - 'backend/python/app/exceptions/**'
      - 'backend/python/app/telemetry/**'
      - 'backend/python/app/edition.py'
      - 'backend/python/app/services/messaging/**'
      - 'backend/python/app/services/resource_governor/**'
      - 'backend/python/tests/integration/db/**'
      - 'backend/python/tests/integration/vector_db/test_pgvector_*.py'
      - 'backend/python/pyproject.toml'
      - 'scripts/assert_no_skips.py'
      - '.github/workflows/pgvector-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgvector-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
    env:
      PG_BIN: /usr/lib/postgresql/${{ matrix.pg }}/bin
      KERNEL_TEST_PORT_BASE: '62500'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL ${{ matrix.pg }}, pgvector and PgBouncer
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-${{ matrix.pg }}" "postgresql-${{ matrix.pg }}-pgvector" pgbouncer
          # The suites start their own clusters; the packaged one only takes memory.
          sudo systemctl stop postgresql || true

      - name: Install the migration tool and the Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/migrate-venv"
          "$RUNNER_TEMP/migrate-venv/bin/pip" install -r backend/db/requirements.txt
          pip install uv
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[full,dev]"

      - name: pgvector provider (lifecycle, collections, per-organisation questions, writes, reads)
        working-directory: backend/python
        env:
          KERNEL_TEST_PG_BINS: ${{ env.PG_BIN }}
          KERNEL_TEST_PGBOUNCER: /usr/sbin/pgbouncer
          KERNEL_TEST_MIGRATE_PYTHON: ${{ runner.temp }}/migrate-venv/bin/python
          TMPDIR: ${{ runner.temp }}
        run: >-
          python -m pytest
          tests/integration/vector_db/test_pgvector_provider_core.py
          tests/integration/vector_db/test_pgvector_probe.py
          tests/integration/vector_db/test_pgvector_writes.py
          tests/integration/vector_db/test_pgvector_reads.py
          tests/integration/vector_db/test_pgvector_search.py
          -m integration --timeout=600 -p no:cacheprovider --junitxml="$RUNNER_TEMP/pgvector-junit.xml"

      - name: No unexpected skips, and every case ran
        if: ${{ always() }}
        run: >
          python3 scripts/assert_no_skips.py "$RUNNER_TEMP/pgvector-junit.xml" --min-tests 74
          --expect-suite 'tests.integration.vector_db.test_pgvector_provider_core=8'
          --expect-suite 'tests.integration.vector_db.test_pgvector_probe=2'
          --expect-suite 'tests.integration.vector_db.test_pgvector_writes=38'
          --expect-suite 'tests.integration.vector_db.test_pgvector_reads=14'
          --expect-suite 'tests.integration.vector_db.test_pgvector_search=12'
