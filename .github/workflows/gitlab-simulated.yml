name: gitlab-simulated

# The real GitLab connector syncs from a simulated GitLab into a real Neo4j and a
# real ArangoDB (backend/python/tests/integration/gitlab_simulated), with the trash
# on and off. After each sync the suite compares what every user can read in
# PipesHub with what GitLab would show them.
#
# It runs on pull requests that touch the connector or the platform code under
# it, and nightly on main, so a change elsewhere that breaks the connector is
# caught within a day even when its path is not listed below.
#
# Any skip fails the job, as in backend-matrix: a skipped test checked nothing.
# Expected failures (strict xfail, a known and documented gap) are allowed.
#
# GitHub-hosted runners and no secrets, so pull requests from forks run it too.

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'backend/python/app/connectors/sources/gitlab/**'
      - 'backend/python/app/connectors/sources/gitlab_personal/**'
      - 'backend/python/app/sources/client/gitlab/**'
      - 'backend/python/app/sources/external/gitlab/**'
      - 'backend/python/app/connectors/core/**'
      - 'backend/python/app/models/**'
      - 'backend/python/app/config/**'
      - 'backend/python/app/services/graph_db/**'
      - 'backend/python/app/modules/parsers/code_parser/**'
      - 'backend/python/app/utils/**'
      - 'backend/python/tests/integration/gitlab_simulated/**'
      - 'backend/python/tests/integration/real_graph.py'
      - 'backend/python/pyproject.toml'
      - 'deployment/docker-compose/docker-compose.integration.graph-db.yml'
      - '.github/workflows/gitlab-simulated.yml'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-simulated-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gitlab:
    name: gitlab · ${{ matrix.backend }} · trash ${{ matrix.trash }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        backend: [neo4j, arango]
        trash: ['off', 'on']
        include:
          - backend: neo4j
            service: neo4j-graph-it
          - backend: arango
            service: arango-graph-it

    env:
      SELECT: ${{ matrix.backend }}
      GITLAB_SIM_TRASH: ${{ matrix.trash == 'on' && '1' || '' }}
      REPORT: ${{ github.workspace }}/gitlab-simulated-results.xml
      # Setting a backend's URL makes its tests fail, not skip, when it is unreachable.
      NEO4J_IT_URI: bolt://localhost:17687
      NEO4J_IT_PASSWORD: ensure-it-pass
      ARANGO_IT_URL: http://localhost:18529
      ARANGO_IT_PASSWORD: ensure-it-pass

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: backend/python
        run: |
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"

      - name: Start ${{ matrix.backend }}
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.graph-db.yml up -d --wait --wait-timeout 300 ${{ matrix.service }}

      - name: Run the GitLab suite on ${{ matrix.backend }}, trash ${{ matrix.trash }}
        working-directory: backend/python
        run: pytest tests/integration/gitlab_simulated -m integration -k "$SELECT" -v -rsx --junitxml="$REPORT"

      - name: Fail if anything skipped
        if: ${{ !cancelled() }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(os.environ["REPORT"]).getroot().iter("testcase"))
          skips = [c for c in cases for s in c.findall("skipped") if s.get("type") != "pytest.xfail"]
          if not cases or skips:
              names = ", ".join(c.get("name", "?") for c in skips)
              print(f"::error::{len(cases)} collected, {len(skips)} skipped: {names}")
              sys.exit(1)
          print(f"{len(cases)} tests ran against a real backend, none skipped.")
          EOF

      - name: Dump service logs
        if: failure()
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.graph-db.yml logs --no-color --timestamps

      - name: Tear down
        if: always()
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.graph-db.yml down -v
