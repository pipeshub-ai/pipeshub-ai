name: run-checks label

# Pull request CI runs only when someone adds the `run-checks` label. Each CI
# workflow starts on that `labeled` event; this one removes the label straight
# away so adding it again re-runs CI on the latest commit. A label removed with
# GITHUB_TOKEN starts no workflow, so the removal cancels nothing.
on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  remove-label:
    if: github.event.label.name == 'run-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label 'run-checks'
