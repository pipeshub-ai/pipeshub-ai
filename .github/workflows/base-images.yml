name: Base images

# Publishes pipeshubai/pipeshub-ai-base (and the GHCR copy) from Dockerfile.base.
# Tags are content hashes from scripts/docker/base_tag.sh:
#   python-deps-<hash>  runtime-<hash>  models-bge-<hash>
# Floating tags (python-deps, runtime, models-bge) move only from main.
# A release calls this workflow when the hash tags it needs are not published yet.
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'backend/python/uv.lock'
      - 'backend/python/pyproject.toml'
      - '.github/workflows/base-images.yml'
      - 'scripts/docker/base_tag.sh'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/pipeshub-ai/pipeshub-ai-base
  HUB_IMAGE: docker.io/pipeshubai/pipeshub-ai-base

jobs:
  hash:
    name: Content hash
    if: github.repository == 'pipeshub-ai/pipeshub-ai'
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.tag.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: tag
        run: echo "hash=$(bash scripts/docker/base_tag.sh --hash)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: hash
    if: github.repository == 'pipeshub-ai/pipeshub-ai'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-deps
            target: python-deps
            arch: amd64
            runner: ubuntu-24.04
          - name: python-deps
            target: python-deps
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: runtime
            target: runtime-base
            arch: amd64
            runner: ubuntu-24.04
          - name: runtime
            target: runtime-base
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: models-bge
            target: models
            arch: amd64
            runner: ubuntu-24.04
          - name: models-bge
            target: models
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free disk: ${before}G -> ${after}G"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
            ${{ env.HUB_IMAGE }}:${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.name }}-${{ matrix.arch }},mode=max

  publish:
    name: Publish ${{ matrix.name }}
    needs: [hash, build]
    if: github.repository == 'pipeshub-ai/pipeshub-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    strategy:
      matrix:
        name: [python-deps, runtime, models-bge]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join architectures
        env:
          NAME: ${{ matrix.name }}
          HASH: ${{ needs.hash.outputs.hash }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          for registry in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              -t "${registry}:${NAME}-${HASH}" \
              "${registry}:${NAME}-${HASH}-amd64" \
              "${registry}:${NAME}-${HASH}-arm64"
          done
          # Floating tags move only from main. A release build of a tag keeps
          # the hash tags and leaves python-deps/runtime/models-bge alone.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            for registry in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              docker buildx imagetools create \
                -t "${registry}:${NAME}" \
                "${registry}:${NAME}-${HASH}"
            done
          fi
