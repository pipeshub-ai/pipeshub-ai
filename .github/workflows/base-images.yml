name: Base images

# Publishes pipeshubai/pipeshub-ai-base (and the GHCR copy) from Dockerfile.base.
# Tags are content hashes from scripts/docker/base_tag.sh:
#   python-deps-<hash>  runtime-<hash>  models-bge-<hash>
# Floating tags (python-deps, runtime, models-bge) move only from main.
# A release calls this workflow when the hash tags it needs are not published yet.
#
# The daily mirror of main's earlier setup is kept: it copies the Docker Hub
# floating tags to GHCR as they are, so GHCR follows a base that was published to
# Docker Hub some other way (an earlier release, a hand-run build) within a day.
# Run the workflow by hand with mode "mirror" to sync sooner. CI pulls GHCR
# anonymously and falls back to Docker Hub, so the package must be public.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'backend/python/uv.lock'
      - 'backend/python/pyproject.toml'
      - '.github/workflows/base-images.yml'
      - 'scripts/docker/base_tag.sh'
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build: publish the content-hash bases for this ref; mirror: copy the current Docker Hub tags to GHCR'
        required: true
        default: build
        type: choice
        options:
          - build
          - mirror

permissions:
  contents: read

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/pipeshub-ai/pipeshub-ai-base
  HUB_IMAGE: docker.io/pipeshubai/pipeshub-ai-base

jobs:
  mirror:
    name: Mirror Docker Hub tags to GHCR
    # A fork's copy of the schedule must not try to push here.
    if: github.repository == 'pipeshub-ai/pipeshub-ai' && (github.event_name == 'schedule' || inputs.mode == 'mirror')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Copy the tags that changed
        run: |
          set -euo pipefail
          {
            echo "| Tag | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for tag in python-deps python-deps-slim runtime; do
            if ! hub="$(crane digest "${HUB_IMAGE}:${tag}")"; then
              echo "::error::Could not read ${HUB_IMAGE}:${tag} from Docker Hub. Check that the tag is published (see the header of Dockerfile.base), then run this workflow again."
              exit 1
            fi
            ghcr="$(crane digest "${GHCR_IMAGE}:${tag}" 2>/dev/null || true)"
            if [ "$hub" = "$ghcr" ]; then
              echo "| \`${tag}\` | skipped, already ${hub} |" >> "$GITHUB_STEP_SUMMARY"
            else
              crane copy "${HUB_IMAGE}:${tag}" "${GHCR_IMAGE}:${tag}"
              echo "| \`${tag}\` | copied ${hub} (GHCR had ${ghcr:-nothing}) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  hash:
    name: Content hash
    # A schedule runs the mirror only; a call from a release carries no mode and builds.
    if: github.repository == 'pipeshub-ai/pipeshub-ai' && github.event_name != 'schedule' && inputs.mode != 'mirror'
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.tag.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tag
        run: echo "hash=$(bash scripts/docker/base_tag.sh --hash)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: hash
    # A schedule runs the mirror only; a call from a release carries no mode and builds.
    if: github.repository == 'pipeshub-ai/pipeshub-ai' && github.event_name != 'schedule' && inputs.mode != 'mirror'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-deps
            target: python-deps
            arch: amd64
            runner: ubuntu-24.04
          - name: python-deps
            target: python-deps
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: runtime
            target: runtime-base
            arch: amd64
            runner: ubuntu-24.04
          - name: runtime
            target: runtime-base
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: models-bge
            target: models
            arch: amd64
            runner: ubuntu-24.04
          - name: models-bge
            target: models
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free disk: ${before}G -> ${after}G"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
            ${{ env.HUB_IMAGE }}:${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.name }}-${{ matrix.arch }},mode=max

  publish:
    name: Publish ${{ matrix.name }}
    needs: [hash, build]
    # A schedule runs the mirror only; a call from a release carries no mode and builds.
    if: github.repository == 'pipeshub-ai/pipeshub-ai' && github.event_name != 'schedule' && inputs.mode != 'mirror'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    strategy:
      matrix:
        name: [python-deps, runtime, models-bge]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join architectures
        env:
          NAME: ${{ matrix.name }}
          HASH: ${{ needs.hash.outputs.hash }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          for registry in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              -t "${registry}:${NAME}-${HASH}" \
              "${registry}:${NAME}-${HASH}-amd64" \
              "${registry}:${NAME}-${HASH}-arm64"
          done
          # Floating tags move only from main. A release build of a tag keeps
          # the hash tags and leaves python-deps/runtime/models-bge alone.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            for registry in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              docker buildx imagetools create \
                -t "${registry}:${NAME}" \
                "${registry}:${NAME}-${HASH}"
            done
          fi
