name: Base images

# Publishes pipeshubai/pipeshub-ai-base (and the GHCR copy) from Dockerfile.base.
# Tags are content hashes from scripts/docker/base_tag.sh:
#   python-deps-<hash>  runtime-<hash>  models-bge-<hash>
# Floating tags (python-deps, runtime, models-bge) move only from main.
# A release calls this workflow when the hash tags it needs are not published yet.
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'backend/python/uv.lock'
      - 'backend/python/pyproject.toml'
      - '.github/workflows/base-images.yml'
      - 'scripts/docker/base_tag.sh'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/pipeshub-ai/pipeshub-ai-base
  HUB_IMAGE: docker.io/pipeshubai/pipeshub-ai-base

jobs:
  hash:
    name: Content hash
    if: github.repository == 'pipeshub-ai/pipeshub-ai'
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.tag.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tag
        run: echo "hash=$(bash scripts/docker/base_tag.sh --hash)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: hash
    if: github.repository == 'pipeshub-ai/pipeshub-ai'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-deps
            target: python-deps
            arch: amd64
            runner: ubuntu-24.04
          - name: python-deps
            target: python-deps
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: runtime
            target: runtime-base
            arch: amd64
            runner: ubuntu-24.04
          - name: runtime
            target: runtime-base
            arch: arm64
            runner: ubuntu-24.04-arm
          - name: models-bge
            target: models
            arch: amd64
            runner: ubuntu-24.04
          - name: models-bge
            target: models
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free disk: ${before}G -> ${after}G"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
            ${{ env.HUB_IMAGE }}:${{ matrix.name }}-${{ needs.hash.outputs.hash }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.name }}-${{ matrix.arch }},mode=max

  publish:
    name: Publish ${{ matrix.name }}
    needs: [hash, build]
    if: github.repository == 'pipeshub-ai/pipeshub-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    strategy:
      matrix:
        name: [python-deps, runtime, models-bge]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join architectures
        env:
          NAME: ${{ matrix.name }}
          HASH: ${{ needs.hash.outputs.hash }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          for registry in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              -t "${registry}:${NAME}-${HASH}" \
              "${registry}:${NAME}-${HASH}-amd64" \
              "${registry}:${NAME}-${HASH}-arm64"
          done
          # Floating tags move only from main. A release build of a tag keeps
          # the hash tags and leaves python-deps/runtime/models-bge alone.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            for registry in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              docker buildx imagetools create \
                -t "${registry}:${NAME}" \
                "${registry}:${NAME}-${HASH}"
            done
          fi
