name: Base images

# CI builds the app image FROM ghcr.io/pipeshub-ai/pipeshub-ai-base instead of
# Docker Hub, so test runs neither hit Docker Hub's anonymous pull limit nor
# show up in its pull counts. This workflow keeps those GHCR tags current.
# Docker Hub's pipeshubai/pipeshub-ai-base, which releases build from, is still
# published by hand (see the header of Dockerfile.base); nothing here pushes to
# Docker Hub.
#
#   mirror  copies each Docker Hub tag, every platform, as it is, so CI tests on
#           the base releases build from. It runs daily, so GHCR follows a
#           hand-published base within a day; run it by hand to sync sooner. It
#           compares digests first (a HEAD request, which Docker Hub does not
#           count as a pull) and copies only the tags that differ.
#   build   rebuilds every tag from main, by hand only: run automatically it
#           would let CI drift ahead of the Docker Hub base. The next daily
#           mirror puts the Docker Hub tags back.
#
# CI pulls these anonymously and falls back to Docker Hub when a tag is missing,
# so the package must be public: Package settings -> Change visibility -> Public.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'mirror: copy the current Docker Hub tags; build: rebuild from main'
        required: true
        default: mirror
        type: choice
        options:
          - mirror
          - build

permissions:
  contents: read

concurrency:
  group: base-images
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/pipeshub-ai/pipeshub-ai-base
  HUB_IMAGE: docker.io/pipeshubai/pipeshub-ai-base

jobs:
  mirror:
    name: Mirror Docker Hub tags to GHCR
    # A fork's copy of the schedule must not try to push here.
    if: github.repository == 'pipeshub-ai/pipeshub-ai' && (github.event_name == 'schedule' || inputs.mode == 'mirror')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Copy the tags that changed
        run: |
          set -euo pipefail
          {
            echo "| Tag | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for tag in python-deps python-deps-slim runtime; do
            if ! hub="$(crane digest "${HUB_IMAGE}:${tag}")"; then
              echo "::error::Could not read ${HUB_IMAGE}:${tag} from Docker Hub. Check that the tag is published (see the header of Dockerfile.base), then run this workflow again."
              exit 1
            fi
            ghcr="$(crane digest "${GHCR_IMAGE}:${tag}" 2>/dev/null || true)"
            if [ "$hub" = "$ghcr" ]; then
              echo "| \`${tag}\` | skipped, already ${hub} |" >> "$GITHUB_STEP_SUMMARY"
            else
              crane copy "${HUB_IMAGE}:${tag}" "${GHCR_IMAGE}:${tag}"
              echo "| \`${tag}\` | copied ${hub} (GHCR had ${ghcr:-nothing}) |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  build:
    name: Build ${{ matrix.tag }} (${{ matrix.arch }})
    if: github.repository == 'pipeshub-ai/pipeshub-ai' && github.ref == 'refs/heads/main' && inputs.mode == 'build'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag: [python-deps, python-deps-slim, runtime]
        arch: [amd64, arm64]
        include:
          - tag: python-deps
            target: python-deps
            bundle_bge: '1'
          - tag: python-deps-slim
            target: python-deps
            bundle_bge: '0'
          - tag: runtime
            target: runtime-base
            bundle_bge: '1'
          # Native runners for each architecture; emulating arm64 would take
          # hours for the Python dependencies.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free disk: ${before}G -> ${after}G"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed under a per-architecture tag; the publish job joins the two, so
      # the tag CI pulls never points at a half-built set of platforms.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            BUNDLE_BGE_EMBEDDING=${{ matrix.bundle_bge }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.tag }}-${{ matrix.arch }}

  publish:
    name: Publish ${{ matrix.tag }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      matrix:
        tag: [python-deps, python-deps-slim, runtime]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under ${{ matrix.tag }}
        env:
          TAG: ${{ matrix.tag }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            -t "${GHCR_IMAGE}:${TAG}" \
            "${GHCR_IMAGE}:${TAG}-amd64" "${GHCR_IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}"
