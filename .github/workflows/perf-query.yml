name: Query Performance

# Weekly search and chat benchmark (integration-tests/perf/). Never runs on
# pull requests: it holds secrets and only ever checks out this repository's own
# branches, the same way the scheduled integration run does.
on:
  # Sunday 21:00 UTC (Monday 02:30 IST). The indexing benchmark has Saturday at
  # the same hour, so the two never share a runner pool's busy hour.
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      users:
        description: 'Simulated users asking at the same time'
        required: true
        default: '4'
      duration:
        description: 'Seconds of load, after warm-up'
        required: true
        default: '300'
      docs:
        description: 'Documents to seed before asking (change only when you also refresh the baseline)'
        required: true
        default: '120'

permissions:
  contents: read

concurrency:
  group: perf-query
  cancel-in-progress: false

env:
  PIPESHUB_BASE_URL: http://localhost:3000
  MESSAGE_BROKER: redis
  COMPOSE_FILE_NEO4J: docker-compose.integration.neo4j.yml
  PERF_LABEL: ci-query-neo4j-4cpu

jobs:
  query-benchmark:
    name: Query benchmark (neo4j)
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=100gb/ssh=true
    timeout-minutes: 120

    # Same environments, and so the same approval gate and secrets, as the
    # integration workflow.
    environment:
      name: ${{ github.event_name == 'schedule' && 'integration-test-daily' || 'integration-test-dev' }}

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DOCKER_BUILDKIT: "1"
      PIPESHUB_TEST_ENV: local
      PIPESHUB_TEST_USER_EMAIL: ${{ secrets.PIPESHUB_TEST_USER_EMAIL }}
      PIPESHUB_TEST_USER_PASSWORD: ${{ secrets.PIPESHUB_TEST_USER_PASSWORD }}
      TEST_OPENAI_LLM_MODEL: ${{ vars.TEST_OPENAI_LLM_MODEL }}
      # Azure OpenAI is where the credits are. The helper prefers it over
      # OpenAI when its credentials are present, and TEST_AI_MODEL_PROVIDER
      # stops a failure here quietly falling back to a key we no longer fund.
      TEST_AI_MODEL_PROVIDER: azureOpenAI
      TEST_AZURE_OPENAI_API_KEY: ${{ secrets.TEST_AZURE_OPENAI_API_KEY }}
      TEST_AZURE_OPENAI_ENDPOINT: ${{ secrets.TEST_AZURE_OPENAI_ENDPOINT || vars.TEST_AZURE_OPENAI_ENDPOINT }}
      TEST_AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.TEST_AZURE_OPENAI_DEPLOYMENT_NAME || vars.TEST_AZURE_OPENAI_DEPLOYMENT_NAME }}
      TEST_AZURE_OPENAI_MODEL: ${{ secrets.TEST_AZURE_OPENAI_MODEL || vars.TEST_AZURE_OPENAI_MODEL }}
      # Without its own value this falls back to the LLM deployment, which
      # would send embedding requests to a chat model.
      TEST_AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${{ secrets.TEST_AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME || vars.TEST_AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME }}
      TEST_AZURE_OPENAI_EMBEDDING_MODEL: ${{ secrets.TEST_AZURE_OPENAI_EMBEDDING_MODEL || vars.TEST_AZURE_OPENAI_EMBEDDING_MODEL }}
      # Routed through env (never interpolated into the shell) so dispatch
      # input cannot inject; validated as integers before use.
      USERS_INPUT: ${{ github.event.inputs.users || '4' }}
      DURATION_INPUT: ${{ github.event.inputs.duration || '300' }}
      DOCS_INPUT: ${{ github.event.inputs.docs || '120' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          for pair in "users:$USERS_INPUT" "duration:$DURATION_INPUT" "docs:$DOCS_INPUT"; do
            name=${pair%%:*}
            value=${pair#*:}
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "$name must be a whole number, got '$value'"
              exit 1
            fi
            if [ "$value" -lt 1 ]; then
              echo "$name must be at least 1, got '$value'"
              exit 1
            fi
          done

      - name: Pull pre-built base images
        run: |
          docker pull pipeshubai/pipeshub-ai-base:python-deps || true
          docker pull pipeshubai/pipeshub-ai-base:runtime || true

      - name: Build Neo4j stack images
        working-directory: deployment/docker-compose
        run: docker compose -f "$COMPOSE_FILE_NEO4J" build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install integration-test dependencies
        working-directory: integration-tests
        run: |
          uv venv
          uv pip install -e .

      # Only the app and the stores it depends on: the connector source
      # databases the integration suite also starts would be idle neighbours
      # competing for the same four CPUs.
      - name: Start services
        working-directory: deployment/docker-compose
        run: docker compose -f "$COMPOSE_FILE_NEO4J" up -d pipeshub-ai

      - name: Wait for core services
        run: |
          deadline=$((SECONDS + 300))
          delay=1
          until curl -sf "${PIPESHUB_BASE_URL}/api/v1/health" | grep -q '"status":"healthy"'; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo "Core services not healthy after 300s"; exit 1; fi
            echo "Not ready, retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt 64 ]; then delay=64; fi
          done

      - name: Wait for Python microservices
        run: |
          deadline=$((SECONDS + 300))
          delay=1
          until curl -sf "${PIPESHUB_BASE_URL}/api/v1/health/services" | grep -q '"status":"healthy"'; do
            if [ "$SECONDS" -ge "$deadline" ]; then echo "Python services not healthy after 300s"; exit 1; fi
            echo "Not ready, retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt 64 ]; then delay=64; fi
          done

      # Bodies are built with jq so a secret containing a quote, backslash or
      # newline still produces valid JSON.
      - name: Create organization and admin user
        run: |
          jq -n \
            --arg email "$PIPESHUB_TEST_USER_EMAIL" \
            --arg password "$PIPESHUB_TEST_USER_PASSWORD" \
            '{
              accountType: "business",
              adminFullName: "Integration Test Admin",
              contactEmail: $email,
              password: $password,
              confirmPassword: $password,
              registeredName: "Integration Test Org",
              shortName: "INTTEST"
            }' \
            | curl -sf "${PIPESHUB_BASE_URL}/api/v1/org" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null

      - name: Skip onboarding
        run: |
          HEADERS=$(mktemp)
          jq -n --arg email "$PIPESHUB_TEST_USER_EMAIL" '{email: $email}' \
            | curl -sf "${PIPESHUB_BASE_URL}/api/v1/userAccount/initAuth" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                -D "${HEADERS}" -o /dev/null
          SESSION_TOKEN=$(grep -i "x-session-token:" "${HEADERS}" | tr -d '\r' | awk '{print $2}')
          rm -f "${HEADERS}"

          ACCESS_TOKEN=$(jq -n \
              --arg email "$PIPESHUB_TEST_USER_EMAIL" \
              --arg password "$PIPESHUB_TEST_USER_PASSWORD" \
              '{method: "password", credentials: {password: $password}, email: $email}' \
            | curl -sf "${PIPESHUB_BASE_URL}/api/v1/userAccount/authenticate" \
                -H "Content-Type: application/json" \
                -H "x-session-token: ${SESSION_TOKEN}" \
                --data-binary @- \
            | jq -r '.accessToken')

          curl -sf -X PUT "${PIPESHUB_BASE_URL}/api/v1/org/onboarding-status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -d '{"status": "configured"}' > /dev/null

      - name: Run query benchmark
        working-directory: integration-tests
        run: |
          source .venv/bin/activate
          CONTAINER=$(docker compose -f "../deployment/docker-compose/$COMPOSE_FILE_NEO4J" ps -q pipeshub-ai)
          python perf/bench_query.py \
            --docs "$DOCS_INPUT" --users "$USERS_INPUT" --duration "$DURATION_INPUT" \
            --label "$PERF_LABEL" --graph-db neo4j --ai-models seed \
            --container "$CONTAINER" \
            --output reports/perf/query.json \
            --summary reports/perf/summary.md

      # Reports only: compare.py exits 0 on a regression until the thresholds
      # have a few weeks of CI history behind them (see perf/README.md).
      # A benchmark that exits 0 without writing a result would otherwise let
      # the job finish green with nothing measured.
      - name: Compare with baseline
        if: ${{ !cancelled() }}
        working-directory: integration-tests
        run: |
          source .venv/bin/activate
          if [ ! -s reports/perf/query.json ]; then
            echo "The benchmark wrote no result at reports/perf/query.json."
            echo "Check the 'Run query benchmark' step above, and the docker logs in this run's artifact."
            exit 1
          fi
          python perf/compare.py \
            --baseline "perf/baselines/$PERF_LABEL.json" \
            --current reports/perf/query.json \
            --summary reports/perf/summary.md

      - name: Write job summary
        if: ${{ !cancelled() && hashFiles('integration-tests/reports/perf/summary.md') != '' }}
        run: cat integration-tests/reports/perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dump docker logs
        if: failure()
        working-directory: deployment/docker-compose
        run: |
          mkdir -p ../../integration-tests/reports/perf/docker-logs
          docker compose -f "$COMPOSE_FILE_NEO4J" logs --no-color --timestamps pipeshub-ai \
            > ../../integration-tests/reports/perf/docker-logs/pipeshub-ai.log 2>&1 || true

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-query-${{ github.run_id }}
          path: integration-tests/reports/perf/
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        working-directory: deployment/docker-compose
        run: docker compose -f "$COMPOSE_FILE_NEO4J" down -v
