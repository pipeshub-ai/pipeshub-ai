name: ARM64 first-run

# Releases publish an arm64 image, but the only place it is ever started is the
# release job itself. A change on main that breaks the arm64 build (typically a
# new dependency with no arm64 wheel or binary) stays invisible until it blocks
# a release.
#
# This builds the slim app image and the sandbox image natively on an arm64
# runner from this commit, then runs the same first-run smoke the release uses
# against them. Nothing is pushed: the images exist only on the runner, under a
# tag Docker Hub does not have, so the smoke cannot silently fall back to a
# published image.
on:
  pull_request:
    branches:
      - main
    # What decides whether the arm64 build works: the image definitions and the
    # dependency manifests they install from.
    paths:
      - 'Dockerfile'
      - 'Dockerfile.base'
      - 'deployment/sandbox/**'
      - 'backend/python/pyproject.toml'
      - 'backend/python/uv.lock'
      - 'deployment/docker-compose/tests/image_structure_test.sh'
      - 'deployment/docker-compose/tests/layer_reuse_test.sh'
      - 'deployment/docker-compose/tests/build_context_test.sh'
      - 'scripts/docker/**'
      - 'backend/nodejs/apps/package.json'
      - 'backend/nodejs/apps/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/arm64-smoke.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Pull-request code runs here with no secrets and a read-only token, on a
# GitHub-hosted runner, checked out without persisting credentials.
permissions:
  contents: read

concurrency:
  group: arm64-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Must not exist on Docker Hub; see the header.
  CI_TAG: ci-arm64

jobs:
  slim:
    name: Build and start slim (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the runner is really ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(dpkg --print-architecture)"
          echo "runner architecture: ${actual}"
          [ "$actual" = "${{ matrix.arch }}" ] || { echo "expected ${{ matrix.arch }}, got ${actual}"; exit 1; }

      # A pull request that changes the base builds python-deps here.
      - name: Reclaim disk space
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true

      # The bases for this tree's Dockerfile.base and uv.lock, by content hash
      # (see scripts/docker/ci_base_images.sh).
      - name: Resolve base images
        run: |
          bash scripts/docker/ci_base_images.sh >> "$GITHUB_ENV"

      # Plain `docker build` puts the image straight into the local image store
      # the installer reads from, with no builder to export out of.
      - name: Build the slim app image
        run: |
          set -euo pipefail
          docker build \
            --target runtime-slim \
            --build-arg PYTHON_DEPS_IMAGE="${PYTHON_DEPS_IMAGE}" \
            --build-arg RUNTIME_BASE_IMAGE="${RUNTIME_BASE_IMAGE}" \
            -t "pipeshubai/pipeshub-ai:${CI_TAG}" .

      - name: Check the slim image layout
        env:
          PIPESHUB_IMAGE: pipeshubai/pipeshub-ai:${{ env.CI_TAG }}
          PIPESHUB_IMAGE_VARIANT: slim
        run: bash deployment/docker-compose/tests/image_structure_test.sh

      - name: Build the sandbox image
        run: docker build -t "pipeshubai/pipeshub-sandbox:${CI_TAG}" deployment/sandbox

      - name: First-run smoke against the arm64 build
        env:
          PIPESHUB_DEPLOY_TYPE: slim
          PIPESHUB_VERSION: ${{ env.CI_TAG }}
          # The installer would otherwise try to refresh this tag from Docker
          # Hub. It does not exist there, and the local build is what we test.
          PIPESHUB_NO_PULL: '1'
          PUBLISHED_HUB_SMOKE_DIAG: ${{ runner.temp }}/diag
        run: bash deployment/docker-compose/tests/published_hub_smoke.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-slim-${{ matrix.arch }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore

  layer-reuse:
    name: Layer reuse (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true

      - name: Resolve base images
        run: |
          bash scripts/docker/ci_base_images.sh >> "$GITHUB_ENV"

      - name: Rebuild and compare layers
        run: bash deployment/docker-compose/tests/layer_reuse_test.sh
