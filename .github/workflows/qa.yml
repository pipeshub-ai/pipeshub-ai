name: QA

# Chooses and runs the tests a change needs, reports them on the PR, and gates
# on one check ("QA / pipeline / gate"). See docs/qa-engine/README.md.
# Shadow mode (plan + report only) until vars.QA_ENFORCE is 'true'.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr | range | since | full'
        type: choice
        options: [pr, range, since, full]
        default: pr
      pr:
        description: 'PR number to report on (set by /qa)'
        type: string
        default: ''
      base_sha:
        description: 'range: changes in base_sha..head_sha (base_sha itself excluded); since: base_sha and every later commit'
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      profile:
        type: choice
        options: [standard, fast, conservative, full, weekly]
        default: standard
      plan_only:
        description: 'plan and report without running tests (/qa plan)'
        type: boolean
        default: false
      review:
        description: 'post a QA review comment (/qa review)'
        type: boolean
        default: false
      # One input for what follows the plan (a dispatch takes at most ten inputs): "true" strengthens and
      # adds tests after the run (/qa on a same-repo PR); "agent" runs the QA agent instead (Claude Code
      # picks and judges, the engine runs); "combine[-open] NUMBER:SHA ..." first stacks those PRs.
      improve:
        description: '"true", "agent", or "combine[-open] NUMBER:SHA ..." (set by /qa)'
        type: string
        default: ''
      command:
        description: 'the /qa command, for the header of its PR comment (set by /qa)'
        type: string
        default: ''
      requested_by:
        type: string
        default: ''
  schedule:
    # After the 18:30 UTC integration nightly: the full run that measures misses.
    - cron: '0 21 * * *'
    # Sundays: the weekly profile (upgrade and perf smoke).
    - cron: '0 4 * * 0'

permissions:
  contents: read
  pull-requests: write
  # qa-pipeline.yml run-stack reads the previous nightly's screenshots; a called job may not ask for more than this.
  actions: read

concurrency:
  group: qa-${{ inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  # The QA agent's settings, from the improve input; checked here.
  agent-args:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      on: ${{ steps.parse.outputs.on }}
      combine: ${{ steps.parse.outputs.combine }}
      open_pr: ${{ steps.parse.outputs.open_pr }}
    steps:
      - id: parse
        env:
          AGENT: ${{ inputs.improve }}
        run: |
          on=false combine="" open_pr=false
          if [[ "$AGENT" == agent ]]; then
            on=true
          elif [[ "$AGENT" =~ ^combine(-open)?((\ [0-9]{1,7}:[0-9a-f]{40}){1,8})$ ]]; then
            on=true combine="${BASH_REMATCH[2]# }"
            [[ -n "${BASH_REMATCH[1]}" ]] && open_pr=true
          elif [[ -n "$AGENT" && "$AGENT" != true && "$AGENT" != false ]]; then
            echo "::error::improve must be true, false, agent or \"combine[-open] NUMBER:SHA ...\""; exit 1
          fi
          { echo "on=$on"; echo "combine=$combine"; echo "open_pr=$open_pr"; } >> "$GITHUB_OUTPUT"

  pipeline:
    needs: agent-args
    uses: ./.github/workflows/qa-pipeline.yml
    with:
      edition: oss
      mode: ${{ inputs.mode || 'pr' }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      profile: ${{ inputs.profile }}
      pr: ${{ inputs.pr }}
      plan_only: ${{ inputs.plan_only || false }}
      review: ${{ inputs.review || false }}
      command: ${{ inputs.command }}
      requested_by: ${{ inputs.requested_by }}
      agent: ${{ needs.agent-args.outputs.on == 'true' }}
      combine: ${{ needs.agent-args.outputs.combine }}
    secrets: inherit

  # The QA agent's tests (a same-repo PR) or combined branch (/qa combine --open-pr), pushed by a
  # job with no secrets, after the checks in qa-agent-publish.yml.
  agent-publish:
    needs: [agent-args, pipeline]
    if: ${{ !cancelled() && vars.QA_ENFORCE == 'true' && needs.agent-args.outputs.on == 'true' && inputs.pr != '' && github.event_name == 'workflow_dispatch' && (needs.agent-args.outputs.combine == '' || needs.agent-args.outputs.open_pr == 'true') }}
    uses: ./.github/workflows/qa-agent-publish.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      edition: oss
      pr: ${{ inputs.pr }}
      head_sha: ${{ inputs.head_sha }}
      combine: ${{ needs.agent-args.outputs.combine }}
      requested_by: ${{ inputs.requested_by }}

  # /qa only: qa-command.yml sets improve for a same-repo PR. After the run, find the change's weak
  # tests and push proven stronger and missing ones, with the jobs of /qa tests (qa-tests.yml):
  # the PR's code runs only where there are no secrets and no token. Never part of the gate,
  # which is the pipeline's own job. Only while the run executes tests (QA_ENFORCE), and never
  # when the repository variable QA_IMPROVE is 'false'.
  improve:
    needs: pipeline
    if: ${{ !cancelled() && vars.QA_ENFORCE == 'true' && vars.QA_IMPROVE != 'false' && inputs.improve == 'true' && inputs.mode == 'pr' && !inputs.plan_only && !inputs.review && inputs.pr != '' && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/qa-tests.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      pr: ${{ inputs.pr }}
      head_sha: ${{ inputs.head_sha }}
      improve: true
      requested_by: ${{ inputs.requested_by }}
    secrets: inherit

  # The only job that writes qa-history: run history, shadow recall, the
  # automatic quarantine and metrics.json. Nightly only, so no pull request or
  # dispatch can write it (scripts/test_workflow_trust.py).
  history:
    needs: pipeline
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Credentials stay for the push to qa-history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          pattern: qa-*-oss
          path: qa-out
          merge-multiple: true

      - name: Coverage from the latest unit-test run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow unit-test.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty') || true
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -p '*-coverage-report-*' -D cov || true
            for z in cov/*/*.zip; do [[ -f "$z" ]] && { unzip -oq "$z" -d "$(dirname "$z")" || true; }; done
          fi
          true

      - name: Shadow recall
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/qa shadow fetch --repo "$GITHUB_REPOSITORY" --since-hours 48 --to qa-out/shadow-new.jsonl \
            || echo "::warning::shadow fetch failed; publishing without new shadow records"

      - name: Publish history and metrics
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--out qa-out --remote origin --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
                --started-at "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)")
          # shadow fetch writes no file when no workflow run failed; publish rejects a missing --shadow file.
          if [[ -f qa-out/shadow-new.jsonl ]]; then args+=(--shadow qa-out/shadow-new.jsonl); fi
          # cov/<suite>-coverage-report-<os>/.../coverage-summary.json, e.g. python, nodejs.
          while IFS= read -r f; do
            suite=${f#cov/}; suite=${suite%%-coverage-report-*}
            args+=(--coverage "$suite=$f")
          done < <(find cov -name coverage-summary.json 2>/dev/null | sort)
          python3 scripts/qa history publish "${args[@]}"
