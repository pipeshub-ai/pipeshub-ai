name: unit-test

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'backend/nodejs/apps/src/**'
      - 'backend/nodejs/apps/tests/**'
      - 'backend/nodejs/apps/package.json'
      - 'backend/nodejs/apps/package-lock.json'
      - 'backend/nodejs/apps/tsconfig*.json'
      - 'backend/nodejs/apps/.mocharc.yaml'
      - 'backend/nodejs/apps/.c8rc.json'
      - 'backend/python/app/**'
      - 'backend/python/tests/**'
      - 'backend/python/pyproject.toml'
      - 'backend/python/pytest.ini'
      - 'backend/python/.coveragerc'
      - 'scripts/unit_shards.py'
      - '.github/workflows/unit-test.yml'
      # The integration-suite guards run in integration-suite-guards.yml.

  workflow_call:
    inputs:
      # Only ever raise the Python minimum; never lower it to make a PR pass. Add tests instead.
      # It lives in three places that must move together: this default, the `|| 89.8`
      # fallback on the `coverage report --fail-under` line (the one pull_request runs use),
      # and weekly-coverage.yml (its input and its Slack text).
      python-coverage-threshold:
        description: 'Minimum Python coverage percentage'
        type: number
        default: 89.8
      generate-coverage-reports:
        description: 'Generate and upload coverage report artifacts'
        type: boolean
        default: false

permissions:
  contents: read

# A push to a pull request supersedes its earlier run; with a dozen jobs per run,
# letting them stack wastes runners other pull requests are waiting for.
concurrency:
  group: unit-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  nodejs-unit-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/nodejs/apps/package-lock.json

      - name: Install dependencies
        run: |
          cd backend/nodejs/apps
          npm ci

      - name: Run unit tests with coverage
        run: |
          cd backend/nodejs/apps
          npx cross-env TS_NODE_PROJECT=tsconfig.test.json c8 --check-coverage --lines 89 --functions 90 --branches 80 --statements 89 --reporter=text --reporter=lcov mocha --parallel --jobs 4

      - name: Generate Node.js coverage reports
        if: ${{ always() && inputs.generate-coverage-reports == true }}
        run: |
          cd backend/nodejs/apps
          npx cross-env TS_NODE_PROJECT=tsconfig.test.json c8 report --reporter=html --reporter=json-summary

      - name: Zip coverage folder (Linux)
        if: ${{ always() && inputs.generate-coverage-reports == true && runner.os == 'Linux' }}
        working-directory: backend/nodejs/apps
        run: |
          if [ -d "coverage" ]; then
            zip -r coverage-report.zip coverage/
          fi

      - name: Zip coverage folder (Windows)
        if: ${{ always() && inputs.generate-coverage-reports == true && runner.os == 'Windows' }}
        working-directory: backend/nodejs/apps
        shell: pwsh
        run: |
          if (Test-Path coverage) {
            Compress-Archive -Path coverage -DestinationPath coverage-report.zip
          }

      - name: Upload Node.js coverage artifact
        if: ${{ always() && inputs.generate-coverage-reports == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodejs-coverage-report-${{ matrix.os }}
          path: backend/nodejs/apps/coverage-report.zip
          retention-days: 7
          if-no-files-found: ignore

  # The Python unit suite runs as one job per shard (scripts/unit_shards.py owns
  # the split), each spread over the runner's cores with pytest-xdist. Run as one
  # process it took ~48 min: ~5 min collecting 78k tests and ~36 min running them.
  # Coverage is gated once, in python-coverage, over every shard's data combined:
  # one shard's percentage on its own means nothing.
  python-unit:
    name: python-unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One fixed place for the fastembed model files, so the cache step, the
      # pre-download step and test_bm25_golden.py all use the same directory.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache

    strategy:
      fail-fast: false
      matrix:
        # Must list exactly the shards in scripts/unit_shards.py, in its order;
        # scripts/test_unit_shards.py checks this.
        shard: [connectors-a, connectors-b, connectors-c, agents, services, modules, core]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout coverage
          # `.[dev]`, not a bare `.`: the dev extra already declares
          # fakeredis[lua], which the FakeClusterRedis contract suites (the
          # CROSSSLOT/multi-key guards for MemoryDB readiness) need. Without
          # it those suites skip and the cluster-safety checks never actually
          # run here. It also brings pytest-xdist and pytest-cov.
          uv pip install --system -e ".[dev]"

      - name: Check whether this shard runs the BM25 golden test
        id: bm25
        working-directory: backend/python
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          owns=$(python3 ../../scripts/unit_shards.py owns "$SHARD" tests/unit/services/vector_db/test_bm25_golden.py)
          echo "needs_bm25=$owns" >> "$GITHUB_OUTPUT"

      # The Qdrant/bm25 files are a few KB; caching them and fetching with
      # retries keeps test_bm25_golden.py (REQUIRE_BM25_MODEL=1 below) off a
      # single anonymous Hub request. The key follows the dependency manifest,
      # which pins fastembed.
      - name: Cache fastembed model
        if: steps.bm25.outputs.needs_bm25 == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-bm25-${{ hashFiles('backend/python/pyproject.toml') }}

      - name: Pre-download fastembed model
        if: steps.bm25.outputs.needs_bm25 == 'true'
        run: |
          for attempt in 1 2 3 4; do
            if python3 -c "from fastembed import SparseTextEmbedding; SparseTextEmbedding(model_name='Qdrant/bm25')"; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying" >&2
            sleep $((attempt * 10))
          done
          echo "Could not download Qdrant/bm25; test_bm25_golden.py will fail" >&2
          exit 1

      # -n logical: one worker per vCPU (`auto` counts physical cores). --dist
      # loadfile keeps each file's tests on one worker, so tests in a file that
      # share module state still run together and in order. pytest-cov merges
      # the workers' data into COVERAGE_FILE. GitHub's 4 vCPUs are 2 cores, so
      # each of the 4 workers runs a test at about half serial speed:
      # --timeout=60 keeps pytest.ini's 30s hang guard at the same CPU budget.
      - name: Run unit tests (${{ matrix.shard }})
        working-directory: backend/python
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
          # test_bm25_golden.py downloads the small Qdrant/bm25 model from the
          # Hub here; fail instead of skipping if it cannot be loaded. Set only
          # in the shard that runs it (the others never fetch the model).
          REQUIRE_BM25_MODEL: ${{ steps.bm25.outputs.needs_bm25 == 'true' && '1' || '' }}
        # Captured first so a failing script stops the step: with no paths
        # pytest falls back to testpaths and runs the whole suite here.
        run: |
          args=$(python3 ../../scripts/unit_shards.py args "$SHARD")
          mapfile -t shard_args <<< "$args"
          pytest "${shard_args[@]}" -n logical --dist loadfile --timeout=60 --cov --cov-report= --durations=15 \
            --junitxml="junit-$SHARD.xml"

      # upload-artifact skips dotfiles unless told otherwise, and every coverage
      # data file is one. Not named python-coverage-report-*: weekly-coverage.yml
      # posts everything under that name to Slack.
      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: py-cov-data-${{ matrix.shard }}
          path: backend/python/.coverage.${{ matrix.shard }}*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Per-test times: scripts/unit_shards.py durations turns these into the
      # per-file minutes the shard balance check reads.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: py-junit-${{ matrix.shard }}
          path: backend/python/junit-${{ matrix.shard }}.xml
          retention-days: 14
          if-no-files-found: warn

  python-coverage:
    needs: python-unit
    # Still runs when a shard failed: the coverage result is a separate question,
    # and python-unit-tests fails on the shard either way.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: py-cov-data-*
          path: backend/python
          merge-multiple: true

      - name: Check coverage
        working-directory: backend/python
        run: |
          coverage combine
          coverage report --fail-under=${{ inputs.python-coverage-threshold || 89.8 }}

      - name: Generate coverage reports
        if: ${{ always() && inputs.generate-coverage-reports == true }}
        working-directory: backend/python
        run: |
          coverage json -o coverage/coverage-summary.json
          coverage html -d coverage/htmlcov

      - name: Zip Python coverage folder
        if: ${{ always() && inputs.generate-coverage-reports == true }}
        working-directory: backend/python
        run: |
          if [ -d "coverage" ]; then
            zip -r python-coverage-report.zip coverage/
          fi

      - name: Upload Python coverage artifact
        if: ${{ always() && inputs.generate-coverage-reports == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # weekly-coverage.yml labels the Slack upload from the part after
          # python-coverage-report-.
          name: python-coverage-report-ubuntu-latest-3.12
          path: backend/python/python-coverage-report.zip
          retention-days: 7
          if-no-files-found: ignore

  # The only automated check on agent behaviour: six golden properties the
  # prompt and loop must hold (tool choice, no placeholder write params, a
  # single final_answer, no write without user intent, resolvable citations,
  # confidence capped when sources are missing). Kept out of the coverage run
  # so a failure reads as a behaviour regression rather than a coverage
  # change. Structural only — no model call, no network, no API key.
  python-agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"

      - name: Run golden agent evals
        working-directory: backend/python
        run: pytest tests/evals -v

  # backend/python/tests/integration holds 24 files and only the three under
  # redis_cluster were run by any workflow. Despite the name most need no
  # services: the ones that do are written to skip when the service is
  # absent, so on a bare runner they skip cleanly and the rest execute.
  # Two paths are excluded below.
  #
  # test_npm_import_live.py is excluded because it is not offline: it pulls
  # real tarballs from registry.npmjs.org. It skips when the registry is
  # unreachable, but a CI runner can reach it, so leaving it in would make
  # every Python pull request depend on the public npm registry and on the
  # pinned packages staying published.
  python-integration-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"

      - name: Run Python integration tests
        working-directory: backend/python
        run: |
          pytest tests/integration \
            --ignore=tests/integration/redis_cluster \
            --ignore=tests/integration/skills/test_npm_import_live.py \
            -v --timeout=300 --session-timeout=900

  # One check for everything the single python-unit-tests job used to run, so a
  # required status check keeps one name however the shards change.
  python-unit-tests:
    needs: [python-unit, python-coverage, python-agent-evals, python-integration-offline]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check the Python jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  redis-cluster-integration-tests:
    # A real 3-master Redis Cluster (grokzen/redis-cluster) is the only way to
    # exercise CROSSSLOT/MOVED/failover behaviour for real -- the FakeClusterRedis
    # contract suites in tests/unit/services/redis/ only approximate it. This job
    # proves the MemoryDB-readiness refactor (R1/R17) against a live cluster on
    # every PR, not just nightly/manual integration runs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"

      - name: Start Redis Cluster
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.redis-cluster.yml up -d --wait

      - name: Run Redis Cluster integration tests
        working-directory: backend/python
        env:
          REDIS_MODE: cluster
          REDIS_CLUSTER_ENDPOINTS: 127.0.0.1:17000,127.0.0.1:17001,127.0.0.1:17002
        run: pytest tests/integration/redis_cluster -v -m integration

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: backend/nodejs/apps
        run: npm ci

      # The Node provider has cluster-specific code the Python suite cannot
      # cover: ioredis' `Cluster.scan()` reaches one node only, so
      # `ClusterRedisProvider.scanKeys` fans out over `nodes('master')` by
      # hand, and `StreamReadPlanner` groups XREADGROUP by a locally
      # implemented CRC16 that must agree with the server's CLUSTER KEYSLOT.
      # `clusterRedisProvider.integration.test.ts` skips itself unless
      # REDIS_CLUSTER_ENDPOINTS is set, which is what activates it here.
      #
      # This runs the whole Node suite, not just the redis specs: mocha merges
      # `spec` from .mocharc.yaml with the CLI, so the two cannot be narrowed
      # without also dropping the `require` hooks the suite depends on. The
      # wider run is worth having anyway — it is what catches a unit test that
      # silently reads the ambient REDIS_MODE.
      - name: Run Node test suite against the cluster
        working-directory: backend/nodejs/apps
        env:
          REDIS_MODE: cluster
          REDIS_CLUSTER_ENDPOINTS: 127.0.0.1:17000,127.0.0.1:17001,127.0.0.1:17002
          TS_NODE_PROJECT: tsconfig.test.json
        run: npx mocha --no-parallel

      - name: Dump Redis Cluster logs
        if: always()
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.redis-cluster.yml logs --no-color

      - name: Tear down Redis Cluster
        if: always()
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.redis-cluster.yml down -v
