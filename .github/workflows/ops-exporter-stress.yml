name: ops-exporter-stress

# Nightly: the ops exporter's load tests (tests marked `stress`). They run an exporter process under CPU burners and
# reconnecting clients, so they are probabilistic on a shared runner and are not part of the per-PR unit job (which
# skips them). A failure here is a finding for the owner, not a gate: nothing waits for this workflow.

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exporter-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          cd backend/python
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"

      - name: Exporter load tests
        working-directory: backend/python
        env:
          RUN_STRESS_TESTS: '1'
        run: |
          pytest tests/unit/telemetry/test_ops_exporter_d159_load.py -m stress -v --timeout=300 \
            --junitxml="$RUNNER_TEMP/ops-exporter-stress.xml"

      - name: Fail on skipped tests
        run: python3 scripts/assert_no_skips.py "$RUNNER_TEMP/ops-exporter-stress.xml" --min-tests 3
