name: SDK Tests

# Tests the TypeScript, Python and Go SDKs against the app built from this commit.
#   Current run:  SDKs generated from this commit's spec and tests.arazzo.yaml. A failure is BLOCK.
#   Previous run: the last released SDKs (.github/sdk-test-matrix.yaml) with the tests in their
#                 tags, only for the languages whose current run passed. A failure is FLAG.
# One job, one app: the three suites run side by side and each test checks only what it created.
# FLAG does not stop the merge; a person accepts it with a label (sdk-break-approval.yml).
# integration-tests/sdk_tests/README.md has the rules and the local run steps.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deployment/docker-compose/**'
      - 'integration-tests/sdk_tests/**'
      - '.github/sdk-test-matrix.yaml'
      - '.github/workflows/sdk-tests.yml'
      - 'Dockerfile'
  # Daily at 01:00 IST (Asia/Kolkata); Actions cron is UTC -> 19:30 UTC.
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push replaces a pull request's run; a manual run never cancels the nightly one.
concurrency:
  group: sdk-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PIPESHUB_BASE_URL: http://localhost:3000
  # The open-api commit whose generation settings this job uses (gen.yaml, workflow.yaml, the
  # overlay, filter_sdk_spec.py and the Speakeasy CLI version in generate-sdks.yml), so the SDK
  # under test equals the published one. Move it when open-api changes them.
  OPEN_API_REF: 11f2c863fb3ec8fb591ccd98baaa26b83f548603
  COMPOSE_FILE: docker-compose.integration.neo4j.yml
  SDK_WORK_DIR: ${{ github.workspace }}/sdk-work
  SDK_RELEASED_DIR: ${{ github.workspace }}/sdk-released
  SDK_REPORTS_DIR: ${{ github.workspace }}/sdk-reports

jobs:
  sdk-tests:
    name: SDK tests (TypeScript, Python, Go)
    # A fork's pull request gets no secrets; the nightly run covers what forks merge.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=100gb
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write          # create the FLAG labels
      pull-requests: write   # the report comment and the labels
      statuses: write        # the "SDK break approval" status on FLAG
    # Same gate as integration-tests.yml: its required reviewers approve every run that is not the
    # nightly, so a manual run cannot reach the secrets without review.
    environment:
      name: ${{ github.event_name == 'schedule' && 'integration-test-daily' || 'integration-test-dev' }}

    steps:
      # Without the key no SDK can be generated, so the 10-minute app build would be for nothing.
      - name: Check the Speakeasy API key
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          if [ -z "$SPEAKEASY_API_KEY" ]; then
            echo "::error::The secret SPEAKEASY_API_KEY is not set for this repository or its environment, so no SDK can be generated."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout the SDK generation settings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pipeshub-ai/open-api
          ref: ${{ env.OPEN_API_REF }}
          path: open-api
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Same Go as generate-sdks.yml: Speakeasy lints the Go SDK with staticcheck v0.6.1, which
      # cannot read packages built by a newer Go. GOTOOLCHAIN=auto still lets a go.mod ask for more.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: false

      # The CLI version comes from generate-sdks.yml at OPEN_API_REF, so the two cannot drift.
      - name: Install Speakeasy CLI
        run: |
          pip install --quiet pyyaml
          version=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["env"]["SPEAKEASY_VERSION"])' \
            open-api/.github/workflows/generate-sdks.yml)
          curl -fsSL -o /tmp/speakeasy.zip "https://github.com/speakeasy-api/speakeasy/releases/download/${version}/speakeasy_linux_amd64.zip"
          sudo unzip -o /tmp/speakeasy.zip -d /usr/local/bin speakeasy
          speakeasy --version

      # Fails when a test names an operation the spec no longer has.
      - name: List the SDK operations no test calls
        run: |
          {
            echo '### SDK test coverage'
            echo '```'
            python3 integration-tests/sdk_tests/coverage.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A language that fails to generate has no suite to run, which the report reads as BLOCK.
      - name: Generate the SDKs and their tests
        id: generate
        continue-on-error: true
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: integration-tests/sdk_tests/generate_sdks.sh open-api "$SDK_WORK_DIR"

      # The app Dockerfile uses these as FROM stages. From GHCR first, as integration-tests.yml does;
      # Docker Hub is the fallback per image.
      - name: Pull pre-built base images
        run: |
          for pair in PYTHON_DEPS_IMAGE=python-deps RUNTIME_BASE_IMAGE=runtime; do
            image="ghcr.io/pipeshub-ai/pipeshub-ai-base:${pair#*=}"
            if ! docker pull "$image"; then
              image="pipeshubai/pipeshub-ai-base:${pair#*=}"
              echo "::warning::Could not pull the GHCR base image, so this run uses ${image} from Docker Hub."
              docker pull "$image" || true
            fi
            echo "${pair%%=*}=${image}" >> "$GITHUB_ENV"
          done

      - name: Build the app
        working-directory: deployment/docker-compose
        env:
          DOCKER_BUILDKIT: "1"
        run: docker compose -f "$COMPOSE_FILE" build pipeshub-ai

      - name: Start the app
        working-directory: deployment/docker-compose
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: docker compose -f "$COMPOSE_FILE" up -d

      - name: Wait for the app
        run: |
          for path in /api/v1/health /api/v1/health/services; do
            timeout 600 bash -c "
              until curl -sf '${PIPESHUB_BASE_URL}${path}' | grep -q '\"status\":\"healthy\"'; do sleep 5; done
            "
          done

      - name: Provision the app
        working-directory: integration-tests
        env:
          PIPESHUB_TEST_USER_EMAIL: ${{ secrets.PIPESHUB_TEST_USER_EMAIL }}
          PIPESHUB_TEST_USER_PASSWORD: ${{ secrets.PIPESHUB_TEST_USER_PASSWORD }}
          TEST_AI_MODEL_PROVIDER: azureOpenAI
          TEST_AZURE_OPENAI_API_KEY: ${{ secrets.TEST_AZURE_OPENAI_API_KEY }}
          TEST_AZURE_OPENAI_ENDPOINT: ${{ secrets.TEST_AZURE_OPENAI_ENDPOINT || vars.TEST_AZURE_OPENAI_ENDPOINT }}
          TEST_AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.TEST_AZURE_OPENAI_DEPLOYMENT_NAME || vars.TEST_AZURE_OPENAI_DEPLOYMENT_NAME }}
          TEST_AZURE_OPENAI_MODEL: ${{ secrets.TEST_AZURE_OPENAI_MODEL || vars.TEST_AZURE_OPENAI_MODEL }}
          TEST_AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: ${{ secrets.TEST_AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME || vars.TEST_AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME }}
          TEST_AZURE_OPENAI_EMBEDDING_MODEL: ${{ secrets.TEST_AZURE_OPENAI_EMBEDDING_MODEL || vars.TEST_AZURE_OPENAI_EMBEDDING_MODEL }}
        # Mask the OAuth client secret in this step: the header of every later step lists
        # the $GITHUB_ENV values.
        run: |
          uv run --no-project --with requests --with pydantic python sdk_tests/provision_sdk_test_env.py
          echo "::add-mask::$(sed -n 's/^PIPESHUB_CLIENT_SECRET=//p' "$GITHUB_ENV")"

      # The suites get only the OAuth app the provisioning step wrote to $GITHUB_ENV.
      - name: 'Current run: generated SDKs'
        id: current
        continue-on-error: true
        run: integration-tests/sdk_tests/run_sdk_tests.sh current "$SDK_WORK_DIR" "$SDK_REPORTS_DIR"

      - name: 'Previous run: last released SDKs'
        id: previous
        continue-on-error: true
        run: |
          mapfile -t passed < <(python3 integration-tests/sdk_tests/report.py "$SDK_REPORTS_DIR" --current-passed)
          if [ ${#passed[@]} -eq 0 ]; then
            echo "No SDK passed the current run; the previous run does not start."
            exit 0
          fi
          integration-tests/sdk_tests/checkout_released_sdks.sh .github/sdk-test-matrix.yaml "$SDK_RELEASED_DIR" "${passed[@]}"
          integration-tests/sdk_tests/run_sdk_tests.sh previous "$SDK_RELEASED_DIR" "$SDK_REPORTS_DIR" "${passed[@]}"

      - name: Report
        id: report
        if: ${{ !cancelled() }}
        env:
          SDK_TEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Folded, because " #" would start a YAML comment in a plain value.
          SDK_TEST_TRIGGER: >-
            ${{ github.event_name == 'pull_request' && format('<{0}|pull request #{1}>', github.event.pull_request.html_url, github.event.pull_request.number) || format('{0} on {1}', github.event_name, github.ref_name) }}
        run: |
          status=0
          python3 integration-tests/sdk_tests/report.py "$SDK_REPORTS_DIR" --out "$SDK_REPORTS_DIR/report" \
            --releases .github/sdk-test-matrix.yaml || status=$?
          echo "verdict=$(cat "$SDK_REPORTS_DIR/report/verdict.txt")" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Update the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.report.outputs.verdict != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: integration-tests/sdk_tests/update_pull_request.sh "$PR_NUMBER" "$VERDICT" "$SDK_REPORTS_DIR/report/summary.md"

      # report.py wrote both chat.postMessage bodies; the failures go in the message's thread.
      - name: Send the report to Slack
        if: ${{ !cancelled() && steps.report.outputs.verdict != '' }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CI_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "::notice::SLACK_BOT_TOKEN or SLACK_CI_CHANNEL_ID is not set, so the report is not sent to Slack."
            exit 0
          fi
          post() {
            curl -sS --fail-with-body -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" --data-binary @- \
              | jq -er 'if .ok then .ts else error("Slack refused the message: \(.error)") end'
          }
          payloads="$SDK_REPORTS_DIR/report/slack.json"
          ts=$(jq --arg channel "$SLACK_CHANNEL_ID" '.message + {channel: $channel}' "$payloads" | post)
          if jq -e '.thread' "$payloads" > /dev/null; then
            jq --arg channel "$SLACK_CHANNEL_ID" --arg ts "$ts" '.thread + {channel: $channel, thread_ts: $ts}' "$payloads" \
              | post > /dev/null
          fi

      - name: Collect Docker logs
        if: ${{ always() }}
        working-directory: deployment/docker-compose
        run: |
          mkdir -p "$SDK_REPORTS_DIR/docker-logs"
          docker compose -f "$COMPOSE_FILE" ps -a > "$SDK_REPORTS_DIR/docker-logs/_containers.txt" 2>&1 || true
          for svc in $(docker compose -f "$COMPOSE_FILE" config --services 2>/dev/null); do
            docker compose -f "$COMPOSE_FILE" logs --no-color --timestamps "$svc" \
              > "$SDK_REPORTS_DIR/docker-logs/${svc}.log" 2>&1 || true
          done

      - name: Upload the reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-test-reports
          path: ${{ env.SDK_REPORTS_DIR }}
          retention-days: 14

      - name: Stop the app
        if: ${{ always() }}
        working-directory: deployment/docker-compose
        run: docker compose -f "$COMPOSE_FILE" down -v
