name: Post-release probe

# A release passing its gate means the artifact installs and upgrades cleanly on
# a CI runner. It does not mean the instance you actually run is healthy after
# taking it. This closes that: after a release, and then on a schedule, probe a
# real deployment and open an issue if it degrades.
#
# The point is time-to-detection. Releasing daily is only safe if a bad release
# is noticed by you within minutes rather than reported by a customer the next
# morning.
#
# Requires two repository settings:
#   vars.PIPESHUB_PROBE_URL      base URL of the instance to probe
#   secrets.PIPESHUB_PROBE_TOKEN optional PAT, if health needs authentication
# Without the URL the workflow no-ops rather than failing, so forks and clones
# are unaffected.

on:
  workflow_run:
    workflows: ['Release — build, publish, verify']
    types: [completed]
  schedule:
    # Every 30 minutes. Detection time matters more than probe cost here.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-release-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the probe is configured
        id: cfg
        env:
          PROBE_URL: ${{ vars.PIPESHUB_PROBE_URL }}
        run: |
          if [ -z "${PROBE_URL:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PIPESHUB_PROBE_URL is not set; skipping. Set it under Settings → Variables to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe
        id: probe
        if: steps.cfg.outputs.configured == 'true'
        env:
          PROBE_URL: ${{ vars.PIPESHUB_PROBE_URL }}
          PROBE_TOKEN: ${{ secrets.PIPESHUB_PROBE_TOKEN }}
        run: |
          set -uo pipefail
          bash deployment/docker-compose/tests/health_probe.sh | tee "$RUNNER_TEMP/probe.txt"
          rc=${PIPESTATUS[0]}
          {
            echo "summary<<EOF"
            cat "$RUNNER_TEMP/probe.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$rc"

      # An alert nobody sees is not an alert. One issue is kept open and
      # updated, rather than a new one every 30 minutes.
      - name: Open or update an alert issue
        if: failure() && steps.cfg.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          # The summary contains text from the probed deployment — service names
          # out of its health JSON, and curl's error output. Interpolating that
          # into the script with ${{ }} would splice remote text into JavaScript
          # source: one backtick ends the template literal and the rest runs with
          # this job's issues:write token. Pass it as data instead.
          PROBE_SUMMARY: ${{ steps.probe.outputs.summary }}
        with:
          script: |
            const title = 'Deployment probe failing';
            const raw = (process.env.PROBE_SUMMARY || '(no output captured)').slice(0, 8000);
            // Fence with more backticks than the content uses, so output holding
            // a fence cannot break out of the code block.
            const longest = (raw.match(/`+/g) || []).reduce((n, m) => Math.max(n, m.length), 0);
            const fence = '`'.repeat(Math.max(3, longest + 1));
            const body = [
              fence,
              raw,
              fence,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This issue is updated by the probe rather than duplicated. It closes itself when the probe next passes.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deployment-probe',
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deployment-probe'],
              });
            }

      - name: Close the alert once healthy again
        if: success() && steps.cfg.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deployment-probe',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Probe passing again as of ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }
