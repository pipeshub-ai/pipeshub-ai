name: Release Changelog

# When a release is published, run the `release-changelog` skill
# (.claude/skills/release-changelog/SKILL.md) to generate the curated
# changelog/<version>.md, update changelog/README.md, and register the release
# in the root CHANGELOG.md — then open a PR with the result for human review.
#
# `published` fires for both full releases and pre-releases (the skill handles
# Beta/Alpha channels) but never for drafts.
on:
  release:
    types: [published]

# One run at a time; a second release published mid-run waits its turn so the
# two PRs don't build on divergent CHANGELOG.md states.
concurrency:
  group: release-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The release event checks out the tagged commit by default; the
      # changelog lives on main, so check that out explicitly.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run the release-changelog skill
        uses: anthropics/claude-code-action@v1
        env:
          # gh CLI auth for the read-only release/PR lookups the skill performs.
          GH_TOKEN: ${{ github.token }}
        with:
          # Metered Claude API key (console.anthropic.com) — org-controlled and
          # does not expire with a personal subscription login, unlike the
          # `claude setup-token` OAuth token used elsewhere in this repo.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tag names are maintainer-controlled, but pass through an env var
          # rather than shell interpolation as a matter of hygiene.
          prompt: |
            Run the release-changelog skill for the release tagged "${{ github.event.release.tag_name }}"
            of pipeshub-ai/pipeshub-ai. Follow .claude/skills/release-changelog/SKILL.md
            exactly: write changelog/<version>.md, update changelog/README.md, and
            register the release in the root CHANGELOG.md (index row, entry below the
            Unreleased section, refreshed Unreleased compare link).

            Do NOT run git commit or git push, and do NOT open a PR — a later
            workflow step handles that. Your only output is the edited files.
          claude_args: '--allowedTools "Read,Write,Edit,Glob,Grep,Skill,Bash(gh release view:*),Bash(gh pr view:*),Bash(gh api:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(grep:*),Bash(mkdir:*),Bash(python3:*)"'

      - name: Open a pull request with the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Only the changelog surfaces may ship from this job.
          git add CHANGELOG.md changelog/
          if git diff --cached --quiet; then
            echo "::warning::The skill produced no changelog changes for $TAG; nothing to open a PR for."
            exit 0
          fi

          VERSION="${TAG#v}"
          BRANCH="changelog/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "docs(changelog): add ${VERSION} release notes"
          git push -u origin "$BRANCH" --force-with-lease

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs(changelog): ${VERSION}" \
            --body "Automated changelog for [${TAG}](${RELEASE_URL}), generated by the \`release-changelog\` skill ([workflow run](${RUN_URL})).

          Review checklist:
          - [ ] Headline captures the release's biggest story
          - [ ] Breaking changes / upgrade notes are complete
          - [ ] Every PR in the release notes is represented in \`changelog/${VERSION}.md\`"
