name: backend-matrix

# Each pluggable backend (broker, vector store, graph store, KV store) run
# against a real server, one job per backend, so a red job names the backend
# that broke. These suites skip themselves when their service is missing, which
# is why the unit-test job can collect them without running them; here any skip
# fails the job instead. A real-service test must not skip for any other
# reason either: one that could not set up its scenario has tested nothing.
#
# GitHub-hosted runners and no secrets, so pull requests from forks run it too.
#
# The graph jobs find their tests rather than listing them. A real-graph test
# is any file under tests/integration that reads NEO4J_IT_URI or ARANGO_IT_URL
# (the env below) and gives its backend parameter the id "neo4j" or "arango";
# each job runs that backend's cases from every such file. New real-graph tests
# that follow the convention run here without editing this workflow.
#
# The storage job is the same idea for the file stores. A storage test is any
# file under tests/integration that reads ARTIFACTS_IT_STORAGE_URL; the job runs
# every one of them against the Node API's real storage routes (the same code
# the product serves, started by tests/support/storage-it-server.ts) on MongoDB
# and each of local disk, S3 (MinIO) and Azure Blob (Azurite). The S3 leg is
# virtual-hosted: MinIO answers <bucket>.s3.us-east-1.amazonaws.com over TLS
# with a throwaway CA, and both the storage service and the tests resolve
# *.amazonaws.com to it, because the S3 adapter reads stored records only through
# such URLs (ARTIFACTS_IT_S3_VHOST=1 tells the tests so). Nothing reaches AWS. A
# discovered file that contributes no test case (for example, one missing
# pytest.mark.integration) fails the job, as does any skip, except a reason that
# begins "not applicable on <store>:" on the leg running that store.
#
# A test that needs a graph store and storage together names both
# ARTIFACTS_IT_STORAGE_URL and NEO4J_IT_URI or ARANGO_IT_URL. The graph jobs leave
# such a file out (they have no storage service, so it could only skip there); the
# storage job runs it, and when it finds one starts Neo4j and ArangoDB beside the
# file store, on every leg. Both engines run on every leg because the file's
# backend parameter covers both and a backend that is not configured skips.

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'backend/python/app/services/messaging/**'
      - 'backend/python/app/services/vector_db/**'
      - 'backend/python/app/services/graph_db/**'
      - 'backend/python/app/services/redis/**'
      - 'backend/python/app/config/**'
      - 'backend/python/app/connectors/core/base/data_processor/**'
      - 'backend/python/app/connectors/core/base/data_store/**'
      - 'backend/python/app/modules/transformers/**'
      # Knowledge-base push: its real-graph tests (graph_db/test_kb_push_*) drive the push service itself.
      - 'backend/python/app/connectors/sources/localKB/**'
      - 'backend/python/app/services/storage_documents.py'
      - 'backend/python/app/modules/indexing/record_republish.py'
      # Entity search and named-entity linking: graph_db/test_permitted_entity_records_* reads through them.
      - 'backend/python/app/modules/retrieval/**'
      - 'backend/python/app/modules/named_entities/**'
      # Connectors whose real-graph tests drive the connector itself (graph_db/test_<name>_*).
      - 'backend/python/app/connectors/sources/linear/**'
      - 'backend/python/app/sources/client/linear/**'
      - 'backend/python/app/sources/external/linear/**'
      - 'backend/python/app/indexing_main.py'
      - 'backend/python/tests/integration/messaging/**'
      - 'backend/python/tests/integration/vector_db/**'
      - 'backend/python/tests/integration/kv/**'
      # Where real-graph tests live.
      - 'backend/python/tests/integration/*.py'
      - 'backend/python/tests/integration/graph_db/**'
      - 'backend/python/tests/integration/compose/**'
      # The storage job: the storage routes and what they load (found by tracing
      # what tests/support/storage-it-server.ts requires), the SDK versions that
      # sign their URLs, and the Python artifact code and what the storage tests import.
      - 'backend/nodejs/apps/src/modules/storage/**'
      - 'backend/nodejs/apps/src/libs/middlewares/**'
      - 'backend/nodejs/apps/src/libs/utils/**'
      - 'backend/nodejs/apps/src/libs/keyValueStore/**'
      - 'backend/nodejs/apps/src/libs/services/authtoken.service.ts'
      - 'backend/nodejs/apps/src/libs/services/keyValueStore.service.ts'
      - 'backend/nodejs/apps/src/libs/services/logger.service.ts'
      - 'backend/nodejs/apps/src/libs/services/mongo.service.ts'
      - 'backend/nodejs/apps/src/libs/repositories/**'
      - 'backend/nodejs/apps/src/libs/db/uow.ts'
      - 'backend/nodejs/apps/src/libs/errors/storage.errors.ts'
      - 'backend/nodejs/apps/src/libs/context/**'
      - 'backend/nodejs/apps/tests/support/**'
      # The storage fingerprint: its reference model, the integration test that replays the model, the table it adds and the checker.
      - 'backend/nodejs/apps/tests/storage/fingerprint-model/**'
      - 'backend/nodejs/apps/tests/stores/storage-fingerprint.itest.ts'
      - 'backend/nodejs/apps/package.json'
      - 'backend/nodejs/apps/package-lock.json'
      - 'backend/nodejs/apps/tsconfig.json'
      - 'backend/nodejs/apps/tsconfig.test.json'
      - 'backend/python/app/modules/artifacts/**'
      - 'backend/python/app/modules/record_metadata/**'
      - 'backend/python/app/models/**'
      - 'backend/python/app/services/cache/**'
      - 'backend/python/app/exceptions/storage_exceptions.py'
      - 'backend/python/app/utils/jwt.py'
      - 'backend/python/app/utils/storage_path.py'
      - 'backend/python/app/utils/storage_move.py'
      # The GitHub Teams connector end to end against a simulated GitHub
      # (tests/integration/github_teams): any change to the connector or its clients.
      - 'backend/python/tests/integration/github_teams/**'
      - 'backend/python/app/connectors/sources/github_teams/**'
      - 'backend/python/app/connectors/sources/github/**'
      - 'backend/python/app/sources/external/github/**'
      - 'backend/python/app/sources/client/github/**'
      # The GitLab connector end to end against a simulated GitLab
      # (tests/integration/gitlab_simulated): any change to the connector or its clients.
      - 'backend/python/tests/integration/gitlab_simulated/**'
      - 'backend/python/app/connectors/sources/gitlab/**'
      - 'backend/python/app/connectors/sources/gitlab_personal/**'
      - 'backend/python/app/sources/external/gitlab/**'
      - 'backend/python/app/sources/client/gitlab/**'
      - 'backend/python/app/modules/parsers/code_parser/**'
      - 'backend/python/app/connectors/core/base/sync_point/**'
      - 'backend/python/app/connectors/core/registry/filters.py'
      # Helpers outside tests/integration that the suites import.
      - 'backend/python/tests/conftest.py'
      - 'backend/python/tests/support/**'
      - 'backend/python/tests/unit/agents/adapter/conftest.py'
      - 'backend/python/tests/unit/agents/adapter/support/scripted_transport.py'
      - 'backend/python/tests/unit/connectors/sources/test_connector_workflow_integration.py'
      - 'backend/python/tests/unit/modules/entity_resolution/conftest.py'
      - 'backend/python/tests/unit/modules/indexing/test_entity_index_rebuild.py'
      - 'backend/python/tests/unit/modules/pipeline/fakes.py'
      - 'backend/python/tests/unit/modules/transformers/test_entity_vectorstore_delete.py'
      - 'backend/python/tests/unit/services/artifact_registry/fakes.py'
      - 'backend/python/tests/unit/services/vector_db/test_strategy_contract.py'
      - 'backend/python/tests/unit/web/qa/lab.py'
      - 'backend/python/pyproject.toml'
      - 'deployment/docker-compose/docker-compose.integration.messaging.yml'
      - 'deployment/docker-compose/docker-compose.integration.vector-db.yml'
      - 'deployment/docker-compose/docker-compose.integration.graph-db.yml'
      - 'deployment/docker-compose/docker-compose.integration.kv.yml'
      - 'scripts/pr_changes.py'
      - '.github/actions/pr-changes/**'
      - '.github/workflows/backend-matrix.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-matrix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which suites below this pull request's changes can affect
  # (scripts/pr_changes.py); every other event runs them all. The backend job's
  # matrix cannot be filtered, so a leg whose suite did not change starts and
  # skips every step (SUITE_RUNS) in a few seconds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix_messaging: ${{ steps.changes.outputs.matrix_messaging }}
      matrix_vector: ${{ steps.changes.outputs.matrix_vector }}
      matrix_kv: ${{ steps.changes.outputs.matrix_kv }}
      matrix_graph: ${{ steps.changes.outputs.matrix_graph }}
      matrix_gitlab: ${{ steps.changes.outputs.matrix_gitlab }}
      matrix_storage: ${{ steps.changes.outputs.matrix_storage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/actions
      - id: changes
        uses: ./.github/actions/pr-changes

  backend:
    name: ${{ matrix.suite }} · ${{ matrix.backend }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Redis too: stage consumers take their leases from Redis on either broker.
          - suite: messaging
            backend: kafka
            compose: docker-compose.integration.messaging.yml
            services: kafka-messaging-it redis-messaging-it
            tests: tests/integration/messaging
            select: kafka
          - suite: messaging
            backend: redis-streams
            compose: docker-compose.integration.messaging.yml
            services: redis-messaging-it
            tests: tests/integration/messaging
            select: redis
          - suite: vector
            backend: qdrant
            compose: docker-compose.integration.vector-db.yml
            services: qdrant-vector-it
            tests: tests/integration/vector_db tests/integration/test_multimodal_indexing.py
            select: qdrant
          - suite: vector
            backend: opensearch
            compose: docker-compose.integration.vector-db.yml
            services: opensearch-vector-it
            tests: tests/integration/vector_db tests/integration/test_multimodal_indexing.py
            select: opensearch
          - suite: vector
            backend: redis
            compose: docker-compose.integration.vector-db.yml
            services: redis-vector-it
            tests: tests/integration/vector_db tests/integration/test_multimodal_indexing.py
            select: redis
          # Redis too: the stranded-record sweep publishes onto a real stream.
          # Qdrant too: the trash's vector cleanup runs against a real collection.
          - suite: graph
            backend: neo4j
            compose: docker-compose.integration.graph-db.yml docker-compose.integration.messaging.yml docker-compose.integration.vector-db.yml
            services: neo4j-graph-it redis-messaging-it qdrant-vector-it
            discover: NEO4J_IT_URI|ARANGO_IT_URL
            select: neo4j
          - suite: graph
            backend: arangodb
            compose: docker-compose.integration.graph-db.yml docker-compose.integration.messaging.yml docker-compose.integration.vector-db.yml
            services: arango-graph-it redis-messaging-it qdrant-vector-it
            discover: NEO4J_IT_URI|ARANGO_IT_URL
            select: arango
          # A job of its own: inside the graph jobs it would take them past their timeout.
          - suite: gitlab
            backend: neo4j
            compose: docker-compose.integration.graph-db.yml
            services: neo4j-graph-it
            tests: tests/integration/gitlab_simulated
            select: neo4j
          - suite: gitlab
            backend: arangodb
            compose: docker-compose.integration.graph-db.yml
            services: arango-graph-it
            tests: tests/integration/gitlab_simulated
            select: arango
          - suite: kv
            backend: etcd
            compose: docker-compose.integration.kv.yml
            services: etcd-kv-it
            tests: tests/integration/kv
            select: etcd

    env:
      # 'true' when this pull request changes code this suite covers
      # (scripts/pr_changes.py); every other event runs every suite.
      SUITE_RUNS: ${{ needs.changes.outputs[format('matrix_{0}', matrix.suite)] }}
      COMPOSE: ${{ matrix.compose }}
      SERVICES: ${{ matrix.services }}
      TESTS: ${{ matrix.tests }}
      DISCOVER: ${{ matrix.discover }}
      SELECT: ${{ matrix.select }}
      REPORT: ${{ github.workspace }}/backend-matrix-results.xml
      # What the real-service tests read; these match their defaults and the
      # ports in the integration compose files.
      NEO4J_IT_URI: bolt://localhost:17687
      NEO4J_IT_PASSWORD: ensure-it-pass
      ARANGO_IT_URL: http://localhost:18529
      ARANGO_IT_PASSWORD: ensure-it-pass
      REDIS_IT_HOST: localhost
      REDIS_IT_PORT: '6389'
      QDRANT_IT_HOST: localhost
      QDRANT_IT_PORT: '6343'

    steps:
      - name: Checkout code
        if: env.SUITE_RUNS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        if: env.SUITE_RUNS == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install system dependencies
        if: env.SUITE_RUNS == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        if: env.SUITE_RUNS == 'true'
        run: pip install uv

      # The dependencies below, CUDA torch among them, can leave a hosted runner's
      # disk about 96% full: past OpenSearch's 95% flood stage, where the node
      # refuses to create any index. None of these jobs use Android or .NET.
      - name: Free disk space
        if: env.SUITE_RUNS == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Install dependencies
        if: env.SUITE_RUNS == 'true'
        working-directory: backend/python
        run: |
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[dev]"
          df -h /

      - name: Start ${{ matrix.backend }}
        if: env.SUITE_RUNS == 'true'
        working-directory: deployment/docker-compose
        run: |
          files=()
          for f in $COMPOSE; do files+=(-f "$f"); done
          # shellcheck disable=SC2086
          docker compose "${files[@]}" up -d --wait --wait-timeout 300 $SERVICES

      - name: Run ${{ matrix.suite }} tests on ${{ matrix.backend }}
        if: env.SUITE_RUNS == 'true'
        working-directory: backend/python
        run: |
          if [ -n "$DISCOVER" ]; then
            # Files that also need storage run in the storage job.
            TESTS=$(grep -rlE --include='*.py' "$DISCOVER" tests/integration | sort \
              | xargs -r grep -LE 'ARTIFACTS_IT_STORAGE_URL' | tr '\n' ' ')
            echo "Discovered: $TESTS"
          fi
          # shellcheck disable=SC2086
          pytest $TESTS -m integration -k "$SELECT" -v -rs --timeout=300 --junitxml="$REPORT"

      - name: Fail if anything skipped
        if: env.SUITE_RUNS == 'true'
        run: |
          python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(os.environ["REPORT"]).getroot()
          cases = list(root.iter("testcase"))
          tests = len(cases)
          # A strict xfail ran (a known gap, documented in its marker); junit files it as a skip.
          skipped = sum(1 for c in cases for s in c.findall("skipped") if s.get("type") != "pytest.xfail")
          if tests == 0 or skipped:
              print(
                  f"::error::{tests} collected, {skipped} skipped. Each skip "
                  "is a test that did not run against the backend: the "
                  "service was unreachable, or the test could not set up "
                  "what it checks. The reasons are in the test step above."
              )
              sys.exit(1)
          print(f"{tests} tests ran against a real backend, none skipped.")
          EOF

      - name: Dump service logs
        if: failure() && env.SUITE_RUNS == 'true'
        working-directory: deployment/docker-compose
        run: |
          files=()
          for f in $COMPOSE; do files+=(-f "$f"); done
          docker compose "${files[@]}" logs --no-color --timestamps

      - name: Tear down
        if: always() && env.SUITE_RUNS == 'true'
        working-directory: deployment/docker-compose
        run: |
          files=()
          for f in $COMPOSE; do files+=(-f "$f"); done
          docker compose "${files[@]}" down -v

  # The storage tests find their own files (see the header). Each leg runs the
  # same tests against one file store.
  storage:
    name: storage · ${{ matrix.backend }}
    needs: changes
    if: needs.changes.outputs.matrix_storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: local
            storage_type: local
            services: mongodb-storage-it
          - backend: s3
            storage_type: s3
            services: mongodb-storage-it minio-vhost-storage-it
          - backend: azure
            storage_type: azureBlob
            services: mongodb-storage-it azurite-storage-it

    env:
      SERVICES: ${{ matrix.services }}
      REPORT: ${{ github.workspace }}/storage-results.xml
      COMPOSE_FILE: ${{ github.workspace }}/backend/python/tests/integration/compose/storage.yml
      STORAGE_PORT: '13000'
      MONGO_STORAGE_IT_PORT: '19117'
      MINIO_VHOST_STORAGE_IT_PORT: '19143'
      # The graph stores, for the tests that need one beside storage (same as the
      # backend job above; they are started only when such a test is found).
      NEO4J_IT_URI: bolt://localhost:17687
      NEO4J_IT_PASSWORD: ensure-it-pass
      ARANGO_IT_URL: http://localhost:18529
      ARANGO_IT_PASSWORD: ensure-it-pass
      # Throwaway: the stores are on this runner's loopback interface.
      SCOPED_SECRET: storage-it-scoped-secret
      S3_KEY: storage-it
      S3_SECRET: storage-it-secret
      # Azurite's published development account.
      AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:19101/devstoreaccount1;

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/nodejs/apps/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Install uv
        run: pip install uv

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-asyncio pytest-timeout
          (cd backend/python && uv pip install --system -e ".[dev]")
          (cd backend/nodejs/apps && npm ci)
          df -h /

      # S3 only: a CA and a MinIO certificate for the *.s3.us-east-1.amazonaws.com
      # names, and the settings both sides need to send those names to MinIO.
      - name: Prepare the virtual-hosted S3 endpoint
        if: matrix.backend == 's3'
        run: |
          backend/python/tests/integration/compose/vhost-certs.sh "$RUNNER_TEMP/storage-it-certs"
          {
            echo "STORAGE_IT_CERTS=$RUNNER_TEMP/storage-it-certs"
            echo "STORAGE_IT_S3_VHOST=1"
            echo "ARTIFACTS_IT_S3_VHOST=1"
            echo "STORAGE_IT_S3_VHOST_ADDR=127.0.0.1:$MINIO_VHOST_STORAGE_IT_PORT"
            echo "S3_ENDPOINT=https://127.0.0.1:$MINIO_VHOST_STORAGE_IT_PORT"
            echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/storage-it-certs/ca.crt"
            echo "SSL_CERT_FILE=$RUNNER_TEMP/storage-it-certs/ca.crt"
          } >> "$GITHUB_ENV"

      # Every file that reads the storage URL. Those that also name a graph store
      # need Neo4j and ArangoDB running as well.
      - name: Find the storage tests
        id: discover
        working-directory: backend/python
        run: |
          TESTS=$(grep -rlE --include='*.py' 'ARTIFACTS_IT_STORAGE_URL' tests/integration | sort | tr '\n' ' ')
          echo "Discovered: $TESTS"
          echo "$TESTS" > "$RUNNER_TEMP/storage-discovered.txt"
          # shellcheck disable=SC2086
          if grep -lE 'NEO4J_IT_URI|ARANGO_IT_URL' $TESTS; then
            echo "graph=true" >> "$GITHUB_OUTPUT"
          else
            echo "graph=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start ${{ matrix.backend }} storage
        run: |
          # shellcheck disable=SC2086
          docker compose -f "$COMPOSE_FILE" --profile vhost up -d --wait --wait-timeout 300 $SERVICES

      - name: Start Neo4j and ArangoDB
        if: steps.discover.outputs.graph == 'true'
        working-directory: deployment/docker-compose
        run: docker compose -f docker-compose.integration.graph-db.yml up -d --wait --wait-timeout 300 neo4j-graph-it arango-graph-it

      - name: Start the storage service
        working-directory: backend/nodejs/apps
        env:
          STORAGE_TYPE: ${{ matrix.storage_type }}
          PORT: ${{ env.STORAGE_PORT }}
          MONGO_URL: mongodb://127.0.0.1:${{ env.MONGO_STORAGE_IT_PORT }}/storage_it
          TS_NODE_PROJECT: tsconfig.test.json
          # S3 sends *.amazonaws.com to MinIO; the other legs add nothing.
          NODE_OPTIONS: ${{ matrix.backend == 's3' && format('--require {0}/backend/nodejs/apps/tests/support/vhost-pin.js', github.workspace) || '' }}
        run: |
          setsid nohup npx ts-node --transpile-only tests/support/storage-it-server.ts > "$RUNNER_TEMP/storage-it-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/storage-it-server.pid"
          for _ in $(seq 1 90); do
            grep -q '^READY ' "$RUNNER_TEMP/storage-it-server.log" && exit 0
            kill -0 "$(cat "$RUNNER_TEMP/storage-it-server.pid")" 2>/dev/null || break
            sleep 2
          done
          cat "$RUNNER_TEMP/storage-it-server.log"
          echo "::error::the storage service did not start"
          exit 1

      - name: Run storage tests on ${{ matrix.backend }}
        working-directory: backend/python
        env:
          ARTIFACTS_IT_STORAGE_URL: http://127.0.0.1:${{ env.STORAGE_PORT }}
          ARTIFACTS_IT_SCOPED_SECRET: ${{ env.SCOPED_SECRET }}
          ARTIFACTS_IT_STORAGE_TYPE: ${{ matrix.storage_type }}
        run: |
          TESTS=$(cat "$RUNNER_TEMP/storage-discovered.txt")
          # shellcheck disable=SC2086
          pytest $TESTS -m integration -v -rs --timeout=300 --junitxml="$REPORT"

      # The storage fingerprint (writer windows, verified document read) against this leg's file store and MongoDB. The reference
      # model runs once per workflow run, on the local leg.
      - name: Fingerprint reference model
        if: always() && matrix.backend == 'local'
        working-directory: backend/nodejs/apps
        run: python3 tests/storage/fingerprint-model/model.py --ci

      - name: Fingerprint integration tests
        if: always()
        working-directory: backend/nodejs/apps
        env:
          STORAGE_TYPE: ${{ matrix.storage_type }}
          DOC_STORE: mongo
          MONGO_IT_URI: mongodb://127.0.0.1:${{ env.MONGO_STORAGE_IT_PORT }}
          TS_NODE_PROJECT: tsconfig.test.json
          NODE_OPTIONS: ${{ matrix.backend == 's3' && format('--require {0}/backend/nodejs/apps/tests/support/vhost-pin.js', github.workspace) || '' }}
        run: >-
          npx mocha --no-config --require reflect-metadata --require ts-node/register --extension ts --exit --timeout 180000
          --forbid-only --forbid-pending --reporter xunit --reporter-option output="$RUNNER_TEMP/fingerprint-${{ matrix.backend }}.xml"
          tests/stores/storage-fingerprint.itest.ts

      # The number of cases is whatever the file defines for this leg (some exist only for local disk, some only for S3 and Azure), counted
      # by a dry run of the same file with the same environment; the run must have executed exactly that many, none skipped or failed.
      - name: Fingerprint tests ran, none skipped
        if: always()
        working-directory: backend/nodejs/apps
        env:
          STORAGE_TYPE: ${{ matrix.storage_type }}
          DOC_STORE: mongo
          MONGO_IT_URI: mongodb://127.0.0.1:${{ env.MONGO_STORAGE_IT_PORT }}
          TS_NODE_PROJECT: tsconfig.test.json
        run: |
          npx mocha --no-config --require reflect-metadata --require ts-node/register --extension ts --dry-run --reporter json \
            --reporter-option output="$RUNNER_TEMP/fingerprint-defined.json" tests/stores/storage-fingerprint.itest.ts > /dev/null
          N=$(python3 -c "import json,os; print(json.load(open(os.environ['RUNNER_TEMP'] + '/fingerprint-defined.json'))['stats']['tests'])")
          echo "defined for ${{ matrix.backend }}: $N"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/assert_no_skips.py "$RUNNER_TEMP/fingerprint-${{ matrix.backend }}.xml" --expect-suite "document fingerprint=$N"

      # The mocha report is a file, so a red run would say only "exit code N"; this prints each failed case and its message.
      - name: Show the failed fingerprint cases
        if: failure()
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          path = os.path.join(os.environ["RUNNER_TEMP"], "fingerprint-${{ matrix.backend }}.xml")
          if not os.path.exists(path):
              sys.exit(0)
          for case in ET.parse(path).getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  print("FAILED:", case.get("name"))
                  print((bad.get("message") or "")[:600])
                  print((bad.text or "")[:1500])
          PY

      # Every skip fails, and so does a discovered file that contributed no test.
      # The one allowance: a test that cannot apply to this store says so with a
      # reason beginning "not applicable on <store>:", counted only on that leg.
      - name: Fail if anything skipped
        working-directory: backend/python
        env:
          DISCOVERED: ${{ runner.temp }}/storage-discovered.txt
          STORAGE_TYPE: ${{ matrix.storage_type }}
        run: python tests/integration/compose/check_storage_junit.py

      - name: Dump service logs
        if: failure()
        run: |
          echo "::group::storage service"
          cat "$RUNNER_TEMP/storage-it-server.log" || true
          echo "::endgroup::"
          docker compose -f "$COMPOSE_FILE" --profile vhost logs --no-color --timestamps
          (cd deployment/docker-compose && docker compose -f docker-compose.integration.graph-db.yml logs --no-color --timestamps)

      - name: Tear down
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/storage-it-server.pid" ]; then
            # setsid made the service its own process group; npx has a node child.
            kill -- "-$(cat "$RUNNER_TEMP/storage-it-server.pid")" 2>/dev/null || true
          fi
          docker compose -f "$COMPOSE_FILE" --profile vhost down -v
          (cd deployment/docker-compose && docker compose -f docker-compose.integration.graph-db.yml down -v)
