name: Dependency Review

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability. Only changes the PR adds or bumps are judged, so
# vulnerabilities already on main never fail an unrelated PR. Runtime,
# development and unknown-scope dependencies are all checked (the action's
# default is runtime only).
on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to post the summary comment on failure. Pull requests from
      # forks get a read-only token, so the comment is skipped there while the
      # check still fails.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: on-failure
