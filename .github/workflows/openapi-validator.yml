name: OpenAPI Spec Validation

# Two independent jobs, so a lint failure never hides the breaking-change result.
# The breaking-change base is the main this pull request's merge commit was built on (HEAD^1),
# so the diff holds only this pull request's changes.

on:
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

env:
  SPEC: backend/nodejs/apps/src/modules/api-docs/pipeshub-openapi.yaml

jobs:
  lint:
    name: Lint the spec with Spectral
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6.17.0

      - name: Lint OpenAPI spec with Spectral
        run: spectral lint "$SPEC" --ruleset .spectral.yaml --fail-severity error

  breaking:
    name: Detect breaking changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Depth 2 brings the merge commit's first parent, the base for the comparison.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Write the base spec
        run: git show "HEAD^1:$SPEC" > base-openapi.yaml

      - name: Detect breaking changes with oasdiff
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0.1.17
        with:
          base: base-openapi.yaml
          revision: ${{ env.SPEC }}
          fail-on: ERR

      - name: Set up Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # oasdiff ignores extensions, so it cannot see an operation leave the SDK.
      - name: Check no operation leaves the SDK
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet pyyaml
          python3 - base-openapi.yaml "$SPEC" <<'EOF'
          import sys
          import yaml

          def sdk_operations(path):
              with open(path) as f:
                  spec = yaml.load(f, Loader=getattr(yaml, "CSafeLoader", yaml.SafeLoader))
              return {
                  (method.upper(), route)
                  for route, item in (spec.get("paths") or {}).items()
                  for method, op in item.items()
                  if isinstance(op, dict) and op.get("x-pipeshub-sdk") is True
              }

          removed = sorted(sdk_operations(sys.argv[1]) - sdk_operations(sys.argv[2]))
          for method, route in removed:
              print(f"::error::{method} {route} is no longer in the SDK: the operation or its x-pipeshub-sdk flag was removed.")
          if removed:
              sys.exit(1)
          print("No operation left the SDK.")
          EOF
