name: PR Desktop Build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Heavy: on a pull request its jobs run only with the ci:full or ci:e2e label (CONTRIBUTING.md).
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/electron-*.yml'
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress build when the PR gets new commits.
concurrency:
  group: electron-pr-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, (contains(fromJSON('["ci:full","ci:e2e"]'), github.event.label.name) || (github.event.action != 'labeled' && github.event.action != 'unlabeled' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:e2e')))) && 'heavy' || format('other-{0}', github.run_id)) || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && contains(fromJSON('["ci:full","ci:e2e"]'), github.event.label.name)) ||
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:e2e')) &&
       (github.event.action != 'unlabeled' || contains(fromJSON('["ci:full","ci:e2e"]'), github.event.label.name)))
    uses: ./.github/workflows/electron-build-reusable.yml
    with:
      targets: '["linux"]'

  # The check branch protection requires for this workflow, not its label-gated jobs: an unrelated label
  # starts a run whose heavy jobs skip, and this reports the latest earlier result instead (CONTRIBUTING.md).
  electron-pr-build-result:
    name: electron-pr-build-result
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 365
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/actions
      - uses: ./.github/actions/heavy-result
        with:
          heavy: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && contains(fromJSON('["ci:full","ci:e2e"]'), github.event.label.name)) || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:e2e')) && (github.event.action != 'unlabeled' || contains(fromJSON('["ci:full","ci:e2e"]'), github.event.label.name))) }}
          needs: ${{ toJSON(needs) }}
          job: electron-pr-build-result
          wait-minutes: 360
