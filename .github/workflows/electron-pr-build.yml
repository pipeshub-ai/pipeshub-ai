name: PR Desktop Build

on:
  pull_request:
    types: [labeled]
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/electron-*.yml'

permissions:
  contents: read

# Cancel an in-progress build when the PR gets new commits.
concurrency:
  group: electron-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-checks'
    uses: ./.github/workflows/electron-build-reusable.yml
    with:
      targets: '["linux"]'
