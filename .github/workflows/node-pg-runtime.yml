name: node-pg-runtime

# Integration tests of the Node PostgreSQL runtime against real PostgreSQL 17 and 18 and PgBouncer, and the generated-types drift check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Heavy: on a pull request its jobs run only with the ci:full or ci:db label (CONTRIBUTING.md).
    branches:
      - 'main'
    paths:
      - 'backend/nodejs/apps/src/libs/db/**'
      - 'backend/nodejs/apps/tests/libs/db/**'
      - 'backend/nodejs/apps/package.json'
      - 'backend/db/**'
      - '.github/workflows/node-pg-runtime.yml'
  schedule:
    - cron: '10 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-pg-runtime-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, (contains(fromJSON('["ci:full","ci:db"]'), github.event.label.name) || (github.event.action != 'labeled' && github.event.action != 'unlabeled' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:db')))) && 'heavy' || format('other-{0}', github.run_id)) || format('{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: true

jobs:
  pg-runtime:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && contains(fromJSON('["ci:full","ci:db"]'), github.event.label.name)) ||
      (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:db')) &&
       (github.event.action != 'unlabeled' || contains(fromJSON('["ci:full","ci:db"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/nodejs/apps/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL 17 and 18, PgBouncer and the migration tool
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-18 postgresql-17-pgvector postgresql-18-pgvector pgbouncer
          python -m venv "$RUNNER_TEMP/migrate-venv"
          "$RUNNER_TEMP/migrate-venv/bin/pip" install --require-hashes --no-deps -r backend/db/requirements.lock

      - name: Install dependencies
        working-directory: backend/nodejs/apps
        run: npm ci --ignore-scripts

      - name: Integration tests (includes the generated-types drift check)
        working-directory: backend/nodejs/apps
        env:
          PG_TEST_BINS: /usr/lib/postgresql/17/bin,/usr/lib/postgresql/18/bin
          PG_TEST_PGBOUNCER: /usr/sbin/pgbouncer
          PG_TEST_MIGRATE_PYTHON: ${{ runner.temp }}/migrate-venv/bin/python
          PG_TEST_WORK: ${{ runner.temp }}
        run: npm run test:pg

  # The check branch protection requires for this workflow, not its label-gated jobs: an unrelated label
  # starts a run whose heavy jobs skip, and this reports the latest earlier result instead (CONTRIBUTING.md).
  node-pg-runtime-result:
    name: node-pg-runtime-result
    needs: [pg-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 365
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/actions
      - uses: ./.github/actions/heavy-result
        with:
          heavy: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && contains(fromJSON('["ci:full","ci:db"]'), github.event.label.name)) || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || contains(github.event.pull_request.labels.*.name, 'ci:db')) && (github.event.action != 'unlabeled' || contains(fromJSON('["ci:full","ci:db"]'), github.event.label.name))) }}
          needs: ${{ toJSON(needs) }}
          job: node-pg-runtime-result
          wait-minutes: 360
