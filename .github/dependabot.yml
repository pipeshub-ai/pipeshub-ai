# Weekly version updates, one grouped PR per ecosystem for minor and patch bumps.
# Security updates are separate: Dependabot raises those as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/nodejs/apps
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      node-api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend/python
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /integration-tests
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      integration-tests-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /backend/nodejs/apps, /backend/python, /deployment/sandbox]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      base-images:
        update-types: [minor, patch]
