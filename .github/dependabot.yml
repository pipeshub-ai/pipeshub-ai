# Monthly version updates, one grouped PR per ecosystem for minor and patch bumps. Every
# change to this file also starts a run, so batch edits to it.
# Security updates are separate: Dependabot raises those as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/nodejs/apps
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      node-api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # bullmq 5 pins ioredis 5.11.1, so ioredis 6 installs a second copy whose types the queue
      # code cannot pass to bullmq. bullmq 6 takes ioredis as a peer but drops repeatable jobs.
      - dependency-name: "ioredis"
        versions: [">=6"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 16.4 enables react-hooks rules (use-memo, immutability, purity) that fail next build in
      # 14 places, each a change to component behaviour rather than a lint fix.
      - dependency-name: "eslint-config-next"
        versions: [">=16.4"]
      # i18next and typescript-eslint require TypeScript 5, and next 15 type-checks through the
      # JavaScript compiler API that TypeScript 7 no longer ships.
      - dependency-name: "typescript"
        versions: [">=7"]
      # react-pdf-highlighter 7 brings its own pdfjs-dist 4. The worker this app loads has to
      # be the same release as that copy, so pdfjs-dist moves when the highlighter does.
      - dependency-name: "pdfjs-dist"
        versions: [">=5"]

  - package-ecosystem: pip
    directory: /backend/python
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # Upper bounds in pyproject.toml are deliberate; Dependabot would raise them. Dependabot edits
    # pyproject.toml only: the hashed locks in requirements/ are regenerated with
    # `python3 scripts/supply_chain.py lock` (docs/agent-harness-v2/guides/SUPPLY-CHAIN.md), so its
    # pull requests fail PY-LOCK-STALE until someone does. Ignores are version ranges.
    ignore:
      # 1.13 stopped setting request.options, so msgraph-core's 429/503 retry stopped running.
      - dependency-name: "microsoft-kiota-http"
        versions: [">=1.13"]
      - dependency-name: "Pillow"
        versions: [">=14"]
      - dependency-name: "reportlab"
        versions: [">=5"]
      - dependency-name: "fpdf2"
        versions: [">=3"]
      - dependency-name: "mariadb"
        versions: [">=3"]
      # Held until the code moves with it. 0.137 nests included routers, which changes the
      # matched route path used as the request-metrics label.
      - dependency-name: "fastapi"
        versions: [">=0.137"]
      # 12.20+ change download and listing response shapes the Azure Files source reads.
      - dependency-name: "azure-storage-file-share"
        versions: [">=12.20"]
      # 2.9+ change compare_commits, which the GitHub source calls.
      - dependency-name: "PyGithub"
        versions: [">=2.9"]
      # 1.1.1+ need langchain-core<1.2.5 (we pin 1.7.0); 1.2+ also double-count cached Bedrock tokens.
      - dependency-name: "langchain-aws"
        versions: [">=1.1.1"]
      # 1.6+ move ChatAnthropic's HTTP clients, so the model egress guard is not installed.
      - dependency-name: "langchain-anthropic"
        versions: [">=1.6"]
      # 4.4+ need google-cloud-storage 3, which conflicts with langchain-google-vertexai on 3.13+.
      - dependency-name: "langchain-google-genai"
        versions: [">=4.4"]

  # The backend's packages come in through the ai-service path dependency, so this entry only
  # moves the suites' own packages and the lock; backend/python above moves the rest.
  - package-ecosystem: uv
    directory: /integration-tests
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      integration-tests-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # Base images pinned by digest (SEC-SC-11) move with their tag: Dependabot updates both.
  - package-ecosystem: docker
    directories: [/, /backend/nodejs/apps, /backend/python, /deployment/sandbox, /deployment/docker-compose/hot-reload, /deployment/e2e]
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # python:3.12 is a two-part tag, so 3.12 -> 3.13 reads as a minor; the runtime moves on purpose only.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Images run Node 24 LTS (22 is the minimum). Odd majors never become LTS, and
      # the next LTS line is adopted on purpose, not by a weekly bump.
      - dependency-name: "node"
        versions: [">=25"]

  # The services install.sh and Compose run, and the test stacks' services, are pinned as tag@digest (C6.44, lead
  # decision 2026-11-11): a rebuilt tag reaches users as a reviewed digest bump, never silently. A database or
  # broker changes minor or major version on purpose only, with its upgrade path, so only patches and digests move.
  - package-ecosystem: docker-compose
    directories: [/deployment/**, /integration-tests/**, /backend/python/tests/integration/**]
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      compose-images:
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
