# Weekly version updates, one grouped PR per ecosystem for minor and patch bumps.
# Security updates are separate: Dependabot raises those as soon as an alert opens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend/nodejs/apps
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      node-api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # bullmq 5 pins ioredis 5.11.1, so ioredis 6 installs a second copy whose types the queue
      # code cannot pass to bullmq. bullmq 6 takes ioredis as a peer but drops repeatable jobs.
      - dependency-name: "ioredis"
        versions: [">=6"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 16.4 enables react-hooks rules (use-memo, immutability, purity) that fail next build in
      # 14 places, each a change to component behaviour rather than a lint fix.
      - dependency-name: "eslint-config-next"
        versions: [">=16.4"]
      # i18next and typescript-eslint require TypeScript 5, and next 15 type-checks through the
      # JavaScript compiler API that TypeScript 7 no longer ships.
      - dependency-name: "typescript"
        versions: [">=7"]
      # react-pdf-highlighter 7 brings its own pdfjs-dist 4. The worker this app loads has to
      # be the same release as that copy, so pdfjs-dist moves when the highlighter does.
      - dependency-name: "pdfjs-dist"
        versions: [">=5"]

  - package-ecosystem: pip
    directory: /backend/python
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # Upper bounds in pyproject.toml are deliberate; Dependabot would raise them. There is no
    # lockfile here, so ignores are version ranges: update-types needs a current version.
    ignore:
      # 1.13 stopped setting request.options, so msgraph-core's 429/503 retry stopped running.
      - dependency-name: "microsoft-kiota-http"
        versions: [">=1.13"]
      - dependency-name: "Pillow"
        versions: [">=14"]
      - dependency-name: "reportlab"
        versions: [">=5"]
      - dependency-name: "fpdf2"
        versions: [">=3"]
      - dependency-name: "mariadb"
        versions: [">=3"]
      # Held until the code moves with it. 0.137 nests included routers, which changes the
      # matched route path used as the request-metrics label.
      - dependency-name: "fastapi"
        versions: [">=0.137"]
      # 12.20+ change download and listing response shapes the Azure Files source reads.
      - dependency-name: "azure-storage-file-share"
        versions: [">=12.20"]
      # 2.9+ change compare_commits, which the GitHub source calls.
      - dependency-name: "PyGithub"
        versions: [">=2.9"]
      # 1.2+ count cached tokens inside input tokens, so Bedrock usage would be counted twice.
      - dependency-name: "langchain-aws"
        versions: [">=1.2"]
      # 1.6+ move ChatAnthropic's HTTP clients, so the model egress guard is not installed.
      - dependency-name: "langchain-anthropic"
        versions: [">=1.6"]
      # 4.4+ need google-cloud-storage 3, which conflicts with langchain-google-vertexai on 3.13+.
      - dependency-name: "langchain-google-genai"
        versions: [">=4.4"]

  # The backend's packages come in through the ai-service path dependency, so this entry only
  # moves the suites' own packages and the lock; backend/python above moves the rest.
  - package-ecosystem: uv
    directory: /integration-tests
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      integration-tests-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /backend/nodejs/apps, /backend/python, /deployment/sandbox]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # python:3.12 is a two-part tag, so 3.12 -> 3.13 reads as a minor; the runtime moves on purpose only.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
