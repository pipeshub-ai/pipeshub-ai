# Scrape jobs for the Compose `postgres-metrics` exporters, read through scrape_config_files in prometheus.yml when
# docker-compose.monitoring-postgres.yml mounts this file. The exporters need no credential: they listen on the
# compose network and on the address PG_METRICS_BIND publishes.
scrape_configs:
  - job_name: postgres-exporter
    scrape_timeout: 15s   # above the exporter's PG_EXPORTER_COLLECTION_TIMEOUT (10s)
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: pgbouncer-exporter
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
  # The pg-backup service of docker-compose.postgres-backup.yml (PG_BACKUP_METRICS_PORT); its absence is PgBackupMetricsMissing.
  - job_name: pg-backup
    static_configs:
      - targets: ["pg-backup:9188"]
