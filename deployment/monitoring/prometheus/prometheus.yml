# The agent harness's own Prometheus (C9.04, C9.05), started only by docker-compose.monitoring.yml.
#
# One job reads Node's merged route on its unpublished internal listener (AGENT_HARNESS_INTERNAL_PORT, 3002): the
# egress proxy, the Model and Tool Gateways and the sandbox broker, Node's own harness families, and the run store's
# state, every sample labelled harness_service, no org-labelled series. It takes the worker credential, which Node
# writes to HARNESS_METRICS_CREDENTIAL_FILE (re-read on every scrape, so a rotation needs no restart).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: pipeshub-agent-harness
    metrics_path: /api/v1/agent-harness/internal/metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/pxh-monitoring/worker-credential
    static_configs:
      - targets: ["pipeshub-ai:3002"]
