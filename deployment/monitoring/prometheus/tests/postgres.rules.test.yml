# promtool test rules: each key alert fires on a synthetic series and stays quiet on a healthy one
# (deployment/docker-compose/tests/postgres_alert_rules_test.sh runs it).
rule_files:
  - ../postgres.rules.yml
evaluation_interval: 1m

tests:
  - name: server and exporter down
    interval: 1m
    input_series:
      - series: 'pg_up{instance="pe:9187", job="postgres-exporter"}'
        values: '1 1 0x5'
      - series: 'up{instance="pe:9187", job="postgres-exporter"}'
        values: '1 0x9'
      - series: 'up{instance="pipeshub-ai:3002", job="pipeshub-agent-harness"}'
        values: '0x9'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "pe:9187", job: postgres-exporter}
            exp_annotations:
              summary: "PostgreSQL is unreachable"
              description: "The exporter on pe:9187 cannot connect to PostgreSQL: the server is down, refusing connections, or the monitoring login (pipeshub_monitor) is missing or has the wrong password."
      - eval_time: 1m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 7m
        alertname: PostgresExporterDown
        exp_alerts:
          - exp_labels: {severity: critical, instance: "pe:9187", job: postgres-exporter}
            exp_annotations:
              summary: "A PostgreSQL or PgBouncer exporter cannot be scraped"
              description: "postgres-exporter on pe:9187 has not answered a scrape for 5 minutes, so no other PostgreSQL alert can fire for it. Check that the exporter container is running."
      - eval_time: 4m
        alertname: PostgresExporterDown
        exp_alerts: []

  - name: connections near max_connections
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{instance="a", job="postgres-exporter", backend_type="client backend", datname="pipeshub", state="active"}'
        values: '50x5 85x10'
      - series: 'pg_stat_activity_count{instance="a", job="postgres-exporter", backend_type="autovacuum worker", datname="pipeshub", state="active"}'
        values: '40x15'
      - series: 'pg_settings_max_connections{instance="a", job="postgres-exporter"}'
        values: '100x15'
      - series: 'pg_settings_superuser_reserved_connections{instance="a", job="postgres-exporter"}'
        values: '3x15'
      - series: 'pg_settings_reserved_connections{instance="a", job="postgres-exporter"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: PostgresConnectionsNearMax
        exp_alerts: []
      - eval_time: 12m
        alertname: PostgresConnectionsNearMax
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter}
            exp_annotations:
              summary: "PostgreSQL uses more than 80% of its connections"
              description: "87.63% of the connections max_connections allows are in use on a. New logins are refused once it is full; look for a client that bypasses PgBouncer."
      - eval_time: 12m
        alertname: PostgresConnectionsExhausted
        exp_alerts: []

  - name: pgbouncer clients wait
    interval: 1m
    input_series:
      - series: 'pgbouncer_pools_client_maxwait_seconds{instance="b", job="pgbouncer-exporter", database="pipeshub", user="pipeshub_query_login"}'
        values: '0x3 3x6'
      - series: 'pgbouncer_pools_client_maxwait_seconds{instance="b", job="pgbouncer-exporter", database="pgbouncer", user="pgbouncer"}'
        values: '30x9'
    alert_rule_test:
      - eval_time: 3m
        alertname: PgBouncerClientsWaiting
        exp_alerts: []
      - eval_time: 8m
        alertname: PgBouncerClientsWaiting
        exp_alerts:
          - exp_labels: {severity: warning, instance: b, job: pgbouncer-exporter, database: pipeshub}
            exp_annotations:
              summary: "Clients wait for a PostgreSQL connection in PgBouncer"
              description: "The oldest client waiting for a server connection to pipeshub has waited 3 s. Past query_wait_timeout PgBouncer drops it and the request fails: a pool is too small or held by slow transactions."

  - name: wal archiving fails
    interval: 1m
    input_series:
      - series: 'pg_stat_archiver_failed_count{instance="a", job="postgres-exporter"}'
        values: '10x30 10+1x40'
      - series: 'pg_stat_archiver_last_archive_age{instance="a", job="postgres-exporter"}'
        values: '30x30 1800+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresWalArchiveFailing
        exp_alerts: []
      - eval_time: 55m
        alertname: PostgresWalArchiveFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter}
            exp_annotations:
              summary: "PostgreSQL cannot archive WAL"
              description: "WAL archiving failed 10 times in the last 10 minutes on a and has been failing for 10 minutes. Unarchived WAL stays in pg_wal and point-in-time restore stops at the last archived segment. Read the server log for archive-push errors (repository unreachable or full)."
      - eval_time: 55m
        alertname: PostgresWalArchiveStalled
        exp_alerts: []
      - eval_time: 65m
        alertname: PostgresWalArchiveStalled
        exp_alerts:
          - exp_labels: {severity: critical, instance: a, job: postgres-exporter}
            exp_annotations:
              summary: "No WAL segment was archived for an hour, and archiving is failing"
              description: "The last successful WAL archive on a was 1h 4m 0s ago. A restore now loses everything after it."

  - name: pg_wal piles up
    interval: 1m
    input_series:
      - series: 'pg_wal_size_bytes{instance="a", job="postgres-exporter"}'
        values: '1e9x20 3e9x20'
      - series: 'pg_settings_max_wal_size_bytes{instance="a", job="postgres-exporter"}'
        values: '1073741824x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresWalPilingUp
        exp_alerts: []
      - eval_time: 38m
        alertname: PostgresWalPilingUp
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter}
            exp_annotations:
              summary: "pg_wal keeps growing"
              description: "pg_wal on a holds 2.794GiB, more than twice max_wal_size. It is kept for archiving or a replication slot, and fills the data volume if nothing releases it."

  - name: transaction id wraparound
    interval: 1m
    input_series:
      - series: 'pg_database_wraparound_age_datfrozenxid_seconds{instance="a", job="postgres-exporter", datname="pipeshub"}'
        values: '1.2e9x30'
      - series: 'pg_database_wraparound_age_datminmxid_seconds{instance="a", job="postgres-exporter", datname="pipeshub"}'
        values: '0x30'
      - series: 'pg_database_wraparound_age_datfrozenxid_seconds{instance="a", job="postgres-exporter", datname="postgres"}'
        values: '2e8x30'
      - series: 'pg_database_wraparound_age_datminmxid_seconds{instance="a", job="postgres-exporter", datname="postgres"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresTxidWraparoundNear
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter, datname: pipeshub}
            exp_annotations:
              summary: "A database is halfway to transaction ID wraparound"
              description: "pipeshub on a has 1.2G transactions (or multixacts) since its oldest unfrozen one. Find what blocks autovacuum (long transactions, idle-in-transaction sessions, abandoned replication slots) and VACUUM the oldest tables."
      - eval_time: 20m
        alertname: PostgresTxidWraparoundImminent
        exp_alerts: []

  - name: idle in transaction
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_max_tx_duration{instance="a", job="postgres-exporter", datname="pipeshub", usename="pipeshub_migrate", state="idle in transaction", application_name="", backend_type="client backend", wait_event="", wait_event_type=""}'
        values: '600x5'
      - series: 'pg_stat_activity_max_tx_duration{instance="a", job="postgres-exporter", datname="pipeshub", usename="pipeshub_jobs", state="active", application_name="", backend_type="client backend", wait_event="", wait_event_type=""}'
        values: '600x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgresIdleInTransaction
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter, datname: pipeshub, usename: pipeshub_migrate}
            exp_annotations:
              summary: "A session sits idle inside a transaction"
              description: "pipeshub_migrate on pipeshub is idle inside a transaction that has been open for 10m 0s. It keeps its locks and holds back vacuum: a client forgot to commit."

  - name: autovacuum behind
    interval: 5m
    input_series:
      - series: 'pg_stat_user_tables_n_dead_tup{instance="a", job="postgres-exporter", datname="pipeshub", schemaname="public", relname="bloated"}'
        values: '500000x20'
      - series: 'pg_stat_user_tables_n_live_tup{instance="a", job="postgres-exporter", datname="pipeshub", schemaname="public", relname="bloated"}'
        values: '500000x20'
      - series: 'pg_stat_user_tables_n_dead_tup{instance="a", job="postgres-exporter", datname="pipeshub", schemaname="public", relname="busy"}'
        values: '500000x20'
      - series: 'pg_stat_user_tables_n_live_tup{instance="a", job="postgres-exporter", datname="pipeshub", schemaname="public", relname="busy"}'
        values: '9500000x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresDeadTuplesHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: PostgresDeadTuplesHigh
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter, datname: pipeshub, schemaname: public, relname: bloated}
            exp_annotations:
              summary: "Autovacuum is not keeping up with a table"
              description: "public.bloated has 500k dead rows, over 30% of the table, for an hour. Check for long transactions holding them back and the table's last_autovacuum."

  - name: search deltas not folded
    interval: 5m
    input_series:
      - series: 'pg_stat_user_tables_n_live_tup{instance="a", job="postgres-exporter", datname="pipeshub", schemaname="retrieval", relname="lexical_term_delta"}'
        values: '2000x5 70000000x10'
      - series: 'pg_stat_user_tables_n_live_tup{instance="a", job="postgres-exporter", datname="pipeshub", schemaname="public", relname="lexical_term_delta"}'
        values: '70000000x15'
    alert_rule_test:
      - eval_time: 45m
        alertname: PostgresSearchFoldBehind
        exp_alerts: []
      - eval_time: 65m
        alertname: PostgresSearchFoldBehind
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter, datname: pipeshub, schemaname: retrieval, relname: lexical_term_delta}
            exp_annotations:
              summary: "Search term-frequency deltas are not being folded"
              description: "retrieval.lexical_term_delta holds 70M unfolded rows for 30 minutes, and every word search reads them. Check that the fold worker (db.maintain fold --watch) is running and that its log shows passes."

  - name: database growth
    interval: 5m
    input_series:
      - series: 'pg_database_size_bytes{instance="a", job="postgres-exporter", datname="pipeshub"}'
        values: '2e9x300 4e9x30'
      - series: 'pg_database_size_bytes{instance="a", job="postgres-exporter", datname="postgres"}'
        values: '8e6x300 4e8x30'
    alert_rule_test:
      - eval_time: 23h
        alertname: PostgresDatabaseGrowingFast
        exp_alerts: []
      - eval_time: 26h
        alertname: PostgresDatabaseGrowingFast
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: postgres-exporter, datname: pipeshub}
            exp_annotations:
              summary: "A database grew by more than half in a day"
              description: "pipeshub on a is 3.725GiB and grew over 50% in 24 hours. Check the free space of the data volume."

  - name: backup too old
    interval: 1m
    input_series:
      # promtool's clock starts at 0: at 10m a stop time of 600 - k * schedule is k schedules old
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="pg-backup:9188", job="pg-backup", type="full"}'
        values: '604800x10'
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="pg-backup:9188", job="pg-backup", type="incr"}'
        values: '21600x10'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="pg-backup:9188", job="pg-backup", stanza="pipeshub", repo="1", type="full"}'
        values: '-967080x10'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="pg-backup:9188", job="pg-backup", stanza="pipeshub", repo="1", type="incr"}'
        values: '0x10'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="pg-backup:9188", job="pg-backup", stanza="pipeshub", repo="2", type="full"}'
        values: '-2116200x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PgBackupTooOld
        exp_alerts:
          - exp_labels: {severity: warning, schedule: full, instance: "pg-backup:9188", job: pg-backup, stanza: pipeshub, repo: "1", type: full}
            exp_annotations:
              summary: "The newest full backup is older than its schedule allows"
              description: "The newest full backup of pipeshub in repository 1 is 1.6 times PG_BACKUP_FULL_DAYS old. Read the pg-backup service's log; a restore must replay more WAL the older it is."
          - exp_labels: {severity: warning, schedule: full, instance: "pg-backup:9188", job: pg-backup, stanza: pipeshub, repo: "2", type: full}
            exp_annotations:
              summary: "The newest full backup is older than its schedule allows"
              description: "The newest full backup of pipeshub in repository 2 is 3.5 times PG_BACKUP_FULL_DAYS old. Read the pg-backup service's log; a restore must replay more WAL the older it is."
          - exp_labels: {severity: critical, schedule: full, instance: "pg-backup:9188", job: pg-backup, stanza: pipeshub, repo: "2", type: full}
            exp_annotations:
              summary: "No full backup for three times its schedule"
              description: "The newest full backup of pipeshub in repository 2 is 3.5 times PG_BACKUP_FULL_DAYS old. Backups have stopped."
          - exp_labels: {severity: warning, schedule: any, instance: "pg-backup:9188", job: pg-backup, stanza: pipeshub, repo: "2"}
            exp_annotations:
              summary: "The newest backup is older than its schedule allows"
              description: "The newest backup of any type of pipeshub in repository 2 is 98 times PG_BACKUP_INCR_HOURS old. Read the pg-backup service's log."
          - exp_labels: {severity: critical, schedule: any, instance: "pg-backup:9188", job: pg-backup, stanza: pipeshub, repo: "2"}
            exp_annotations:
              summary: "No backup for three times its schedule"
              description: "The newest backup of any type of pipeshub in repository 2 is 98 times PG_BACKUP_INCR_HOURS old. Backups have stopped."

  - name: backups on schedule
    interval: 1m
    input_series:
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="pg-backup:9188", job="pg-backup", type="full"}'
        values: '604800x10'
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="pg-backup:9188", job="pg-backup", type="incr"}'
        values: '21600x10'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="pg-backup:9188", job="pg-backup", stanza="pipeshub", repo="1", type="full"}'
        values: '-86400x10'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="pg-backup:9188", job="pg-backup", stanza="pipeshub", repo="1", type="incr"}'
        values: '-3600x10'
      - series: 'pipeshub_pg_backup_last_attempt_success{instance="pg-backup:9188", job="pg-backup"}'
        values: '1x10'
      - series: 'pipeshub_pg_backup_wal_gap_segments{instance="pg-backup:9188", job="pg-backup"}'
        values: '0x10'
      - series: 'up{instance="pg-backup:9188", job="pg-backup"}'
        values: '1x10'
    alert_rule_test:
      - {eval_time: 10m, alertname: PgBackupTooOld, exp_alerts: []}
      - {eval_time: 10m, alertname: PgBackupFailing, exp_alerts: []}
      - {eval_time: 10m, alertname: PgBackupWalGap, exp_alerts: []}
      - {eval_time: 10m, alertname: PgBackupMetricsMissing, exp_alerts: []}

  - name: backups failing, wal dropped, metrics missing
    interval: 1m
    input_series:
      - series: 'pipeshub_pg_backup_last_attempt_success{instance="pg-backup:9188", job="pg-backup"}'
        values: '1 0x20'
      - series: 'pipeshub_pg_backup_wal_gap_segments{instance="pg-backup:9188", job="pg-backup"}'
        values: '0 2x20'
      - series: 'up{instance="pg-backup:9188", job="pg-backup"}'
        values: '1 0x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: PgBackupFailing, exp_alerts: []}
      - eval_time: 17m
        alertname: PgBackupFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: "pg-backup:9188", job: pg-backup}
            exp_annotations:
              summary: "Backups are failing"
              description: "The last backup attempt on pg-backup:9188 failed and none has succeeded for 15 minutes. Read the pg-backup service's log for pgBackRest's error (repository unreachable or full, or the server down)."
      - eval_time: 2m
        alertname: PgBackupWalGap
        exp_alerts:
          - exp_labels: {severity: critical, instance: "pg-backup:9188", job: pg-backup}
            exp_annotations:
              summary: "The server dropped WAL that no backup covers"
              description: "2 WAL segments were dropped because the archive queue exceeded PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX. Point-in-time restore cannot cross the gap until the full backup pg-backup has started succeeds."
      - {eval_time: 10m, alertname: PgBackupMetricsMissing, exp_alerts: []}
      - eval_time: 17m
        alertname: PgBackupMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, instance: "pg-backup:9188", job: pg-backup}
            exp_annotations:
              summary: "The backup service's metrics cannot be scraped"
              description: "pg-backup on pg-backup:9188 has not answered a scrape for 15 minutes, so no backup alert can fire. The service is down, or docker-compose.postgres-backup.yml is not in use and no backups are taken."

  - name: connections on a server without reserved_connections (PostgreSQL 15 and older)
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{instance="old", job="postgres-exporter", backend_type="client backend", datname="pipeshub", state="active"}'
        values: '90x10'
      - series: 'pg_settings_max_connections{instance="old", job="postgres-exporter"}'
        values: '100x10'
      - series: 'pg_settings_superuser_reserved_connections{instance="old", job="postgres-exporter"}'
        values: '3x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: PostgresConnectionsNearMax
        exp_alerts:
          - exp_labels: {severity: warning, instance: old, job: postgres-exporter}
            exp_annotations:
              summary: "PostgreSQL uses more than 80% of its connections"
              description: "92.78% of the connections max_connections allows are in use on old. New logins are refused once it is full; look for a client that bypasses PgBouncer."

  - name: replica without a streaming WAL receiver
    interval: 1m
    input_series:
      # lag reads 0 when receive and replay positions are equal, which a disconnected receiver leaves them
      - series: 'pg_replication_is_replica{instance="cut", job="postgres-exporter"}'
        values: '1x10'
      - series: 'pg_replication_lag_seconds{instance="cut", job="postgres-exporter"}'
        values: '0x10'
      - series: 'pg_replication_is_replica{instance="ok", job="postgres-exporter"}'
        values: '1x10'
      - series: 'pg_replication_lag_seconds{instance="ok", job="postgres-exporter"}'
        values: '0x10'
      - series: 'pg_stat_wal_receiver_last_msg_receipt_time{instance="ok", job="postgres-exporter", status="streaming", slot_name="s1", upstream_host="primary"}'
        values: '0+60x10'
      - series: 'pg_stat_wal_receiver_last_msg_receipt_time{instance="restarting", job="postgres-exporter", status="starting", slot_name="s1", upstream_host="primary"}'
        values: '0x10'
      - series: 'pg_replication_is_replica{instance="restarting", job="postgres-exporter"}'
        values: '1x10'
      - series: 'pg_replication_is_replica{instance="primary", job="postgres-exporter"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresReplicaNotStreaming
        exp_alerts: []
      - eval_time: 8m
        alertname: PostgresReplicaNotStreaming
        exp_alerts:
          - exp_labels: {severity: warning, instance: cut, job: postgres-exporter}
            exp_annotations:
              summary: "A PostgreSQL replica is not streaming WAL from its primary"
              description: "The replica cut has had no streaming WAL receiver for 5 minutes: it falls behind while the primary commits, though its replication lag can still read 0. Check primary_conninfo, the network and the primary's replication slots."
          - exp_labels: {severity: warning, instance: restarting, job: postgres-exporter}
            exp_annotations:
              summary: "A PostgreSQL replica is not streaming WAL from its primary"
              description: "The replica restarting has had no streaming WAL receiver for 5 minutes: it falls behind while the primary commits, though its replication lag can still read 0. Check primary_conninfo, the network and the primary's replication slots."

  - name: first full backup never completes
    interval: 1m
    input_series:
      # promtool's clock starts at 0: a scheduler started at 600 - k * schedule has run k full schedules at 10m
      - series: 'pipeshub_pg_backup_scheduler_start_timestamp_seconds{instance="new", job="pg-backup"}'
        values: '-86400x10'
      - series: 'pipeshub_pg_backup_scheduler_start_timestamp_seconds{instance="stuck", job="pg-backup"}'
        values: '-1209000x10'
      - series: 'pipeshub_pg_backup_scheduler_start_timestamp_seconds{instance="done", job="pg-backup"}'
        values: '-1209000x10'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="done", job="pg-backup", stanza="pipeshub", repo="1", type="full"}'
        values: '-3600x10'
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="new", job="pg-backup", type="full"}'
        values: '604800x10'
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="stuck", job="pg-backup", type="full"}'
        values: '604800x10'
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="done", job="pg-backup", type="full"}'
        values: '604800x10'
      - series: 'pipeshub_pg_backup_repository_up{instance="new", job="pg-backup"}'
        values: '1x10'
      - series: 'pipeshub_pg_backup_repository_up{instance="stuck", job="pg-backup"}'
        values: '1x10'
      - series: 'pipeshub_pg_backup_repository_up{instance="done", job="pg-backup"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: PgBackupNoFullBackup
        exp_alerts:
          - exp_labels: {severity: critical, instance: stuck, job: pg-backup}
            exp_annotations:
              summary: "No full backup has completed since the backup service started"
              description: "pg-backup on stuck started 2 times PG_BACKUP_FULL_DAYS ago and the repository holds no full backup: nothing can be restored. Read the pg-backup service's log; the first full backup may be failing or still running."

  - name: first full backup check while the repository is unreadable
    interval: 1m
    input_series:
      # the scheduler keeps exporting the last readable backup times (its state is on the persistent volume)
      - series: 'pipeshub_pg_backup_scheduler_start_timestamp_seconds{instance="unreadable", job="pg-backup"}'
        values: '-1209000x20'
      - series: 'pipeshub_pg_backup_schedule_seconds{instance="unreadable", job="pg-backup", type="full"}'
        values: '604800x20'
      - series: 'pipeshub_pg_backup_repository_up{instance="unreadable", job="pg-backup"}'
        values: '0x20'
      - series: 'pipeshub_pg_backup_last_success_timestamp_seconds{instance="unreadable", job="pg-backup", stanza="pipeshub", repo="1", type="full"}'
        values: '-3600x20'
    alert_rule_test:
      - {eval_time: 20m, alertname: PgBackupNoFullBackup, exp_alerts: []}
      - eval_time: 20m
        alertname: PgBackupRepositoryUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, instance: unreadable, job: pg-backup}
            exp_annotations:
              summary: "The backup repository cannot be read"
