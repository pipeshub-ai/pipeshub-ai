apiVersion: v2
name: pipeshub-ai
description: Open-source enterprise AI search and context layer for AI agents, with permission-aware search, cited answers and an MCP server
type: application
version: 0.2.2
appVersion: "1.0.0"
home: https://pipeshub.com
icon: https://pipeshub.com/logo.svg
sources:
  - https://github.com/pipeshub-ai/pipeshub-ai
maintainers:
  - name: PipesHub Team
    email: contact@pipeshub.com
    url: https://pipeshub.com
keywords:
  - ai
  - enterprise-search
  - rag
  - mcp
  - context-layer
  - knowledge-graph
  - mongodb
  - redis
  - neo4j
annotations:
  category: AI/ML Platform
  licenses: Apache-2.0

# Vendored under deployment/helm/vendor. helm dependency build packages these
# local charts. It does not contact Docker Hub. Bitnami's OCI registry now
# requires a login, which a client install must not need.
dependencies:
  - name: mongodb
    version: 18.1.10
    repository: "file://../vendor/mongodb"
    condition: mongodb.enabled
  - name: redis
    version: 24.0.0
    repository: "file://../vendor/redis"
    condition: redis.enabled
