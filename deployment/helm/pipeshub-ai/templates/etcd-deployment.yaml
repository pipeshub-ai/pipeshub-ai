{{- if .Values.etcd.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-etcd
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pipeshub-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: etcd
  template:
    metadata:
      annotations:
        {{- include "pipeshub-ai.etcdTls.podAnnotation" . | nindent 8 }}
      labels:
        {{- include "pipeshub-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: etcd
    spec:
      # Store pods never call the Kubernetes API: no service-account token to steal (SEC-D-10).
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.etcd.podSecurityContext | nindent 8 }}
      containers:
        - name: etcd
          image: {{ include "pipeshub-ai.image" (dict "image" .Values.etcd.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
          ports:
            - name: client
              containerPort: 2379
              protocol: TCP
          command:
            - etcd
            - --name
            - etcd-node
            - --data-dir
            - /etcd-data
            # TLS only, and only for a client with a certificate the chart issued (SEC-D-06). The one member has no
            # peer, so the peer port listens on loopback.
            - --listen-client-urls
            - https://0.0.0.0:2379
            - --advertise-client-urls
            - https://{{ include "pipeshub-ai.fullname" . }}-etcd:2379
            - --client-cert-auth
            - --trusted-ca-file
            - /tls/ca.crt
            - --cert-file
            - /tls/tls.crt
            - --key-file
            - /tls/tls.key
            - --listen-peer-urls
            - http://127.0.0.1:2380
            - --initial-advertise-peer-urls
            - http://{{ include "pipeshub-ai.fullname" . }}-etcd:2380
            - --initial-cluster
            - etcd-node=http://{{ include "pipeshub-ai.fullname" . }}-etcd:2380
          livenessProbe:
            exec:
              command:
                - etcdctl
                - --endpoints=https://localhost:2379
                - --cacert=/tls/ca.crt
                - --cert=/tls/tls.crt
                - --key=/tls/tls.key
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - etcdctl
                - --endpoints=https://localhost:2379
                - --cacert=/tls/ca.crt
                - --cert=/tls/tls.crt
                - --key=/tls/tls.key
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: etcd-tls
              mountPath: /tls
              readOnly: true
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.etcd.securityContext | nindent 12 }}
      volumes:
        - name: etcd-tls
          secret:
            secretName: {{ include "pipeshub-ai.fullname" . }}-etcd-server-tls
            defaultMode: 0440
        - name: etcd-data
          {{- if .Values.etcd.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pipeshub-ai.fullname" . }}-etcd
          {{- else }}
          emptyDir: {}
          {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-etcd
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 2379
      targetPort: client
      protocol: TCP
  selector:
    {{- include "pipeshub-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: etcd

---

{{- if .Values.etcd.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-etcd
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  accessModes:
    {{- toYaml .Values.etcd.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.etcd.persistence.size | quote }}
  {{- $etcdClass := .Values.etcd.persistence.storageClass | default .Values.global.storageClass }}
  {{- if $etcdClass }}
  storageClassName: {{ $etcdClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
