{{- if include "pipeshub-ai.createSecrets" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-secrets
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ required "secretKey is required when not using existing secrets or external secrets. Generate with: openssl rand -hex 32" .Values.secretKey | b64enc | quote }}
  {{- if and .Values.secretKeyNext .Values.secretKeyPrevious }}
    {{- fail "secretKeyNext and secretKeyPrevious are both set: set secretKeyNext before the switch, secretKeyPrevious after it, never both" }}
  {{- end }}
  {{- with .Values.secretKeyNext }}
  secret-key-next: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secretKeyPrevious }}
  secret-key-previous: {{ . | b64enc | quote }}
  {{- end }}
  {{- if eq (include "pipeshub-ai.sandboxMode" .) "broker" }}
  {{- /* ADR-KEY-02: the broker's own key, never SECRET_KEY. Unset, it is generated once and kept across upgrades. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "pipeshub-ai.fullname" .)) }}
  {{- $kept := "" }}
  {{- if and $existing $existing.data }}
  {{- $kept = index $existing.data "sandbox-broker-component-key" | default "" }}
  {{- end }}
  {{- if .Values.sandboxBrokerComponentKey }}
  sandbox-broker-component-key: {{ .Values.sandboxBrokerComponentKey | b64enc | quote }}
  {{- else if $kept }}
  sandbox-broker-component-key: {{ $kept | quote }}
  {{- else }}
  sandbox-broker-component-key: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if has (include "pipeshub-ai.sandboxMode" .) (list "broker" "docker") }}
  {{- /* R38IDENT-FU-1, SEC-A-04: each Docker API proxy caller's credential. Unset, generated once and kept. */}}
  {{- $current := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "pipeshub-ai.fullname" .)) }}
  {{- range $key, $set := dict "docker-proxy-broker-token" .Values.dockerProxyBrokerToken "docker-proxy-token" .Values.dockerProxyToken }}
  {{- $held := "" }}
  {{- if and $current $current.data }}
  {{- $held = index $current.data $key | default "" }}
  {{- end }}
  {{- if $set }}
  {{ $key }}: {{ $set | b64enc | quote }}
  {{- else if $held }}
  {{ $key }}: {{ $held | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.arango.enabled }}
  arango-password: {{ required "arango.auth.rootPassword is required when ArangoDB is enabled" .Values.arango.auth.rootPassword | b64enc | quote }}
  {{- end }}
  qdrant-api-key: {{ include "pipeshub-ai.qdrantApiKey" . | b64enc | quote }}
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ required "redis.auth.password is required when Redis auth is enabled. Set via --set redis.auth.password=<password>" .Values.redis.auth.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.mongodb.auth.enabled }}
  mongodb-username: {{ .Values.mongodb.auth.rootUser | default "root" | b64enc | quote }}
  mongodb-password: {{ required "mongodb.auth.rootPassword is required when MongoDB auth is enabled. Set via --set mongodb.auth.rootPassword=<password>" .Values.mongodb.auth.rootPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.neo4j.enabled }}
  {{- if eq .Values.neo4j.auth.password "your_password" }}
    {{- fail "neo4j.auth.password must not use default placeholder 'your_password'. Set a secure password via --set neo4j.auth.password=<password>" }}
  {{- end }}
  neo4j-password: {{ required "neo4j.auth.password is required when Neo4j is enabled" .Values.neo4j.auth.password | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.extraSecretData }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
