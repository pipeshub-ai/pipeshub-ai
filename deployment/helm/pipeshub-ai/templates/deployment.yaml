{{- /* Validate required secrets before deployment */ -}}
{{- include "pipeshub-ai.validateRequiredSecrets" . }}
{{- include "pipeshub-ai.validateSandbox" . }}
{{- include "pipeshub-ai.validateStores" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "pipeshub-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if include "pipeshub-ai.createSecrets" . }}
      {{- $_ := set $podAnnotations "checksum/qdrant-api-key" (include "pipeshub-ai.qdrantApiKeyChecksum" .) }}
      {{- end }}
      {{- if .Values.metrics.enabled }}
      {{- /* Per-pod scrape of Node's process metrics (R41SUPPLY-FU-13): the Service address answers from any replica. */}}
      {{- $_ := set $podAnnotations "prometheus.io/scrape" "true" }}
      {{- $_ := set $podAnnotations "prometheus.io/port" (toString .Values.metrics.node.port) }}
      {{- $_ := set $podAnnotations "prometheus.io/path" "/metrics" }}
      {{- end }}
      {{- with include "pipeshub-ai.etcdTls.podAnnotation" . | fromYaml }}
      {{- $podAnnotations = merge $podAnnotations . }}
      {{- end }}
      {{- if .Values.metrics.harness.enabled }}
      {{- $_ := set $podAnnotations "checksum/harness-metrics" (include (print $.Template.BasePath "/harness-metrics-agent.yaml") . | sha256sum) }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pipeshub-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: main
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pipeshub-ai.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.sandbox.runtimeClassName }}
      # Pod-level RuntimeClass for the whole pod, including the privileged
      # Docker-in-Docker sidecar, so an escape lands in the sandboxed runtime
      # rather than on the node. The RuntimeClass must already exist in the
      # cluster. This chart does NOT configure gVisor's required DinD daemon
      # flags or nested-container networking, so do not combine gVisor with
      # sandbox.dind.enabled until that is set up and smoke-tested; a VM runtime
      # (Kata) or an off-cluster backend (e2b) avoids that gap.
      runtimeClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # The root filesystem is read-only, but the app downloads models into the
        # caches the image ships with (a newly chosen embedding model). Each pod
        # gets a writable copy of them, seeded from the image so an air-gapped
        # cluster keeps the bundled models.
        - name: model-cache
          image: {{ include "pipeshub-ai.appImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "pipeshub-ai.appSecurityContext" . | nindent 12 }}
          command: ["/bin/sh", "-ec"]
          args:
            - for d in huggingface fastembed; do if [ -d "/root/.cache/$d" ]; then cp -a "/root/.cache/$d" /seed/; else mkdir -p "/seed/$d"; fi; done
          volumeMounts:
            - name: cache
              mountPath: /seed
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- include "pipeshub-ai.appSecurityContext" . | nindent 12 }}
          image: {{ include "pipeshub-ai.appImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: main
              containerPort: 8091
              protocol: TCP
            - name: connector
              containerPort: 8088
              protocol: TCP
            - name: backend
              containerPort: 3001
              protocol: TCP
            - name: query
              containerPort: 8000
              protocol: TCP
            - name: indexing
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: node-metrics
              containerPort: {{ .Values.metrics.node.port }}
              protocol: TCP
            {{- end }}
          env:{{ include "pipeshub-ai.appEnv" . }}
            - name: NODE_LOG_FILES
              value: {{ .Values.logging.nodeFiles.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            # Node serves its event-loop utilization here (/metrics), the autoscaler's per-process signal.
            - name: METRICS_PORT
              value: {{ .Values.metrics.node.port | quote }}
            {{- end }}
            {{- if .Values.logging.nodeFiles.enabled }}
            - name: NODE_LOG_DIR
              value: {{ .Values.logging.nodeFiles.path | quote }}
            {{- end }}
            - name: AGENT_HARNESS_RELAY_ENABLED
              value: {{ include "pipeshub-ai.agentHarnessEnabled" . | quote }}
            - name: AGENT_HARNESS_WORKER_ENABLED
              value: {{ include "pipeshub-ai.agentHarnessEnabled" . | quote }}
            - name: HARNESS_FLOW_GUARD
              value: {{ .Values.agentHarness.flowGuard | quote }}
            - name: AGENT_HARNESS_KILL_SWITCH
              value: {{ .Values.agentHarness.killSwitch | quote }}
            - name: HARNESS_ENGINE_IMAGE_REGISTRY
              value: {{ include "pipeshub-ai.engineImageRegistry" . | quote }}
            - name: AGENT_HARNESS_INTERNAL_PORT
              value: {{ .Values.config.agentHarnessInternalPort | quote }}
            - name: AGENT_HARNESS_INTERNAL_HOST
              value: "127.0.0.1"
            - name: AGENT_HARNESS_STATE_URL
              value: {{ printf "http://localhost:%v" .Values.config.agentHarnessInternalPort | quote }}
            {{- if .Values.metrics.harness.enabled }}
            # Node writes the scraper's credential here every minute; only this
            # pod's metrics agent, running as the same user, reads it.
            - name: HARNESS_METRICS_CREDENTIAL_FILE
              value: /run/pxh-monitoring/worker-credential
            - name: HARNESS_METRICS_CREDENTIAL_OWNER
              value: {{ .Values.securityContext.runAsUser | default .Values.podSecurityContext.runAsUser | quote }}
            {{- end }}
            # Code sandbox capacity (sandbox.capacity in values.yaml).
            {{- if and .Values.sandbox.dind.enabled (eq (include "pipeshub-ai.sandboxPath" .) "dind") }}
            - name: SANDBOX_HOST_MEMORY_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: dind
                  resource: limits.memory
                  divisor: "1"
            - name: SANDBOX_HOST_CPU_MILLIS
              valueFrom:
                resourceFieldRef:
                  containerName: dind
                  resource: limits.cpu
                  divisor: "1m"
            - name: SANDBOX_MEMORY_SHARE
              value: {{ .Values.sandbox.capacity.memoryShare | default "0.9" | quote }}
            # The daemon is this pod's sidecar: the live limit reads the
            # sidecar (sandbox.dind.liveLimit), never the node.
            - name: SANDBOX_DOCKER_TOPOLOGY
              value: "dind-sidecar"
            {{- if not .Values.sandbox.dind.liveLimit.enabled }}
            - name: SANDBOX_LIVE_LIMIT
              value: "off"
            {{- end }}
            {{- range $name, $key := dict "SANDBOX_SIDECAR_MEM_HIGH" "memHigh" "SANDBOX_SIDECAR_MEM_HARD" "memHard" "SANDBOX_SIDECAR_CPU_BRAKE" "cpuBrake" "SANDBOX_SIDECAR_CPU_THROTTLE" "cpuThrottle" }}
            {{- with (index $.Values.sandbox.dind.liveLimit $key) }}
            - name: {{ $name }}
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with (include "pipeshub-ai.sandboxCapacityDivisor" .) }}
            - name: SANDBOX_CAPACITY_DIVISOR
              value: {{ . | quote }}
            {{- end }}
            {{- with (include "pipeshub-ai.sandboxMaxTotal" .) }}
            - name: SANDBOX_MAX_TOTAL
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $key := dict "SANDBOX_MAX_PER_ORG" "maxPerOrg" "SANDBOX_MAX_PER_REQUEST" "maxPerRequest" "SANDBOX_MIN_TOTAL" "minTotal" "SANDBOX_CPU_FACTOR" "cpuFactor" "SANDBOX_SLOT_WAIT_S" "slotWaitSeconds" "SANDBOX_HOST_PID_LIMIT" "pidLimit" "SANDBOX_MEMORY_OVERCOMMIT" "memoryOvercommit" }}
            {{- /* Not `with`: a numeric 0 is a setting, not an empty value. */}}
            {{- $value := index $.Values.sandbox.capacity $key }}
            {{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            # Each pod has its own sandboxes and load alert evaluator, so each
            # gets its own alert cooldown.
            - name: SANDBOX_ALERT_SCOPE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.metrics.enabled }}
            # The ops exporter of the indexing process (not the parsing Deployment's own /metrics).
            - name: PIPESHUB_METRICS_ENABLED
              value: "true"
            - name: PIPESHUB_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- if eq (.Values.metrics.bind | toString) "podIP" }}
            - name: PIPESHUB_METRICS_BIND
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- else }}
            - name: PIPESHUB_METRICS_BIND
              value: {{ .Values.metrics.bind | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.parsing.enabled }}
            # Parsing runs in its own Deployment: send every parse there.
            - name: USE_PARSING_SERVICE
              value: "true"
            - name: PARSING_SERVICE_URL
              value: {{ printf "http://%s:%d" (include "pipeshub-ai.parsingName" .) (.Values.parsing.port | int) | quote }}
            {{- if ne (toString .Values.parsing.clientConcurrency) "" }}
            - name: PARSING_SERVICE_CONCURRENCY
              value: {{ .Values.parsing.clientConcurrency | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Per-pod ephemera (logs, caches, $HOME) — always emptyDir to avoid
            # ReadWriteOnce contention between replicas. Logs should be shipped via
            # the platform log collector (CloudWatch, Loki, etc.) for retention.
            - name: app-logs
              mountPath: /app/python/logs
            - name: app-home
              mountPath: /home/user
            - name: app-rootlocal
              mountPath: /root/.local
            - name: tmp
              mountPath: /tmp
            {{- include "pipeshub-ai.etcdTlsMount" . | nindent 12 }}
            {{- include "pipeshub-ai.secretKeyMount" . | nindent 12 }}
            - name: cache
              mountPath: /root/.cache/huggingface
              subPath: huggingface
            - name: cache
              mountPath: /root/.cache/fastembed
              subPath: fastembed
            {{- if .Values.logging.nodeFiles.enabled }}
            - name: node-logs
              mountPath: {{ .Values.logging.nodeFiles.path | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            # Shared persistent data (uploads, local KV state, etc.). With multiple
            # replicas this PVC MUST be ReadWriteMany — validation in _helpers.tpl
            # blocks the install otherwise.
            - name: pipeshub-storage
              mountPath: /data/pipeshub
              subPath: data
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.s3SignatureV4Preload }}
            - name: s3-sigv4
              mountPath: /etc/pipeshub/s3-sigv4
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.harness.enabled }}
            - name: harness-metrics-credential
              mountPath: /run/pxh-monitoring
            {{- end }}
          {{- if .Values.healthCheck.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            initialDelaySeconds: {{ .Values.healthCheck.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.livenessProbe.failureThreshold }}
        {{- if .Values.metrics.harness.enabled }}
        - name: harness-metrics
          image: {{ include "pipeshub-ai.image" (dict "image" .Values.metrics.harness.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.metrics.harness.image.pullPolicy | default .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "pipeshub-ai.appSecurityContext" . | nindent 12 }}
          args:
            - --config.file=/etc/pxh-agent/agent.yml
            - --enable-feature=agent
            - --enable-feature=expand-external-labels
            - --storage.agent.path=/agent
            # Not 9091: the indexing governor's exporter (metrics.port) may bind every interface of the pod.
            - --web.listen-address=127.0.0.1:9094
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.metrics.harness.resources | nindent 12 }}
          volumeMounts:
            - name: harness-metrics-config
              mountPath: /etc/pxh-agent
              readOnly: true
            - name: harness-metrics-credential
              mountPath: /run/pxh-monitoring
              readOnly: true
            - name: harness-metrics-wal
              mountPath: /agent
            {{- if .Values.metrics.harness.remoteWrite.bearerTokenSecret.name }}
            - name: harness-metrics-remote-write
              mountPath: /etc/pxh-remote-write
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if and .Values.sandbox.dind.enabled (ne (include "pipeshub-ai.sandboxMode" .) "broker") }}
        {{- include "pipeshub-ai.dindContainer" . | nindent 8 }}
        {{- include "pipeshub-ai.dockerProxyContainer" (dict "root" . "profile" "legacy") | nindent 8 }}
        {{- end }}
          {{- with .Values.nodeSelector }}
          {{- $selector := include "pipeshub-ai.compactMap" . }}
          {{- if $selector }}
      nodeSelector:
        {{- $selector | nindent 8 }}
          {{- end }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.spreadAcrossNodes }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pipeshub-ai.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: main
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "pipeshub-ai.etcdTlsVolume" (dict "root" . "client" "pipeshub-ai") | nindent 8 }}
        {{- include "pipeshub-ai.secretKeyVolume" . | nindent 8 }}
        {{- if and .Values.sandbox.dind.enabled (ne (include "pipeshub-ai.sandboxMode" .) "broker") }}
        {{- include "pipeshub-ai.dindVolume" . | nindent 8 }}
        {{- end }}
        - name: cache
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: app-home
          emptyDir: {}
        - name: app-rootlocal
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.logging.nodeFiles.enabled }}
        - name: node-logs
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: pipeshub-storage
          persistentVolumeClaim:
            claimName: {{ include "pipeshub-ai.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.s3SignatureV4Preload }}
        - name: s3-sigv4
          configMap:
            name: {{ include "pipeshub-ai.fullname" . }}-s3-sigv4
        {{- end }}
        {{- if .Values.metrics.harness.enabled }}
        - name: harness-metrics-config
          configMap:
            name: {{ include "pipeshub-ai.fullname" . }}-harness-metrics
        - name: harness-metrics-credential
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: harness-metrics-wal
          emptyDir:
            sizeLimit: 512Mi
        {{- with .Values.metrics.harness.remoteWrite.bearerTokenSecret }}
        {{- if .name }}
        - name: harness-metrics-remote-write
          secret:
            secretName: {{ .name }}
            items:
              - key: {{ required "metrics.harness.remoteWrite.bearerTokenSecret.key is required with its name" .key }}
                path: token
        {{- end }}
        {{- end }}
        {{- end }}
