{{- /* Validate required secrets before deployment */ -}}
{{- include "pipeshub-ai.validateRequiredSecrets" . }}
{{- include "pipeshub-ai.validateSandbox" . }}
{{- include "pipeshub-ai.validateStores" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "pipeshub-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if include "pipeshub-ai.createSecrets" . }}
      {{- $_ := set $podAnnotations "checksum/qdrant-api-key" (include "pipeshub-ai.qdrantApiKeyChecksum" .) }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pipeshub-ai.labels" . | nindent 8 }}
        app.kubernetes.io/component: main
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pipeshub-ai.serviceAccountName" . }}
      {{- with .Values.sandbox.runtimeClassName }}
      # Pod-level RuntimeClass for the whole pod, including the privileged
      # Docker-in-Docker sidecar, so an escape lands in the sandboxed runtime
      # rather than on the node. The RuntimeClass must already exist in the
      # cluster. This chart does NOT configure gVisor's required DinD daemon
      # flags or nested-container networking, so do not combine gVisor with
      # sandbox.dind.enabled until that is set up and smoke-tested; a VM runtime
      # (Kata) or an off-cluster backend (e2b) avoids that gap.
      runtimeClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "pipeshub-ai.image" (dict "image" .Values.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: main
              containerPort: 8091
              protocol: TCP
            - name: connector
              containerPort: 8088
              protocol: TCP
            - name: backend
              containerPort: 3001
              protocol: TCP
            - name: query
              containerPort: 8000
              protocol: TCP
            - name: indexing
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:{{ include "pipeshub-ai.appEnv" . }}
            # Code sandbox capacity (sandbox.capacity in values.yaml).
            {{- if and .Values.sandbox.dind.enabled (eq (include "pipeshub-ai.sandboxPath" .) "dind") }}
            - name: SANDBOX_HOST_MEMORY_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: dind
                  resource: limits.memory
                  divisor: "1"
            - name: SANDBOX_HOST_CPU_MILLIS
              valueFrom:
                resourceFieldRef:
                  containerName: dind
                  resource: limits.cpu
                  divisor: "1m"
            - name: SANDBOX_MEMORY_SHARE
              value: {{ .Values.sandbox.capacity.memoryShare | default "0.9" | quote }}
            # The daemon is this pod's sidecar: the live limit reads the
            # sidecar (sandbox.dind.liveLimit), never the node.
            - name: SANDBOX_DOCKER_TOPOLOGY
              value: "dind-sidecar"
            {{- if not .Values.sandbox.dind.liveLimit.enabled }}
            - name: SANDBOX_LIVE_LIMIT
              value: "off"
            {{- end }}
            {{- range $name, $key := dict "SANDBOX_SIDECAR_MEM_HIGH" "memHigh" "SANDBOX_SIDECAR_MEM_HARD" "memHard" "SANDBOX_SIDECAR_CPU_BRAKE" "cpuBrake" "SANDBOX_SIDECAR_CPU_THROTTLE" "cpuThrottle" }}
            {{- with (index $.Values.sandbox.dind.liveLimit $key) }}
            - name: {{ $name }}
              value: {{ . | toString | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with (include "pipeshub-ai.sandboxCapacityDivisor" .) }}
            - name: SANDBOX_CAPACITY_DIVISOR
              value: {{ . | quote }}
            {{- end }}
            {{- with (include "pipeshub-ai.sandboxMaxTotal" .) }}
            - name: SANDBOX_MAX_TOTAL
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $key := dict "SANDBOX_MAX_PER_ORG" "maxPerOrg" "SANDBOX_MAX_PER_REQUEST" "maxPerRequest" "SANDBOX_MIN_TOTAL" "minTotal" "SANDBOX_CPU_FACTOR" "cpuFactor" "SANDBOX_SLOT_WAIT_S" "slotWaitSeconds" "SANDBOX_HOST_PID_LIMIT" "pidLimit" "SANDBOX_MEMORY_OVERCOMMIT" "memoryOvercommit" }}
            {{- /* Not `with`: a numeric 0 is a setting, not an empty value. */}}
            {{- $value := index $.Values.sandbox.capacity $key }}
            {{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            # Each pod has its own sandboxes and load alert evaluator, so each
            # gets its own alert cooldown.
            - name: SANDBOX_ALERT_SCOPE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.metrics.enabled }}
            # The ops exporter of the indexing process (not the parsing Deployment's own /metrics).
            - name: PIPESHUB_METRICS_ENABLED
              value: "true"
            - name: PIPESHUB_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- if eq (.Values.metrics.bind | toString) "podIP" }}
            - name: PIPESHUB_METRICS_BIND
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- else }}
            - name: PIPESHUB_METRICS_BIND
              value: {{ .Values.metrics.bind | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.parsing.enabled }}
            # Parsing runs in its own Deployment: send every parse there.
            - name: USE_PARSING_SERVICE
              value: "true"
            - name: PARSING_SERVICE_URL
              value: {{ printf "http://%s:%d" (include "pipeshub-ai.parsingName" .) (.Values.parsing.port | int) | quote }}
            {{- if ne (toString .Values.parsing.clientConcurrency) "" }}
            - name: PARSING_SERVICE_CONCURRENCY
              value: {{ .Values.parsing.clientConcurrency | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Per-pod ephemera (logs, caches, $HOME) — always emptyDir to avoid
            # ReadWriteOnce contention between replicas. Logs should be shipped via
            # the platform log collector (CloudWatch, Loki, etc.) for retention.
            - name: app-logs
              mountPath: /app/python/logs
            - name: app-home
              mountPath: /home/user
            - name: app-rootlocal
              mountPath: /root/.local
            {{- if .Values.persistence.enabled }}
            # Shared persistent data (uploads, local KV state, etc.). With multiple
            # replicas this PVC MUST be ReadWriteMany — validation in _helpers.tpl
            # blocks the install otherwise.
            - name: pipeshub-storage
              mountPath: /data/pipeshub
              subPath: data
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.s3SignatureV4Preload }}
            - name: s3-sigv4
              mountPath: /etc/pipeshub/s3-sigv4
              readOnly: true
            {{- end }}
          {{- if .Values.healthCheck.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            initialDelaySeconds: {{ .Values.healthCheck.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: backend
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.livenessProbe.failureThreshold }}
        {{- if .Values.sandbox.dind.enabled }}
        # Docker-in-Docker: gives SANDBOX_MODE=docker a daemon, so
        # model-generated code runs in a throwaway container instead of as a
        # subprocess of the application. See `sandbox.dind` in values.yaml for
        # the privilege trade this makes.
        - name: dind
          image: {{ .Values.sandbox.dind.image | quote }}
          imagePullPolicy: {{ .Values.sandbox.dind.pullPolicy | quote }}
          securityContext:
            # The daemon needs to create namespaces, mount filesystems and
            # manage cgroups, which no unprivileged container can do. This
            # deliberately overrides the pod-level runAsNonRoot.
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
          {{- if .Values.sandbox.dind.liveLimit.enabled }}
          # Starts the loop that writes this container's cgroup counters for
          # docker-proxy (pipeshub-ai.dindExporterScript), then the image's
          # entrypoint with the args below unchanged.
          command: ["/bin/sh", "-c", {{ include "pipeshub-ai.dindExporterScript" . | quote }}, "pipeshub-dind"]
          {{- end }}
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            # For the `docker info` probes below.
            - name: DOCKER_HOST
              value: "unix:///var/run/dind/docker.sock"
            {{- if .Values.sandbox.dind.liveLimit.enabled }}
            - name: PIPESHUB_EXPORT_INTERVAL
              value: {{ .Values.sandbox.dind.liveLimit.exportIntervalSeconds | default 5 | toString | quote }}
            {{- end }}
          # No TCP listener: every container in a pod shares one network
          # namespace, so a loopback port would hand the raw API to the
          # application container too. The socket's volume is mounted only
          # here and in docker-proxy. First arg must be `dockerd`; if it starts
          # with `-`, dockerd-entrypoint.sh adds its default 0.0.0.0:2375 listener.
          args:
            - dockerd
            - "--host=unix:///var/run/dind/docker.sock"
          resources:
            {{- toYaml .Values.sandbox.dind.resources | nindent 12 }}
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: dind-sock
              mountPath: /var/run/dind
          livenessProbe:
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            # Pulling the sandbox image on a cold cache can take a while;
            # this is what stops a slow first start being read as a crash.
            exec:
              command: ["docker", "info"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
        - name: docker-proxy
          image: {{ .Values.sandbox.proxy.image | default (include "pipeshub-ai.image" (dict "image" .Values.image "global" .Values.global)) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          # Bypasses the image entrypoint, which drops privileges for the app
          # and needs capabilities this container deliberately does not have.
          command: ["python", "-m", "app.docker_proxy_main"]
          workingDir: /app/python
          securityContext:
            # Root only to open the root-owned daemon socket; it holds no
            # capabilities. Same as the Compose docker-socket-proxy.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Loopback only (also the proxy's default): the pod IP must not
            # serve it, since the proxy has no client authentication.
            - name: DOCKER_PROXY_HOST
              value: "127.0.0.1"
            - name: DOCKER_PROXY_PORT
              value: {{ .Values.sandbox.dind.port | quote }}
            - name: DOCKER_PROXY_UPSTREAM
              value: "unix:///var/run/dind/docker.sock"
            - name: DOCKER_PROXY_LOG_LEVEL
              value: {{ .Values.sandbox.proxy.logLevel | quote }}
            {{- with .Values.sandbox.proxy.allowedImages }}
            - name: DOCKER_PROXY_ALLOWED_IMAGES
              value: {{ . | quote }}
            {{- end }}
            - name: SANDBOX_DOCKER_IMAGE
              value: {{ .Values.config.sandboxDockerImage | quote }}
            - name: SANDBOX_EGRESS_NETWORK
              value: {{ .Values.config.sandboxEgressNetwork | quote }}
            # The same value the app gets: the reaper removes sandbox
            # containers older than this cap plus a margin.
            - name: SANDBOX_MAX_RUN_TIMEOUT_S
              value: {{ .Values.config.sandboxMaxRunTimeoutS | quote }}
            # Labels this release's sandbox containers, so releases sharing a
            # daemon never see or reap each other's.
            - name: DOCKER_PROXY_INSTANCE
              value: {{ printf "%s/%s" .Release.Namespace (include "pipeshub-ai.fullname" .) | quote }}
            - name: DOCKER_PROXY_REAP_UNLABELED
              value: {{ .Values.sandbox.proxy.reapUnlabeled | default false | toString | quote }}
            {{- if .Values.sandbox.dind.liveLimit.enabled }}
            # Written by the loop in the dind container; served as GET /_pipeshub/usage.
            - name: DOCKER_PROXY_SIDECAR_STATS_FILE
              value: "/var/run/dind/pipeshub-sidecar-stats"
            {{- end }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            {{- toYaml .Values.sandbox.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: dind-sock
              mountPath: /var/run/dind
          # A TCP connect, not /_ping: /_ping is forwarded to dockerd, and a
          # slow daemon should not restart the proxy. The listener is on
          # loopback, so a kubelet tcpSocket probe (pod IP) cannot reach it.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.sandbox.dind.port }}), timeout=3).close()"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
        {{- end }}
          {{- with .Values.nodeSelector }}
          {{- $selector := include "pipeshub-ai.compactMap" . }}
          {{- if $selector }}
      nodeSelector:
        {{- $selector | nindent 8 }}
          {{- end }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.spreadAcrossNodes }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "pipeshub-ai.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: main
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.sandbox.dind.enabled }}
        - name: dind-storage
          {{- if .Values.sandbox.dind.storage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.sandbox.dind.storage.existingClaim | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.sandbox.dind.storage.sizeLimit | quote }}
          {{- end }}
        - name: dind-sock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        - name: cache
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
        - name: app-home
          emptyDir: {}
        - name: app-rootlocal
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: pipeshub-storage
          persistentVolumeClaim:
            claimName: {{ include "pipeshub-ai.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.s3SignatureV4Preload }}
        - name: s3-sigv4
          configMap:
            name: {{ include "pipeshub-ai.fullname" . }}-s3-sigv4
        {{- end }}
