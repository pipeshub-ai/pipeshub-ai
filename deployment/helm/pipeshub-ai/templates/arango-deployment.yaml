{{- if .Values.arango.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-arango
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: arango
spec:
  replicas: 1
  # The data volume is ReadWriteOnce: a surged second pod either never attaches it
  # or, on the same node, opens the same database directory. So stop the old pod
  # first. Not Recreate: an upgrade to it fails on the live rollingUpdate field.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "pipeshub-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: arango
  template:
    metadata:
      labels:
        {{- include "pipeshub-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: arango
    spec:
      # Store pods never call the Kubernetes API: no service-account token to steal (SEC-D-10).
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.arango.podSecurityContext | nindent 8 }}
      containers:
        - name: arango
          image: {{ include "pipeshub-ai.image" (dict "image" .Values.arango.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.arango.image.pullPolicy }}
          ports:
            - containerPort: 8529
              name: arango
          env:
            - name: ARANGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipeshub-ai.arangoSecretName" . }}
                  key: arango-password
          volumeMounts:
            - name: arango-data
              mountPath: /var/lib/arangodb3
          resources:
            {{- toYaml .Values.arango.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.arango.securityContext | nindent 12 }}
      volumes:
        - name: arango-data
        {{- if .Values.arango.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pipeshub-ai.fullname" . }}-arango
        {{- else }}
          emptyDir: {}
        {{- end }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-arango
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: arango
spec:
  type: ClusterIP
  ports:
    - port: 8529
      targetPort: arango
      protocol: TCP
      name: arango
  selector:
    {{- include "pipeshub-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: arango

---

{{- if .Values.arango.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}-arango
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: arango
spec:
  accessModes:
    {{- toYaml .Values.arango.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.arango.persistence.size }}
  {{- $arangoClass := .Values.arango.persistence.storageClass | default .Values.global.storageClass }}
  {{- if $arangoClass }}
  storageClassName: {{ $arangoClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
