{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- include "pipeshub-ai.validatePostgres" . }}
{{- $p := .Values.postgres.auth.passwords }}
{{- $host := include "pipeshub-ai.postgres.name" . }}
{{- /* Passwords and the URLs built from them live only in this Secret (never a ConfigMap, never rendered into NOTES.txt). */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pipeshub-ai.postgres.secretName" . }}
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  {{- range $name := splitList " " (include "pipeshub-ai.postgres.logins" .) }}
  {{ $name }}-password: {{ index $p $name | toString | b64enc | quote }}
  {{- end }}
  node-url: {{ printf "postgresql://pipeshub_node_login:%s@%s:6432/pipeshub" $p.node $host | b64enc | quote }}
  jobs-url: {{ printf "postgresql://pipeshub_jobs:%s@%s:6432/pipeshub" $p.jobs $host | b64enc | quote }}
  migrate-url: {{ printf "postgresql+psycopg://pipeshub_migrate:%s@%s:5432/pipeshub" $p.migrate $host | b64enc | quote }}
{{- end }}
