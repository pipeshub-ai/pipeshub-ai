{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pipeshub-ai.fullname" . }}
  labels:
    {{- include "pipeshub-ai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pipeshub-ai.selectorLabels" . | nindent 6 }}
    {{- if .Values.postgres.enabled }}
    # The PostgreSQL pod has a policy of its own; this one (which allows the whole namespace in) must not also select it.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - postgres
    {{- end }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if or .Values.networkPolicy.egress .Values.networkPolicy.extraEgress }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
