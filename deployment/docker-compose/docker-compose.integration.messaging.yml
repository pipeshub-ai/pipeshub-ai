# Brokers for the messaging integration tests (fair scheduling + lanes).
#
#   docker compose -f deployment/docker-compose/docker-compose.integration.messaging.yml up -d
#   cd backend/python && pytest tests/integration/messaging -m integration
#
# Ports are deliberately non-standard so this can run beside a dev stack
# without clashing with it.

# Every service that runs an image the base file runs keeps the base file's
# baseline (ADR-OPS-02): no capability but those its image proves it needs, with
# the reason beside each, no privilege gain, and memory and process limits.
# tests/unit/harness/security/test_container_baseline.py checks it.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

# A service whose image writes only to its volumes also gets a read-only root.
x-read-only-root: &read-only-root
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  kafka-messaging-it:
    <<: *hardened
    image: confluentinc/cp-kafka:7.9.0@sha256:02170e46da5c36b1581cd42ebfbf2a55edae6348c62bc772bc2166841db745b2
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    container_name: kafka-messaging-it
    depends_on:
      - zookeeper-messaging-it
    ports:
      - "29192:29192"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-messaging-it:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29192
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-messaging-it:9092,HOST://localhost:29192
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      # Tests create and rebalance groups constantly; no point waiting.
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Topics are created per test with an explicit partition count, so the
      # broker must not pre-create record-events at one partition.
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_RETENTION_HOURS=1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 3G
          pids: 4096

  zookeeper-messaging-it:
    <<: *hardened
    image: confluentinc/cp-zookeeper:7.9.0@sha256:5ae28c2f45b89e12e8ba27bd0cfbe6488ef7082a17f01c878ab7f1841a58874b
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: zookeeper-messaging-it
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 4096

  redis-messaging-it:
    <<: [*hardened, *read-only-root]
    # The image entrypoint drops to the redis user (SETUID, SETGID); with no volume
    # an earlier redis wrote, there is nothing to hand over.
    cap_add: [SETUID, SETGID]
    image: redis:7.2-alpine@sha256:82403a0812a51faf6779f8d0dbe25ea85279ec7d49d24a3c78a65e9d8a87fa5f
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: redis-messaging-it
    ports:
      - "6389:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 4096
