# SECRET_KEY as a file, not an environment variable (R38IDENT-FU-8, ADR-KEY-02 D8). Opt-in: install.sh adds
# nothing by itself; set
#
#   PIPESHUB_COMPOSE_OVERRIDES=docker-compose.secret-key-file.yml ./install.sh
#
# (install.sh keeps the choice in .env), or pass it with -f after docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.secret-key-file.yml up -d
#
# Compose copies the key from .env into /run/secrets/pipeshub_secret_key inside the app container, owned by the app's
# user (uid 1000) with mode 0400, and the app reads it through SECRET_KEY_FILE. The container's environment, `docker
# inspect` and /proc/<pid>/environ no longer carry it; the copy on the host stays in .env (mode 0600), where install.sh
# keeps and rotates it as before.
#
# To keep the key outside .env, replace `environment: SECRET_KEY` below with `file: /path/to/secret-key` (a file whose
# owner is uid 1000 and mode 0400: Compose bind-mounts a file secret with its host owner and mode) and leave SECRET_KEY
# empty in .env.
#
# SECRET_KEY_PREVIOUS and SECRET_KEY_NEXT stay variables: they are set only while a rotation runs (ADR-KEY-01).

services:
  pipeshub-ai:
    environment:
      - SECRET_KEY=
      - SECRET_KEY_FILE=/run/secrets/pipeshub_secret_key
    secrets:
      - source: pipeshub_secret_key
        target: pipeshub_secret_key
        uid: "1000"
        gid: "1000"
        mode: 0400

secrets:
  pipeshub_secret_key:
    environment: SECRET_KEY
