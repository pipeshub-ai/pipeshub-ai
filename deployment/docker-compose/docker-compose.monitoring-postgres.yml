# PostgreSQL, PgBouncer and backup alerts for the monitoring overlay: Prometheus scrapes the `postgres-metrics` exporters and
# the pg-backup service (docker-compose.postgres-backup.yml), and loads deployment/monitoring/prometheus/postgres.rules.yml. Name it after docker-compose.monitoring.yml, with the
# `postgres` and `postgres-metrics` profiles on:
#
#   COMPOSE_PROFILES=...,postgres,postgres-metrics GRAFANA_ADMIN_PASSWORD=... docker compose -f docker-compose.yml \
#     -f docker-compose.agent-harness.yml -f docker-compose.monitoring.yml -f docker-compose.monitoring-postgres.yml up -d
#
# It is separate because an install without the exporters would otherwise page PostgresExporterDown for ever.

services:
  prometheus:
    # Repeats docker-compose.monitoring.yml's baseline (ADR-OPS-02) so that this file read alone keeps it too.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 256m
    volumes:
      - ../monitoring/prometheus/postgres.scrape.yml:/etc/prometheus/scrape.d/postgres.yml:ro
      - ../monitoring/prometheus/postgres.rules.yml:/etc/prometheus/rules/postgres.rules.yml:ro
