# ServiceNow simulator for the servicenow_sim suite (integration-tests/connectors/servicenow/
# servicenow_sim_*_test.py). An override, used after the stack's own file:
#
#   docker compose -f docker-compose.integration.neo4j.yml -f docker-compose.integration.servicenow-sim.yml up -d
#
# The connector takes its instance URL from its configuration, so it reaches the simulator by its service
# name (http://servicenow-sim): a private address, which PipesHub accepts for a source an admin configures
# unless PIPESHUB_BLOCK_PRIVATE_ADDRESSES is on. The simulator speaks plain http, which the connector refuses
# unless SERVICENOW_ALLOW_INSECURE_HTTP is set. The test process drives the simulator's control API on the
# published port (integration-tests/connectors/servicenow_sim.env).
services:
  servicenow-sim:
    image: ${SERVICENOW_SIM_IMAGE:-pipeshub/connectors-simulator:it}
    restart: always
    command: ["servicenow"]
    environment:
      CONNSIM_SOURCES: servicenow
      # The instance lives in one process's memory.
      CONNSIM_WORKERS: "1"
      # 14 knowledge bases (one per access pattern) with 60 article rows: every rule, small enough to open
      # every record as every probed person.
      CONNSIM_SERVICENOW_ARTICLES: "60"
    # Not 8101-8103, 8106, 8107 or 8110: the other simulators publish those in the same stack.
    ports:
      - "127.0.0.1:8109:80"
    mem_limit: 512m

  pipeshub-ai:
    environment:
      - SERVICENOW_ALLOW_INSECURE_HTTP=1
