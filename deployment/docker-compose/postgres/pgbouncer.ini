; PgBouncer for the `postgres` compose profile. Baked into the image: the reset settings below are part of
; the security model (they stop one client's session state leaking to the next), so they are not a bind mount.
[databases]
pipeshub = host=postgres port=5432 dbname=pipeshub

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
pool_mode = transaction
; SCRAM verifiers written by initdb/10-roles.sh; no auth_query (it would need a superuser-owned lookup function)
auth_type = scram-sha-256
auth_file = /pgbouncer-auth/userlist.txt

; Without server_reset_query_always the reset does not run in transaction mode, and a leaked SET ROLE,
; session GUC, temp table or WITH HOLD cursor would reach the next client. DISCARD ALL is avoided: it also
; drops prepared statements and plans (20-30% slower in measurements).
server_reset_query = RESET ALL; SET SESSION AUTHORIZATION DEFAULT; CLOSE ALL; DEALLOCATE ALL; DISCARD TEMP; UNLISTEN *; SELECT pg_advisory_unlock_all()
server_reset_query_always = 1
max_prepared_statements = 200
; A restore window switches the application logins off and back on; PgBouncer would otherwise keep refusing them for 15 s.
server_login_retry = 2

max_client_conn = 1000
max_db_connections = 32
default_pool_size = 4
ignore_startup_parameters = extra_float_digits

; The Node API (DOC_STORE=postgres) keeps 10 clients per process and sends unnamed statements, so it needs no
; prepared-statement state from the pooler; its login gets default_pool_size server connections like any other.
; A client waits at most 5 s for a server connection, like the Node pool's connection timeout: a longer queue
; only hides overload. An idle transaction is cut at 30 s, the same as idle_in_transaction_session_timeout.
query_wait_timeout = 5
idle_transaction_timeout = 30

; One pool per login, so a busy service cannot take server connections from another: the indexing service gets the largest
; pool for its bursts, and the sizes add up to at most max_db_connections (a test checks it). A login not listed gets
; default_pool_size.
[users]
pipeshub_query_login = pool_size=8
pipeshub_indexing_login = pool_size=10
pipeshub_connectors_login = pool_size=4
pipeshub_node_login = pool_size=6
pipeshub_jobs = pool_size=2
pipeshub_kv_login = pool_size=2
