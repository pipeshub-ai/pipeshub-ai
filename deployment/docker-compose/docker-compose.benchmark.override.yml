# Benchmark overrides, layered on docker-compose.integration.{neo4j,arango}.yml:
#
#   docker compose -f docker-compose.integration.neo4j.yml \
#                  -f docker-compose.benchmark.override.yml up -d
#
# FRAMES answers must come from retrieval over the benchmark corpus only, so
# code execution (run_code / the coding sandbox) is switched off. Web search is
# excluded separately: the harness only ever uses the `internal_search` chat
# mode, and `guard.py` fails the run if a disallowed tool is called anyway.
# See integration-tests/benchmarks/frames/README.md.
#
# Skills are off for the same reason, and because leaving them on is strictly
# waste here: every builtin pack (pdf, docx, xlsx, pptx, data-analysis, ...)
# executes in the coding sandbox that the line above just disabled, so the
# ~1.7k prompt tokens they cost per request (4 pinned tool schemas plus the
# catalog section) advertise capabilities no run can reach.
#
# The RAG baselines read PipesHub's Qdrant directly; with the default
# docker-compose.yml (which doesn't publish it) also layer
# docker-compose.benchmark.ports.yml.
services:
  pipeshub-ai:
    environment:
      - PIPESHUB_ENABLE_CODE_EXECUTION=false
      - PIPESHUB_ENABLE_SKILLS=false
      # `PIPESHUB_AGENT_DISABLED_TOOLSETS` is deliberately unset: PipesHub ships
      # a calculator, so PipesHub is measured with one. It does arithmetic over
      # values already retrieved — no outside information — and `guard.py`
      # allows it explicitly rather than by omission. Measured on the dev split:
      # every question that used it was also answered correctly without it, so
      # it changes the score by ~0 either way.
