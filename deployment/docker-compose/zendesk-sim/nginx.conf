# TLS front for the Zendesk simulator (docker-compose.integration.zendesk-sim.yml). The connector's clients call
# https://<subdomain>.zendesk.com (the API, sign-in and attachment links) and the attachment CDN
# (<name>.zdusercontent.com) over HTTPS: the hosts are fixed in the code. This container answers under those names with
# a certificate from a CA made for the test run (sim-tls/make-certs.sh) and passes each request on unchanged, Host header
# and raw path included. The simulator tells the tenant host from the CDN host by the Host header.
worker_processes 1;
events {}

http {
    access_log off;
    large_client_header_buffers 8 64k;
    client_max_body_size 64m;
    # Injected latency, throttling and paging must reach the connector as the simulator sends them.
    proxy_buffering off;
    proxy_request_buffering off;

    server {
        listen 443 ssl;
        server_name pipeshubsim.zendesk.com pipeshubsim.zdusercontent.com p1.zdusercontent.com;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location / {
            # No URI part: the request line goes on exactly as the client sent it.
            proxy_pass http://zendesk-sim:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    # Anything else that reaches this container is a name the test did not mean to capture.
    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        return 421;
    }
}
