# Every service that runs an image the base file runs keeps the base file's
# baseline (ADR-OPS-02): no capability but those its image proves it needs, with
# the reason beside each, no privilege gain, and memory and process limits.
# tests/unit/harness/security/test_container_baseline.py checks it.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

# A service whose image writes only to its volumes also gets a read-only root.
x-read-only-root: &read-only-root
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  pipeshub-ai:
    <<: *hardened
    # Only the image entrypoint holds these, as root, for its first moments: it
    # hands earlier root-owned volumes to uid 1000 (CHOWN, DAC_OVERRIDE, FOWNER),
    # then drops to that user (SETUID, SETGID) and empties its bounding set
    # (SETPCAP) before any service starts, so no service process has any of them.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP, KILL]
    image: pipeshub-ai:latest
    restart: always
    build:
      context: ../../../
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        PYTHON_DEPS_IMAGE: ${PYTHON_DEPS_IMAGE:-pipeshubai/pipeshub-ai-base:python-deps}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-pipeshubai/pipeshub-ai-base:runtime}
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
      shm_size: 4gb
      ulimits:
        memlock:
          soft: -1
          hard: -1
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 12G
          pids: 16384
    # Lets the kernel page out memory that a co-located idle service (e.g.
    # Docling's model weights between documents) is holding but not
    # actively using, instead of counting it against the hard OOM cap above
    # forever.
    # mem_swappiness (per-container swap aggressiveness) is a cgroup v1-only
    # knob and is silently discarded with a warning on cgroup v2 hosts
    # (Docker Desktop, modern Linux distros) -- intentionally omitted here.
    memswap_limit: 16G
    shm_size: 2gb
    # 7 services (node, frontend, 5 python) share one container's fd budget;
    # docker's 1024 default hits EMFILE on accept() during startup.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    logging:
      driver: local
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-15}"
        compress: "true"
    environment:
      # Core environment settings
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001}
      - SKIP_DOMAIN_CHECK=${SKIP_DOMAIN_CHECK:-false}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      # Security settings - allow override with custom secret
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY to a random key, e.g. the output of openssl rand -base64 32 (install.sh generates one)}

      # Public endpoints
      - CONNECTOR_PUBLIC_BACKEND=${CONNECTOR_PUBLIC_BACKEND:-}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-}

      # Internal service URLs
      - QUERY_BACKEND=http://localhost:8000
      - CONNECTOR_BACKEND=http://localhost:8088
      - INDEXING_BACKEND=http://localhost:8091
      - EMBEDDING_SERVER_URL=http://localhost:8002

      # Key-Value Store Configuration
      - KV_STORE_TYPE=${KV_STORE_TYPE:-redis}

      # Graph Database config
      - DATA_STORE=neo4j

      # Neo4j config
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-your_password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      
      # Message broker config
      - MESSAGE_BROKER=${MESSAGE_BROKER:-redis}
      - REDIS_STREAMS_MAXLEN=${REDIS_STREAMS_MAXLEN:-10000}
      - REDIS_STREAMS_RETENTION_MODE=${REDIS_STREAMS_RETENTION_MODE:-after_ack}
      # Indexing lanes on Redis Streams: how many (every service must agree), and
      # how a connector is given one: "assigned" (the least busy lane, recorded
      # once) or "hash", which switches assigned lanes off.
      - FAIR_SCHEDULING_LANE_COUNT=${FAIR_SCHEDULING_LANE_COUNT:-8}
      - FAIR_SCHEDULING_LANE_ASSIGNMENT=${FAIR_SCHEDULING_LANE_ASSIGNMENT:-assigned}

      # Redis config — general instance (KV, BullMQ/Celery, Streams)
      # DB 0: KV persistent config  DB 1: BullMQ/Celery  DB 2: Streams
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - REDIS_KV_PREFIX=${REDIS_KV_PREFIX:-pipeshub:kv:}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-10000}
      - REDIS_DB=${REDIS_DB:-0}

      # Redis vector instance — dedicated for RediSearch (isolated from KV/queues)
      # Memory grows with doc count; separate from general instance to prevent OOM
      # of KV/BullMQ/Streams.  REDIS_VECTOR_HOST/PORT fall back to REDIS_HOST/PORT
      # when unset (single-instance mode).
      - REDIS_VECTOR_HOST=redis-vector
      - REDIS_VECTOR_PORT=6379

      # MongoDB config
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/?authSource=admin&replicaSet=rs0&w=majority
      - MONGO_DB_NAME=es
      - REPLICA_SET_AVAILABLE=true

      # Vector DB — Redis Search (requires Redis >= 8.4 for FT.HYBRID)
      - VECTOR_DB_TYPE=redis
      # Dense vector storage dtype for new indexes: FLOAT16 (default, ~2x less
      # index memory, negligible recall loss) or FLOAT32. Changing this only
      # affects newly created indexes.
      - REDIS_VECTOR_DENSE_DTYPE=${REDIS_VECTOR_DENSE_DTYPE:-FLOAT16}

      - OLLAMA_API_URL=http://host.docker.internal:11434

      # Rate limit config
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-2000}
      - MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE=${MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE:-1000}

      # Set to true to replace secrets in config API responses with **** markers
      - HIDE_SECRET_CONFIG=${HIDE_SECRET_CONFIG:-false}

      # MCP OAuth scopes
      - MCP_SCOPES=${MCP_SCOPES:-openid,profile,email,offline_access,semantic:write,conversation:write,conversation:chat,kb:read,kb:write,kb:upload,team:read,user:read,usergroup:read,config:read,agent:read,agent:execute,connector:read,connector:write,connector:sync,code:read,project:read,project:write,project:delete}

      # Token config
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-24h}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-720h}
      - PASSWORD_RESET_LINK_EXPIRY=${PASSWORD_RESET_LINK_EXPIRY:-20m}
      
      # ML thread limit — caps PyTorch / OpenBLAS / MKL threads per operation.
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}

      # Indexing concurrency — leave unset (empty) to let each service derive
      # its ceiling from this container's own cgroup/CPU limits at startup.
      # Set an explicit integer only to pin a hard ceiling.
      - MAX_CONCURRENT_PARSING=${MAX_CONCURRENT_PARSING:-}
      - MAX_CONCURRENT_INDEXING=${MAX_CONCURRENT_INDEXING:-}
      - MAX_PENDING_INDEXING_TASKS=${MAX_PENDING_INDEXING_TASKS:-}
      - QUERY_UVICORN_WORKERS=${QUERY_UVICORN_WORKERS:-}
      # Query-service runtime tuning. Defaults reproduce current behaviour:
      # langchain transport, accessible-records cache on, signed-URL cache off.
      - PIPESHUB_AGENT_TRANSPORT=${PIPESHUB_AGENT_TRANSPORT:-langchain}
      - PIPESHUB_ACCESSIBLE_RECORDS_CACHE=${PIPESHUB_ACCESSIBLE_RECORDS_CACHE:-}
      - PIPESHUB_ACCESSIBLE_RECORDS_CACHE_TTL=${PIPESHUB_ACCESSIBLE_RECORDS_CACHE_TTL:-300}
      - PIPESHUB_SIGNED_URL_CACHE_SECONDS=${PIPESHUB_SIGNED_URL_CACHE_SECONDS:-0}
      # Most characters one agent turn may stream before it is stopped as a
      # runaway. Blank keeps the built-in 1000000; 0 removes the limit.
      - PIPESHUB_AGENT_MAX_TURN_OUTPUT_CHARS=${PIPESHUB_AGENT_MAX_TURN_OUTPUT_CHARS:-}
      # true: features that trade some compute or tokens per question for
      # better answers (keyword hits merged by rank fusion, search results
      # with the most relevant record first, answer composition and
      # multi-step rules, reading an answer's records in full). Off by
      # default. A feature's own switch below, when set to true or false,
      # overrides it for that feature; blank follows it.
      # It also turns on named-entity extraction while indexing, and the
      # entity tools, whatever the Labs flag ENABLE_NAMED_ENTITY_EXTRACTION says.
      - HIGH_ACCURACY_MODE=${HIGH_ACCURACY_MODE:-false}
      - GREP_RANK_FUSION=${GREP_RANK_FUSION:-}
      # Opt-in only: HIGH_ACCURACY_MODE does not turn this one on.
      - KEYWORD_SEARCH_QUERIES=${KEYWORD_SEARCH_QUERIES:-}
      # Opt-in only: knowledge-base uploads take the dates their content
      # states (true: instead of upload times; all: also of file times).
      - CONTENT_DOCUMENT_DATES=${CONTENT_DOCUMENT_DATES:-}
      - RELEVANCE_ORDERED_CONTEXT=${RELEVANCE_ORDERED_CONTEXT:-}
      - FUSION_RECORD_CUT=${FUSION_RECORD_CUT:-}
      - ANSWER_COMPOSITION_RULES=${ANSWER_COMPOSITION_RULES:-}
      - THOROUGH_RETRIEVAL=${THOROUGH_RETRIEVAL:-}
      - MULTI_STEP_ANSWER_RULES=${MULTI_STEP_ANSWER_RULES:-}
      - ENTITY_SEARCH_TOOL=${ENTITY_SEARCH_TOOL:-}
      # On unless set to false; HIGH_ACCURACY_MODE does not change it.
      - TIMELINE_SUMMARIES=${TIMELINE_SUMMARIES:-}
      # On unless set to false; HIGH_ACCURACY_MODE does not change it.
      - DATE_FILTER_SAFETY_NET=${DATE_FILTER_SAFETY_NET:-}
      - FETCH_SIZE_BY_CHARS=${FETCH_SIZE_BY_CHARS:-}
      # On unless set to false; HIGH_ACCURACY_MODE does not change it.
      - TARGETED_RETRIEVAL=${TARGETED_RETRIEVAL:-}
      # Opt-in only: HIGH_ACCURACY_MODE does not turn this one on.
      - SEARCH_SOURCE_DIVERSITY=${SEARCH_SOURCE_DIVERSITY:-}
      - INDEXING_UVICORN_WORKERS=${INDEXING_UVICORN_WORKERS:-1}
      - UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS=${UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS:-60}
      - PARSING_UVICORN_WORKERS=${PARSING_UVICORN_WORKERS:-1}
      - DOCLING_UVICORN_WORKERS=${DOCLING_UVICORN_WORKERS:-1}
      - LOCAL_DOCLING_PARSE_WORKERS=${LOCAL_DOCLING_PARSE_WORKERS:-1}
      - PDF_OCR_DETECTION_WORKERS=${PDF_OCR_DETECTION_WORKERS:-1}
      - ENABLE_PDFPLUMBER_PROCESSOR=${ENABLE_PDFPLUMBER_PROCESSOR:-false}
      - PDF_DOCLING_MAX_PAGES=${PDF_DOCLING_MAX_PAGES:-30}
      - MAX_TABLE_ROWS_FOR_LLM=${MAX_TABLE_ROWS_FOR_LLM:-1000}
      - EXCEL_MAX_TABLE_ROWS_TO_INDEX=${EXCEL_MAX_TABLE_ROWS_TO_INDEX:-20000}
      - EXCEL_HEADER_GENERATION_SAMPLE_SCAN_LIMIT=${EXCEL_HEADER_GENERATION_SAMPLE_SCAN_LIMIT:-500}
      - EMBEDDING_SERVER_ALLOW_REMOTE_CODE=${EMBEDDING_SERVER_ALLOW_REMOTE_CODE:-false}
      
      - OPIK_API_KEY=${OPIK_API_KEY:-}
      - OPIK_WORKSPACE=${OPIK_WORKSPACE:-}

      # AWS credentials (for Bedrock IAM role access from inside the container)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}

      # Slack Bot config
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - SLACK_BOT_PORT=${SLACK_BOT_PORT:-3020}

      # Custom (non-catalog) STDIO MCP servers run an admin-entered command on this
      # host as the app user, with its network access. Off unless "true"; catalog
      # and remote (HTTP) MCP servers are unaffected.
      - MCP_ALLOW_CUSTOM_STDIO=${MCP_ALLOW_CUSTOM_STDIO:-false}

      # Sandbox execution mode (local = subprocess, docker = ephemeral containers).
      # Defaults to "docker" -- the sandbox-image service below builds the required
      # pipeshub/sandbox:latest image before pipeshub-ai starts.
      # Production (docker-compose.prod.yml) pulls pipeshubai/pipeshub-sandbox:${IMAGE_TAG}
      # from the registry instead; build/push from deployment/sandbox alongside pipeshub-ai.
      - SANDBOX_MODE=${SANDBOX_MODE:-docker}
      # SANDBOX_MODE=local is refused unless this is "true" (single-user dev only).
      - SANDBOX_ALLOW_LOCAL=${SANDBOX_ALLOW_LOCAL:-false}
      # Generated code gets no network unless set to true; even then private,
      # link-local and cloud-metadata addresses are firewalled. CIDRs in
      # SANDBOX_EGRESS_ALLOW_CIDRS (comma-separated, e.g. a pip mirror) are exempt.
      - SANDBOX_ALLOW_NETWORK=${SANDBOX_ALLOW_NETWORK:-false}
      - SANDBOX_EGRESS_ALLOW_CIDRS=${SANDBOX_EGRESS_ALLOW_CIDRS:-}
      - SANDBOX_DOCKER_IMAGE=${SANDBOX_DOCKER_IMAGE:-pipeshub/sandbox:latest}
      - SANDBOX_EGRESS_NETWORK=${SANDBOX_EGRESS_NETWORK:-pipeshub_sandbox_egress}
      # The app never sees the Docker socket; sandbox containers are created
      # through docker-socket-proxy, which only admits sandbox-shaped requests.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - DOCKER_PROXY_TOKEN=${DOCKER_PROXY_TOKEN:?set DOCKER_PROXY_TOKEN (install.sh generates it)}
      # Per-run writable-layer cap (default 10g; 0 disables). Enforced only where
      # the storage driver supports it; logs a warning once otherwise.
      - SANDBOX_DISK_QUOTA=${SANDBOX_DISK_QUOTA:-10g}

    depends_on:
      docker-socket-proxy:
        # Not service_healthy: an older image (rollback.sh) has no proxy
        # module, and that must cost run_code, not the whole app.
        condition: service_started
        required: false
      redis:
        condition: service_healthy
      redis-vector:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully

    networks:
      - default
      - sandbox-control
    volumes:
      - pipeshub_data:/data/pipeshub
      - pipeshub_root_local:/root/.local
      # Persist the HuggingFace model cache so models pulled at runtime survive
      # container recreation instead of being re-downloaded on every restart.
      - pipeshub_hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Probe the aggregated /api/v1/health/services endpoint served by the
    # nodejs API. If curl succeeds, the nodejs service itself is up; the JSON
    # body must additionally report every Python application service
    # (query, connector, indexing, docling, embedding) as "healthy" before the container
    # is considered ready. This makes `docker compose up --wait` block until
    # all pipeshub services inside the container have finished starting.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -sf http://localhost:3000/api/v1/health/services -o /tmp/hc.json &&
          python3 -c "import json,sys; d=json.load(open('/tmp/hc.json')); s=d.get('services',{}) or {}; required=('query','connector','indexing','docling'); sys.exit(0 if all(s.get(k)=='healthy' for k in required) and s.get('embedding') in ('healthy','starting') else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s

  # The only container with the Docker socket. It forwards just the calls the
  # coding sandbox makes, refuses any container create that would reach the
  # host (privileged, binds, devices, host namespaces, other images or
  # networks), and only acts on containers it created. See
  # backend/python/app/sandbox/docker_proxy.py.
  docker-socket-proxy:
    <<: [*hardened, *read-only-root]
    # Reaches the Docker socket through the socket's group, never as root (SEC-D-02):
    # set DOCKER_GID to the socket's group (stat -c %g /var/run/docker.sock); the
    # default 0 fits Docker Desktop, whose socket is root:root.
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:-0}"
    image: pipeshub-ai:latest
    restart: always
    working_dir: /app/python
    # Bypasses the image entrypoint, which drops privileges for the app and
    # needs capabilities this container deliberately does not have.
    entrypoint: ["python", "-m", "app.docker_proxy_main"]
    environment:
      # SEC-A-04: every caller sends this credential; the proxy beside the Docker socket holds no SECRET_KEY
      # (ADR-KEY-02).
      - DOCKER_PROXY_TOKEN=${DOCKER_PROXY_TOKEN:?set DOCKER_PROXY_TOKEN (install.sh generates it)}
      - SANDBOX_DOCKER_IMAGE=${SANDBOX_DOCKER_IMAGE:-pipeshub/sandbox:latest}
      - SANDBOX_EGRESS_NETWORK=${SANDBOX_EGRESS_NETWORK:-pipeshub_sandbox_egress}
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 4096
    networks:
      - sandbox-control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2375/_ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    # Single-node replica set, defined once in the base file.
    extends:
      file: ../docker-compose.yml
      service: mongodb
    # The base file attaches its own network; this file uses the default one.
    networks: !reset null
    environment:
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}

  redis:
    <<: [*hardened, *read-only-root]
    # The image entrypoint hands /data to the redis user (CHOWN, and DAC_READ_SEARCH
    # to reach into the 0700 folder an earlier root-running redis left), drops to it
    # (SETUID, SETGID) and empties its bounding set (SETPCAP: Redis 8's entrypoint
    # stops without it); redis-server holds none of them. The command goes through
    # that entrypoint: started straight from sh, redis-server ran as root.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID, SETPCAP]
    # General-purpose Redis: KV persistent config (DB 0), BullMQ/Celery queues
    # (DB 1), Redis Streams (DB 2).  Through the image entrypoint Redis 8 loads its
    # bundled modules, RediSearch among them; with no index and no --search-workers
    # it runs no HNSW background workers.  Memory stays bounded by design:
    # KV has finite keys, BullMQ uses removeOnComplete, Streams use MAXLEN.
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c "exec docker-entrypoint.sh redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 4096

  redis-vector:
    <<: [*hardened, *read-only-root]
    # The image entrypoint hands /data to the redis user (CHOWN, and DAC_READ_SEARCH
    # to reach into the 0700 folder an earlier root-running redis left), drops to it
    # (SETUID, SETGID) and empties its bounding set (SETPCAP: Redis 8's entrypoint
    # stops without it); redis-server holds none of them. The command goes through
    # that entrypoint: started straight from sh, redis-server ran as root.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID, SETPCAP]
    # Dedicated Redis vector DB: HNSW indexes over HASH-backed documents with
    # binary FLOAT16 vectors (2 bytes/dim).  Isolated from the general instance
    # so vector memory growth (proportional to indexed docs) cannot OOM KV/queues.
    #
    # Memory budget (ON HASH + FLOAT16):
    #   ~3 KB/doc  →  10K docs ≈ 30 MB, 100K docs ≈ 300 MB, 1M docs ≈ 3 GB
    # Set deploy.resources.limits.memory accordingly when scaling past 100K docs.
    #
    # --search-workers moves HNSW indexing off the main thread into a background
    # tiered pool. With the default (0) every HSET is indexed synchronously and
    # per-insert latency grows with graph size (~25 ms/vector at 20k docs vs
    # ~1 ms with workers).  Tune REDIS_SEARCH_WORKERS toward available CPU cores.
    #
    # The image entrypoint loads the bundled modules, RediSearch among them, when the
    # command is redis-server; loading search again aborts the server, so the command
    # names no --loadmodule. Storage is ON HASH, so ReJSON goes unused.
    image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports: 
    - "6379:6379"
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_SEARCH_WORKERS=${REDIS_SEARCH_WORKERS:-4}
    command: >
      sh -c "exec docker-entrypoint.sh redis-server
      --search-workers ${REDIS_SEARCH_WORKERS:-4}
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    volumes:
      - redis_vector_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 4096

  neo4j:
    <<: *hardened
    # Its entrypoint, as root, hands /data, /logs and the plugin folder to the
    # neo4j user (CHOWN, DAC_OVERRIDE, FOWNER) and drops to it (SETUID, SETGID).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    image: neo4j:5.26.0@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5
    ulimits:
      nofile:
        soft: 60000
        hard: 60000
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-your_password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          cpus: '4'
          # 2G heap + 1G page cache still needs JVM/native headroom.
          memory: 4G
          pids: 4096
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Build-only helper that ensures the pipeshub/sandbox:latest image is
  # available on the host Docker daemon before pipeshub-ai starts.
  # The container itself is a no-op: it prints a message and exits 0, leaving
  # the image in place for SANDBOX_MODE=docker ephemeral execution.
  sandbox-image:
    <<: [*hardened, *read-only-root]
    image: pipeshub/sandbox:latest
    build:
      context: ../../../deployment/sandbox
      dockerfile: Dockerfile
    restart: "no"
    command: ["sh", "-c", "echo 'pipeshub/sandbox:latest image ready'"]
    deploy:
      resources:
        limits:
          memory: 64M
          pids: 4096

volumes:
  mongodb_data:
    driver: local
  mongodb_replset_key:
    driver: local
  redis_data:
    driver: local
  redis_vector_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  pipeshub_data:
    driver: local
  pipeshub_root_local:
    driver: local
  pipeshub_hf_cache:
    driver: local

networks:
