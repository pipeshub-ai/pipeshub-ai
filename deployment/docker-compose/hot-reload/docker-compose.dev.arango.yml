# Every service that runs an image the base file runs keeps the base file's
# baseline (ADR-OPS-02): no capability but those its image proves it needs, with
# the reason beside each, no privilege gain, and memory and process limits.
# tests/unit/harness/security/test_container_baseline.py checks it.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

# A service whose image writes only to its volumes also gets a read-only root.
x-read-only-root: &read-only-root
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  pipeshub-ai:
    image: pipeshub-ai:latest
    restart: always
    build:
      dockerfile: Dockerfile.dev
      args:
        - BUILDKIT_INLINE_CACHE=1
        - PYTHON_DEPS_BASE=${PYTHON_DEPS_BASE:-build-base}
      shm_size: 4gb
      ulimits:
        memlock:
          soft: -1
          hard: -1
    ports:
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "8081:8081"
      - "8088:8088"
      - "3000:3000"
      - "3001:3001"
      - "3020:3020"
      - "8001:8000"
    deploy:
      resources:
        limits:
          memory: 12G
    # Lets the kernel page out memory that a co-located idle service (e.g.
    # Docling's model weights between documents) is holding but not
    # actively using, instead of counting it against the hard OOM cap above
    # forever. memswap_limit is the combined memory+swap ceiling (not a
    # separate swap allowance), so 12G memory / 16G memswap gives 4G of swap.
    # mem_swappiness (per-container swap aggressiveness) is a cgroup v1-only
    # knob and is silently discarded with a warning on cgroup v2 hosts
    # (Docker Desktop, modern Linux distros) -- intentionally omitted here.
    memswap_limit: 16G
    shm_size: 2gb
    # 7 services (node, frontend, 5 python) share one container's fd budget;
    # docker's 1024 default hits EMFILE on accept() during startup.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    logging:
      driver: local
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-15}"
        compress: "true"
    environment:
      # Core environment settings
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001}
      - SKIP_DOMAIN_CHECK=${SKIP_DOMAIN_CHECK:-false}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      # Security settings - allow override with custom secret
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY to a random key, e.g. the output of openssl rand -base64 32 (install.sh generates one)}

      # Public endpoints
      - CONNECTOR_PUBLIC_BACKEND=${CONNECTOR_PUBLIC_BACKEND:-}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-}

      # Internal service URLs
      - QUERY_BACKEND=http://localhost:8000
      - CONNECTOR_BACKEND=http://localhost:8088
      - INDEXING_BACKEND=http://localhost:8091
      - EMBEDDING_SERVER_URL=http://localhost:8002
      # Standalone parsing / extraction services (opt-in)
      - PARSING_SERVICE_URL=http://localhost:8092
      - EXTRACTION_SERVICE_URL=http://localhost:8093
      - USE_PARSING_SERVICE=${USE_PARSING_SERVICE:-true}
      - CODE_FILE_CLASSIFICATION=${CODE_FILE_CLASSIFICATION:-true}

      # Key-Value Store Configuration
      - KV_STORE_TYPE=${KV_STORE_TYPE:-etcd}

      # ETCD config
      - ETCD_URL=http://etcd:2379
      - ETCD_HOST=etcd
      - ETCD_TIMEOUT=${ETCD_TIMEOUT:-5000}

      # ArangoDB config
      - ARANGO_URL=http://arango:8529
      - ARANGO_DB_NAME=es
      - ARANGO_USERNAME=root
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:-your_password}
      # Ensure we use the same password as configured for the ArangoDB service

      # Message broker config
      - MESSAGE_BROKER=${MESSAGE_BROKER:-redis}
      - REDIS_STREAMS_MAXLEN=${REDIS_STREAMS_MAXLEN:-500000}
      - REDIS_STREAMS_RETENTION_MODE=${REDIS_STREAMS_RETENTION_MODE:-after_ack}
      # Indexing lanes on Redis Streams: how many (every service must agree), and
      # how a connector is given one: "assigned" (the least busy lane, recorded
      # once) or "hash", which switches assigned lanes off.
      - FAIR_SCHEDULING_LANE_COUNT=${FAIR_SCHEDULING_LANE_COUNT:-8}
      - FAIR_SCHEDULING_LANE_ASSIGNMENT=${FAIR_SCHEDULING_LANE_ASSIGNMENT:-assigned}

      # Kafka config
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka-1:9092}
      - KAFKA_SSL=${KAFKA_SSL:-false}
      - KAFKA_USERNAME=${KAFKA_USERNAME:-}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD:-}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}

      # Redis config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - REDIS_KV_PREFIX=${REDIS_KV_PREFIX:-pipeshub:kv:}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-10000}
      - REDIS_DB=${REDIS_DB:-0}

      # MongoDB config
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/?authSource=admin&replicaSet=rs0&w=majority
      - MONGO_DB_NAME=es
      - REPLICA_SET_AVAILABLE=true

      # Qdrant config
      - QDRANT_API_KEY=${QDRANT_API_KEY:-your_qdrant_secret_api_key}
      - QDRANT_HOST=qdrant
      - QDRANT_MEMORY_LIMIT=${QDRANT_MEMORY_LIMIT:-4G}
      - QDRANT_GRPC_PORT=6334
      - QDRANT_PORT=6333

      - OLLAMA_API_URL=http://host.docker.internal:11434

      # Rate limit config
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-2000}
      - MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE=${MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE:-1000}

      # Set to true to replace secrets in config API responses with **** markers
      - HIDE_SECRET_CONFIG=${HIDE_SECRET_CONFIG:-false}

      # MCP OAuth scopes
      - MCP_SCOPES=${MCP_SCOPES:-openid,profile,email,offline_access,semantic:write,conversation:write,conversation:chat,kb:read,kb:write,kb:upload,team:read,user:read,usergroup:read,config:read,agent:read,agent:execute,connector:read,connector:write,connector:sync,code:read,project:read,project:write,project:delete}

      # Token config
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-24h}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-720h}
      - PASSWORD_RESET_LINK_EXPIRY=${PASSWORD_RESET_LINK_EXPIRY:-20m}
      
      # ML thread limit — caps PyTorch / OpenBLAS / MKL threads per operation.
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}

      # Indexing concurrency — leave unset (empty) to let each service derive
      # its ceiling from this container's own cgroup/CPU limits at startup.
      # Set an explicit integer only to pin a hard ceiling.
      - MAX_CONCURRENT_PARSING=${MAX_CONCURRENT_PARSING:-}
      - MAX_CONCURRENT_INDEXING=${MAX_CONCURRENT_INDEXING:-}
      - MAX_PENDING_INDEXING_TASKS=${MAX_PENDING_INDEXING_TASKS:-}
      - QUERY_UVICORN_WORKERS=${QUERY_UVICORN_WORKERS:-}
      # Query-service runtime tuning. Defaults reproduce current behaviour:
      # langchain transport, accessible-records cache on, signed-URL cache off.
      - PIPESHUB_AGENT_TRANSPORT=${PIPESHUB_AGENT_TRANSPORT:-langchain}
      - PIPESHUB_ACCESSIBLE_RECORDS_CACHE=${PIPESHUB_ACCESSIBLE_RECORDS_CACHE:-}
      - PIPESHUB_ACCESSIBLE_RECORDS_CACHE_TTL=${PIPESHUB_ACCESSIBLE_RECORDS_CACHE_TTL:-300}
      - PIPESHUB_SIGNED_URL_CACHE_SECONDS=${PIPESHUB_SIGNED_URL_CACHE_SECONDS:-0}
      # Stored-record cache: memory (default, per worker, up to 512 MiB) | redis.
      - PIPESHUB_RECORD_CACHE_BACKEND=${PIPESHUB_RECORD_CACHE_BACKEND:-memory}
      - PIPESHUB_RECORD_CACHE_BYTES=${PIPESHUB_RECORD_CACHE_BYTES:-}
      # ripgrep threads per search; blank = half the container's CPUs (also the cap).
      - GREP_THREADS=${GREP_THREADS:-}
      # Most characters one agent turn may stream before it is stopped as a
      # runaway. Blank keeps the built-in 1000000; 0 removes the limit.
      - PIPESHUB_AGENT_MAX_TURN_OUTPUT_CHARS=${PIPESHUB_AGENT_MAX_TURN_OUTPUT_CHARS:-}
      # true: features that trade some compute or tokens per question for
      # better answers (keyword hits merged by rank fusion, search results
      # with the most relevant record first, answer composition and
      # multi-step rules, reading an answer's records in full). Off by
      # default. A feature's own switch below, when set to true or false,
      # overrides it for that feature; blank follows it.
      # It also turns on named-entity extraction while indexing, and the
      # entity tools, whatever the Labs flag ENABLE_NAMED_ENTITY_EXTRACTION says.
      - HIGH_ACCURACY_MODE=${HIGH_ACCURACY_MODE:-false}
      - GREP_RANK_FUSION=${GREP_RANK_FUSION:-}
      # Opt-in only: HIGH_ACCURACY_MODE does not turn this one on.
      - KEYWORD_SEARCH_QUERIES=${KEYWORD_SEARCH_QUERIES:-}
      # Opt-in only: knowledge-base uploads take the dates their content
      # states (true: instead of upload times; all: also of file times).
      - CONTENT_DOCUMENT_DATES=${CONTENT_DOCUMENT_DATES:-}
      - RELEVANCE_ORDERED_CONTEXT=${RELEVANCE_ORDERED_CONTEXT:-}
      - FUSION_RECORD_CUT=${FUSION_RECORD_CUT:-}
      - ANSWER_COMPOSITION_RULES=${ANSWER_COMPOSITION_RULES:-}
      - THOROUGH_RETRIEVAL=${THOROUGH_RETRIEVAL:-}
      - MULTI_STEP_ANSWER_RULES=${MULTI_STEP_ANSWER_RULES:-}
      - ENTITY_SEARCH_TOOL=${ENTITY_SEARCH_TOOL:-}
      # On unless set to false; HIGH_ACCURACY_MODE does not change it.
      - TIMELINE_SUMMARIES=${TIMELINE_SUMMARIES:-}
      # On unless set to false; HIGH_ACCURACY_MODE does not change it.
      - DATE_FILTER_SAFETY_NET=${DATE_FILTER_SAFETY_NET:-}
      - FETCH_SIZE_BY_CHARS=${FETCH_SIZE_BY_CHARS:-}
      # On unless set to false; HIGH_ACCURACY_MODE does not change it.
      - TARGETED_RETRIEVAL=${TARGETED_RETRIEVAL:-}
      # Opt-in only: HIGH_ACCURACY_MODE does not turn this one on.
      - SEARCH_SOURCE_DIVERSITY=${SEARCH_SOURCE_DIVERSITY:-}
      - INDEXING_UVICORN_WORKERS=${INDEXING_UVICORN_WORKERS:-1}
      - UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS=${UVICORN_WORKER_HEALTHCHECK_TIMEOUT_SECONDS:-60}
      - PARSING_UVICORN_WORKERS=${PARSING_UVICORN_WORKERS:-1}
      - DOCLING_UVICORN_WORKERS=${DOCLING_UVICORN_WORKERS:-1}
      - LOCAL_DOCLING_PARSE_WORKERS=${LOCAL_DOCLING_PARSE_WORKERS:-4}
      - PDF_OCR_DETECTION_WORKERS=${PDF_OCR_DETECTION_WORKERS:-4}
      - MAX_TABLE_ROWS_FOR_LLM=${MAX_TABLE_ROWS_FOR_LLM:-1000}
      - INDEXING_TABLE_ROW_BATCH_SIZE=${INDEXING_TABLE_ROW_BATCH_SIZE:-50}
      - EXCEL_MAX_TABLE_ROWS_TO_INDEX=${EXCEL_MAX_TABLE_ROWS_TO_INDEX:-20000}
      - EXCEL_HEADER_GENERATION_SAMPLE_SCAN_LIMIT=${EXCEL_HEADER_GENERATION_SAMPLE_SCAN_LIMIT:-500}

      - OPIK_API_KEY=${OPIK_API_KEY:-}
      - OPIK_WORKSPACE=${OPIK_WORKSPACE:-}

      # AWS credentials (for Bedrock IAM role access from inside the container)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}

      # Slack Bot config
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - SLACK_BOT_PORT=${SLACK_BOT_PORT:-3020}

      - ENABLE_PDFPLUMBER_PROCESSOR=${ENABLE_PDFPLUMBER_PROCESSOR:-false}
      - PDF_DOCLING_MAX_PAGES=${PDF_DOCLING_MAX_PAGES:-30}
      - PDF_DOCLING_TABLE_MODE=${PDF_DOCLING_TABLE_MODE:-accurate}

      # Next.js frontend dev (browser calls Node API on host port 3000)
      - DOCKER_DEV=true
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
      
      # Frontend memory optimization - limit Node.js heap to 2GB
      - NODE_OPTIONS=--max-old-space-size=2048
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      etcd:
        condition: service_healthy
      arango:
        condition: service_healthy

    volumes:
      - pipeshub_data:/data/pipeshub
      - pipeshub_root_local:/root/.local
      # Persist the HuggingFace model cache so models pulled at runtime survive
      # container recreation instead of being re-downloaded on every restart.
      - pipeshub_hf_cache:/root/.cache/huggingface
      # ── Hot Reload: bind-mount source code so watchers pick up file saves ──
      - ../scripts/dev_process_monitor.sh:/app/dev_process_monitor.sh
      - ../../../backend/python/app:/app/python/app
      - ../../../backend/python/harness_core:/app/python/harness_core
      # Mount entire source directories — picks up all config file additions automatically
      - ../../../backend/nodejs/apps:/app/backend
      - ../../../frontend:/app/frontend
      # Anonymous volumes protect container node_modules from being overwritten by host
      - /app/backend/node_modules
      - /app/frontend/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/health/services || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongodb:
    # Single-node replica set, defined once in the base file.
    extends:
      file: ../docker-compose.yml
      service: mongodb
    # The base file attaches its own network; this file uses the default one.
    networks: !reset null
    # Host tools must add directConnection=true: the member advertises
    # mongodb:27017, which only resolves inside the Compose network.
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}

  redis:
    <<: [*hardened, *read-only-root]
    # The image entrypoint hands /data to the redis user (CHOWN, and DAC_READ_SEARCH
    # to reach into the 0700 folder an earlier root-running redis left) and drops to
    # it (SETUID, SETGID); redis-server holds none of them. The command goes through
    # that entrypoint: started straight from sh, redis-server ran as root.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    image: redis:7.4.12-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c "exec docker-entrypoint.sh redis-server
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 4096

  arango:
    <<: *hardened
    image: arangodb:3.12.4@sha256:b7cc8dbf5f24c0fe235b6e50a26dbcfaebaf9abe0d322acefcf3dab63b5a0102
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_PASSWORD:-your_password}
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://localhost:8529 --server.password '${ARANGO_PASSWORD:-your_password}' --javascript.execute-string 'db._version()' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 4096

  etcd:
    <<: [*hardened, *read-only-root]
    image: quay.io/coreos/etcd:v3.5.17@sha256:a055da833a7c013b836ed0822e8ec1f99b059658be255ad8d0fcd31b635ae3d6
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    command: >
      etcd
      --name etcd-node
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://0.0.0.0:2380
      --initial-cluster etcd-node=http://0.0.0.0:2380
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 4096

  zookeeper:
    <<: *hardened
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.9.0@sha256:5ae28c2f45b89e12e8ba27bd0cfbe6488ef7082a17f01c878ab7f1841a58874b
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 4096

  kafka-1:
    <<: *hardened
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.9.0@sha256:02170e46da5c36b1581cd42ebfbf2a55edae6348c62bc772bc2166841db745b2
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=ACCESS:PLAINTEXT
      - KAFKA_LISTENERS=ACCESS://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=ACCESS://kafka-1:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=ACCESS
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_CREATE_TOPICS=record-events:32:1,entity-events:1:1,sync-events:1:1
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_NUM_NETWORK_THREADS=3
      - KAFKA_NUM_IO_THREADS=8
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
          pids: 4096

  qdrant:
    <<: *hardened
    image: qdrant/qdrant:v1.15.5@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    stop_grace_period: 120s
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-your_qdrant_secret_api_key}
      # Performance optimizations
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=64
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
      - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=8
      - QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD=10000  # KB, not points: memory-map any segment over 10 MB
      - QDRANT__STORAGE__WAL__WAL_CAPACITY_MB=256
      - QDRANT__CLUSTER__CONSENSUS__MAX_MESSAGE_QUEUE_SIZE=1000
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '4'
          # Search slows sharply once the index outgrows this; size it from
          # docs/deployment/vector-db-sizing.md. QDRANT_MEMORY_LIMIT also tells
          # the app the figure, for the warning on the Services page.
          memory: ${QDRANT_MEMORY_LIMIT:-4G}
          pids: 4096
        reservations:
          cpus: '2'
          memory: 2G
    ulimits:
      nofile:
        soft: 50000
        hard: 50000
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    driver: local
  mongodb_replset_key:
    driver: local
  redis_data:
    driver: local
  arango_data:
    driver: local
  etcd_data:
    driver: local
  qdrant_storage:
    driver: local
  pipeshub_data:
    driver: local
  pipeshub_root_local:
    driver: local
  pipeshub_hf_cache:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
