services:
  pipeshub-ai:
    image: pipeshub-ai:latest
    restart: always
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        PYTHON_DEPS_IMAGE: ${PYTHON_DEPS_IMAGE:-pipeshubai/pipeshub-ai-base:python-deps}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-pipeshubai/pipeshub-ai-base:runtime}
      shm_size: 4gb
      ulimits:
        memlock:
          soft: -1
          hard: -1
    ports:
      - "8091:8091"
      - "8081:8081"
      - "8088:8088"
      - "3000:3000"
      - "3020:3020"
      - "8001:8000"
    deploy:
      resources:
        limits:
          # OOM cap only (not reserved). Sibling service limits are likewise caps.
          memory: 12G
    # Lets the kernel page out memory that a co-located idle service (e.g.
    # Docling's model weights between documents) is holding but not
    # actively using, instead of counting it against the hard OOM cap above
    # forever. memswap_limit is the combined memory+swap ceiling (not a
    # separate swap allowance), so 12G memory / 16G memswap gives 4G of swap.
    # mem_swappiness (per-container swap aggressiveness) is a cgroup v1-only
    # knob and is silently discarded with a warning on cgroup v2 hosts
    # (Docker Desktop, modern Linux distros) -- intentionally omitted here.
    memswap_limit: 16G
    shm_size: 2gb
    # 7 services (node, frontend, 5 python) share one container's fd budget;
    # docker's 1024 default hits EMFILE on accept() during startup.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    init: true
    logging:
      driver: local
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILE:-15}"
        compress: "true"
    environment:
      # Core environment settings
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - STRICT_MODE=${STRICT_MODE:-false}
      - SKIP_DOMAIN_CHECK=${SKIP_DOMAIN_CHECK:-false}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      # Security settings - allow override with custom secret
      - SECRET_KEY=${SECRET_KEY:-your_random_encryption_secret_key}

      # Public endpoints
      - CONNECTOR_PUBLIC_BACKEND=${CONNECTOR_PUBLIC_BACKEND:-}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-}

      # Internal service URLs
      - QUERY_BACKEND=http://localhost:8000
      - CONNECTOR_BACKEND=http://localhost:8088
      - INDEXING_BACKEND=http://localhost:8091
      - EMBEDDING_SERVER_URL=http://localhost:8002
      # Standalone parsing / extraction services (opt-in)
      - PARSING_SERVICE_URL=http://localhost:8092
      - EXTRACTION_SERVICE_URL=http://localhost:8093
      - USE_PARSING_SERVICE=${USE_PARSING_SERVICE:-true}
      - DEFER_EXTRACTION=${DEFER_EXTRACTION:-false}

      # Key-Value Store Configuration
      - KV_STORE_TYPE=${KV_STORE_TYPE:-redis}

      # Graph Database config
      - DATA_STORE=neo4j

      # Neo4j config
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-your_password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      
      # Message broker config
      - MESSAGE_BROKER=${MESSAGE_BROKER:-redis}
      - REDIS_STREAMS_MAXLEN=${REDIS_STREAMS_MAXLEN:-500000}

      # Kafka config
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka-1:9092}
      - KAFKA_SSL=${KAFKA_SSL:-false}
      - KAFKA_USERNAME=${KAFKA_USERNAME:-}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD:-}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-}

      # Redis config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - REDIS_KV_PREFIX=${REDIS_KV_PREFIX:-pipeshub:kv:}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT:-10000}
      - REDIS_DB=${REDIS_DB:-0}

      # MongoDB config
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/?authSource=admin
      - MONGO_DB_NAME=es
      # Standalone mongod — multi-document transactions unavailable. App branches on this.
      - REPLICA_SET_AVAILABLE=false

      # Qdrant config
      - QDRANT_API_KEY=${QDRANT_API_KEY:-your_qdrant_secret_api_key}
      - QDRANT_HOST=qdrant
      - QDRANT_GRPC_PORT=6334
      - QDRANT_PORT=6333

      - OLLAMA_API_URL=http://host.docker.internal:11434

      # Rate limit config
      - MAX_REQUESTS_PER_MINUTE=${MAX_REQUESTS_PER_MINUTE:-5000}
      - MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE=${MAX_OAUTH_CLIENT_REQUESTS_PER_MINUTE:-1000}

      # Set to true to replace secrets in config API responses with **** markers
      - HIDE_SECRET_CONFIG=${HIDE_SECRET_CONFIG:-false}

      # MCP OAuth scopes
      - MCP_SCOPES=${MCP_SCOPES:-openid,profile,email,offline_access,semantic:write,conversation:write,conversation:chat,kb:read,team:read,user:read,config:read,agent:read,agent:execute,connector:read}

      # Token config
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY:-24h}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-720h}
      
      # ML thread limit — caps PyTorch / OpenBLAS / MKL threads per operation.
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}

      # Indexing concurrency — leave unset (empty) to let each service derive
      # its ceiling from this container's own cgroup/CPU limits at startup.
      # Set an explicit integer only to pin a hard ceiling.
      - MAX_CONCURRENT_PARSING=${MAX_CONCURRENT_PARSING:-}
      - MAX_CONCURRENT_INDEXING=${MAX_CONCURRENT_INDEXING:-}

      - OPIK_API_KEY=${OPIK_API_KEY:-}
      - OPIK_WORKSPACE=${OPIK_WORKSPACE:-}

      # AWS credentials (for Bedrock IAM role access from inside the container)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}

      # Slack Bot config
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - SLACK_BOT_PORT=${SLACK_BOT_PORT:-3020}

      - ENABLE_PDFPLUMBER_PROCESSOR=true

    depends_on:
      # Blocks until the bucket exists. Without it pytest can start while
      # minio-init is still running, and the MinIO suite fails on a bucket
      # that is merely late rather than missing.
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      neo4j:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Only started with the kafka profile (a Kafka run); required: false lets
      # the default Redis Streams run start without it.
      kafka-1:
        condition: service_healthy
        required: false
    volumes:
      - pipeshub_data:/data/pipeshub
      # Local FS connector tests write files here and the connector reads them
      # (integration-tests/connectors/local_fs). Committed, so the checkout
      # owns it and the test process can write to it.
      - ../../integration-tests/local_fs_root:/srv/local-fs-it:ro
      - pipeshub_root_local:/root/.local
      # Persist the HuggingFace model cache so models pulled at runtime survive
      # container recreation instead of being re-downloaded on every restart.
      - pipeshub_hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mongodb:
    image: mongo:${MONGO_IMAGE_TAG:-8.0.17}
    restart: always
    # Shared ~16 GB hosts: cap WiredTiger so Mongo does not grab ~half of RAM.
    # Sibling deploy.limits are OOM caps, not concurrent reservations.
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
      - GLIBC_TUNABLES=${MONGO_GLIBC_TUNABLES:-glibc.pthread.rseq=0}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL here is a connector *source* — data to be indexed — not a store
  # the platform uses. It lets the PostgreSQL connector be tested without an
  # external database, the same way MinIO covers object storage.
  postgres-source:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-pipeshubtest}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-pipeshubtest123}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-pipeshub_connector_test}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-pipeshubtest} -d ${POSTGRES_TEST_DB:-pipeshub_connector_test}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A website and feeds for the Web and RSS connectors to sync from, so both
  # have live coverage without depending on a public site. Tests change what it
  # serves through its control API (integration-tests/helper/web_fixtures.py).
  web-fixtures:
    image: python:3.12.11-alpine3.22
    restart: always
    command: ["python", "/srv/server.py", "--seed", "/srv/seed", "--port", "8080", "--base-url", "http://web-fixtures:8080"]
    volumes:
      - ../../integration-tests/web_fixtures:/srv:ro
    ports:
      - "127.0.0.1:8089:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/__fixtures__/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MariaDB, like postgres-source, is a connector *source* for the MariaDB
  # connector's tests, not a store the platform uses.
  mariadb-source:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_USER: ${MARIADB_TEST_USER:-pipeshubtest}
      MARIADB_PASSWORD: ${MARIADB_TEST_PASSWORD:-pipeshubtest123}
      MARIADB_DATABASE: ${MARIADB_TEST_DB:-pipeshub_connector_test}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nextcloud and BookStack are connector *sources*, like mariadb-source, and
  # large enough to start only where their tests run: the workflow sets
  # COMPOSE_PROFILES=selfhosted-sources for that shard.
  nextcloud-source:
    image: nextcloud:31.0.9-apache
    profiles: ["selfhosted-sources"]
    restart: always
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-pipeshubadmin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-pipeshub-nc-admin-123}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud-source"
    volumes:
      # Turns off sample files before the test user's first login.
      - ../../integration-tests/nextcloud_source/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 3s
      retries: 60

  bookstack-db:
    image: mariadb:11.4
    profiles: ["selfhosted-sources"]
    restart: always
    environment:
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:-bookstack123}
      MARIADB_DATABASE: bookstack
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      # Published so the tests can create BookStack's API token (see
      # integration-tests/connectors/bookstack/bookstack_source_helper.py).
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  bookstack-source:
    image: lscr.io/linuxserver/bookstack:v26.05.4-ls282
    profiles: ["selfhosted-sources"]
    restart: always
    depends_on:
      bookstack-db:
        condition: service_healthy
    environment:
      APP_URL: http://bookstack-source
      # Any valid Laravel key; this instance holds only test data.
      APP_KEY: base64:cGlwZXNodWItaW50ZWdyYXRpb24tYm9va3N0YWNrMDA=
      DB_HOST: bookstack-db
      DB_PORT: "3306"
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:-bookstack123}
      DB_DATABASE: bookstack
    # The image's nginx also listens on IPv6, and fails to start on hosts
    # without it. Seed its site config without those lines, then start as usual.
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /config/nginx/site-confs && sed '/listen \[::\]/d' /defaults/nginx/site-confs/default.conf.sample > /config/nginx/site-confs/default.conf && exec /init
    ports:
      - "127.0.0.1:8094:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost/login"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4-bookworm
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c "redis-server
      --appendonly yes
      --appendfsync everysec
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    volumes:
      - redis_data:/data

  # Local SMTP sink for mail-dependent integration tests: CI runners cannot
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO gives the MinIO connector a real S3-compatible endpoint to sync from,
  # so that connector has live coverage without an external account. The bucket
  # is created by minio-init rather than by the tests, which never create or
  # delete buckets.
  minio:
    # MinIO no longer publishes these images on Docker Hub (the minio/minio and
    # minio/mc repositories now return "repository does not exist"), so pull the
    # identical release tags from quay.io, MinIO's own registry, pinned by
    # manifest digest because quay is a historical archive rather than a
    # maintained channel, so a re-pushed tag would not change what CI pulls.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pipeshubtest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pipeshubtest123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-pipeshubtest} ${MINIO_ROOT_PASSWORD:-pipeshubtest123} &&
      mc mb --ignore-existing local/${MINIO_TEST_BUCKET:-pipeshub-connector-test} &&
      echo 'minio bucket ready'
      "

  neo4j:
    image: neo4j:5.26.0
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-your_password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  zookeeper:
    profiles: ["kafka"]
    image: confluentinc/cp-zookeeper:7.9.0
    restart: always
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.9.0
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=ACCESS:PLAINTEXT,HOST:PLAINTEXT
      - KAFKA_LISTENERS=ACCESS://0.0.0.0:9092,HOST://0.0.0.0:29092
      - KAFKA_ADVERTISED_LISTENERS=ACCESS://kafka-1:9092,HOST://localhost:29092
      - KAFKA_INTER_BROKER_LISTENER_NAME=ACCESS
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_CREATE_TOPICS=record-events:1:1,entity-events:1:1,sync-events:1:1
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_NUM_NETWORK_THREADS=3
      - KAFKA_NUM_IO_THREADS=8
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.15
    stop_grace_period: 120s
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-your_qdrant_secret_api_key}
      # Performance optimizations
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=64
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
      - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=8
      - QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD=10000  # KB, not points: memory-map any segment over 10 MB
      - QDRANT__STORAGE__WAL__WAL_CAPACITY_MB=256
      - QDRANT__CLUSTER__CONSENSUS__MAX_MESSAGE_QUEUE_SIZE=1000
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    ulimits:
      nofile:
        soft: 50000
        hard: 50000
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # Zammad is a connector *source*, like bookstack-source, behind its own
  # profile because it is the heaviest of them: the workflow sets
  # COMPOSE_PROFILES=zammad-source only for the shard that runs its tests.
  #
  # Elasticsearch is not optional here. The connector lists tickets through
  # Zammad's search API with queries like `group_id:3 AND updated_at:[... TO *]`.
  # Zammad serves those with Elasticsearch; without it, it falls back to a SQL
  # LIKE over the ticket title and article body, which treats that query as a
  # literal string and matches nothing. The connector would sync no tickets,
  # and a test written against that would pass while proving nothing.
  zammad-db:
    image: postgres:16-alpine
    profiles: ["zammad-source"]
    restart: always
    environment:
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: ${ZAMMAD_DB_PASSWORD:-zammad123}
      POSTGRES_DB: zammad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zammad"]
      interval: 5s
      timeout: 3s
      retries: 30

  zammad-redis:
    image: redis:7-alpine
    profiles: ["zammad-source"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  zammad-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    profiles: ["zammad-source"]
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 60

  zammad-init:
    image: zammad/zammad-docker-compose:6.4.1-63
    profiles: ["zammad-source"]
    depends_on:
      zammad-db:
        condition: service_healthy
      zammad-elasticsearch:
        condition: service_healthy
    environment: &zammad-env
      POSTGRESQL_HOST: zammad-db
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD:-zammad123}
      POSTGRESQL_DB: zammad
      REDIS_URL: redis://zammad-redis:6379
      ELASTICSEARCH_ENABLED: "true"
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: "9200"
    command: ["zammad-init"]
    volumes:
      - zammad-storage:/opt/zammad/storage

  zammad-railsserver:
    image: zammad/zammad-docker-compose:6.4.1-63
    profiles: ["zammad-source"]
    restart: always
    depends_on:
      zammad-init:
        condition: service_completed_successfully
      zammad-redis:
        condition: service_healthy
    environment: *zammad-env
    # The image's entrypoint binds puma to IPv6 only, so it will not start on a
    # host without IPv6. Bind IPv4 instead, then start as usual. Serving the API
    # straight from puma also keeps the nginx and websocket containers out of
    # the stack; the connector only calls the REST API.
    entrypoint:
      - /bin/sh
      - -c
      - sed 's#tcp://\[::\]#tcp://0.0.0.0#' /docker-entrypoint.sh > /tmp/zammad-entrypoint.sh && chmod +x /tmp/zammad-entrypoint.sh && exec /tmp/zammad-entrypoint.sh zammad-railsserver
    ports:
      - "127.0.0.1:8096:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:3000/api/v1/getting_started"]
      interval: 10s
      timeout: 5s
      retries: 60
    volumes:
      - zammad-storage:/opt/zammad/storage

  zammad-scheduler:
    image: zammad/zammad-docker-compose:6.4.1-63
    profiles: ["zammad-source"]
    restart: always
    depends_on:
      zammad-init:
        condition: service_completed_successfully
      zammad-redis:
        condition: service_healthy
    environment: *zammad-env
    command: ["zammad-scheduler"]
    volumes:
      - zammad-storage:/opt/zammad/storage

volumes:
  zammad-storage:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_storage:
    driver: local
  pipeshub_data:
    driver: local
  pipeshub_root_local:
    driver: local
  pipeshub_hf_cache:
    driver: local
