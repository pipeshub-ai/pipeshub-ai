# Zendesk simulator for the zendesk_sim suite (integration-tests/connectors/zendesk/zendesk_sim_*_test.py). An override,
# used after the stack's own file:
#
#   deployment/docker-compose/sim-tls/make-certs.sh "$SIM_TLS_DIR"
#   docker compose -f docker-compose.integration.neo4j.yml -f docker-compose.integration.zendesk-sim.yml up -d
#
# The connector calls fixed hosts over HTTPS: https://<subdomain>.zendesk.com (API, Help Center, OAuth, attachment links)
# and the attachment CDN (*.zdusercontent.com). Nothing in the product moves them. So zendesk-tls takes the names the
# suite uses (subdomain pipeshubsim) as network aliases and answers them with a certificate from a CA made for the run,
# and pipeshub-ai trusts that CA through SSL_CERT_FILE (httpx and OpenSSL, so aiohttp, both read it). The scenario's
# public_base and cdn_base name those same https hosts, so the connector's own checks "this is the tenant's host" and
# "this is a Zendesk CDN host" run for real. The test process drives the simulator's control API on the published port
# (integration-tests/connectors/zendesk_sim.env).
#
# Fail closed: without the aliases the names resolve to the real Zendesk. zendesk-guard sits on the stack's network and is
# healthy only while the names resolve to zendesk-tls's own address there, and pipeshub-ai starts only after it is. The
# suite checks it again inside the pipeshub-ai container before any sync (integration-tests/connectors/zendesk/
# sim_world.py, `zendesk_front`). Never stop or recreate zendesk-tls while a connector syncs. Every call to these names
# from this stack goes to the simulator, so no suite that needs the real Zendesk can run on it. nginx resolves
# zendesk-sim once, when it starts: restart zendesk-tls after recreating zendesk-sim.
services:
  zendesk-sim:
    image: ${ZENDESK_SIM_IMAGE:-pipeshub/connectors-simulator:it}
    restart: always
    command: ["zendesk"]
    environment:
      CONNSIM_SOURCES: zendesk
      # The account lives in one process's memory.
      CONNSIM_WORKERS: "1"
    # 8115, the simulator's own port: 8101-8103, 8106-8112 and 8117-8118 are the other simulators' in the same stack.
    ports:
      - "127.0.0.1:8115:80"
    mem_limit: 512m

  zendesk-tls:
    image: nginx:1.27.5-alpine
    restart: always
    depends_on:
      zendesk-sim:
        condition: service_healthy
    volumes:
      - ./zendesk-sim/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SIM_TLS_DIR:?run sim-tls/make-certs.sh and set SIM_TLS_DIR}/tls.pem:/etc/nginx/tls/tls.pem:ro
      - ${SIM_TLS_DIR}/tls.key:/etc/nginx/tls/tls.key:ro
    networks:
      default:
        aliases:
          - pipeshubsim.zendesk.com
          - pipeshubsim.zdusercontent.com
          - p1.zdusercontent.com
    mem_limit: 128m

  # Healthy only while the three names resolve, on this network, to the TLS front and to nothing else.
  zendesk-guard:
    image: nginx:1.27.5-alpine
    restart: always
    depends_on:
      zendesk-tls:
        condition: service_started
    command: ["sleep", "infinity"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          front=$$(getent hosts zendesk-tls | cut -d' ' -f1) && [ -n "$$front" ] &&
          [ "$$(getent hosts pipeshubsim.zendesk.com | cut -d' ' -f1)" = "$$front" ] &&
          [ "$$(getent hosts pipeshubsim.zdusercontent.com | cut -d' ' -f1)" = "$$front" ] &&
          [ "$$(getent hosts p1.zdusercontent.com | cut -d' ' -f1)" = "$$front" ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 32m

  pipeshub-ai:
    environment:
      - SSL_CERT_FILE=/etc/pipeshub-it/ca-bundle.pem
    volumes:
      - ${SIM_TLS_DIR}/ca-bundle.pem:/etc/pipeshub-it/ca-bundle.pem:ro
    depends_on:
      zendesk-guard:
        condition: service_healthy
