# Jira Cloud OAuth (3LO) simulator for the jira_cloud_oauth_sim suite (integration-tests/connectors/jira/
# jira_cloud_sim_oauth_test.py and jira_cloud_sim_personal_test.py). An override, used after the stack's own file:
#
#   deployment/docker-compose/sim-tls/make-certs.sh "$SIM_TLS_DIR"
#   docker compose -f docker-compose.integration.neo4j.yml -f docker-compose.integration.jira-cloud-oauth-sim.yml up -d
#
# Atlassian's OAuth hosts are fixed in the product: https://auth.atlassian.com (authorize, token) and
# https://api.atlassian.com (accessible-resources, /ex/jira/{cloudId}/...). jira-cloud-oauth-tls takes those names as
# network aliases and answers them with a certificate from a CA made for the run; pipeshub-ai trusts that CA through
# SSL_CERT_FILE. The test process drives the simulator's control API on the published port.
#
# Fail closed: without the aliases the names resolve to the real Atlassian. jira-cloud-oauth-guard is healthy only while both
# names resolve to the front, and pipeshub-ai starts only after it is. The suite checks it again inside the pipeshub-ai
# container before any sign-in. Every call to these names from this stack goes to the simulator, so no suite that needs the
# real Atlassian OAuth can run on it. Restart jira-cloud-oauth-tls after recreating jira-cloud-oauth-sim.
services:
  jira-cloud-oauth-sim:
    image: ${JIRA_CLOUD_OAUTH_SIM_IMAGE:-pipeshub/connectors-simulator:it}
    restart: always
    command: ["jira"]
    environment:
      CONNSIM_SOURCES: jira
      CONNSIM_SEED: "42"
      CONNSIM_JIRA_ISSUES: "150"
      CONNSIM_PEOPLE: "24"
      CONNSIM_CONTENT_PROVIDER: faker
      # Tokens and grants live in one process's memory.
      CONNSIM_WORKERS: "1"
    ports:
      - "127.0.0.1:${JIRA_CLOUD_OAUTH_SIM_PORT:-8130}:80"
    mem_limit: 768m

  jira-cloud-oauth-tls:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: always
    depends_on:
      jira-cloud-oauth-sim:
        condition: service_healthy
    volumes:
      - ./jira-cloud-oauth-sim/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SIM_TLS_DIR:?run sim-tls/make-certs.sh and set SIM_TLS_DIR}/tls.pem:/etc/nginx/tls/tls.pem:ro
      - ${SIM_TLS_DIR}/tls.key:/etc/nginx/tls/tls.key:ro
    networks:
      default:
        aliases:
          - auth.atlassian.com
          - api.atlassian.com
    mem_limit: 128m

  # Healthy only while both names resolve, on this network, to the TLS front and to nothing else.
  jira-cloud-oauth-guard:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: always
    depends_on:
      jira-cloud-oauth-tls:
        condition: service_started
    command: ["sleep", "infinity"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          front=$$(getent hosts jira-cloud-oauth-tls | cut -d' ' -f1) && [ -n "$$front" ] &&
          [ "$$(getent hosts auth.atlassian.com | cut -d' ' -f1)" = "$$front" ] &&
          [ "$$(getent hosts api.atlassian.com | cut -d' ' -f1)" = "$$front" ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 32m

  pipeshub-ai:
    environment:
      - SSL_CERT_FILE=/etc/pipeshub-it/ca-bundle.pem
    volumes:
      - ${SIM_TLS_DIR}/ca-bundle.pem:/etc/pipeshub-it/ca-bundle.pem:ro
    depends_on:
      jira-cloud-oauth-guard:
        condition: service_healthy
