# Forwards the app's calls to the web readers and nothing else. The readers fetch whatever a
# search result or page link points at, so they must not share a network with the app: this
# proxy is the only container on both, and it only ever connects onward to the readers.
worker_processes 1;

events {}

stream {
    # Docker's DNS, asked per connection: a reader whose profile is off is simply unreachable
    # instead of stopping the proxy at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $server_port $reader {
        8080  searxng-reader:8080;
        11235 crawl4ai-reader:11235;
    }

    server {
        listen 8080;
        listen 11235;
        proxy_pass $reader;
        proxy_connect_timeout 5s;
    }
}
