# TLS front for the Zoom simulator (docker-compose.integration.zoom-sim.yml). The connector's clients call
# api.zoom.us and zoom.us over HTTPS (the hosts are fixed in the code); this container answers under those names
# with a certificate from a CA made for the test run and passes each request on unchanged, Host header included,
# which is how the simulator tells the API (/v2) from sign-in (/oauth) and transcript downloads (/rec).
worker_processes 1;
events {}

http {
    access_log off;
    large_client_header_buffers 8 64k;
    client_max_body_size 64m;
    # Injected latency, throttling and paging must reach the connector as the simulator sends them.
    proxy_buffering off;
    proxy_request_buffering off;

    server {
        listen 443 ssl;
        server_name api.zoom.us zoom.us ssrweb.zoom.us;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location / {
            # No URI part: the request line goes on exactly as the client sent it. A meeting UUID with a slash
            # is percent-encoded twice in the path (%252F); decoding or normalising it here would break it.
            proxy_pass http://zoom-sim:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    # Anything else that reaches this container is a name the test did not mean to capture.
    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        return 421;
    }
}
