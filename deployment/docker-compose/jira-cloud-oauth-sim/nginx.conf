# TLS front for the Jira Cloud OAuth simulator (docker-compose.integration.jira-cloud-oauth-sim.yml). The connector and the
# platform call https://auth.atlassian.com (sign-in, token exchange, refresh) and https://api.atlassian.com (accessible
# resources, the /ex/jira/{cloudId} gateway): fixed hosts, nothing in the product moves them. This container answers under
# those names with a certificate from a CA made for the test run (sim-tls/make-certs.sh) and passes each request on
# unchanged, Host header and raw path included.
worker_processes 1;
events {}

http {
    access_log off;
    large_client_header_buffers 8 64k;
    client_max_body_size 64m;
    proxy_buffering off;
    proxy_request_buffering off;

    server {
        listen 443 ssl;
        server_name auth.atlassian.com api.atlassian.com;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location / {
            proxy_pass http://jira-cloud-oauth-sim:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    # Anything else that reaches this container is a name the test did not mean to capture.
    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        return 421;
    }
}
