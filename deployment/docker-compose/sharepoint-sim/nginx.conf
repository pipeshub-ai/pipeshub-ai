# TLS front for the SharePoint simulator (docker-compose.integration.sharepoint-sim.yml). The connector,
# the Graph SDK and azure-identity call Microsoft's fixed hosts over HTTPS; this container answers under
# those names with a certificate from a CA made for the test run, and passes each request on unchanged,
# Host header included, which is how the simulator tells Graph, Entra ID and SharePoint apart.
worker_processes 1;
events {}

http {
    access_log off;
    # Graph $select/$expand query strings and SharePoint REST paths run long.
    large_client_header_buffers 8 64k;
    client_max_body_size 64m;
    # Injected latency, throttling and paging must reach the connector as the simulator sends them.
    proxy_buffering off;
    proxy_request_buffering off;

    server {
        listen 443 ssl;
        server_name graph.microsoft.com login.microsoftonline.com contoso.sharepoint.com contoso-my.sharepoint.com;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location / {
            # No URI part: the request line goes on exactly as the client sent it (SharePoint REST paths
            # carry quotes and encoded characters that normalising would change).
            proxy_pass http://sharepoint-sim:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    # Anything else that reaches this container is a name the test did not mean to capture.
    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/tls/tls.pem;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        return 421;
    }
}
