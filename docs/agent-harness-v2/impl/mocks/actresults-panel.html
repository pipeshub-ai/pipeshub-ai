<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity panel results</title>
<style>
:root {
  --bg: #fbfbfa; --surface: #ffffff; --surface-2: #f4f5f2; --border: #e0e3dc; --border-strong: #c9cec5; --text: #1d211c;
  --muted: #646b62; --faint: #8c9389; --accent: #1f8a65; --accent-11: #1a7a5a; --accent-soft: #e3f4ec; --accent-ink: #fff;
  --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b4231f; --bad-soft: #fde8e8; --blue: #1d5fbf; --blue-soft: #e6effc;
  --focus: #2b6cd8; --hl: #fff4c2; --mono-bg: #f7f8f5; --stderr: #b4231f; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121412; --surface: #1a1d1a; --surface-2: #222622; --border: #313731; --border-strong: #454c44; --text: #e8ebe6;
    --muted: #a2aa9f; --faint: #7c8579; --accent: #3fbf93; --accent-11: #5fd1a8; --accent-soft: #163128; --accent-ink: #0b1a14;
    --warn: #f0b555; --warn-soft: #33290f; --bad: #ff8f8a; --bad-soft: #3a1b1b; --blue: #8ab4ff; --blue-soft: #18263d;
    --focus: #7aa7ff; --hl: #3b3410; --mono-bg: #161916; --stderr: #ff9a95; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121412; --surface: #1a1d1a; --surface-2: #222622; --border: #313731; --border-strong: #454c44; --text: #e8ebe6;
  --muted: #a2aa9f; --faint: #7c8579; --accent: #3fbf93; --accent-11: #5fd1a8; --accent-soft: #163128; --accent-ink: #0b1a14;
  --warn: #f0b555; --warn-soft: #33290f; --bad: #ff8f8a; --bad-soft: #3a1b1b; --blue: #8ab4ff; --blue-soft: #18263d;
  --focus: #7aa7ff; --hl: #3b3410; --mono-bg: #161916; --stderr: #ff9a95; --shadow: none;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent-11); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

header.top { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--surface); }
header.top h1 { font-size: 16px; margin: 0; flex: 1 1 240px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button, #theme { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 61px); }
.chat { overflow: auto; padding: 24px clamp(16px, 4vw, 48px); }
.chat-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.user { align-self: flex-end; background: var(--surface-2); border-radius: 14px; padding: 8px 14px; max-width: 85%; }
.steps-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.steps-bar .va { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; background: var(--surface); cursor: pointer; min-height: 28px; }
.steps-bar .va[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-11); }
.answer p { margin: 0 0 10px; }
.cite { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 5px; margin: 0 1px; border-radius: 9px; border: 0;
  background: var(--accent-soft); color: var(--accent-11); font-size: 11px; font-weight: 600; cursor: pointer; vertical-align: 2px; }
.cite:hover { background: var(--accent); color: var(--accent-ink); }
.cite.on { background: var(--accent); color: var(--accent-ink); }
.sentence.hl { background: var(--hl); border-radius: 3px; }
.composer { margin-top: 8px; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; color: var(--muted); background: var(--surface); }

aside.panel { border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.p-head { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.p-head .row1 { display: flex; align-items: center; gap: 8px; }
.p-head h2 { font-size: 15px; margin: 0; flex: 1; font-weight: 600; }
.badge { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.b-ok { background: var(--accent-soft); color: var(--accent-11); }
.b-run { background: var(--blue-soft); color: var(--blue); }
.b-wait { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-gray { background: var(--surface-2); color: var(--muted); }
.p-head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.filter { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.filter button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; min-height: 30px; cursor: pointer; }
.filter button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-11); font-weight: 600; }
.close { margin-left: 4px; border: 0; background: none; cursor: pointer; width: 32px; height: 32px; border-radius: 6px; color: var(--muted); font-size: 18px; }
.p-body { overflow: auto; padding: 8px 16px 24px; flex: 1; min-height: 0; }
.sec-h { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 10px 0 6px; color: var(--text); }
.sec-h .n { color: var(--muted); font-weight: 400; margin-left: auto; }

ol.steps { list-style: none; margin: 0; padding: 0; position: relative; }
ol.steps::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
li.step { position: relative; padding-left: 28px; margin-bottom: 6px; }
li.step > .dot { position: absolute; left: 0; top: 9px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--surface); border: 2px solid var(--border-strong); color: var(--muted); }
li.step.ok > .dot { border-color: var(--accent); color: var(--accent-11); }
li.step.fail > .dot, li.step.denied > .dot { border-color: var(--bad); color: var(--bad); }
li.step.wait > .dot { border-color: var(--warn); color: var(--warn); }
li.step.run > .dot { border-color: var(--blue); color: var(--blue); }
li.step.quiet > .dot { width: 10px; height: 10px; left: 5px; top: 8px; border-width: 2px; }
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); transition: box-shadow .2s, border-color .2s; }
.card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.s-row { display: flex; align-items: flex-start; border-radius: 10px; }
.s-row:hover { background: var(--surface-2); }
.s-row > .meta { display: flex; gap: 4px; align-items: center; flex-shrink: 0; padding: 10px 10px 0 0; flex-wrap: wrap; justify-content: flex-end; max-width: 45%; }
.s-head { flex: 1 1 0; min-width: 0; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: start; gap: 8px; text-align: left; background: none; border: 0; padding: 8px 10px; cursor: pointer; border-radius: 10px; min-height: 44px; }
.s-head .txt { min-width: 0; display: block; }
.s-head .lbl { font-weight: 500; overflow-wrap: break-word; }
.s-head .lbl .app { color: var(--muted); font-weight: 400; }
.s-head .out { font-size: 12px; color: var(--muted); }
.s-head .out.bad { color: var(--bad); }
.s-head .out.warn { color: var(--warn); }
.s-head .dur { font-size: 11px; color: var(--faint); flex-shrink: 0; padding-top: 2px; }
.chev { color: var(--muted); font-size: 12px; width: 16px; text-align: center; padding-top: 3px; flex-shrink: 0; }
.s-body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.s-body[hidden] { display: none; }
.lab { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: none; margin-bottom: 2px; }
.supports { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.quiet-line { color: var(--faint); font-size: 12px; padding: 4px 0 4px 0; }

.summary { font-size: 13px; color: var(--text); }
.summary ul { margin: 2px 0 0; padding-left: 18px; }
.summary li { margin: 2px 0; }
.summary p { margin: 0 0 4px; }
.rec-cite { font-size: 10px; margin-left: 4px; }
.tbl { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 12px; }
.tbl th, .tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
.tbl th { background: var(--surface-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
.tbl tr:last-child td { border-bottom: 0; }
.more-note { font-size: 11px; color: var(--muted); margin-top: 3px; }
.fields { border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: grid; grid-template-columns: minmax(5rem, max-content) 1fr; gap: 3px 12px; font-size: 12px; }
.fields .k { color: var(--muted); }
.fields .open { grid-column: 1 / -1; margin-top: 4px; }
.raw { position: relative; border: 1px solid var(--border); border-radius: 8px; background: var(--mono-bg); }
.raw pre { margin: 0; padding: 8px 30px 8px 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.raw.tall pre { max-height: none; }
.raw .copy { position: absolute; top: 4px; right: 4px; border: 0; background: var(--surface-2); border-radius: 4px; cursor: pointer; font-size: 11px; padding: 2px 4px; color: var(--muted); }
.raw .stderr { color: var(--stderr); }
.plain { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
.plain.clip { max-height: 140px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.linkbtn { border: 0; background: none; color: var(--accent-11); cursor: pointer; padding: 6px 0; font-size: 12px; font-weight: 500; min-height: 32px; }
.sublinkbtn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 0; font-size: 12px; min-height: 28px; display: inline-flex; gap: 4px; align-items: center; }
.args { font-size: 12px; display: grid; grid-template-columns: minmax(4rem, max-content) 1fr; gap: 2px 10px; border-left: 2px solid var(--border); padding-left: 8px; }
.args .k { color: var(--muted); }
.note { font-size: 12px; color: var(--muted); border-radius: 8px; background: var(--surface-2); padding: 6px 8px; }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.files { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.files a { display: inline-flex; gap: 6px; align-items: center; }
.group-items { list-style: none; margin: 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 4px; }
.group-items > li .card { border-style: solid; background: var(--surface); }
.nested { border-left: 2px dashed var(--border-strong); margin-left: 4px; padding-left: 10px; display: flex; flex-direction: column; gap: 4px; }
.nested .sub-row { display: flex; gap: 6px; font-size: 12px; align-items: baseline; }
.nested .sub-row .ic { width: 14px; flex-shrink: 0; }
.legend { font-size: 12px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--border); }

.grabber { display: none; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .chat { padding: 16px; }
  aside.panel { border-left: 0; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.08); }
  .grabber { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 8px auto 0; }
  .close { display: none; }
  .p-body { overflow: visible; padding: 8px 12px 24px; }
  .p-head { padding: 8px 12px; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Activity panel: what each step found</h1>
  <div class="tabs" role="tablist" aria-label="Scenario">
    <button role="tab" aria-selected="true" data-s="short">Short run (3 steps)</button>
    <button role="tab" aria-selected="false" data-s="long">Long run (30 steps)</button>
    <button role="tab" aria-selected="false" data-s="kinds">Every kind of result</button>
  </div>
  <button id="theme" type="button">Toggle dark</button>
</header>
<div class="layout">
  <main class="chat" id="chat" aria-label="Conversation"></main>
  <aside class="panel" aria-labelledby="p-title">
    <div class="grabber" aria-hidden="true"></div>
    <div class="p-head">
      <div class="row1"><h2 id="p-title">Activity</h2><span id="p-status"></span><button class="close" type="button" aria-label="Close activity">✕</button></div>
      <div class="sub" id="p-sub"></div>
      <div class="filter" id="p-filter"></div>
    </div>
    <div class="p-body" id="p-body"></div>
  </aside>
</div>
<script>
'use strict';
/* Links: only http, https and mailto become links; anything else stays text (the build reuses safeLink). */
function safeHref(u) {
  try { const x = new URL(u); return ['http:', 'https:', 'mailto:'].includes(x.protocol) && !x.username && !x.password ? x.href : null; } catch { return null; }
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function a(href, text) {
  const h = safeHref(href);
  return h ? `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(text ?? href)}</a>` : esc(text ?? href);
}
/* Internal record links open the record viewer, as citations do. */
function rec(id, text) { return `<a href="/record?recordId=${encodeURIComponent(id)}">${esc(text)}</a>`; }
/* Plain text with its URLs made clickable (the same rule for raw results). */
function linkify(text) {
  return esc(text).replace(/\b((?:https?:\/\/|mailto:)[^\s"'<>)\]]+)/g, (m) => {
    const h = safeHref(m.replace(/&amp;/g, '&'));
    return h ? `<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${m}</a>` : m;
  });
}
function cites(ns) { return ns.map((n) => `<button type="button" class="cite" data-cite="${n}" aria-label="Citation ${n}">${n}</button>`).join(''); }

/* ---------- result renderers (the build reuses the main chat's ToolDetails pieces) ---------- */
function rSummary(r) { return `<div class="summary">${r.html}</div>`; }
function rRecords(r) {
  const head = r.columns.map((c) => `<th>${esc(c)}</th>`).join('');
  const rows = r.rows.map((row) => `<tr>${row.cells.map((c, i) => `<td>${i === 0 && row.url ? a(row.url, c) : i === 0 && row.rec ? rec(row.rec, c) : esc(c)}${i === 0 && row.cite ? `<span class="rec-cite">${cites([row.cite])}</span>` : ''}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${r.total > r.rows.length ? `<div class="more-note">Showing ${r.rows.length} of ${r.total}</div>` : ''}`;
}
function rFields(r) {
  return `<div class="fields">${r.fields.map(([k, v]) => `<span class="k">${esc(k)}</span><span>${linkify(v)}</span>`).join('')}${r.url ? `<span class="open">${a(r.url, r.open ?? 'Open')}</span>` : ''}</div>`;
}
function rJson(r) { return `<div class="raw"><button class="copy" type="button" aria-label="Copy">⧉</button><pre class="mono">${linkify(JSON.stringify(r.value, null, 2))}</pre></div>`; }
function rPlain(r) {
  if (!r.long) return `<div class="plain">${linkify(r.text)}</div>`;
  return `<div class="plain clip" data-clip>${linkify(r.text)}</div><button type="button" class="linkbtn" data-more aria-expanded="false">Show more</button><div class="more-note">The chat keeps the first 2,000 characters of a result; the agent read all 48,310.</div>`;
}
function rCode(r) {
  const out = r.stdout ? `<span>${linkify(r.stdout)}</span>` : '';
  const err = r.stderr ? `<span class="stderr">${linkify(r.stderr)}</span>` : '';
  const files = r.files?.length ? `<div><div class="lab">Files it made</div><div class="files">${r.files.map((f) => `<span>📄 ${rec(f.id, f.name)} <span class="more-note" style="display:inline">${esc(f.size)}</span></span>`).join('')}</div></div>` : '';
  return `<div><div class="lab">Output · exit code ${r.exit}</div><div class="raw"><pre class="mono">${out}${out && err ? '\n' : ''}${err}</pre></div></div>${files}`;
}
function rRawToggle(r) {
  const id = `raw-${++uid}`;
  return `<div><button type="button" class="sublinkbtn" data-raw aria-expanded="false" aria-controls="${id}">▸ View raw</button><div id="${id}" hidden>${rJson(r)}</div></div>`;
}
function rNote(r) { return `<div class="note ${r.tone ?? ''}">${r.html}</div>`; }
function rEmpty() { return `<div class="note">No results.</div>`; }
const RENDER = { summary: rSummary, records: rRecords, fields: rFields, json: rJson, plain: rPlain, code: rCode, note: rNote, empty: rEmpty, rawtoggle: rRawToggle };
function result(r) { return Array.isArray(r) ? r.map(result).join('') : RENDER[r.kind](r); }

const ICON = { ok: '✓', fail: '!', denied: '✕', wait: '⏸', run: '…' };
const BADGE = {
  allowed: '<span class="badge b-ok">You allowed</span>',
  denied: '<span class="badge b-bad">You declined</span>',
  wait: '<span class="badge b-wait">Waiting for you</span>',
  run: '<span class="badge b-run">Running</span>',
};

let uid = 0;
function stepCard(s) {
  const id = `st-${++uid}`;
  s.domId = id;
  const statusCls = s.status ?? 'ok';
  const outCls = statusCls === 'fail' || statusCls === 'denied' ? 'bad' : statusCls === 'wait' ? 'warn' : '';
  const meta = `${s.approval ? BADGE[s.approval] : statusCls === 'run' ? BADGE.run : ''}${s.cites?.length ? cites(s.cites) : ''}`;
  const hasBody = s.result || s.args || s.children || s.why;
  const body = hasBody ? `
    <div class="s-body" id="${id}-b" ${s.open ? '' : 'hidden'}>
      ${s.why ? rNote({ html: s.why, tone: s.whyTone }) : ''}
      ${s.children ? `<div class="nested">${s.children.map((c) => `<div class="sub-row"><span class="ic" aria-hidden="true">${ICON[c.status ?? 'ok']}</span><span><b style="font-weight:500">${esc(c.label)}</b>${c.out ? ` <span style="color:var(--muted)">· ${linkify(c.out)}</span>` : ''}</span></div>`).join('')}</div>` : ''}
      ${s.result ? result(s.result) : ''}
      ${s.args ? `<div><button type="button" class="sublinkbtn" data-details aria-expanded="false" aria-controls="${id}-d">▸ Details</button>
        <div id="${id}-d" hidden><div class="lab">What the agent asked for</div><div class="args">${Object.entries(s.args).map(([k, v]) => `<span class="k">${esc(k)}</span><span>${linkify(typeof v === 'string' ? v : JSON.stringify(v))}</span>`).join('')}</div></div></div>` : ''}
    </div>` : '';
  return `<div class="card" id="${id}" data-cites="${(s.cites ?? []).join(' ')}"><div class="s-row">
    <button type="button" class="s-head" ${hasBody ? `aria-expanded="${s.open ? 'true' : 'false'}" aria-controls="${id}-b"` : 'aria-disabled="true"'}>
      <span class="chev" aria-hidden="true">${hasBody ? (s.open ? '▾' : '▸') : ''}</span>
      <span class="txt"><span class="lbl">${s.app ? `<span class="app">${esc(s.app)} · </span>` : ''}${esc(s.label)}</span>
        <span class="out ${outCls}" style="display:block">${esc(s.out)}</span></span>
      ${s.dur ? `<span class="dur">${esc(s.dur)}</span>` : ''}
    </button>${meta ? `<span class="meta">${meta}</span>` : ''}</div>${body}</div>`;
}
function stepLi(s) {
  if (s.quiet) return `<li class="step quiet"><span class="dot" aria-hidden="true"></span><div class="quiet-line">${esc(s.label)}</div></li>`;
  if (s.group) {
    const id = `gr-${++uid}`;
    const allCites = [...new Set(s.items.flatMap((i) => i.cites ?? []))];
    s.domId = id;
    return `<li class="step ${s.status ?? 'ok'}"><span class="dot" aria-hidden="true">${ICON[s.status ?? 'ok']}</span>
      <div class="card" id="${id}" data-cites="${allCites.join(' ')}">
        <div class="s-row"><button type="button" class="s-head" aria-expanded="${s.open ? 'true' : 'false'}" aria-controls="${id}-b">
          <span class="chev" aria-hidden="true">${s.open ? '▾' : '▸'}</span>
          <span class="txt"><span class="lbl">${s.app ? `<span class="app">${esc(s.app)} · </span>` : ''}${esc(s.label)}</span><span class="out" style="display:block">${esc(s.out)}</span></span>
          <span class="dur">${esc(s.dur ?? '')}</span>
        </button>${allCites.length ? `<span class="meta">${cites(allCites)}</span>` : ''}</div>

}

function toggle(btn) {
  const body = document.getElementById(btn.getAttribute('aria-controls'));
  if (!body) return;
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', String(open));
  body.hidden = !open;
  const chev = btn.querySelector('.chev');
  if (chev) chev.textContent = open ? '▾' : '▸';
}
function openTo(el) {
  for (let node = el; node && node.id !== 'p-body'; node = node.parentElement) {
    if (node.classList?.contains('s-body') && node.hidden) {
      node.hidden = false;
      const head = node.previousElementSibling?.querySelector('.s-head');
      head?.setAttribute('aria-expanded', 'true');
      const chev = head?.querySelector('.chev');
      if (chev) chev.textContent = '▾';
    }
  }
}
function trace(n) {

  document.querySelectorAll('.sentence').forEach((e) => { if (e.dataset.sent.split(' ').includes(String(n))) e.classList.add('hl'); });

  const target = cards.find((c) => !c.querySelector('.card')) ?? cards[0];
  if (!target) return;

  target.classList.add('flash');
  target.scrollIntoView({ block: 'center', behavior: 'instant' });
  target.querySelector('.s-head')?.focus({ preventScroll: true });
}
